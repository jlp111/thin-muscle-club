    $('#f_back').onclick=()=>{ cur='library'; render(); };
  }

  /* ---- 训练记录 ---- */
  /* 周条状态放模块作用域：切页再回来要停在原来那一周，而不是每次重置回本周。
     logWeek = 相对本周的偏移（-4..4），logSel = 当前选中日期。 */
  let logWeek = 0;
  let logSel = '';
  const WD_LABEL = '一二三四五六日';                     /* 周一为一 */
  function weekOffset(key){
    const a = Util.mondayOf(new Date(key + 'T00:00:00')).getTime();
    return Math.round((a - Util.mondayOf().getTime()) / 604800000);
  }
  function log(){
    const wdName=['周日','周一','周二','周三','周四','周五','周六'];
    const dayKeys=Object.keys(Plan.get().week);
    const todayKey=Util.localDate();
    const trained={}; (Store.get().logs||[]).forEach(l=>{ if(l.date) trained[l.date]=1; });

    /* 选中日期失效（隔天再打开、导入数据后变空）就回到今天；超出 ±4 周同样回来，
       否则会停在一条滑不回去的周上。 */
    if(!Util.isDateStr(logSel)) logSel=todayKey;
    logWeek=weekOffset(logSel);
    if(Math.abs(logWeek)>4){ logSel=todayKey; logWeek=0; }

    appInner().innerHTML = `<div class="panel"><h2>训练记录</h2>
      <div class="wstrip" id="wstrip" role="tablist" data-no-swipe
           aria-label="一周的日期，左右滑动可切换周"></div>
      <select id="logDay" class="vhide" aria-label="训练日（周几）">${dayKeys.map(d=>'<option value="'+d+'">'+d+'</option>').join('')}</select>
      <div id="logForm"></div>
      <h3 class="mt-7">历史记录</h3>
      <div id="logHistory"></div>
    </div>`;

    const sel=$('#logDay');
    /* 日期 → 周几。计划周的键固定是七个中文星期（见 Plan.week），必命中。 */
    const wdOf=key=>wdName[new Date(key+'T00:00:00').getDay()];
    let swipe=null, swallowUntil=0;             /* 滑动末尾浏览器会补发 click，要吞掉 */

    function stripDays(){
      const base=new Date(Util.mondayOf()); base.setDate(base.getDate()+logWeek*7);
      const out=[];
      for(let i=0;i<7;i++){
        const d=new Date(base); d.setDate(d.getDate()+i);
        const key=Util.localDate(d);
        out.push({key:key, num:d.getDate(), dow:d.getDay(), on:!!trained[key]});
      }
      return out;
    }
    function stripHtml(){
      return stripDays().map(x=>{
        const isToday=x.key===todayKey, isSel=x.key===logSel;
        const wd=WD_LABEL[(x.dow+6)%7];
        return '<button type="button" class="wday'+(isSel?' is-sel':'')+(isToday?' is-today':'')+'"'
          + ' data-date="'+x.key+'" role="tab" aria-selected="'+(isSel?'true':'false')+'"'
          + ' aria-label="'+x.key+' 周'+wd+(isToday?' 今天':'')+'">'
          + '<span class="wc">'+(isToday?'今':wd)+'</span>'
          + '<span class="dn">'+x.num+'</span>'
          + '<i class="dot'+(x.on?' on':'')+'" aria-hidden="true"></i>'
          + '</button>';
      }).join('');
    }
    function paintStrip(anim){
      const strip=$('#wstrip'); if(!strip) return;
      strip.innerHTML=stripHtml();
      if(anim){
        strip.classList.remove('enter-l','enter-r','bump-l','bump-r');
        void strip.offsetWidth;                 /* 读一次布局，动画才会重播而不是被忽略 */
        strip.classList.add(anim);
        strip.addEventListener('animationend', function h(){
          strip.classList.remove(anim); strip.removeEventListener('animationend', h);
        });
      }
      strip.querySelectorAll('.wday').forEach(btn=>{
        btn.onclick=()=>{ if(Date.now()<swallowUntil) return; applyDay(btn.getAttribute('data-date')); };
      });
    }
    function markStrip(){
      document.querySelectorAll('#wstrip .wday').forEach(b=>{
        const on=b.getAttribute('data-date')===logSel;
        b.classList.toggle('is-sel', on);
        b.setAttribute('aria-selected', on?'true':'false');
      });
    }
    function applyDay(key){
      logSel=key;
      const wd=wdOf(key);
      if(dayKeys.indexOf(wd)>=0) sel.value=wd;
      markStrip();
      startLogForm();
    }
    /* 切周时保持「同一个星期几」的选中，表单跟着换到新周那一天。
       到 ±4 周边界不再移动，改为回弹一下——静默无反应会让人以为手势没生效。 */
    function setWeek(delta){
      const next=Math.max(-4, Math.min(4, logWeek+delta));
      if(next===logWeek){ paintStrip(delta>0?'bump-l':'bump-r'); return; }
      const dow=new Date(logSel+'T00:00:00').getDay();
      logWeek=next;
      const same=stripDays().filter(x=>x.dow===dow)[0];
      if(same) logSel=same.key;
      paintStrip(delta>0?'enter-r':'enter-l');
      applyDay(logSel);
    }
    const stripEl=$('#wstrip');
    if(stripEl){
      /* 横滑切周：横向位移 >36px、明显大于纵向（纵向滚动不该被误判）、非长按。
         左滑 = 上一周，右滑 = 下一周（按用户口径）。 */
      stripEl.addEventListener('pointerdown', e=>{
        if(e.pointerType==='mouse') return;      /* 桌面走点击与方向键，不抢鼠标拖拽 */
        swipe={x:e.clientX, y:e.clientY, t:Date.now(), id:e.pointerId};
      });
      stripEl.addEventListener('pointerup', e=>{
        if(!swipe || swipe.id!==e.pointerId) return;
        const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y, dt=Date.now()-swipe.t;
        swipe=null;
        if(Math.abs(dx)<36 || Math.abs(dx)<Math.abs(dy)*1.2 || dt>800) return;   /* 算点击 */
        swallowUntil=Date.now()+350;
        if(e.cancelable) e.preventDefault();
        setWeek(dx<0 ? -1 : 1);
      });
      stripEl.addEventListener('pointercancel', ()=>{ swipe=null; });
      stripEl.addEventListener('keydown', e=>{
        const step={ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7}[e.key];
        if(step==null) return;
        e.preventDefault();
        const d=new Date(logSel+'T00:00:00'); d.setDate(d.getDate()+step);
        const key=Util.localDate(d);
        const off=weekOffset(key);
        if(Math.abs(off)>4) return;              /* 超出 ±4 周不响应 */
        if(off!==logWeek){ logWeek=off; paintStrip(step>0?'enter-r':'enter-l'); }
        applyDay(key);
        /* 重绘后原按钮已被替换，焦点要还给新的选中格，否则键盘用户会掉到 body */
        const nb=document.querySelector('#wstrip .wday[data-date="'+key+'"]');
        if(nb) try{ nb.focus({preventScroll:true}); }catch(_e){}
      });
    }
    if(sel) sel.onchange=startLogForm;
    paintStrip();
    /* 初始必须把 #logDay 对到「这个日期本身是周几」：select 的默认值是第一个
       option（周一），原来直接就 startLogForm()，于是每天第一次打开记录页渲染
       的都是周一的动作，保存还会把周一的 dayType 写进当天记录（污染热力图、
       本周训练日与部位肌肉图）。 */
    { const wd0=wdOf(logSel); if(dayKeys.indexOf(wd0)>=0) sel.value=wd0; }
    startLogForm();
    renderHistory();
  }
  /* ---- 记录表单：按动作类型决定计量单位 --------------------------------
   * 抗阻（推/拉/腿/核心）→ 重量 kg × 次数
   * 有氧与功法 → 时间(min) / 遍 / 圈 / 秒 / 次，按动作库 reps 文案判定
   * 组数取动作库预设一次铺满；重量优先用 Adapt 的渐进建议，其次回落到上次记录。
   * -------------------------------------------------------------------- */
  function unitSpec(a){
    const cat=String((a&&a.cat)||'');
    const reps=String((a&&a.reps)||'');
    const nums=reps.match(/\d+(?:\.\d+)?/g)||[];
    const first=nums.length?parseFloat(nums[0]):null;
    if(cat==='push'||cat==='pull'||cat==='legs'||cat==='core')
      return {kind:'kg',weight:true,def:first,unit:'次'};
    if(/min|分钟/i.test(reps)) return {kind:'min',weight:false,def:first,unit:'min'};
    /* 距离与步数：不认出来就会被当成「次」，于是 3km 被记成「3 次」。
       先判 km 再判 m，避免 "40m" 里那个 m 被误读成 mile/min。 */
    if(/km|公里/i.test(reps))   return {kind:'km',weight:false,def:first,unit:'km'};
    if(/\d\s*(?:m|米)(?!i)/i.test(reps)) return {kind:'m',weight:false,def:first,unit:'m'};
    if(/步/.test(reps))        return {kind:'step',weight:false,def:first,unit:'步'};
    if(/遍/.test(reps))        return {kind:'round',weight:false,def:first,unit:'遍'};
    if(/圈/.test(reps))        return {kind:'round',weight:false,def:first,unit:'圈'};
    if(/秒|sec|\d\s*s(?:\b|\/)/i.test(reps)) return {kind:'sec',weight:false,def:first,unit:'秒'};
    return {kind:'rep',weight:false,def:first,unit:'次'};
  }
  function lastLoggedWeight(actionId){
    const logs=(Store.get().logs||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    for(let i=0;i<logs.length;i++){
      const e=(logs[i].entries||[]).find(x=>x.actionId===actionId);
      if(!e) continue;
      const w=(e.sets||[]).reduce((m,s)=>Math.max(m,+(s.weight||0)),0);
      if(w>0) return w;
    }
    return null;
  }
  /* 首次没有历史时给一个保守起始重量（按肌群），避免逼用户空手估数；
     它只是起点，右侧 meta 会标注「起始」，用户按实际改即可。 */
  const SEED_W = {push:10, pull:15, legs:20, core:5};
  function defaultWeight(a){
    try{ const g=Adapt.suggestion(a.id); if(g&&g.target) return g.target; }catch(e){}
    const last=lastLoggedWeight(a.id);
    if(last!=null) return last;
    const seed=SEED_W[a.cat];
    return (typeof seed==='number')?seed:null;
  }
  function weightIsSeed(a){
    try{ const g=Adapt.suggestion(a.id); if(g&&g.target) return false; }catch(e){}
    return lastLoggedWeight(a.id)==null && typeof SEED_W[a.cat]==='number';
  }
  /* ---- 记录表单：结构对齐 GymMane --------------------------------------
   * 每个动作 = 一块：标题 + 类别 + LAST / NEXT 两行上下文，下面是「组次行」。
   * 组次行 = 序号 | 重量步进器 | 次数步进器 | 完成勾选（非抗阻只有一列数值）。
   * 步进器替代键盘输入：站着单手操作时，弹键盘是最痛的交互；勾选表示这组做了，
   * 未勾的组保存时不计入（默认全勾，因为数值已按计划预填）。
   * -------------------------------------------------------------------- */
  const STEP_W = 2.5;                                  // 抗阻重量步长 kg
  /* 步长按「单位」查表。data-unit 上挂的是 sp.unit（次/min/遍/圈/秒/m/km/步），
     所以键必须用这些真实单位；旧表用的 rep/round/sec 是 kind，查不到就退成 1，
     于是「秒」一直按 1 跳、「分钟」按 5 跳——两套键并存才不会漏。 */
  const STEP_OF = {kg:1, rep:1, round:1, sec:15, min:5,
                   '次':1, '遍':1, '圈':1, '秒':15, 'm':10, 'km':1, '步':2};
  function lastSetsText(actionId){
    const logs=(Store.get().logs||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    for(let k=0;k<logs.length;k++){
      const e=(logs[k].entries||[]).find(x=>x.actionId===actionId);
      if(e && (e.sets||[]).length){
        const u=e.unit||'次';
        return e.sets.map(s=> (+s.weight>0) ? (s.weight+'×'+s.reps) : (s.reps+u)).join(' · ');
      }
    }
    return '';
  }
  /* ---- 训练草稿：还没保存的输入，先自己留在本地 --------------------------
   * 为什么要：表单是 innerHTML 重建的 —— 切日期、切星期几、保存之后都会重建，
   * 敲进 input 的数字全在那一刻丢掉；关掉页面更是整场白记。
   * 草稿不是第二份数据，只是「尚未变成记录的输入」的临时容器：
   *   保存成功即清除；改回原样也清除；只留最近 5 天。
   * 写失败（隐私模式 / 配额满）静默放弃 —— 草稿丢了不影响正事，不该为它弹提示；
   * 数据本体的写入失败仍走 Store 的 R7 提示。 */
  const DRAFT_KEY='thinMuscle.logDraft.v1';
  const DRAFT_KEEP_DAYS=5;
  let draftT=null;
  function draftRead(){
    try{ const o=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');
      return (o && typeof o==='object' && !Array.isArray(o)) ? o : {}; }
    catch(e){ return {}; }                       /* 坏 JSON 一律当没有，绝不让表单炸掉 */
  }
  function draftWriteMap(m){
    try{
      const ks=Object.keys(m).sort();
      while(ks.length>DRAFT_KEEP_DAYS){ delete m[ks.shift()]; }
      localStorage.setItem(DRAFT_KEY, JSON.stringify(m));
      return true;
    }catch(e){ return false; }
  }
  function formSignature(form){
    if(!form) return '';
    const parts=[];
    form.querySelectorAll('.act').forEach(a=>{
      a.querySelectorAll('.sr').forEach(r=>{
        const w=r.querySelector('input[data-w]'), rp=r.querySelector('input[data-r]'), c=r.querySelector('.chk');
        parts.push((w?w.value:'')+'/'+(rp?rp.value:'')+'/'+(c&&c.classList.contains('on')?'1':'0'));
      });
    });
    const rt=$('#logRate'), rc=$('#logRec');
    parts.push('r'+(rt?rt.value:''), 'v'+(rc?rc.value:''));
    return parts.join(';');
  }
  function draftCollect(form){
    const acts=[];
    form.querySelectorAll('.act').forEach(a=>{
      const sets=[];
      a.querySelectorAll('.sr').forEach(r=>{
        const w=r.querySelector('input[data-w]'), rp=r.querySelector('input[data-r]'), c=r.querySelector('.chk');
        sets.push({w: w?w.value:'', r: rp?rp.value:'', on: !!c && c.classList.contains('on')});
      });
      acts.push({id:a.getAttribute('data-act'), sets:sets});
    });
    const rt=$('#logRate'), rc=$('#logRec');
    return {at:Date.now(), acts:acts, rating: rt?rt.value:'', recovery: rc?rc.value:''};
  }
  function draftFlush(){
    clearTimeout(draftT); draftT=null;
    const form=$('#logForm'); if(!form) return;
    const day=form.getAttribute('data-log-date'); if(!day) return;   /* 休息日表单不带日期 = 不存草稿 */
    if(!form.querySelector('.act')) return;                          /* 双保险：没有组行的表单不配当草稿 */
    const m=draftRead();
    if(formSignature(form)!==form.getAttribute('data-pristine')){ m[day]=draftCollect(form); draftWriteMap(m); }
    else if(m[day]){ delete m[day]; draftWriteMap(m); }              /* 改回原样就别留残稿 */
  }
  function draftQueue(){ clearTimeout(draftT); draftT=setTimeout(draftFlush, 400); }
  function draftDrop(day){ const m=draftRead(); if(m[day]){ delete m[day]; draftWriteMap(m); } }
  function draftClearAll(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
  /* 恢复要处理的三件事：动作被移出计划（跳过，不报错也不弹东西）、
     草稿里的组数比计划多（那正是用户「加一组」加的，照常补出行）、
     勾选状态与数值分别还原。 */
  function draftRestore(form, day){
    const d=draftRead()[day]; if(!d || !Array.isArray(d.acts)) return false;
    let hit=0;
    d.acts.forEach(rec=>{
      if(!rec || !rec.id) return;
      const box=form.querySelector('.act[data-act="'+String(rec.id).replace(/["\\]/g,'')+'"]');
      if(!box) return;
      let rows=[].slice.call(box.querySelectorAll('.sr'));
      const a=Library.byId(rec.id); const sp=a?unitSpec(a):null;
      while(sp && Array.isArray(rec.sets) && rows.length<rec.sets.length){
        const last=rows[rows.length-1];
        const lw=last&&last.querySelector('input[data-w]'), lr=last&&last.querySelector('input[data-r]');
        const foot=box.querySelector('.act-foot'); if(!foot) break;
        foot.insertAdjacentHTML('beforebegin',
          setRowHtml(a, sp, rows.length, lw?lw.value:'', lr?lr.value:'', true));
        rows=[].slice.call(box.querySelectorAll('.sr'));
      }
      (rec.sets||[]).forEach((st,i)=>{
        const r=rows[i]; if(!r) return;
        const w=r.querySelector('input[data-w]'), rp=r.querySelector('input[data-r]'), c=r.querySelector('.chk');
        if(w && st.w!=null) w.value=st.w;
        if(rp && st.r!=null) rp.value=st.r;
        if(c){ c.classList.toggle('on', !!st.on); c.setAttribute('aria-pressed', st.on?'true':'false');
               c.setAttribute('aria-label','第 '+(i+1)+' 组'+(st.on?'已完成':'未完成')); }
        hit++;
      });
      syncSetFoot(box);
    });
    if(!hit) return false;
    const rt=$('#logRate'), rc=$('#logRec');
    if(rt && d.rating!=='' && d.rating!=null) rt.value=d.rating;
    if(rc && d.recovery!=null) rc.value=d.recovery;
    updateActProg();
    const note=$('#draftNote');
    if(note){ note.hidden=false;
      note.innerHTML='<span>已接回上次未保存的记录 · '
        +new Date(d.at||Date.now()).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
        +'（草稿只存在这台设备上，保存后自动清除）</span>'
        +'<button type="button" class="wmore" data-draft-drop>丢弃草稿</button>'; }
    return true;
  }
  /* 加一组 = 复制上一组的重量与次数（同重量多组是最常见的记法，不该再敲一遍）。
     删除只允许删「加出来的」那几组，计划里的组删不掉 —— 免得一键抹掉整组记录。 */
  function syncSetFoot(box){
    const n=box.querySelectorAll('.sr').length;
    const min=Math.max(1, +box.getAttribute('data-min')||1);
    const del=box.querySelector('[data-del-set]');
    if(del){
      /* 不再隐藏：始终显示「减一组」，到下限置灰，用户能看到边界而不是按钮凭空消失。 */
      del.hidden=false;
      del.disabled = n<=min;
      del.setAttribute('aria-disabled', n<=min?'true':'false');
    }
    const cnt=box.querySelector('.act-count');
    if(cnt) cnt.textContent = n+' 组';
  }
  function addSetRow(box){
    const a=Library.byId(box.getAttribute('data-act')); if(!a) return;
    const sp=unitSpec(a);
    const rows=[].slice.call(box.querySelectorAll('.sr'));
    const last=rows[rows.length-1];
    const lw=last&&last.querySelector('input[data-w]'), lr=last&&last.querySelector('input[data-r]');
    const dw=sp.weight?defaultWeight(a):null;
    const foot=box.querySelector('.act-foot'); if(!foot) return;
    foot.insertAdjacentHTML('beforebegin', setRowHtml(a, sp, rows.length,
      lw?lw.value:(dw==null?'':dw), lr?lr.value:(sp.def==null?'':sp.def), !followMode));
    syncSetFoot(box); updateActProg(); draftQueue();
  }
  function delLastSetRow(box){
    const min=Math.max(1, +box.getAttribute('data-min')||1);
    const rows=[].slice.call(box.querySelectorAll('.sr'));
    if(rows.length<=min) return;
    rows[rows.length-1].remove();
    syncSetFoot(box); updateActProg(); draftQueue();
  }

  /* ---------- v4.2 · 勾完一组之后的两个动作 ----------
   * 只认「勾上」：取消勾是纠正，不是完成，不该触发节拍器。
   * 找下一组的顺序是「本动作后面 → 本动作前面补漏 → 下一个动作」，这样中途补勾
   * 也不会把视线甩到别的动作去。 */
  function nextSetAndRest(ck){
    const form=$('#logForm'); if(!form) return;
    const cks=[].slice.call(form.querySelectorAll('.chk'));
    const i=cks.indexOf(ck);
    let next=null, k;
    for(k=i+1;k<cks.length;k++){ if(!cks[k].classList.contains('on')){ next=cks[k]; break; } }
    if(!next) for(k=0;k<i;k++){ if(!cks[k].classList.contains('on')){ next=cks[k]; break; } }
    cks.forEach(function(c){ const r=c.closest('.sr'); if(r) r.classList.remove('is-next'); });
    if(next){
      const row=next.closest('.sr');
      if(row){
        row.classList.add('is-next');
        /* 只在「看不见」时滚动：已经露出来的行再滚一次，等于把用户的手指骗走。
           上留 96、下留 92（休息条 + 底栏），被压住的判断不看整屏视口。 */
        const b=row.getBoundingClientRect();
        const vh=window.innerHeight||0;
        if(b.top<96 || b.bottom>vh-92){
          const reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          try{ row.scrollIntoView({block:'center', behavior: reduce?'auto':'smooth'}); }
          catch(e){ row.scrollIntoView(); }
        }
      }
    }
    const box=ck.closest('.act');
    restStart(box && box.getAttribute('data-unit')==='kg' ? 90 : 60);
  }

  /* ---------- 组间休息倒计时 ----------
   * 纯前端计时，不进 Store：它是「当下这一组的节拍」，不是要长期保存的数据。
   * 切页 / 换日 / 保存一律停表，否则会出现「人在今日页、表还挂在昨天那组」。
   * 条子常驻 body（不进 #app），避免每次重渲染都要重建计时器。 */
  let restT=null, restEnd=0, restSpan=1;
  function restStart(sec){
    if(!(sec>0)) return;
    restEnd=Date.now()+sec*1000; restSpan=sec*1000;
    let bar=document.getElementById('restBar');
    if(!bar){
      document.body.insertAdjacentHTML('beforeend',
        '<div class="restbar" id="restBar" hidden role="timer" aria-live="off" aria-label="组间休息倒计时">'
        +'<span class="rb-k">休息</span><b class="rb-t" id="rbTime">0:00</b>'
        +'<span class="rb-track"><i id="rbFill"></i></span>'
        +'<button type="button" class="rb-btn" data-rest="add">+30s</button>'
        +'<button type="button" class="rb-btn rb-skip" data-rest="skip">跳过</button>'
        +'</div>');
      bar=document.getElementById('restBar');
      bar.addEventListener('click', function(e){
        const b=e.target && e.target.closest ? e.target.closest('[data-rest]') : null;
        if(!b) return;
        if(b.getAttribute('data-rest')==='skip'){ restStop(); return; }
        restEnd+=30000; restSpan+=30000; restTick();
      });
    }
    bar.hidden=false;
    document.body.classList.add('is-resting');
    clearInterval(restT);
    restT=setInterval(restTick, 250);
    restTick();
  }
  function restTick(){
    const t=document.getElementById('rbTime'), f=document.getElementById('rbFill');
    if(!t) return;
    const left=Math.max(0, restEnd-Date.now());
    const s=Math.ceil(left/1000);
    t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if(f) f.style.width=(restSpan?left/restSpan*100:0)+'%';
    if(left<=0){ restStop(); if(cur==='log'){ try{ toast('休息结束，做下一组','ok'); }catch(e){} } }
  }
  function restStop(){
    clearInterval(restT); restT=null;
    const bar=document.getElementById('restBar');
    if(bar) bar.hidden=true;
    document.body.classList.remove('is-resting');
  }
  /* 组行模板：渲染与「加一组」共用同一个函数。以前加行要照抄一遍结构，
     很容易漏掉非抗阻动作的 .sr-empty 占位，导致网格错位。 */
  function setRowHtml(a, sp, idx, wv, rv, on){
    /* 只有一列数值的动作（时长 / 距离 / 遍数）：不再留第二个空列，
       让唯一一列横跨「数值 + 次数」的位置——否则半行空白，数字缩在左边一格。 */
    const one = !sp.weight;
    return '<div class="sr'+(one?' one':'')+'">'
      + '<span class="no">'+(idx+1)+'</span>'
      + (sp.weight ? stepperHtml(a.name,sp,'w',idx,wv,'kg') : '')
      + stepperHtml(a.name,sp,'r',idx,rv,sp.unit)
      + '<button type="button" class="chk'+(on?' on':'')+'" data-chk="'+idx+'" aria-pressed="'+(on?'true':'false')
        +'" aria-label="第 '+(idx+1)+' 组'+(on?'已完成':'未完成')+'">✓</button>'
      + '</div>';
  }
  function stepperHtml(actionName, sp, field, idx, val, unit){
    const isW = field==='w';
    const u = unit || (isW ? 'kg' : sp.unit);
    const aria = esc(actionName)+' 第 '+(idx+1)+' 组'+(isW?'重量':sp.unit);
    return '<span class="stepper">'
      + '<button type="button" class="st" data-step="-1" data-f="'+field+'" aria-label="减少">−</button>'
      + '<input type="number" inputmode="'+(isW?'decimal':'numeric')+'" '+(isW?'step="0.5" ':'')+'min="0" data-'+field+'="'+idx+'" value="'+val+'" aria-label="'+aria+'">'
      + '<span class="u" aria-hidden="true">'+esc(u)+'</span>'
      + '<button type="button" class="st" data-step="1" data-f="'+field+'" aria-label="增加">+</button>'
      + '</span>';
  }
  function startLogForm(opt){
    cancelStepPend();        // 表单要重建：丢掉还按着的那一次
    restStop();              // 换日/保存/重建即换了一轮节拍：旧倒计时必须结束
    draftFlush();            // 重建会抹掉 input 里的值：先把「还没保存的输入」存成草稿
    /* 立刻摘掉标记：下面的休息日/空计划分支会提前 return，不摘就会被下一次
       flush 当成"这一天的表单"，把只有 rating 默认值的空壳写回草稿、覆盖真草稿。 */
    const prevForm=$('#logForm');
    if(prevForm){ prevForm.removeAttribute('data-log-date'); prevForm.removeAttribute('data-pristine'); }
    const day=logSel||Util.localDate(); const wk=Plan.get().week[$('#logDay').value];
    const acts=(wk&&Array.isArray(wk.actions))?wk.actions.map(id=>Library.byId(id)).filter(Boolean):[];
    if(!acts.length){
      /* 休息/空计划：展示空态卡片（替换旧内容，避免残留上一日的动作造成误导） */
      $('#logForm').innerHTML = '<div class="card"><p class="small muted">'+esc(Plan.types()[wk&&wk.type]||(wk&&wk.type)||'休息')+'——该日为休息/空计划，无需记录。有安排时：选好日期 → 核对自动带出的组次 → 保存这次训练。</p></div>';
      return;
    }
    const blocks = acts.map(a=>{
      const sp=unitSpec(a);
      /* 抗阻与核心默认至少 3 组；纯时长有氧（unit=min）保留计划组数，
         否则一个 20 分钟 interval 会被拆成三行无意义的记录。 */
      const minSets = (!sp.weight && sp.unit==='min') ? 1 : 3;
      const n=Math.max(minSets, parseInt(a.sets,10)||minSets);
      const dw=sp.weight?defaultWeight(a):null;
      const seedFlag=sp.weight && weightIsSeed(a);
      const catLabel=(Library.CATS.find(c=>c.k===a.cat)||{}).label||'';
      let sug=null; try{ sug=Adapt.suggestion(a.id); }catch(e){}
      const lastTxt=lastSetsText(a.id);

      let rows='';
      for(let s=0;s<n;s++){
        const wv = dw==null ? '' : dw;
        const rv = sp.def==null ? '' : sp.def;
        rows += setRowHtml(a, sp, s, wv, rv, !followMode);
      }

      /* 参考 openGym compact / Flex：动作块只留「上次」与「目标」一行，
         首练不再把「首次记录，选能标准完成…」在每个动作里重复八遍。 */
      const shortLast = lastTxt ? (function(t){
        const parts=String(t).split(' · ');
        return parts.length>3 ? parts.slice(0,3).join(' · ')+' …' : t;
      })(lastTxt) : '';
      const tw = (sug && sug.target) ? sug.target : (sp.weight ? dw : null);
      const targetTxt = (tw!=null && sp.weight)
        ? tw+'kg × '+esc(a.reps||'')
        : esc(a.reps||'');
      const context = (shortLast?'<span><b>上次</b> '+esc(shortLast)+'</span>':'')
        + (targetTxt?'<span><b>目标</b> '+targetTxt+'</span>':'')
        + (!shortLast?'<span>首练 · 按预设</span>':'');

      /* 加出来的组也算进这张卡：data-planned 是「计划组数」，
         删除按钮只允许删到这条线为止。 */
      return '<div class="act" data-act="'+a.id+'" data-unit="'+sp.unit+'" data-planned="'+n+'" data-min="'+minSets+'">'
        + '<div class="act-top"><b>'+esc(a.name)+'</b>'
          + (catLabel?'<span class="act-cat">'+catLabel+'</span>':'')
          + (seedFlag?'<span class="act-seed">起始</span>':'')
        + '</div>'
        + '<div class="act-ctx">'+context+'</div>'
        + rows
        + '<div class="act-foot">'
          + '<span class="act-count">'+n+' 组</span>'
          + '<button type="button" class="wmore addset" data-add-set aria-label="给 '+esc(a.name)+' 加一组，复制上一组的重量和次数">＋ 加一组</button>'
          + '<button type="button" class="wmore delset" data-del-set>减一组</button>'
        + '</div>'
        + '</div>';
    }).join('');

    /* 默认全勾 = 一次都不用点。计数回答「这一页几组、已勾几组」；
       分段条反过来标「哪个动作有缺口」，全勾时它是一条安静的空轨。
       「跟练」是唯一会让默认值翻转的开关：开启后每组从空勾开始，点一下才算完成，
       才能接上「定位下一组 + 休息倒计时」这套节拍（默认关 = 赛后补记的快速通道）。 */
    const aprog = '<div class="aprog" id="aprog"><span class="ap-t">已勾 <b id="apDone">0</b>/<b id="apAll">0</b> 组</span>'
      + '<span class="ap-bars" id="apBars">'+acts.map(()=>'<i></i>').join('')+'</span>'
      + '<button type="button" class="ap-follow" data-follow aria-pressed="'+(followMode?'true':'false')+'"'
      + ' aria-label="跟练模式：'+(followMode?'已开启':'已关闭')+'，开启后每组点一下才算完成，并自动开始组间休息">'
      + (followMode?'跟练中':'跟练')+'</button></div>';

    $('#logForm').innerHTML = '<div class="log-session">'
      + '<div class="log-session-hd"><p class="log-kicker">本次训练</p>'
      + '<h3>'+esc(day)+' · '+esc(Plan.types()[wk.type]||wk.type)+'</h3></div>'
      + aprog
      + '<p class="small muted draft-note" id="draftNote" hidden></p>'
      + '</div>'
      + '<div class="log-legend" aria-hidden="true"><span>组</span><span>数值</span><span>次数</span><span>完成</span></div>'
      + '<div class="log-acts">'+blocks+'</div>'
      + '<div class="card log-save">'
      + '<div class="field-row">'
      + '<div class="field"><label for="logRate">本次训练评分 (1-10)</label><input id="logRate" type="number" min="1" max="10" value="8"></div>'
      + '<div class="field"><label for="logRec">恢复状态 (睡眠/酸痛)</label><input id="logRec" placeholder="如：睡眠7h，胸微酸"></div>'
      + '</div>'
      + '<span class="field-err" id="logSets_err"></span>'
      + '<div class="btnrow"><button class="btn" id="saveLog">保存这次训练</button></div>'
      + '</div>';

    bindSetRows();
    appInner().querySelectorAll('#logForm .act').forEach(syncSetFoot);
    updateActProg();
    const logForm=$('#logForm');
    logForm.setAttribute('data-log-date', day);
    /* pristine 必须是「还没恢复草稿」时的签名：恢复之后表单和默认值不一样，
       但那是用户自己的输入，不能当成"未编辑"而被清掉。 */
    logForm.setAttribute('data-pristine', formSignature(logForm));
    draftRestore(logForm, day);
    /* 切跟练模式：草稿会把旧的勾选带回来，所以恢复之后再按模式统一一次。
       只动勾，不动已经敲进去的重量/次数。 */
    if(opt && opt.resetChecks){
      [].forEach.call(logForm.querySelectorAll('.act'), function(box){
        [].forEach.call(box.querySelectorAll('.chk'), function(c,i){
          const on=!followMode;
          c.classList.toggle('on', on);
          c.setAttribute('aria-pressed', on?'true':'false');
          c.setAttribute('aria-label','第 '+(i+1)+' 组'+(on?'已完成':'未完成'));
        });
      });
      [].forEach.call(logForm.querySelectorAll('.sr.is-next'), function(r){ r.classList.remove('is-next'); });
      updateActProg();
    }

    /* 防重入：保存后要重建表单、按钮节点会换掉，所以用时间戳而非 disabled 作唯一闸门。 */
    $('#saveLog').onclick=()=>{
      if(Date.now() - lastSaveAt < 800) return;
      clearFieldErrs();
      const entries=[];
      document.querySelectorAll('#logForm [data-act]').forEach(box=>{
        const aid=box.getAttribute('data-act');
        const unit=box.getAttribute('data-unit')||'次';
        /* 勾选 = 这组做了；取消勾 = 这次跳过。语义只有一套，
           不再有「没动过就全存」这种代码看得见、界面上看不见的隐藏规则。 */
        const sets=[...box.querySelectorAll('.sr')].filter(r=>{
          const c=r.querySelector('.chk');
          return !c || c.classList.contains('on');
        }).map(r=>{
          const w=r.querySelector('input[data-w]'), rp=r.querySelector('input[data-r]');
          return {weight: w?(+w.value||0):0, reps: rp?(+rp.value||0):0};
        }).filter(s=>s.weight||s.reps);
        if(sets.length) entries.push({actionId:aid,actionName:(Library.byId(aid)||{}).name||aid,unit,sets,rpe:null});
      });
      if(!entries.length){ setFieldErr(null,'请至少记录一组','#logSets_err'); return; }
      lastSaveAt = Date.now();
      const sb=$('#saveLog'); if(sb){ sb.disabled=true; sb.textContent='已保存 ✓'; }
      Log.add({id:Store.uid(),date:day,dayType:wk.type,entries,rating:+$('#logRate').value||8,recovery:$('#logRec').value});
      draftDrop(day);                       // 已成记录，草稿立刻失效
      /* 摘掉日期标记：否则紧随的 startLogForm 会先 draftFlush，把刚保存的这份
         脏表单又写回草稿（表现为"存好了却还提示有未保存草稿"）。 */
      const lf=$('#logForm'); if(lf) lf.removeAttribute('data-log-date');
      toast('已保存训练记录','ok');
      renderHistory();
      const dot=document.querySelector('.wday[data-date="'+day+'"] .dot');
      if(dot) dot.classList.add('on');
      startLogForm();   /* 重建表单：不留白，且重量自动带出刚存的值 */
    };
  }
  /* 一个动作的所有组都勾上 → 它那段点亮 */
  function updateActProg(){
    const box=$('#logForm'); if(!box) return;
    const acts=[...box.querySelectorAll('.act')];
    const flags=acts.map(a=>{
      const cks=[...a.querySelectorAll('.chk')];
      return cks.length>0 && cks.every(c=>c.classList.contains('on'));
    });
    const cks=[...box.querySelectorAll('.chk')];
    const checked=cks.filter(c=>c.classList.contains('on')).length;
    const d=$('#apDone'); if(d) d.textContent=checked;
    const all=$('#apAll'); if(all) all.textContent=cks.length;
    const bars=$('#apBars');
    if(bars) [...bars.children].forEach((b,k)=>b.classList.toggle('gap', !flags[k]));
    const ap=$('#aprog'); if(ap) ap.classList.toggle('all-ok', checked===cks.length && cks.length>0);
  }
  /* 步进器与勾选：只绑定一次（委托到 document）。
     之前的写法在每次重渲染时都给 #logForm 加一遍监听，导致一次点击触发 2~4 次
     —— 表现为「+ 一下重量跳了 5kg」「勾选点了没反应」。 */
  let setRowsBound = false;
  /* 跟练模式：组默认空勾，逐组点。默认关 —— 关着就是「全勾 + 改数字就存」的补记快速通道。
     只活在这一屏（不落 localStorage）：它是当下这次训练的做法，不是长期偏好。 */
  let followMode = false;
  let lastSaveAt = 0;      // 保存防重入的时间戳闸门：跨表单重建依然有效
  /* 步进器「按下但未提交」的状态提到模块作用域：切日与保存都会重建表单，
     若计时器还攥着已 detach 的 input，会每 90ms 往幽灵节点写值（静默失败）。 */
  let stepPend = null, stepHoldT = null, stepRepeatT = null;
  function cancelStepPend(){
    clearTimeout(stepHoldT); clearInterval(stepRepeatT);
    stepHoldT = stepRepeatT = null; stepPend = null;
  }
  function bindSetRows(){
    if(setRowsBound) return;
    setRowsBound = true;
    const bump=btn=>{
      const actEl=btn.closest('[data-act]');
      const unit=actEl?actEl.getAttribute('data-unit'):'次';
      const field=btn.getAttribute('data-f');
      const input=btn.parentElement.querySelector('input');
      if(!input) return;
      const step = field==='w' ? STEP_W : (STEP_OF[unit]||1);
      const cur = parseFloat(input.value||'0')||0;
      input.value = Math.max(0, +(cur + (+btn.getAttribute('data-step'))*step).toFixed(2));
      /* 调了数值说明这组要做：自动勾上，省一次点击 */
      const row=btn.closest('.sr');
      const ck=row?row.querySelector('.chk'):null;
      if(ck && !ck.classList.contains('on')){
        ck.classList.add('on'); ck.setAttribute('aria-pressed','true');
        const i=[].slice.call(ck.closest('.act').querySelectorAll('.chk')).indexOf(ck);
        ck.setAttribute('aria-label','第 '+(i+1)+' 组已完成');
        updateActProg();
      }
      draftQueue();
    };
    /* 按下只记态势，抬指才提交：pointerdown 那一刻不可能知道这是「点击」还是
       「横滑的起手」，在那里改值＝每次想滑页都白丢一档。 */
    document.addEventListener('pointerdown', e=>{
      const btn=e.target && e.target.closest ? e.target.closest('#logForm .st') : null;
      if(!btn) return;
      e.preventDefault();                       // 不聚焦输入框 → 不弹键盘
      cancelStepPend();
      stepPend={btn:btn, x:e.clientX, y:e.clientY, repeated:false};
      stepHoldT=setTimeout(()=>{
        if(!stepPend || stepPend.btn!==btn) return;
        stepPend.repeated=true;
        bump(btn);                              // 380ms 到点：确认是长按，才第一次生效
        stepRepeatT=setInterval(()=>{ if(stepPend) bump(btn); }, 90);
      }, 380);
    });
    /* 4px（远小于判轴 12px）：手指一动就说明不是「按住不动」，
       立刻交出连加权，把手势仲裁完整让给 SwipeTab。 */
    document.addEventListener('pointermove', e=>{
      if(!stepPend) return;
      if(Math.abs(e.clientX-stepPend.x) > 4 || Math.abs(e.clientY-stepPend.y) > 4) cancelStepPend();
    }, { passive: true });
    document.addEventListener('pointerup', ()=>{
      if(!stepPend) return;
      const p2=stepPend;
      if(!p2.repeated) bump(p2.btn);            // 短按：抬指时才生效
      cancelStepPend();
    });
    document.addEventListener('pointercancel', cancelStepPend);

    document.addEventListener('click', e=>{
      const ck=e.target && e.target.closest ? e.target.closest('#logForm .chk') : null;
      if(!ck) return;
      const on=!ck.classList.contains('on');
      ck.classList.toggle('on', on);
      ck.setAttribute('aria-pressed', on?'true':'false');
      const i=[...ck.closest('.act').querySelectorAll('.chk')].indexOf(ck);
      ck.setAttribute('aria-label','第 '+(i+1)+' 组'+(on?'已完成':'未完成'));
      updateActProg();
      draftQueue();
      /* 勾上 = 这组做完了：定位下一组并开休息表（先更新进度条，避免滚动时高度还在变） */
      if(on) nextSetAndRest(ck);
    });

    /* 「＋ 加一组 / 减一组 / 丢弃草稿 / 跟练开关」：委托一次，跟表单重建无关 */
    document.addEventListener('click', e=>{
      if(!e.target || !e.target.closest) return;
      const add=e.target.closest('#logForm [data-add-set]');
      const del=e.target.closest('#logForm [data-del-set]');
      const drop=e.target.closest('#logForm [data-draft-drop]');
      const follow=e.target.closest('#logForm [data-follow]');
      if(follow){
        followMode=!followMode;
        /* 换模式 = 换一套「做完没做完」的账，旧勾选不能带过去；
           已经敲进去的重量/次数要留着，所以只重置勾，不重置输入。 */
        startLogForm({resetChecks:true});
        toast(followMode?'跟练模式：每组点一下才算完成，并自动开始休息':'已回到全勾，改数字即可保存','ok');
        return;
      }
      if(add){ const box=add.closest('.act'); if(box) addSetRow(box); return; }
      if(del){ const box=del.closest('.act'); if(box) delLastSetRow(box); return; }
      if(drop){
        const form=$('#logForm'); if(!form) return;
        draftDrop(form.getAttribute('data-log-date'));
        form.removeAttribute('data-log-date');      // 同上：别让重建前的 flush 把脏表单写回去
        startLogForm();                            /* 丢弃 = 回到计划默认值，不自己猜怎么还原 */
        const nt=$('#draftNote'); if(nt){ nt.hidden=true; nt.innerHTML=''; }
      }
    });
    /* 手打的数字（不是步进器改的）也要进草稿 */
    document.addEventListener('input', e=>{
      if(e.target && e.target.closest && e.target.closest('#logForm')) draftQueue();
    }, {passive:true});
    /* 关页面 / 切后台：等不到 400ms 防抖，立即落盘 —— 这才是草稿真正救命的时刻 */
    window.addEventListener('pagehide', draftFlush);
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden) draftFlush(); });
  }

  /* 坚持：近 18 周训练热力图（列=周，行=周一..周日）+ 连续天数 / 本周完成度 */
  function consistencyPanel(){
    const has={}; (Store.get().logs||[]).forEach(l=>{ if(l.date) has[l.date]=1; });
    const today=new Date();
    const dow=(today.getDay()+6)%7;                        // 周一 = 0
    const monday=new Date(today); monday.setDate(today.getDate()-dow);
    const weeks=18;
    const start=new Date(monday); start.setDate(monday.getDate()-(weeks-1)*7);
    const todayKey=Util.localDate(today), mondayKey=Util.localDate(monday);
    let cells='', total=0, week=0;
    for(let w=0;w<weeks;w++){
      for(let d=0;d<7;d++){
        const dt=new Date(start); dt.setDate(start.getDate()+w*7+d);
        const key=Util.localDate(dt);
        const fut = key > todayKey;
        const on = !!has[key];
        if(on){ total++; if(key>=mondayKey) week++; }
        cells += '<i class="hc'+(on?' on':'')+(fut?' fut':'')+'" title="'+key+(on?' 已训练':'')+'"></i>';
      }
    }
    let streak=0; const cur=new Date(today);
    if(!has[Util.localDate(cur)]) cur.setDate(cur.getDate()-1);
    while(has[Util.localDate(cur)]){ streak++; cur.setDate(cur.getDate()-1); }
    return '<div class="panel"><h2>坚持</h2>'
      + '<div class="cons-top"><b>连续 <em>'+streak+'</em> 天</b>'
      + '<span class="small muted">本周 '+week+'/7 · 近 '+weeks+' 周 '+total+' 天</span></div>'
      + '<div class="heat" role="img" aria-label="近 '+weeks+' 周训练热力图，共 '+total+' 天">'+cells+'</div>'
      + '<div class="heat-lg"><span>少</span><i class="hc"></i><i class="hc on"></i><span>多</span></div>'
      + '</div>';
  }

  // 趋势图：按容器宽度重算坐标（375px 屏不再把 11px 文字压到 4.8px）
  // 三条量纲不同（kg / % / cm），统一按「各自区间内的相对位置 0-100%」绘制，
  // 并在末点标注真实数值 + 图例给出各自区间，避免被误读为同一量纲
  const CHART_SERIES=[
    {k:'weight', label:'体重', unit:'kg', cls:'s-weight'},
    {k:'bodyfat',label:'体脂', unit:'%',  cls:'s-bodyfat'},
    {k:'waist',  label:'腰围', unit:'cm', cls:'s-waist'}
  ];
  function renderChart(){
    const box=$('#chartBox'); if(!box) return;
    const ms=Progress.list();
    if(ms.length<2){ box.innerHTML=emptyState('至少录入 2 次体测，才会生成趋势图'); return; }
    const W=Math.max(300, Math.round(box.clientWidth||0)||680), H=260;
    const padL=40,padR=12,padT=12,padB=30;
    const iw=W-padL-padR, ih=H-padT-padB, n=ms.length;
    const X=i=> n>1 ? padL+iw*i/(n-1) : padL+iw/2;
    let grid='', ylab='';
    [0,0.25,0.5,0.75,1].forEach(t=>{
      const y=padT+ih*(1-t);
      grid+='<line class="gridline" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'"/>';
      ylab+='<text class="tick" x="'+(padL-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+Math.round(t*100)+'%</text>';
    });
    let paths='', legend='';
    const goalW=(Store.get().profile||{}).goalWeight||63;
    CHART_SERIES.forEach(s=>{
      const rawVals=ms.map(m=>m[s.k]).filter(v=>v!=null);
      if(!rawVals.length) return;
      const allVals=(s.k==='weight'&&goalW!=null)?rawVals.concat([goalW]):rawVals;
      const min=Math.min.apply(null,allVals), max=Math.max.apply(null,allVals), span=(max-min)||1;
      const pts=[];
      ms.forEach((m,i)=>{ if(m[s.k]==null) return;
        pts.push({x:X(i), y:padT+ih*(1-(m[s.k]-min)/span), v:m[s.k]}); });
      if(!pts.length) return;
      paths+='<polyline class="'+s.cls+'" fill="none" stroke-width="2" stroke-linejoin="round" points="'+
        pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')+'"/>';
      pts.forEach(p=>{ paths+='<circle class="'+s.cls+'" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3"/>'; });
      if(s.k==='weight' && pts.length>=3){
        const w7=pts.map((p,i)=>{
          const from=Math.max(0,i-6);
          const seg=pts.slice(from,i+1);
          return {x:p.x, y:padT+ih*(1-(seg.reduce((a,q)=>a+q.v,0)/seg.length-min)/span)};
        });
        paths+='<polyline class="ma7" fill="none" stroke-width="2" stroke-linejoin="round" points="'+
          w7.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')+'"/>';
        legend+='<span><i class="ma7"></i>7 点移动均线</span>';
      }
      const last=pts[pts.length-1];
      paths+='<text class="tick val" x="'+Math.min(last.x+6,W-padR).toFixed(1)+'" y="'+(last.y+4).toFixed(1)+'" text-anchor="end">'+last.v+s.unit+'</text>';
      legend+='<span><i class="'+s.cls+'"></i>'+s.label+' '+min+' - '+max+' '+s.unit+'</span>';
    });
    const wVals=ms.map(m=>m.weight).filter(v=>v!=null);
    let goalLine='';
    if(wVals.length && goalW>0){
      const wAll=(goalW!=null)?wVals.concat([goalW]):wVals;
      const wMin=Math.min.apply(null,wAll), wSpan=(Math.max.apply(null,wAll)-wMin)||1;
      const gy=padT+ih*(1-(goalW-wMin)/wSpan);
      goalLine='<line class="goalline" x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'"/>';
      paths+='<text class="tick" x="'+(W-padR)+'" y="'+(gy-5).toFixed(1)+'" text-anchor="end">目标 '+goalW+'kg</text>';
      legend+='<span><i class="goalline"></i>目标体重</span>';
    }
    const xlab=ms.map((m,i)=>'<text class="tick" x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(m.date.slice(5))+'</text>').join('');
    box.innerHTML='<div class="chart-wrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" '+
      'role="img" aria-label="体测趋势：体重 / 体脂 / 腰围，纵轴为各序列在自身区间内的相对位置">'+
      grid+ylab+
      '<line class="axis" x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+ih)+'"/>'+
      '<line class="axis" x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'"/>'+
      goalLine+paths+xlab+'</svg></div>'+
      '<div class="legend">'+legend+'<span class="mut">纵轴 = 各序列在自身区间内的相对位置（0-100%）</span></div>';
  }

  /* ---- 周报 ---- */
  function report(){
    const monday=Util.localDate(Util.mondayOf());
    const trainN=Log.thisWeekResistCount();   // 抗阻次数（目标 3），功能日不计入
    const trainAll=Log.thisWeekCount();        // 含功能日的总活动次数
    const dietDays=Store.get().diet.filter(x=>x.date>=monday);
    const dietOk=dietDays.filter(x=>Diet.match(x).level==='ok').length;
    const sleeps=Body.sleepList().filter(s=>s.date>=monday);
    const avgSleep=sleeps.length?Math.round(sleeps.reduce((a,s)=>a+s.hours,0)/sleeps.length*10)/10:null;
    const wins=Store.get().diet.filter(x=>x.date>=monday&&x.firstmeal&&x.lastmeal)
      .map(x=>{const p=t=>{const q=String(t).split(':');return (+q[0])*60+(+q[1]);};let s=p(x.lastmeal)-p(x.firstmeal);if(s<=0)s+=1440;return s/60;});
    const avgWin=wins.length?Math.round(wins.reduce((a,b)=>a+b,0)/wins.length*10)/10:null;
    // 稳定度评分：训练 30% + 饮食 30% + 睡眠 20% + 进食窗 20%
    // 训练分按「抗阻 3 次」为满分线（本部署版周计划抗阻日 = 周一/周三/周五 共 3 天）
    const trainScore=Math.min(1,trainN/3)*30;
    const dietScore=(dietDays.length?dietOk/dietDays.length:0)*30;
    const sleepScore=sleeps.length?Math.min(1,avgSleep/7)*20:0;
    const winScore=avgWin!=null?Math.max(0,Math.min(1,(14-avgWin)/4))*20:0;  // 14h→0分，10h→满分
    const score=Math.round(trainScore+dietScore+sleepScore+winScore);
    const fb=Diet.feedback();
    const notes=[];
    notes.push('本周抗阻 '+trainN+' 次（目标 3 次），含功能日共活动 '+trainAll+' 次。');
    if(dietDays.length) notes.push('饮食打卡 '+dietDays.length+' 天，达标 '+dietOk+' 天。');
    if(avgSleep!=null) notes.push('平均睡眠 '+avgSleep+'h（目标 ≥7h）。');
    if(avgWin!=null) notes.push('平均进食窗 '+avgWin+'h（目标 ≤12h）。');
    if(trainN<3) notes.push('抗阻频率偏低（'+trainN+'/3）——推/拉/腿至少各 1 次是保肌底线。');
    if(avgSleep!=null&&avgSleep<7) notes.push('睡眠低于 7h：恢复与保肌都在打折，先修睡眠再谈加量。');
    const jr=Store.get().journal.filter(x=>x.date>=monday).slice().reverse();
    appInner().innerHTML = pageTabs('report') + `<div class="panel"><h2>本周复盘 · 周报</h2>
      <div class="grid stat stat-4 mt-0">
        <div class="stat"><div class="v">${score}</div><div class="k">本周稳定度 / 100</div></div>
        <div class="stat"><div class="v">${trainN}</div><div class="k">抗阻次数 / 3</div></div>
        <div class="stat"><div class="v">${dietOk}/${dietDays.length}</div><div class="k">饮食达标天</div></div>
        <div class="stat"><div class="v">${avgSleep!=null?avgSleep:'—'}</div><div class="k">平均睡眠 h</div></div>
      </div>
      <h3 class="mt-7">本周观察</h3>
      <ul class="tip-list">${notes.map(n=>'<li>'+esc(n)+'</li>').join('')}</ul>
      <h3 class="mt-7">文字周记</h3>
      <textarea id="jr_text" rows="4" placeholder="这周身体、饮食、训练、情绪有什么变化？"></textarea>
      <div class="btnrow"><button class="btn sm" id="jr_save">保存周记</button></div>
      <div id="jrList" class="mt-4"></div>
      <div class="btnrow mt-6 no-print"><button class="btn sm" id="jr_print">打印本页周报</button></div>
    </div>`;
    function renderJournal(){
      const el=$('#jrList'); if(!el) return;
      const all=Store.get().journal.slice().reverse();
      el.innerHTML=all.length?all.slice(0,8).map(x=>'<div class="card mt-4"><b>'+esc(x.date)+'</b><p class="small mt-2">'+esc(x.content)+'</p></div>').join(''):'<span class="small muted">还没有周记。</span>';
    }
    renderJournal();
    $('#jr_save').onclick=()=>{
      const c=$('#jr_text').value.trim();
      if(!c){ toast('先写一点内容再保存','warn'); return; }
      Store.set(d=>{ const date=Util.localDate(); const i=d.journal.findIndex(x=>x.date===date);
        if(i>=0)d.journal[i]={id:d.journal[i].id,date,content:c}; else d.journal.push({id:Store.uid(),date,content:c}); });
      toast('周记已保存','ok'); renderJournal(); $('#jr_text').value='';
    };
    $('#jr_print').onclick=()=>window.print();
  }

  /* ---- 饮食打卡 ---- */
  function diet(){
    const today=Util.localDate();
    appInner().innerHTML = `<div class="panel"><h2>饮食打卡</h2>
      <p class="muted">热量 ${Diet.TARGET.kcalMin}–${Diet.TARGET.kcalMax} kcal · 蛋白 ${Diet.TARGET.proTrain}g/天。按当天有无训练记录自动切换训练日。</p>
      <div class="field-row">
        <div class="field"><label for="d_date">日期</label><input id="d_date" type="date" value="${today}">
          <span class="field-err" id="d_date_err"></span></div>
        <div class="field"><label for="d_first">首餐时间</label><input id="d_first" type="time" value="08:00"></div>
        <div class="field"><label for="d_last">末餐时间</label><input id="d_last" type="time" value="20:00"></div>
      </div>
      <h3 class="mt-6">分餐次录入 <span class="small muted">（三餐 + 下午/晚上加餐，合计自动加总）</span></h3>
      <div id="mealRows">
        ${[['早餐','07:00–09:00'],['午餐','11:30–13:30'],['下午加餐','14:30–16:00'],['晚餐','17:30–19:30'],['晚上加餐','21:00–22:00']].map(([m,slot],mi)=>`
        <div class="meal-card" data-meal="${m}">
          <button type="button" class="meal-card-head" data-meal-pick="${mi}" aria-label="为${m}选食物">
            <span class="meal-tag">${m}</span>
            <span class="meal-slot">${slot}</span>
            <span class="meal-pick">选食物 ›</span>
          </button>
          <input class="m_food" placeholder="吃了什么（可留空）" aria-label="${m}食物">
          <div class="food-sug"></div>
          <div class="meal-nums">
            <div>
              <label class="meal-num-k">重量</label>
              <span class="input-unit">
                <input class="m_wt" type="number" inputmode="decimal" placeholder="0" aria-label="${m}重量（克）">
                <span class="unit" aria-hidden="true">g</span>
              </span>
            </div>
            <div>
              <label class="meal-num-k">热量</label>
              <span class="input-unit">
                <input class="m_kcal" type="number" inputmode="decimal" placeholder="0" aria-label="${m}热量（千卡，只填数字）">
                <span class="unit" aria-hidden="true">kcal</span>
              </span>
            </div>
            <div>
              <label class="meal-num-k">蛋白质</label>
              <span class="input-unit">
                <input class="m_pro" type="number" inputmode="decimal" placeholder="0" aria-label="${m}蛋白（克，只填数字）">
                <span class="unit" aria-hidden="true">g</span>
              </span>
            </div>
          </div>
        </div>`).join('')}
      </div>
      <div class="small mt-3">合计：<b id="m_sumK">0</b> kcal · <b id="m_sumP">0</b> g 蛋白 <span class="muted">（自动加总，点击右侧食物库可填入对应餐次）</span></div>
      <div class="row mt-5">
        ${Diet.FLAGS.map(f=>'<label class="small inline"><input type="checkbox" id="flag_'+f.k+'"> '+f.label+'</label>').join('')}
      </div>
      <div id="hungryHint" class="small mt-2"></div>
      <div class="btnrow"><button class="btn sm" id="addDiet">保存打卡</button></div>
      <div id="dietFb" class="mt-6"></div>
      <div id="todayMeals" class="mt-5"></div>
      <div id="dietMatrix" class="mt-4"></div>
      <div id="dietList" class="mt-5"></div>
      <details class="mt-6" id="kcalTrendBox">
        <summary><span>近 7 天热量趋势（点开展开图表）</span></summary>
        <div id="kcalTrend" class="mt-4 chart-wrap"></div>
      </details>
    </div>`;
    renderDietFb(); renderTodayMeals(); renderDietMatrix(); renderDietList();
    const kt=$('#kcalTrendBox');
    if(kt) kt.addEventListener('toggle',()=>{ if(kt.open) renderKcalTrend(); });
    function renderFoodOptions(q){
      const box=$('#foodOptions'); if(!box) return;
      const list=Foods.list(q||'');
      /* 按类型分组渲染：外卖即食 / 蛋白质 / 主食碳水 / 果蔬——每组独立三列网格 */
      const GROUPS=[['waimai','外卖即食'],['protein','蛋白质'],['carb','主食碳水'],['produce','果蔬']];
      const card=f=>'<button type="button" class="food-opt" data-food="'+esc(f.id)+'" data-kcal="'+f.kcal+'" data-pro="'+f.protein+'"><b>'+esc(f.name)+'</b><small>'+f.kcal+'kcal · 蛋白'+f.protein+'g</small></button>';
      let html='';
      GROUPS.forEach(g=>{
        const items=list.filter(f=>(f.cat||'other')===g[0]);
        if(items.length) html+='<h4 class="food-cat-title">'+g[1]+'</h4><div class="food-grid">'+items.map(card).join('')+'</div>';
      });
      const other=list.filter(f=>!GROUPS.some(g=>g[0]===(f.cat||'other')));
      if(other.length) html+='<h4 class="food-cat-title">其他</h4><div class="food-grid">'+other.map(card).join('')+'</div>';
      box.innerHTML=html || '<span class="small muted">无匹配——直接手填 kcal/蛋白即可</span>';
      /* 食物库点选 → 填入「当前聚焦餐次」（curMeal/bindSum 为 diet() 闭包级，与餐次输入常驻绑定） */
      box.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{
        const rows=mealRows(); const row=rows[curMeal]||rows[0]; if(!row) return;
        const foodIn=row.querySelector('.m_food');
        if(!foodIn.value.trim()) foodIn.value=b.querySelector('b').textContent;
        row.querySelector('.m_kcal').value=b.getAttribute('data-kcal');
        row.querySelector('.m_pro').value=b.getAttribute('data-pro');
        row.dataset.foodId=b.getAttribute('data-food');
        row.dataset.foodKcal=b.getAttribute('data-kcal');
        row.dataset.foodPro=b.getAttribute('data-pro');
        toast('已填入「'+row.getAttribute('data-meal')+'」（按 100g 基准，可按实际克数换算）','ok');
        bindSum();
      });
    }
    function updateHungryHint(){
      const el=$('#hungryHint'); if(!el) return;
      const kcal=+($('#d_kcal')&&$('#d_kcal').value||0);
      const T=Diet.TARGET;   // P1-5：提示区间与打卡判定同源（可被 profile.local.js 覆盖），不再硬编码
      if(!kcal){ el.innerHTML='<span class="muted">先填热量，再看今天的身体感。</span>'; return; }
      if(kcal>=T.kcalMin&&kcal<=T.kcalMax){ el.innerHTML='<span class="ok">缺口 ≈ '+(T.tdee-kcal)+'kcal → 身体感：微微饿（不是饿到烦躁）。微微饿是薄肌的基础——不是节食。</span>'; }
      else if(kcal<T.kcalMin){ el.innerHTML='<span class="warn">缺口过大 → 身体感：饿到烦躁——这不是微微饿，是节食（掉肌预警）。</span>'; }
      else { el.innerHTML='<span class="muted">接近或超出预算 → 身体感：饱。今天把缺口留给明天，不硬塞也不硬扣。</span>'; }
    }
    updateHungryHint();
    /* 分餐次输入常驻绑定：focus 跟踪（食物库点选目标）+ input 自动加总 */
    let curMeal=0;
    const mealRows=()=>[...document.querySelectorAll('#mealRows .meal-card')];
    const r0=x=>Math.round(x), r1=x=>Math.round(x*10)/10;
    const bindSum=()=>{
      const rows=mealRows();
      $('#m_sumK').textContent=r0(rows.reduce((a,r)=>a+(+r.querySelector('.m_kcal').value||0),0));
      $('#m_sumP').textContent=r1(rows.reduce((a,r)=>a+(+r.querySelector('.m_pro').value||0),0));
    };
    /* 数值输入校验：只允许数字与小数点（单点），上限 10000；非法字符实时剔除，超限截断并提示 */
    const numValidate=inp=>{
      inp.addEventListener('input',()=>{
        let v=inp.value;
        const cleaned=v.replace(/[^\d.]/g,'').replace(/\.(?=.*\.)/g,'');
        /* 非法字符是"正在打字"的瞬间问题：toast 是全局长条，用户视线在键盘上，看不见也不该被拦住。
           改成元素自身抖动 + invalid 描边，反馈落在被操作的那个框上。 */
        if(cleaned!==v){ inp.value=cleaned; shakeField(inp); }
        if(inp.value && +inp.value>10000){ inp.value='10000'; toast('数值不能超过 10000','warn'); }
        bindSum();
      });
    };
    mealRows().forEach((r,i)=>{
      r.querySelectorAll('input').forEach(inp=>{ inp.addEventListener('focus',()=>{ curMeal=i; }); });
      r.querySelectorAll('.m_kcal,.m_pro,.m_wt').forEach(inp=>numValidate(inp));
      r.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',bindSum));
      const foodInp=r.querySelector('.m_food');
      const sugBox=r.querySelector('.food-sug');
      foodInp.addEventListener('input',()=>{
        const q=foodInp.value.trim();
        if(!q){ sugBox.innerHTML=''; return; }
        const hits=Foods.list(q);
        if(hits.length===1){
          r.dataset.foodId=hits[0].id;
          r.dataset.foodKcal=hits[0].kcal;
          r.dataset.foodPro=hits[0].protein;
          const wtIn=r.querySelector('.m_wt');
          if(!wtIn.value || +wtIn.value===0) wtIn.value=hits[0].serv||0;
          wtIn.dispatchEvent(new Event('input',{bubbles:true}));   // 换关联食物后按新基准重算（wt 已有值则沿用）
          sugBox.innerHTML='';
        }else if(hits.length>1){
          delete r.dataset.foodId;
          delete r.dataset.foodKcal;
          delete r.dataset.foodPro;
          sugBox.innerHTML=hits.slice(0,3).map(h=>'<button type="button" class="sug-chip" data-sid="'+esc(h.id)+'">'+esc(h.name)+' · '+h.kcal+'kcal/100g</button>').join('');
          sugBox.querySelectorAll('.sug-chip').forEach(btn=>btn.onclick=()=>{
            const id=btn.getAttribute('data-sid');
            const f=Foods.byId(id);
            if(!f) return;
            foodInp.value=f.name;
            r.dataset.foodId=f.id;
            r.dataset.foodKcal=f.kcal;
            r.dataset.foodPro=f.protein;
            const wtIn=r.querySelector('.m_wt');
            if(!wtIn.value || +wtIn.value===0) wtIn.value=f.serv||0;
            sugBox.innerHTML='';
            const kcalIn=r.querySelector('.m_kcal');
            kcalIn.dispatchEvent(new Event('input',{bubbles:true}));
            wtIn.dispatchEvent(new Event('input',{bubbles:true}));
          });
        }else{
          delete r.dataset.foodId;
          delete r.dataset.foodKcal;
          delete r.dataset.foodPro;
          sugBox.innerHTML='';
        }
      });
      const wtInp=r.querySelector('.m_wt');
      wtInp.addEventListener('input',()=>{
        if(!r.dataset.foodId) return;
        const wt=+wtInp.value;
        if(!(wt>0)) return;
        const kcal=Math.round(+r.dataset.foodKcal*wt/100);
        const pro=Math.round(+r.dataset.foodPro*wt/100*10)/10;
        const kcalIn=r.querySelector('.m_kcal');
        const proIn=r.querySelector('.m_pro');
        kcalIn.value=kcal;
        proIn.value=pro;
        kcalIn.dispatchEvent(new Event('input',{bubbles:true}));
        proIn.dispatchEvent(new Event('input',{bubbles:true}));
      });
    });
    const kcalIn=$('#d_kcal'); if(kcalIn) kcalIn.addEventListener('input',updateHungryHint);

    /* ---- v3.39 餐次弹窗：选食物库 / 自己加一条 ----
       旧流程要滚到页底的食物库，且填的是「最后聚焦的那个输入框」——焦点一跑就填错餐次。
       现在点哪一餐就只改哪一餐，弹窗里直接搜索、点选、或手写名字与热量。 */
    let sheetReturnFocus=null;
    function closeFoodSheet(){
      const b=document.getElementById('foodSheet');
      if(!b){
        /* 路由已经清掉了抽屉时不再归还焦点：此时 opener 多半已随旧页销毁。 */
        document.removeEventListener('keydown', onSheetKey);
        document.documentElement.classList.remove('sheet-open');
        sheetReturnFocus=null;
        return;
      }
      b.remove();
      document.removeEventListener('keydown', onSheetKey);
      document.documentElement.classList.remove('sheet-open');
      const back=sheetReturnFocus;
      sheetReturnFocus=null;
      /* 关闭后把焦点还给触发弹窗的餐次表头：否则键盘/读屏用户会掉到 body，
         必须从头 Tab 一遍才能回到原来位置。 */
      if(back && back.focus) setTimeout(function(){ try{ back.focus(); }catch(e){} }, 0);
    }
    function onSheetKey(e){
      if(e.key==='Escape'){ e.preventDefault(); closeFoodSheet(); return; }
      if(e.key!=='Tab') return;
      const wrap=document.getElementById('foodSheet');
      if(!wrap) return;
      const sheet=wrap.querySelector('.sheet');
      const list=[].slice.call(sheet.querySelectorAll(
        'button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]'
      )).filter(function(el){ return el.offsetParent !== null; });
      if(!list.length){ e.preventDefault(); return; }
      const first=list[0], last=list[list.length-1];
      if(e.shiftKey && (document.activeElement===first || !sheet.contains(document.activeElement))){
        e.preventDefault(); last.focus();
      }else if(!e.shiftKey && document.activeElement===last){
        e.preventDefault(); first.focus();
      }
    }
    function fillMeal(row, d){
      row.querySelector('.m_food').value=d.name;
      const wtIn=row.querySelector('.m_wt'), kIn=row.querySelector('.m_kcal'), pIn=row.querySelector('.m_pro');
      if(d.id){
        row.dataset.foodId=d.id; row.dataset.foodKcal=d.kcal; row.dataset.foodPro=d.pro;
        const wt=d.wt||100;
        wtIn.value=wt;
        kIn.value=Math.round(d.kcal*wt/100);
        pIn.value=Math.round(d.pro*wt/100*10)/10;
      }else{
        delete row.dataset.foodId; delete row.dataset.foodKcal; delete row.dataset.foodPro;
        wtIn.value=d.wt||'';
        kIn.value=d.kcalVal||'';
        pIn.value=d.proVal||'';
      }
      kIn.dispatchEvent(new Event('input',{bubbles:true}));
      pIn.dispatchEvent(new Event('input',{bubbles:true}));
      bindSum();
    }
    function openFoodSheet(idx, openerEl){
      /* 优先用调用方传进来的按钮：移动端点击按钮不一定让它获得焦点，
         document.activeElement 可能还是 body，关闭后就无法把焦点还回去。 */
      const opener=openerEl || document.activeElement;
      closeFoodSheet();
      const rows=mealRows(); const row=rows[idx]; if(!row) return;
      const mealName=row.getAttribute('data-meal');
      const back=document.createElement('div');
      back.className='sheet-backdrop'; back.id='foodSheet';
      back.innerHTML=
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">'+
          '<div class="sheet-hd"><b id="sheetT">'+esc(mealName)+' · 选食物</b>'+
            '<button type="button" class="sheet-x" data-sheet-close aria-label="关闭">✕</button></div>'+
          '<input id="sheetSearch" class="sheet-search" placeholder="搜索食物库（共 '+Foods.list().length+' 条）" aria-label="搜索食物">'+
          '<div id="sheetList" class="sheet-list"></div>'+
          '<div class="sheet-custom">'+
            '<div class="sheet-custom-k">没有？自己加一条（只填这一餐）</div>'+
            '<div class="sheet-custom-row">'+
              '<input id="sheetName" placeholder="食物名称" aria-label="自定义食物名称">'+
              '<span class="input-unit"><input id="sheetKcal" type="number" inputmode="decimal" placeholder="0" aria-label="热量"><span class="unit">kcal</span></span>'+
              '<span class="input-unit"><input id="sheetPro" type="number" inputmode="decimal" placeholder="0" aria-label="蛋白质"><span class="unit">g</span></span>'+
            '</div>'+
            '<button type="button" class="btn ghost sm sheet-add" id="sheetAdd">填入这一餐</button>'+
          '</div>'+
        '</div>';
      document.body.appendChild(back);
      sheetReturnFocus=opener;
      /* 锁住背景：抽屉展开时底下的页面不应跟着滚。html 类在 closeFoodSheet 里撤掉。 */
      document.documentElement.classList.add('sheet-open');
      document.addEventListener('keydown', onSheetKey);
      /* 遮罩上的滚轮/触摸不穿透到背景；抽屉内部的滚动仍交给 .sheet-list。 */
      back.addEventListener('wheel', function(e){
        if(!e.target.closest('.sheet')) e.preventDefault();
      }, {passive:false});
      back.addEventListener('touchmove', function(e){
        if(!e.target.closest('.sheet')) e.preventDefault();
      }, {passive:false});

      const listBox=back.querySelector('#sheetList');
      const renderList=function(q){
        const list=Foods.list(q||'');
        listBox.innerHTML=list.length
          ? list.map(function(f){
              return '<button type="button" class="food-opt" data-fid="'+esc(f.id)+'">'+
                '<b>'+esc(f.name)+'</b><small>'+f.kcal+' kcal · 蛋白 '+f.protein+'g / '+esc(f.per||'100g')+'</small></button>';
            }).join('')
          : '<p class="small muted">没找到——用下面的「自己加一条」。</p>';
        listBox.querySelectorAll('[data-fid]').forEach(function(btn){
          btn.onclick=function(){
            const f=Foods.byId(btn.getAttribute('data-fid'));
            if(!f) return;
            fillMeal(row,{id:f.id, name:f.name, kcal:f.kcal, pro:f.protein, wt:f.serv||100});
            closeFoodSheet();
          };
        });
      };
      renderList('');
      back.querySelector('#sheetSearch').oninput=function(e){ renderList(e.target.value.trim()); };

      back.querySelector('#sheetAdd').onclick=function(){
        const name=back.querySelector('#sheetName').value.trim();
        if(!name){ toast('先写个食物名','warn'); return; }
        const kv=+back.querySelector('#sheetKcal').value||0;
        const pv=+back.querySelector('#sheetPro').value||0;
        const exact=Foods.list().find(function(f){ return f.name===name; });
        if(exact && !kv && !pv){
          fillMeal(row,{id:exact.id, name:exact.name, kcal:exact.kcal, pro:exact.protein, wt:exact.serv||100});
        }else{
          fillMeal(row,{name:name, kcalVal:kv||'', proVal:pv||''});
        }
        closeFoodSheet();
      };

      back.addEventListener('click', function(e){
        if(e.target===back || e.target.closest('[data-sheet-close]')) closeFoodSheet();
      });
      const sIn=back.querySelector('#sheetSearch');
      if(sIn) sIn.focus();
    }
    appInner().querySelectorAll('[data-meal-pick]').forEach(function(b){
      b.onclick=function(){ openFoodSheet(+b.getAttribute('data-meal-pick'), b); };
    });
    /* 食物库默认折叠：首次展开时才渲染 25 张卡片（懒渲染省首屏），搜索绑定不变 */
    const foodLib=$('#foodLib');
    if(foodLib){
      foodLib.addEventListener('toggle',()=>{
        if(foodLib.open && !foodLib.dataset.loaded){ renderFoodOptions(''); foodLib.dataset.loaded='1'; }
      });
    }
    const fs2=$('#foodSearch'); if(fs2) fs2.oninput=e=>renderFoodOptions(e.target.value);
    $('#addDiet').onclick=()=>{
      clearFieldErrs();
      const date=$('#d_date').value;
      if(!date){ setFieldErr('#d_date','请先选择日期','#d_date_err'); return; }
      /* 分餐次收集：五餐（名称/食物/热量/蛋白），空餐过滤；kcal/protein 顶层字段由各餐加总（兼容 match/weekMatrix/feedback） */
      const meals=[...document.querySelectorAll('#mealRows .meal-card')].map(r=>({
        name:r.getAttribute('data-meal'),
        food:r.querySelector('.m_food').value.trim(),
        kcal:+r.querySelector('.m_kcal').value||0,
        pro:+r.querySelector('.m_pro').value||0,
        wt:+r.querySelector('.m_wt').value||0
      })).filter(m=>m.kcal||m.pro||m.food||m.wt);
      const kcal=meals.reduce((a,m)=>a+m.kcal,0), protein=meals.reduce((a,m)=>a+m.pro,0);
      if(!kcal&&!protein){ setFieldErr(null,'至少在一个餐次填入热量或蛋白','#m_sumK'); return; }
      const flags=Diet.FLAGS.filter(f=>$('#flag_'+f.k).checked).map(f=>f.k);
      Diet.add({id:Store.uid(),date,kcal,protein,flags,meals,firstmeal:($('#d_first')&&$('#d_first').value)||'',lastmeal:($('#d_last')&&$('#d_last').value)||''});
      toast('已打卡（'+meals.length+' 个餐次）','ok'); renderDietFb(); renderTodayMeals(); renderDietMatrix(); renderDietList(); renderKcalTrend();
    };
  }

  function renderTodayMeals(){
    const box=$('#todayMeals'); if(!box) return;
    const today=Util.localDate();
    const rec=Diet.list().find(x=>x.date===today);
    if(!rec||!Array.isArray(rec.meals)||!rec.meals.length){ box.innerHTML='<p class="small muted">今天还没有分餐次记录——在上方按餐次填入后保存，这里会展示当天的三餐与加餐明细。</p>'; return; }
    const MEAL_ORDER=['早餐','午餐','下午加餐','晚餐','晚上加餐'];
    const meals=rec.meals.slice().sort((a,b)=>MEAL_ORDER.indexOf(a.name)-MEAL_ORDER.indexOf(b.name)).filter(m=>m.kcal||m.pro||m.wt||m.food);
    const r0=x=>Math.round(x), r1=x=>Math.round(x*10)/10;
    const totK=r0(meals.reduce((a,m)=>a+m.kcal,0)), totP=r1(meals.reduce((a,m)=>a+m.pro,0)), totW=r0(meals.reduce((a,m)=>a+(m.wt||0),0));
    box.innerHTML='<h3>今日餐次明细</h3><div class="dm-grid">'+

      `<div class="dm-card dm-total"><div class="dm-head"><span class="dm-date">合计</span></div><div class="dm-num"><span class="lbl">重量</span><span class="val">${totW?totW+'g':'-'}</span></div><div class="dm-num"><span class="lbl">热量</span><span class="val">${totK}</span></div><div class="dm-num"><span class="lbl">蛋白</span><span class="val">${totP}g</span></div></div>`+
      '</div>';
  }
  function renderKcalTrend(){
    const box=$('#kcalTrend'); if(!box) return;
    const ls=Diet.list().slice(0,7).reverse();
    if(!ls.length){ box.innerHTML='<p class="small muted">还没有打卡数据——打卡后这里会出现近 7 天热量趋势（含目标区间带）。</p>'; return; }
    const vals=ls.map(x=>x.kcal||0);
    const W=560,H=190,pad=40;
    const tMin=Diet.TARGET.kcalMin,tMax=Diet.TARGET.kcalMax;
    const max=Math.max(...vals,tMax)*1.12||1200;
    const xs=i=>pad+i*((W-pad*2)/Math.max(1,vals.length-1));
    const ys=v=>H-26-(v/max)*(H-52);
    const pts=vals.map((v,i)=>xs(i)+','+ys(v)).join(' ');
    const yT=ys(tMax),yB=ys(tMin);
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 7 天热量趋势，含目标区间" style="width:100%;height:auto">
      <rect x="${pad}" y="${yT}" width="${W-pad*2}" height="${Math.max(2,yB-yT)}" fill="var(--accent-bg)"/>
      <line x1="${pad}" y1="${yT}" x2="${W-pad}" y2="${yT}" class="goalline"/>
      <line x1="${pad}" y1="${yB}" x2="${W-pad}" y2="${yB}" class="goalline"/>
      <text x="${W-pad}" y="${yT-4}" text-anchor="end" font-size="10" fill="var(--txt-3)">目标上限 ${tMax}</text>
      <text x="${W-pad}" y="${yB+12}" text-anchor="end" font-size="10" fill="var(--txt-3)">目标下限 ${tMin}</text>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${vals.map((v,i)=>'<circle cx="'+xs(i)+'" cy="'+ys(v)+'" r="3.5" fill="var(--accent)"/><text x="'+xs(i)+'" y="'+(ys(v)-9)+'" text-anchor="middle" font-size="11" fill="var(--txt-2)">'+(v||'—')+'</text>').join('')}
      ${ls.map((x,i)=>'<text x="'+xs(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--txt-3)">'+x.date.slice(5)+'</text>').join('')}
    </svg>`;
  }

  function herbNature(x){
    return NV(x.nature) ? '' : (x.nature + (NV(x.meridian) ? '' : '，归'+x.meridian+'经'));
  }
  function renderKBList(o,filter){
    filter=filter||'';
    let items=o.mod.list();
    if(filter==='__mine') items=items.filter(x=>o.mod.inMine(x.id));
    else if(filter) items=items.filter(x=> o.axis==='tier' ? x.tier===filter : x.type===filter);
    const cnt=$(o.countSel);
    if(cnt) cnt.textContent='我的清单 '+o.mod.mine().length+' 项 / 共 '+o.mod.list().length+' 项';
    let body;
    if(!items.length){
      body = emptyState('无匹配项','<button class="btn ghost sm" data-clear-filter="'+o.clear+'">清除筛选</button>');
    } else if(o.groupBy){
      /* 按组折叠：组内仍是卡片，组本身可收起。
         护肤成分库 38 项平铺接近 10 屏，但日常真正在用的只有「基础必备」那几项，
         其余属于查阅型内容——收起来之后，打开成分库看到的就是可执行的清单。 */
      body = o.groupBy(items).filter(g=>g.items.length).map(g=>
        '<details class="kb-group"'+(g.open?' open':'')+'>'+
          '<summary><span class="kbg-k">'+esc(g.label)+'</span>'+
          '<span class="kbg-n">'+g.items.length+' 项</span></summary>'+
          '<div class="grid'+(o._seen?'':' stagger')+'">'+g.items.map(x=>kbCard(o,x)).join('')+'</div>'+
        '</details>').join('');
    } else {
      body = '<div class="grid'+(o._seen?'':' stagger')+'">'+items.map(x=>kbCard(o,x)).join('')+'</div>';
    }
    $(o.listSel).innerHTML = body;
    /* 首次标记必须在 body 拼好之后再置位。先前放在拼接前，o._seen 恒为 true，
       stagger 一次也没生效过（实测 .grid.stagger 命中 0 个）。 */
    o._seen = true;
    // 从概览「我的事项」跳转而来：定位到目标条目 → 高亮 + 自动展开 + 滚入视野
    if(focusKb && cur===focusKb.tab){
      const card = $(o.listSel).querySelector('[data-kb="'+focusKb.id+'"]');
      if(card){
        const grp = card.closest('details.kb-group');
        if(grp) grp.open = true;      // 目标若在收起的组里，先把所在组打开
        card.classList.add('is-focus');
        const det = card.querySelector('details');
        if(det) det.open = true;
        if(card.scrollIntoView) card.scrollIntoView({block:'center', behavior:'smooth'});
      }
      focusKb = null;
    }
  }
  function kbCard(o,x){
    const axisVal = o.axis==='tier' ? x.tier : x.type;
    const tagCls  = (o.clsMap||{})[axisVal] || 'c0';
    const tagText = o.axis==='tier' ? o.mod.tierLabel(x.tier) : o.mod.typeLabel(x.type);
    const inMine  = o.mod.inMine(x.id);
    const pair    = (o.chips(x)||[]).filter(Boolean);
    const fields  = (o.fields(x)||[]).filter(Boolean);
    const hidden  = o.hideToggle ? !!o.hideToggle(x) : false;
    const excluded = o.excludedWhen ? !!o.excludedWhen(x) : false;
    return '<div class="card '+(excluded?'is-excluded':'')+'" data-kb="'+esc(x.id)+'">'+
      '<div class="row between"><b>'+esc(x.name)+'</b>'+
        '<span class="tag '+tagCls+'">'+esc(tagText)+'</span>'+
        (evQualified(x.evidence)?'<span class="badge mut">限</span>':'')+'</div>'+
      '<div class="lead">'+rich(firstSeg(o.lead(x),78))+'</div>'+
      (pair.length?chips(pair):'')+
      '<details><summary>展开：'+o.detail+'</summary>'+
        fields.map(function(fl){ return fld(fl[0],fl[1],fl[2],fl[3]); }).join('')+
        (o.extra?o.extra(x):'')+
        fldPlain('来源',x.src)+
      '</details>'+
      (hidden?'':'<div class="row mt-4 kb-act">'+
        '<button type="button" class="kb-toggle'+(inMine?' is-in':'')+'" '+o.attr+'="'+x.id+'"'+
        ' aria-pressed="'+(inMine?'true':'false')+'">'+
        (inMine?'已在清单 · 点击移除':'＋ 加入清单')+'</button></div>')+
    '</div>';
  }

          <li><b>饮食对内湿最直接</b>：减少甜食、油炸、奶茶与冰饮（生湿助热）；增加山药、茯苓、薏米（湿重期炒制）、白扁豆、陈皮（理气化湿）；控糖本身同时对应现代抗糖化机制——两套理论在此处交汇</li>
          <li><b>睡眠即美容</b>：中医讲「子时入睡，血归于肝」，23 点前入睡对暗沉与眼周状态的作用，强于任何眼霜。这与西医"深睡期修复"的结论方向一致</li>
          <li><b>情志与"肝郁"</b>：压力与情绪紧张会加重面部泛红、痘痘与色沉（肝郁化热、气滞血瘀）。规律训练是很好的疏解渠道，保持即可；若长期高压，调畅情志比加护肤品更有效</li>
          <li><b>面部穴位按揉</b>：迎香、颧髎、地仓、合谷、足三里，每日各 1-2 分钟，手法轻柔（活血通络、助运化）；配合「松解恢复」模块的摩腹（助脾胃运化）——这两项是零成本且与这类体质对路的</li>
          <li><b>体质性禁忌（重要）</b>：这类体质多属本虚标实，<b>刮痧、拔罐、强刺激类"排毒"项目不宜过频</b>，会耗气伤正，反而使面色更暗、恢复更慢（与「松解恢复」模块同一条原则）；面部更应避免暴力手法</li>

        </ul>
