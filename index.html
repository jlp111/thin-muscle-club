<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<title>薄肌训练系统 · ThinMuscle</title>
<style>
/* =====================================================================
 * 薄肌训练系统 · 展示层样式表 v5
 * 设计系统：Ink Surface + 三轴色彩 (status / cat / tier)
 *
 * 契约（改动前务必先读）：
 *   status 轴 --st-*   仅表达「判定」——ok / info / warn / bad / mut，是全站唯一允许填充的轴。
 *   cat    轴 --cat-*  无序分类——仅「文字 + 描边」，禁填充，避免与状态色混淆。
 *   tier   轴 --tier-* 有序分级——同 cat，仅「文字 + 描边」。
 *   --accent 仅用于「可交互」，禁止用它表达判定。
 *   别名：--cat-0 = --st-mut = --tier-3（同为「中性/其他」）；--st-info = --accent（信息色即品牌色）。
 *
 * v5 相对 v4 的变更（纯展示层，DOM 与类名契约不变）：
 *   1. 品牌色由通用蓝 #4f9dff 收敛为「鸢尾紫」，与 status 轴（绿 / 琥珀 / 红）色相隔离，
 *      既避开品类默认蓝，也让「可交互」在深色底上更容易被一眼识别。
 *   2. 新增材质层令牌 --grad-* / --amb-* / --glow：面板与卡片由「平涂」升级为极轻的
 *      竖向渐变 + 顶缘高光，用材质而非阴影来表达层级，深色下不再糊成一片。
 *   3. 圆角、阴影、字阶、进度条厚度整体收紧，标题加负字距，提升「精密仪器」般的秩序感。
 *   4. 新增自定义滚动条、选区配色、prefers-contrast 增强，无障碍能力只增不减。
 *   所有 颜色 / 字号 / 间距 / 圆角 / 阴影 / 渐变 一律走 CSS 变量，禁止硬编码。
 * ===================================================================== */

/* ---------- 1. 设计令牌 ---------- */
:root{
  /* 声明原生控件配色：select 下拉 / date 日历 / 滚动条 会跟随该值渲染 */
  color-scheme: dark;
  /* 分区锚点偏移 = header 高 + 余量（87+12 / 移动 53+12） */
  --h-header:99px;

  /* 1. 表面层级 4 阶：0=页面凹槽 → 1=面板 → 2=卡片 → 3=悬停/浮起 */
  --surface-0:#08090c;  --surface-1:#101216;  --surface-2:#171a20;  --surface-3:#21252c;
  --line-1:#1e222a;     --line-2:#2b303a;     --line-3:#3d4450;     --line-ctl:#4d5462;

  /* 2. 文本 */
  /* 三级文字刻意拉开：txt-1 主 / txt-2 次 / txt-3 辅助。
     txt-3 取值受「卡片悬停态」反推——悬停底色 --surface-3 比常态亮，三级文字须在其上仍 ≥4.5:1；
     因此把 txt-2 一并上提，避免两级被压成同一档。 */
  --txt-1:#e9ebf0;  --txt-2:#a3acba;  --txt-3:#868f9e;  --txt-inv:#080c12;

  /* 3. 动作色（唯一用于「可交互」，禁止表达判定）——鸢尾紫 */
  --accent:#7c86f2;  --accent-bg:rgba(124,134,242,.13); --accent-bd:rgba(124,134,242,.36); --accent-hi:#9ba3f8;

  /* 4. status 轴（唯一允许填充的轴） */
  --st-ok:#4ad6a0;  --st-ok-bg:rgba(74,214,160,.13);  --st-ok-bd:rgba(74,214,160,.34);
  --st-info:#7c86f2;--st-info-bg:rgba(124,134,242,.13);--st-info-bd:rgba(124,134,242,.34);
  --st-warn:#f2b45c;--st-warn-bg:rgba(242,180,92,.13);--st-warn-bd:rgba(242,180,92,.34);
  --st-bad:#f97070; --st-bad-bg:rgba(249,112,112,.13);--st-bad-bd:rgba(249,112,112,.34);
  --st-mut:#a3acba; --st-mut-bg:rgba(163,172,186,.10);--st-mut-bd:rgba(163,172,186,.26);

  /* 5. cat 池（无序分类，文字+描边，禁填充） */
  --cat-1:#f0947a; --cat-1-bd:rgba(240,148,122,.32);
  --cat-2:#e8bb63; --hl-money:#e8bb63; --hl-money-bg:rgba(232,187,99,.13); --hl-money-bd:rgba(232,187,99,.32);
   --cat-2-bd:rgba(232,187,99,.32);
  --cat-3:#a8cd6e; --cat-3-bd:rgba(168,205,110,.32);
  --cat-4:#57c98d; --cat-4-bd:rgba(87,201,141,.32);
  --cat-5:#5ccfd8; --cat-5-bd:rgba(92,207,216,.32);
  --cat-6:#6fa8f5; --cat-6-bd:rgba(111,168,245,.32);
  --cat-7:#b58cf0; --cat-7-bd:rgba(181,140,240,.32);
  --cat-8:#e88fc2; --cat-8-bd:rgba(232,143,194,.32);
  --cat-0:#98a1b0; --cat-0-bd:rgba(152,161,176,.26);

  /* 6. tier 轴（有序分级，文字+描边，禁填充） */
  --tier-1:#6fe0b4;  --tier-2:#8cc0ff;  --tier-3:#98a1b0;  --tier-4:#f89a9a;

  /* 7. 字体 */
  --ff: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --ff-num: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --fs-xs:11px; --lh-xs:1.6;   --fs-sm:12px; --lh-sm:1.65;   --fs-md:13px; --lh-md:1.72;
  --fs-lg:15px; --lh-lg:1.45;  --fs-xl:19px; --lh-xl:1.3;  --fs-display:24px; --lh-display:1.15;
  --fw-m:500; --fw-sb:600; --fw-b:700;
  /* 标题负字距：字号越大越收紧，避免中英混排显得松散 */
  --ls-tight:-.01em; --ls-display:-.02em;

  /* 8. 间距 9 档 */
  --sp-1:2px; --sp-2:4px; --sp-3:6px; --sp-4:8px; --sp-5:12px;
  --sp-6:16px; --sp-7:20px; --sp-9:32px;

  /* 9. 圆角 3 档 + full */
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;

  /* 10. 材质与高程
     层级靠「渐变 + 顶缘高光」表达，阴影只做轻量兜底，避免深色下叠加成灰雾 */
  --hi-1:inset 0 1px 0 rgba(255,255,255,.045);  --hi-2:inset 0 1px 0 rgba(255,255,255,.075);
  --shadow-1:0 1px 2px rgba(0,0,0,.34), var(--hi-1);
  --shadow-2:0 2px 6px rgba(0,0,0,.34), 0 10px 28px rgba(0,0,0,.42), var(--hi-2);
  --shadow-3:0 4px 12px rgba(0,0,0,.42), 0 20px 48px rgba(0,0,0,.58), var(--hi-2);
  --glow:rgba(124,134,242,.26);
  /* 控件材质：主按钮的内高光 / 投影 / 按压阴影、输入框的内凹阴影。
     本质是「白上黑下」的光影常量，但仍收进令牌 —— 浅色主题需要单独调弱，
     否则深色下合适的强度放到白底上会显得脏。 */
  --btn-hi:inset 0 1px 0 rgba(255,255,255,.22);
  --btn-hi-hover:inset 0 1px 0 rgba(255,255,255,.28);
  --btn-drop:0 1px 2px rgba(0,0,0,.28);
  --btn-press:inset 0 2px 4px rgba(0,0,0,.24);
  --input-inset:inset 0 1px 2px rgba(0,0,0,.16);
  /* 面板 / 卡片 / 页头 的竖向渐变：顶部略亮，模拟自上而下的环境光 */
  --grad-panel:linear-gradient(180deg,#13161b 0%,#0f1115 100%);
  --grad-card:linear-gradient(180deg,#1a1d23 0%,#161920 100%);
  --grad-header:linear-gradient(180deg,#13161b 0%,#0f1115 100%);
  --grad-btn:linear-gradient(180deg,#8b93f5 0%,#6d78ea 100%);
  --grad-btn-hi:linear-gradient(180deg,#9aa1f8 0%,#7b85ee 100%);
  --grad-bar:linear-gradient(90deg,#37c78f,#5ee0aa);
  /* 页面顶部环境光 + 表头右缘渐隐色（移动端 tabs 溢出遮罩） */
  --amb-1:rgba(124,134,242,.055);
  --header-fade:#0f1115;
  --input-bg:#0b0d11;

  /* 11. 焦点环 */
  --ring:#9ba3f8; --ring-w:2px; --ring-offset:2px;

  /* 12. 控件尺寸 */
  --h-ctrl:40px; --h-row:40px; --h-tag:20px; --h-chip:24px; --h-bar:6px;
  /* 12b. 控件内边距 / 尺寸（消除硬编码，间距一律走令牌） */
  --pad-tab:14px; --pad-btn:16px; --h-btn-sm:36px; --pad-ctl:10px; --sz-icon:32px; --max-pick:340px;

  /* 13. 动效 */
  --dur-1:120ms; --dur-2:180ms; --dur-3:260ms;
  --ease-std:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);

  /* 14. 栅格与容器 */
  --container:1240px;
  --grid-dense:repeat(auto-fill,minmax(min(100%,240px),1fr));
  --gap-grid:var(--sp-5);

  /* 15. 层级 */
  --z-header:10; --z-modal:40; --z-toast:50;
  --scrim:rgba(0,0,0,.62);
}

/* ---------- 1b. 浅色主题令牌 ----------
   切法：只覆盖「颜色 / 材质」类令牌，字号 / 间距 / 圆角 / 层级结构完全沿用 :root ——
   保证两套主题的版式与信息层级严格对等。
   surface 层级语义不变：0=页面/凹槽 → 1=面板 → 2=卡片 → 3=悬停。
   对比度：全部前景色已按 WCAG AA(≥4.5:1) 数值核验，白底最小值 5.22:1。
   禁纯黑纯白：正文用冷调近黑 #15181e；卡片用 #ffffff 但以描边 + 阴影区分层级。 */
[data-theme="light"]{
  color-scheme:light;
  --surface-0:#f5f6f9;  --surface-1:#ffffff;  --surface-2:#ffffff;  --surface-3:#eef0f5;
  --line-1:#e8ebf1;     --line-2:#dde2ea;     --line-3:#c5ccd8;     --line-ctl:#b6bec9;
  --txt-1:#15181e;  --txt-2:#525b6b;  --txt-3:#5f6875;  --txt-inv:#ffffff;

  --accent:#4f57d4;  --accent-bg:rgba(79,87,212,.09); --accent-bd:rgba(79,87,212,.30); --accent-hi:#3c44b8;

  --st-ok:#0b7a52;  --st-ok-bg:rgba(11,122,82,.09);   --st-ok-bd:rgba(11,122,82,.28);
  --st-info:#4f57d4;--st-info-bg:rgba(79,87,212,.09); --st-info-bd:rgba(79,87,212,.28);
  --st-warn:#8a5600;--st-warn-bg:rgba(138,86,0,.09);  --st-warn-bd:rgba(138,86,0,.28);
  --st-bad:#c02a2a; --st-bad-bg:rgba(192,42,42,.08);  --st-bad-bd:rgba(192,42,42,.28);
  --st-mut:#5f6875; --st-mut-bg:rgba(95,104,117,.09); --st-mut-bd:rgba(95,104,117,.26);

  --cat-1:#b04a1e; --cat-1-bd:rgba(176,74,30,.28);
  --cat-2:#7a5a00; --hl-money:#7a5a00; --hl-money-bg:rgba(122,90,0,.10); --hl-money-bd:rgba(122,90,0,.28);
   --cat-2-bd:rgba(122,90,0,.28);
  --cat-3:#4a6b18; --cat-3-bd:rgba(74,107,24,.28);
  --cat-4:#126b45; --cat-4-bd:rgba(18,107,69,.28);
  --cat-5:#0c6270; --cat-5-bd:rgba(12,98,112,.28);
  --cat-6:#2450ae; --cat-6-bd:rgba(36,80,174,.28);
  --cat-7:#5f34a5; --cat-7-bd:rgba(95,52,165,.28);
  --cat-8:#9c3568; --cat-8-bd:rgba(156,53,104,.28);
  --cat-0:#5f6875; --cat-0-bd:rgba(95,104,117,.26);

  --tier-1:#0b7a52; --tier-2:#4f57d4; --tier-3:#5f6875; --tier-4:#c02a2a;

  --hi-1:inset 0 1px 0 rgba(255,255,255,.90);
  --hi-2:inset 0 1px 0 rgba(255,255,255,.95);
  --shadow-1:0 1px 2px rgba(19,25,38,.06), 0 1px 1px rgba(19,25,38,.04);
  --shadow-2:0 2px 6px rgba(19,25,38,.06), 0 10px 24px rgba(19,25,38,.08);
  --shadow-3:0 4px 12px rgba(19,25,38,.09), 0 20px 44px rgba(19,25,38,.13);
  --glow:rgba(79,87,212,.22);
  --btn-hi:inset 0 1px 0 rgba(255,255,255,.30);
  --btn-hi-hover:inset 0 1px 0 rgba(255,255,255,.40);
  --btn-drop:0 1px 2px rgba(19,25,38,.12);
  --btn-press:inset 0 2px 4px rgba(19,25,38,.14);
  --input-inset:inset 0 1px 2px rgba(19,25,38,.05);
  --grad-panel:linear-gradient(180deg,#ffffff 0%,#fcfdff 100%);
  --grad-card:linear-gradient(180deg,#ffffff 0%,#fafbfe 100%);
  --grad-header:linear-gradient(180deg,#ffffff 0%,#fbfcfe 100%);
  --grad-btn:linear-gradient(180deg,#5a62dc 0%,#474ec6 100%);
  --grad-btn-hi:linear-gradient(180deg,#6169e4 0%,#4d54ce 100%);
  --grad-bar:linear-gradient(90deg,#1a9e6a,#3ec98a);
  --amb-1:rgba(79,87,212,.045);
  --header-fade:#ffffff;
  --input-bg:#ffffff;

  --ring:#4f57d4;
  --scrim:rgba(19,25,38,.44);

  /* 表格行悬停：原规则用 --surface-2，但浅色下 surface-2 与 surface-1 同为白色会不可见，
     故在浅色作用域内改用 surface-3。此规则仅在 [data-theme="light"] 下生效，深色不受影响。 */
  table.data tbody tr:hover{ background:var(--surface-3); }
}
@media (pointer:coarse){ :root{ --h-ctrl:44px; --h-row:44px; } }

/* ---------- 2. 基础重置 ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--surface-0)}
body{margin:0;color:var(--txt-1);
  /* 顶部环境光：整站只有这一处页面级渐变，锚在文档顶端，滚动时自然淡出 */
  background:radial-gradient(58% 300px at 50% 0, var(--amb-1), transparent 100%) no-repeat, var(--surface-0);
  font-family:var(--ff);font-size:var(--fs-md);line-height:var(--lh-md);
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
h1{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:var(--fw-b);letter-spacing:var(--ls-tight);text-wrap:balance}
h2{font-size:var(--fs-lg);line-height:var(--lh-lg);font-weight:var(--fw-sb);letter-spacing:var(--ls-tight);text-wrap:balance}
h3{font-size:var(--fs-md);line-height:var(--lh-md);font-weight:var(--fw-sb);color:var(--txt-1);letter-spacing:var(--ls-tight);text-wrap:balance}
p{font-size:var(--fs-md);line-height:var(--lh-md);text-wrap:pretty}
a{color:var(--accent);text-decoration:none;transition:color var(--dur-1) var(--ease-std)}
a:hover{color:var(--accent-hi);text-decoration:underline;text-underline-offset:2px}
b,strong{font-weight:var(--fw-sb)}
ul,ol{padding-left:1.25em}
svg{display:block;max-width:100%}
button{font-family:inherit}
::selection{background:var(--accent-bd);color:var(--txt-1)}

/* 自定义滚动条：默认细窄、低对比，悬停时才浮现——避免抢走内容注意力 */
*{scrollbar-width:thin;scrollbar-color:var(--line-3) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid transparent;
  background-clip:content-box;border-radius:var(--r-full)}
::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

/* ---------- 3. 工具类 ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--txt-2)}
.small{font-size:var(--fs-sm);line-height:var(--lh-sm)}
.num{font-family:var(--ff-num);font-variant-numeric:tabular-nums}
.mt-0{margin-top:0} .mt-2{margin-top:var(--sp-2)} .mt-3{margin-top:var(--sp-3)}
.mt-4{margin-top:var(--sp-4)} .mt-5{margin-top:var(--sp-5)}
.mt-6{margin-top:var(--sp-6)} .mt-7{margin-top:var(--sp-7)}
/* status 文字色（全局统一：ok / info / warn / bad / mut） */
.ok{color:var(--st-ok)} .info{color:var(--st-info)} .warn{color:var(--st-warn)}
.bad{color:var(--st-bad)} .mut{color:var(--st-mut)}

/* ---------- 4. 布局：页头 / 主区 ---------- */
header{position:sticky;top:0;z-index:var(--z-header);
  background:var(--grad-header);
  border-bottom:1px solid var(--line-2)}
/* 页头底缘一道虹彩发丝线：把品牌色以极低的强度带到全局最显眼的位置 */
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-bd) 22%,var(--accent-bd) 78%,transparent);
  opacity:.5;pointer-events:none}
.nav-inner{position:relative;max-width:var(--container);margin:0 auto;padding:0 var(--sp-5)}
.nav-brand{display:flex;align-items:baseline;gap:var(--sp-3);padding:var(--sp-4) 0 var(--sp-2)}
.brand{font-size:var(--fs-md);line-height:var(--lh-md);font-weight:var(--fw-sb);
  letter-spacing:.02em;color:var(--txt-1);display:inline-flex;align-items:center;gap:var(--sp-3)}
/* 品牌标记：纯 CSS 绘制的双环符号，替代字符图标（P0-1 零命中） */
.brand::before{content:'';flex:0 0 auto;width:12px;height:12px;border-radius:var(--r-full);
  background:var(--grad-btn);box-shadow:0 0 0 1px var(--accent-bd), 0 0 10px var(--glow)}
.ver{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--txt-3);
  font-family:var(--ff-num)}
main{max-width:var(--container);margin:0 auto;padding:var(--sp-6) var(--sp-5) var(--sp-9)}
@media (max-width:767px){
  .nav-brand{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  :root{--pad-tab:var(--sp-4);--h-header:65px}
  /* 右缘渐隐：遮住横向滚动的 tabs，暗示「还有更多」，颜色须与页头实底一致 */
  .nav-inner::after{content:'';position:absolute;top:0;right:0;bottom:0;width:var(--sp-9);
    background:linear-gradient(90deg,transparent,var(--header-fade) 65%);
    pointer-events:none}
}

/* ---------- 4b. 主题切换按钮 ----------
   绝对定位于页头右侧。注意不能放进 .nav-brand —— 该容器在 ≤767px 被设成 sr-only，
   按钮会跟着消失。 */
.theme-btn{position:absolute;top:10px;right:var(--sp-5);z-index:1;
  display:inline-flex;align-items:center;height:var(--h-chip);padding:0 var(--sp-4);
  border:1px solid var(--line-2);border-radius:var(--r-full);background:var(--surface-1);
  color:var(--txt-2);font-family:inherit;font-size:var(--fs-xs);line-height:1;
  font-weight:var(--fw-m);white-space:nowrap;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  box-shadow:var(--hi-1);
  transition:background-color var(--dur-1) var(--ease-std),
             border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
.theme-btn:hover{background:var(--surface-2);border-color:var(--accent-bd);color:var(--txt-1)}
.theme-btn:focus-visible{outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}
@media (max-width:767px){
  .theme-btn{top:var(--sp-3);height:var(--h-tag);padding:0 var(--sp-3)}
}

/* ---------- 5. Tab 导航 ---------- */
.tabs{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) 0;
  overflow-x:auto;overscroll-behavior-x:contain;scroll-behavior:smooth;
  scroll-padding-inline:var(--sp-4);
  scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.nav-group{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto}
.nav-sep{flex:0 0 auto;width:1px;height:20px;background:var(--line-2);margin:0 var(--sp-2)}
.nav-glabel{flex:0 0 auto;font-size:var(--fs-xs);line-height:var(--lh-xs);
  font-weight:var(--fw-m);color:var(--txt-3);padding:0 var(--sp-1);white-space:nowrap;
  letter-spacing:.06em}
.tab{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;
  height:var(--h-ctrl);padding:0 var(--pad-tab);border:1px solid transparent;
  border-radius:var(--r-md);background:transparent;color:var(--txt-2);
  font-size:var(--fs-md);font-weight:var(--fw-sb);line-height:1;white-space:nowrap;
  cursor:pointer;-webkit-appearance:none;appearance:none}
.tab:hover{background:var(--surface-2);color:var(--txt-1)}
/* 激活态：品牌色淡底胶囊 + 底部短发光条。两者都走 --accent，与 status 轴不冲突 */
.tab.active{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--txt-1);
  box-shadow:var(--hi-1)}
.tab.active::after{content:'';position:absolute;left:50%;bottom:3px;width:16px;height:2px;
  transform:translateX(-50%);border-radius:var(--r-full);
  background:var(--accent);box-shadow:0 0 8px var(--glow)}
@media (max-width:1023px){
  .nav-glabel{display:none}
  .nav-sep{margin:0 var(--sp-1)}
}
@media (max-width:479px){
  :root{--pad-tab:var(--sp-3)}
  .tab{font-size:var(--fs-sm)}
}

/* ---------- 6. 面板 / 卡片 / 栅格 ---------- */
.panel{background:var(--grad-panel);border:1px solid var(--line-1);border-radius:var(--r-lg);
  padding:var(--sp-6);margin-bottom:var(--sp-6);box-shadow:var(--shadow-1)}
.card{background:var(--grad-card);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:var(--sp-5);box-shadow:var(--shadow-1)}
@media (hover:hover){
.card:hover{background:var(--surface-3);border-color:var(--line-3);
  box-shadow:var(--shadow-2);transform:translateY(-1px)}
}
.card.note-warn{border-color:var(--st-warn-bd)}
.card.note-ok{border-color:var(--st-ok-bd)}
.card.note-alt{border-color:var(--cat-7-bd)}
.card.note-pink{border-color:var(--cat-8-bd)}
/* 卡片内段落节奏（替代逐条 inline margin） */
:where(.card)>p{margin-top:var(--sp-4)}
.card>*:first-child{margin-top:0}
.act-block{margin:var(--sp-5) 0;border-top:1px solid var(--line-1);padding-top:var(--sp-4)}
.card.is-excluded{opacity:.72}
.card.is-excluded .lead{text-decoration:line-through;text-decoration-color:var(--line-3)}

.grid{display:grid;grid-template-columns:1fr;gap:var(--gap-grid);margin-top:var(--sp-5)}
.grid.stat{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.stat>*:first-child{grid-column:span 2}
.grid.dense{grid-template-columns:var(--grid-dense)}
.grid.mt-0{margin-top:0}
@media (min-width:768px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1024px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- 7. 行 / 工具条 / 字段 ---------- */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3)}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);
  margin:var(--sp-5) 0}
/* 长页分区：跳转目录 + 锚点偏移（避免 sticky header 盖住标题） */
.toc{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.toc-item{display:inline-flex;align-items:center;height:var(--h-chip);padding:0 var(--sp-4);
  border-radius:var(--r-full);border:1px solid var(--line-2);background:transparent;
  color:var(--txt-2);font-size:var(--fs-xs);line-height:1;white-space:nowrap;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  transition:background-color var(--dur-1) var(--ease-std),
             border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
.toc-item:hover{background:var(--surface-2);border-color:var(--accent-bd);color:var(--txt-1)}
.toc-item:focus-visible{border-color:var(--accent-bd)}
.panel[id]{scroll-margin-top:var(--h-header)}
.toolbar:first-child{margin-top:0}
.toolbar>select,.toolbar>input{max-width:200px;flex:0 1 200px}
.btnrow{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-5)}
.field{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.field-row{display:grid;gap:var(--sp-4);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.field-err{display:none;margin-top:var(--sp-1);font-size:var(--fs-sm);
  line-height:var(--lh-sm);color:var(--st-bad)}
.field-err.show{display:block}
input.invalid,select.invalid,textarea.invalid{border-color:var(--st-bad)}

/* ---------- 8. 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:var(--h-ctrl);padding:0 var(--pad-btn);border:1px solid var(--accent-bd);
  border-radius:var(--r-md);
  background:var(--grad-btn);color:var(--txt-inv);
  font-size:var(--fs-md);font-weight:var(--fw-b);line-height:1;white-space:nowrap;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  box-shadow:var(--btn-hi), var(--btn-drop)}
.btn:hover{background:var(--grad-btn-hi);
  box-shadow:var(--btn-hi-hover), 0 2px 12px var(--glow)}
.btn:active{transform:translateY(1px);
  box-shadow:var(--btn-press)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
/* ghost / danger 走「安静」路线：去掉主按钮的渐变与内高光，只留描边 */
.btn.ghost{background:transparent;color:var(--txt-1);border-color:var(--line-2);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--accent-bd);color:var(--txt-1)}
.btn.danger{background:transparent;color:var(--st-bad);border-color:var(--st-bad-bd);box-shadow:none}
.btn.danger:hover{background:var(--st-bad-bg);border-color:var(--st-bad);color:var(--st-bad)}
.btn.sm{height:var(--h-btn-sm);padding:0 var(--sp-4);font-size:var(--fs-sm);font-weight:var(--fw-sb)}
@media (pointer:coarse){ .btn.sm{height:44px;min-height:44px} }
.btn.quiet{background:transparent;border-color:transparent;color:var(--txt-3);box-shadow:none}
.btn.quiet:hover,.btn.quiet:focus-visible{background:var(--surface-2);
  border-color:var(--line-2);color:var(--txt-1)}
.btn.danger.quiet{background:transparent;border-color:transparent;color:var(--txt-3);box-shadow:none}
.btn.danger.quiet:hover,.btn.danger.quiet:focus-visible{background:var(--st-bad-bg);
  border-color:var(--st-bad-bd);color:var(--st-bad)}

/* ---------- 9. 表单控件 ---------- */
input,select,textarea{width:100%;height:var(--h-ctrl);background:var(--input-bg);
  border:1px solid var(--line-ctl);border-radius:var(--r-sm);color:var(--txt-1);
  font-family:inherit;font-size:var(--fs-md);line-height:var(--lh-md);padding:0 var(--pad-ctl);
  box-shadow:var(--input-inset)}
input,textarea{-webkit-appearance:none;appearance:none}
textarea{height:auto;min-height:calc(var(--h-ctrl) * 1.75);padding:var(--sp-4) var(--pad-ctl);resize:vertical}
input::placeholder,textarea::placeholder{color:var(--txt-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-bd);
  box-shadow:0 0 0 var(--ring-w) var(--accent-bg)}
input[type=checkbox],input[type=radio]{width:1em;height:1em;min-width:1em;padding:0;margin:0;
  font-size:var(--fs-lg);accent-color:var(--accent);flex:0 0 auto;box-shadow:none;
  -webkit-appearance:auto;appearance:auto}
label{display:block;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-2);
  font-weight:var(--fw-m);margin:var(--sp-4) 0 var(--sp-2)}
label.inline{display:inline-flex;align-items:center;gap:var(--sp-2);margin:0;
  min-width:0;font-size:var(--fs-md)}
/* 非表单控件的区块标题：与 label 同视觉，但不承担表单关联语义 */
.field-label{display:block;font-size:var(--fs-sm);line-height:var(--lh-sm);
  color:var(--txt-2);font-weight:var(--fw-m);margin:var(--sp-4) 0 var(--sp-2)}

/* ---------- 10. 表格 ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:var(--sp-4) 0}
table.data{width:100%;border-collapse:collapse;font-size:var(--fs-sm);line-height:var(--lh-sm)}
table.data th,table.data td{text-align:left;padding:var(--sp-4) var(--pad-ctl);
  border-bottom:1px solid var(--line-1);vertical-align:top}
table.data th{color:var(--txt-2);font-weight:var(--fw-sb);font-size:var(--fs-xs);
  line-height:var(--lh-xs);white-space:nowrap;border-bottom-color:var(--line-2);
  letter-spacing:.04em}
table.data tbody tr{min-height:var(--h-row)}
@media (hover:hover){
table.data tbody tr:hover{background:var(--surface-2)}
}
table.data td.num,table.data th.num{text-align:right;
  font-family:var(--ff-num);font-variant-numeric:tabular-nums}
table.data tbody tr.is-today{background:var(--accent-bg)}
/* 移动端：表格转字段行卡片 */
@media (max-width:767px){
  .table-wrap{overflow:visible}
  table.data thead{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap}
  table.data,table.data tbody,table.data tr,table.data td{display:block;width:100%}
  table.data tr{border:1px solid var(--line-1);border-radius:var(--r-md);
    padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);background:var(--grad-card)}
  table.data td{border:none;padding:var(--sp-1) 0;display:flex;gap:var(--sp-4);
    align-items:baseline;justify-content:space-between}
  table.data td::before{content:attr(data-label);flex:0 0 auto;color:var(--txt-3);
    font-size:var(--fs-xs);line-height:var(--lh-xs)}
  table.data td:empty{display:none}
  table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
}
@media (min-width:480px) and (max-width:767px){
  table.data td{padding:var(--sp-2) 0}
}

/* ---------- 11. 标签 / 徽标 / 芯片 ---------- */
.tag{display:inline-flex;align-items:center;height:var(--h-tag);padding:0 var(--sp-4);
  border-radius:var(--r-full);border:1px solid var(--cat-0-bd);background:transparent;
  color:var(--cat-0);font-size:var(--fs-xs);line-height:1;font-weight:var(--fw-m);
  white-space:nowrap}
/* cat：无序分类——文字 + 描边，禁填充（与 tier 轴同规） */
.c0{color:var(--cat-0);background:transparent;border-color:var(--cat-0-bd)}
.c1{color:var(--cat-1);background:transparent;border-color:var(--cat-1-bd)}
.c2{color:var(--cat-2);background:transparent;border-color:var(--cat-2-bd)}
.c3{color:var(--cat-3);background:transparent;border-color:var(--cat-3-bd)}
.c4{color:var(--cat-4);background:transparent;border-color:var(--cat-4-bd)}
.c5{color:var(--cat-5);background:transparent;border-color:var(--cat-5-bd)}
.c6{color:var(--cat-6);background:transparent;border-color:var(--cat-6-bd)}
.c7{color:var(--cat-7);background:transparent;border-color:var(--cat-7-bd)}
.c8{color:var(--cat-8);background:transparent;border-color:var(--cat-8-bd)}
/* tier：有序分级——文字 + 描边，不填充 */
.tag.t1,.tag.t2,.tag.t3,.tag.t4{background:transparent}
.tag.t1{color:var(--tier-1);border-color:currentColor}
.tag.t2{color:var(--tier-2);border-color:currentColor}
.tag.t3{color:var(--tier-3);border-color:currentColor}
.tag.t4{color:var(--tier-4);border-color:currentColor}
.tag.t4 .tier-ord,.fld-k.t4{color:var(--tier-4)}

.chiprow{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-3) 0 var(--sp-1)}
.chip{display:inline-flex;align-items:center;gap:var(--sp-2);height:var(--h-chip);padding:0 var(--sp-4);
  border-radius:var(--r-sm);background:var(--surface-1);border:1px solid var(--line-2);
  color:var(--txt-2);font-size:var(--fs-xs);line-height:1;white-space:nowrap}
.chip b{color:var(--txt-1);font-weight:var(--fw-sb);font-variant-numeric:tabular-nums}
.chip.ok{color:var(--st-ok);background:var(--st-ok-bg);border-color:var(--st-ok-bd)}
.chip.info{color:var(--st-info);background:var(--st-info-bg);border-color:var(--st-info-bd)}
.chip.warn{color:var(--st-warn);background:var(--st-warn-bg);border-color:var(--st-warn-bd)}
.chip.bad{color:var(--st-bad);background:var(--st-bad-bg);border-color:var(--st-bad-bd)}
.chip.mut{color:var(--st-mut);background:var(--st-mut-bg);border-color:var(--st-mut-bd)}
.chip.ok b,.chip.info b,.chip.warn b,.chip.bad b,.chip.mut b{color:inherit}

.badge{display:inline-flex;align-items:center;height:var(--h-tag);padding:0 var(--sp-2);
  border-radius:var(--r-sm);border:1px solid transparent;font-size:var(--fs-xs);
  font-weight:var(--fw-sb);line-height:1;white-space:nowrap}
.badge.ok{color:var(--st-ok);background:var(--st-ok-bg);border-color:var(--st-ok-bd)}
.badge.info{color:var(--st-info);background:var(--st-info-bg);border-color:var(--st-info-bd)}
.badge.warn{color:var(--st-warn);background:var(--st-warn-bg);border-color:var(--st-warn-bd)}
.badge.bad{color:var(--st-bad);background:var(--st-bad-bg);border-color:var(--st-bad-bd)}
.badge.mut{color:var(--st-mut);background:var(--st-mut-bg);border-color:var(--st-mut-bd)}

.pill{display:inline-flex;align-items:center;height:var(--h-chip);padding:0 var(--sp-4);
  border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--line-2);
  color:var(--txt-2);font-size:var(--fs-xs);line-height:1;white-space:nowrap}

/* ---------- 12. 内容片段：字段行 / 高亮 / 列表 / 失败模式 ---------- */
.fld{display:flex;gap:var(--sp-2);margin:var(--sp-2) 0;
  font-size:var(--fs-sm);line-height:var(--lh-sm)}
/* 内容整体作为一个 flex item —— flex 恒为「标签 + 内容」两项。
   若省掉这层，文本与被 rich()/markNum() 标记过的行内元素会各自成为匿名 flex item，
   在 nowrap 下并排挤压并独立折行，出现「金标准」被拆成两列这类错位（务必保留此层） */
.fld-v{flex:1 1 auto;min-width:0}
/* 动作名可点击：概览与计划统一使用 .tag.act-link（分类色描边 pill），与动作库同款 */
.act-tags{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.tag.act-link{cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;
  transition:border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
.tag.act-link:hover{border-color:var(--accent-bd);color:var(--txt-1)}
.tag.act-link:focus-visible{outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}
.card.is-focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg),var(--shadow-2)}
/* 补充演示图（free-exercise-db · Unlicense 公共领域 · 每动作 2 张：起始位 / 终末位） */
.ds2-row{display:flex;flex-wrap:wrap;gap:var(--sp-3)}
.ds2-img{display:block;width:150px;height:auto;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface-2)}
.ds2-note{font-size:var(--fs-xs);color:var(--txt-3);margin:var(--sp-2) 0 0;line-height:var(--lh-xs)}
.ds-off .ds2-img{display:none}
/* 数据集演示动画（GIF 由 CDN 按需加载，离线自动降级） */
.ds-gif{display:block;width:180px;height:180px;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface-2)}
.ds-attr{font-size:var(--fs-xs);color:var(--txt-3);margin:var(--sp-2) 0 0;line-height:var(--lh-xs)}
.ds-off .ds-gif{display:none}
.ds-off .ds-attr::before{content:'动画未加载 · ';color:var(--txt-3)}
.flist li{margin-bottom:var(--sp-1)}
.fld-k{flex:0 0 auto;min-width:3.4em;font-weight:var(--fw-sb);white-space:nowrap}
.fld-k::before{content:'';display:inline-block;width:4px;height:4px;
  border-radius:var(--r-full);background:currentColor;margin-right:var(--sp-3);
  vertical-align:2px;opacity:.85}
.fld-k.ok{color:var(--st-ok)}   .fld-k.info{color:var(--st-info)}
.fld-k.warn{color:var(--st-warn)} .fld-k.bad{color:var(--st-bad)}
.fld-k.mut{color:var(--st-mut)}
/* 动作库扩展字段标题：复用 cat 轴（无序分类）——与 status 轴分工不冲突
   （要点=ok 绿 / 常见错误=bad 红 属 status；协同肌群·中文分步·动画演示·演示 属分类） */
.fld-k.anat{color:var(--cat-5)}   /* 协同肌群 —— 解剖参考 */
.fld-k.step{color:var(--cat-2)}   /* 中文分步 —— 核心操作步骤 */
.fld-k.anim{color:var(--cat-7)}   /* 动画演示 —— 视觉资源 */
.fld-k.ref{color:var(--cat-6)}    /* 演示 —— 外部参考源 */
.hl{background:var(--accent-bg);color:var(--accent-hi);border-radius:var(--r-sm);
  padding:0 var(--sp-2);font-weight:var(--fw-sb);font-variant-numeric:tabular-nums;
  box-shadow:inset 0 0 0 1px var(--accent-bd)}
.hl.money{background:var(--hl-money-bg);color:var(--hl-money);
  box-shadow:inset 0 0 0 1px var(--hl-money-bd)}
/* 中文分步的要领标注：与「中文分步」标题同色系（cat-2 琥珀），加粗 + 淡琥珀底。
   数据侧用 **…** 标记，渲染时由 rich() 转 <b> 后升级为本类 */
.key{color:var(--cat-2);font-weight:var(--fw-sb);
  background:var(--hl-money-bg);border-radius:var(--r-sm);padding:0 var(--sp-2)}
.flist{margin:var(--sp-1) 0 0;padding-left:1.25em}
.flist li{margin:var(--sp-1) 0}
.lead{font-size:var(--fs-md);line-height:var(--lh-md);color:var(--txt-1);
  font-weight:var(--fw-m);margin:var(--sp-3) 0 var(--sp-2)}
.fail{background:var(--st-warn-bg);border:1px solid var(--st-warn-bd);
  border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);
  margin:var(--sp-3) 0 var(--sp-2);font-size:var(--fs-sm);line-height:var(--lh-sm)}
.fail-k{display:block;color:var(--st-warn);font-weight:var(--fw-sb);
  font-size:var(--fs-xs);line-height:var(--lh-xs);margin-bottom:var(--sp-1)}
.fail-step{padding:var(--sp-1) 0}
.fail-step b{color:var(--st-warn);font-weight:var(--fw-sb);margin-right:var(--sp-2)}
.src{color:var(--txt-3);font-size:var(--fs-xs);line-height:var(--lh-xs)}
.tip-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:var(--sp-2);
  margin-bottom:0;margin-left:0;margin-right:0}
.tip-list:not([class*="mt-"]){margin-top:var(--sp-2)}
.tip-list li{position:relative;padding-left:var(--sp-5);
  font-size:var(--fs-sm);line-height:var(--lh-sm)}
.tip-list li::before{content:'·';position:absolute;left:var(--sp-3);top:0;color:var(--txt-3)}
/* 步骤序列（护肤早晚流程）：序号圆 + 单行动作，替代长段落便于扫读 */
.steps{list-style:none;padding:0;margin:var(--sp-2) 0 0;counter-reset:step}
.steps li{position:relative;padding-left:var(--sp-7);margin:var(--sp-2) 0;
  font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-1)}
.steps li:first-child{margin-top:0}
.steps li::before{counter-increment:step;content:counter(step);
  position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:var(--r-full);
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-0);border:1px solid var(--line-2);color:var(--txt-3);
  font-family:var(--ff-num);font-size:var(--fs-xs);font-weight:var(--fw-sb)}

<!-- 本地个人画像（可选）：文件不存在时静默跳过，页面回落到内置中性示例值。
     该文件已被 .gitignore 排除，真实个人信息不会进仓库；模板见 profile.local.example.js。 -->
<script src="profile.local.js"></script>

<script>
"use strict";
/* =====================================================================
 * 薄肌训练系统 (ThinMuscle Trainer)
 * 模块化功能系统 —— 可独立运行，也可作为子模块挂载到更大系统。
 *
 * 模块边界（统一通过 Store 数据层通信，便于将来拆分/集成）：
 *   Store    : 数据层 (localStorage 持久化 + 导入/导出)
 *   Library  : 动作库管理 (CRUD / 分类 / 搜索)
 *   Plan     : 训练计划制定 (推拉腿薄肌模板 + 自定义)
 *   Log      : 训练记录追踪 (逐组重量次数 + 恢复评分)
 *   Diet     : 饮食打卡 (热量/蛋白目标 + 训练日自动识别 + 吃练匹配度)
 *   Supps    : 补剂循证库 (分级/剂量/禁忌/相互作用/证据评级 + 我的清单)
 *   Progress : 进度反馈 (体测趋势 + 周完成度反馈)
 *   UI       : 路由与渲染 (tab 切换 / 事件委托)
 * ===================================================================== */

/* ----------------------- 模块: Util (通用工具) -----------------------
 * 日期一律走 localDate()。禁止使用 toISOString().slice(0,10)：
 * 它返回 UTC 日期，在 UTC+8 下本地 00:00-08:00 会得到"昨天"，
 * 导致录入日期错位、周窗口整体偏移、训练日识别失效（R1）。
 * -------------------------------------------------------------------- */
const Util = (function(){
  function pad(n){ return String(n).padStart(2,'0'); }
  // 本地日期 YYYY-MM-DD
  function localDate(d){
    const t = d ? new Date(d) : new Date();
    return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
  }
  // 本地本周一（00:00）
  function mondayOf(d){
    const t = d ? new Date(d) : new Date();
    t.setHours(0,0,0,0);
    t.setDate(t.getDate() - ((t.getDay()+6)%7));
    return t;
  }
  // 是否为合法 YYYY-MM-DD
  function isDateStr(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  // 深拷贝（本系统数据无函数与 Date 对象，JSON 往返安全）
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  return {localDate, mondayOf, isDateStr, pad, clone};
})();

/* ----------------------- 个人画像（开源版为中性示例值） -----------------------
 * 全站的训练目标、饮食门槛与部分文案都锚定在这份画像上。开源版本内置的是
 * **中性示例值**，不含任何真实个人信息。
 *
 * 本地使用真实画像：在 index.html 同目录创建 profile.local.js（已被 .gitignore
 * 排除，不会进仓库），内容见 profile.local.example.js：
 *   window.__TM_PROFILE__ = {age:30, sex:'男', height:175, weight:70,
 *                            bodyfat:20, muscleRate:null, city:''};
 *   window.__TM_TARGETS__ = {kcalMin:1900, kcalMax:2400, proTrain:120, proRest:100};
 *
 * 未提供的字段沿用示例值；muscleRate / city / tdee 留空则不渲染相关文案。
 * -------------------------------------------------------------------------- */
const PERSONAL = Object.assign({
  age: 30, sex: '男', height: 175, weight: 70, bodyfat: 20,
  muscleRate: null,   // 可选：体成分秤上的肌肉率 %
  city: '',           // 可选：所在城市（仅用于气候相关提示文案）
  tdee: null,         // 可选：实测/估算 TDEE，留空则由公式推算
  goal: '薄肌 (降体脂保肌)'
}, (typeof window !== 'undefined' && window.__TM_PROFILE__) || {});

/* 由画像推导的区间——改画像即自动跟随，不写死在文案里 */
const DERIVED = (function(){
  const p = PERSONAL;
  const pos = v => typeof v === 'number' && isFinite(v) && v > 0;
  const r = (x, n) => Math.round(x * Math.pow(10, n)) / Math.pow(10, n);
  const lean = (pos(p.weight) && pos(p.bodyfat)) ? r(p.weight * (1 - p.bodyfat / 100), 1) : null;
  const hrLo = pos(p.age) ? Math.floor((220 - p.age) * 0.6) : null;
  const hrHi = pos(p.age) ? Math.floor((220 - p.age) * 0.8) : null;
  const proLo = pos(p.weight) ? Math.round(p.weight * 1.6) : null;
  const proHi = pos(p.weight) ? Math.round(p.weight * 2.2) : null;
  // Mifflin-St Jeor × 活动系数 1.5（每周 3-5 次训练）；显式给了 tdee 则以显式值为准
  const bmr = (pos(p.weight) && pos(p.height) && pos(p.age))
    ? Math.round(10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === '女' ? -161 : 5)) : null;
  const tdee = pos(p.tdee) ? Math.round(p.tdee) : (bmr ? Math.round(bmr * 1.5 / 50) * 50 : null);
  // 文案用：画像缺失时回落到中性表述，绝不渲染 null
  const hrText = (hrLo && hrHi) ? hrLo + '-' + hrHi : null;
  const proText = (proLo && proHi) ? proLo + '-' + proHi + 'g' : null;
  const leanText = lean ? lean + ' kg' : null;
  const tdeeText = tdee ? tdee + ' kcal' : null;
  return {lean, hrLo, hrHi, proLo, proHi, bmr, tdee, hrText, proText, leanText, tdeeText};
})();

/* ----------------------- 模块: Store (数据层) ----------------------- */
/* ----------------------- 模块: KbData (静态知识库常量) -----------------------
 * 全站只读数据，与业务逻辑彻底分离——本区只有数据字面量，不含任何逻辑。
 * 增删条目、修订文案只需读本区；改动数据结构才需要看 Schema。

/* ----------------------- 模块: Schema (结构定义与版本迁移) -----------------------
 * 数据长什么样、跨版本如何演进，全部收敛在这一处。
 * 这是本系统风险最高、也最需要单测的一块，因此与持久化（Store）彻底分开：
 *   normalize() 保证渲染层永不因缺字段抛错（R3）
 *   normalize() 幂等，可安全重复调用
 * ------------------------------------------------------------------------------ */
const Schema = (function(){
  const clone = Util.clone;
  /* ---- 数据规范化（R3）：保证渲染层永不因缺字段抛错 ----
     所有外部进入的数据（本地存储 / 导入 JSON）必须先过这里 */
  const ARR_KEYS = ['supps','herbs','releases','longevity','skincare'];
  function normalize(d){
    if(!d || typeof d !== 'object' || Array.isArray(d)) d = {};
    if(!d.profile || typeof d.profile!=='object') d.profile = clone(KbData.DATA.profile);
    if(!Array.isArray(d.library)) d.library = clone(KbData.LIBRARY);
    // 动作条目：补齐渲染用到的全部字段
    d.library = d.library.filter(a=>a && typeof a==='object' && typeof a.id==='string').map(a=>({
      id: a.id,
      name: typeof a.name==='string' ? a.name : '(未命名动作)',
      cat: typeof a.cat==='string' ? a.cat : 'core',
      muscles: typeof a.muscles==='string' ? a.muscles : '',
      sets: (typeof a.sets==='number' && a.sets>0) ? a.sets : 3,
      reps: typeof a.reps==='string' ? a.reps : '12-15',
      equip: typeof a.equip==='string' ? a.equip : '',
      level: typeof a.level==='string' ? a.level : '',
      points: Array.isArray(a.points) ? a.points.map(String) : [],
      errors: Array.isArray(a.errors) ? a.errors.map(String) : [],
      fail: typeof a.fail==='string' ? a.fail : '',
      demo: typeof a.demo==='string' ? a.demo : ''
    }));
    // 计划：模板 + 七天结构 + 动作引用合法性
    if(!d.plan || typeof d.plan!=='object' || !d.plan.week || typeof d.plan.week!=='object') d.plan = clone(KbData.PLAN);
    if(typeof d.plan.template !== 'string') d.plan.template = KbData.PLAN.template;
    if(typeof d.plan.focus !== 'string') d.plan.focus = '';
    const liveIds = {}; d.library.forEach(a=>{ liveIds[a.id]=1; });
    Object.keys(KbData.PLAN.week).forEach(day=>{
      const w = d.plan.week[day];
      if(!w || typeof w!=='object'){ d.plan.week[day] = clone(KbData.PLAN.week[day]); return; }
      if(typeof w.type !== 'string') w.type = 'rest';
      // 剔除指向已删除动作的引用，避免界面残留"已删"占位
      w.actions = Array.isArray(w.actions) ? w.actions.filter(id=>liveIds[id]) : [];
    });
    // 训练记录
    if(!Array.isArray(d.logs)) d.logs = [];
    d.logs = d.logs.filter(l=> l && typeof l==='object').map(l=>({
      id: l.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(l.date) ? l.date : Util.localDate(),
      dayType: typeof l.dayType==='string' ? l.dayType : '',
      rating: (typeof l.rating==='number') ? l.rating : 8,
      recovery: typeof l.recovery==='string' ? l.recovery : '',
      entries: (Array.isArray(l.entries)?l.entries:[]).filter(e=>e && typeof e==='object').map(e=>({
        actionId: typeof e.actionId==='string' ? e.actionId : '',
        actionName: typeof e.actionName==='string' ? e.actionName : '(未知动作)',
        sets: (Array.isArray(e.sets)?e.sets:[]).filter(s=>s && typeof s==='object')
          .map(s=>({ weight: Number(s.weight)||0, reps: Number(s.reps)||0 })),
        rpe: (e.rpe==null || e.rpe==='') ? null : (Number(e.rpe)||null)
      }))
    }));
    // 体测
    if(!Array.isArray(d.metrics)) d.metrics = [];
    d.metrics = d.metrics.filter(m=> m && typeof m==='object').map(m=>({
      id: m.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(m.date) ? m.date : Util.localDate(),
      weight:  (m.weight==null  || m.weight==='') ? null : (Number(m.weight)  || null),
      bodyfat: (m.bodyfat==null || m.bodyfat==='') ? null : (Number(m.bodyfat) || null),
      waist:   (m.waist==null   || m.waist==='') ? null : (Number(m.waist)   || null)
    }));
    // 睡眠打卡（date=记录日，语义为「昨夜」；同日 upsert）
    if(!Array.isArray(d.sleep)) d.sleep = [];
    d.sleep = d.sleep.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      hours: Number(x.hours)||0,
      quality: Number(x.quality)||3
    }));
    // 柔韧自测（坐位体前屈 cm，越大越好；深蹲最低点髋高 cm，越小越好）
    if(!Array.isArray(d.flex)) d.flex = [];
    d.flex = d.flex.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      sitreach: (x.sitreach==null || x.sitreach==='') ? null : (Number(x.sitreach)||null),
      squat:    (x.squat==null    || x.squat==='')    ? null : (Number(x.squat)   ||null)
    }));
    // 舌象周记
    if(!Array.isArray(d.tongue)) d.tongue = [];
    d.tongue = d.tongue.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      coat: typeof x.coat==='string' ? x.coat : '',
      thick: typeof x.thick==='string' ? x.thick : '',
      note: typeof x.note==='string' ? x.note : ''
    }));
    // 饮食
    if(!Array.isArray(d.diet)) d.diet = [];
    d.diet = d.diet.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      kcal: Number(x.kcal)||0,
      protein: Number(x.protein)||0,
      flags: Array.isArray(x.flags) ? x.flags.filter(f=>typeof f==='string') : []
    }));
    // 各知识库"我的清单"：只保留字符串 id
    ARR_KEYS.forEach(k=>{
      if(!Array.isArray(d[k])) d[k] = [];
      d[k] = d[k].filter(x=>typeof x==='string');
    });
    // 内置动作删除黑名单（R6）
    if(!Array.isArray(d.removedBuiltin)) d.removedBuiltin = [];
    d.removedBuiltin = d.removedBuiltin.filter(x=>typeof x==='string');
    // 备份时间戳（R7）
    if(!Util.isDateStr(d.lastBackupAt)) d.lastBackupAt = null;
    return d;
  }

  return {normalize};
})();

const Store = (function(){
  const KEY = 'thinMuscle.trainSys.v1';
  const BACKUP_PREFIX = 'thinMuscle.backup.v1.';
  const BACKUP_KEEP = 3;

  // 从 KbData 取常量（保持 Store.DEFAULT_* 对外接口不变，内部调用点无需改动）
  const {LIBRARY:DEFAULT_LIBRARY, PLAN:DEFAULT_PLAN, SUPPLEMENTS:DEFAULT_SUPPLEMENTS,
         HERBS:DEFAULT_HERBS, RELEASE:DEFAULT_RELEASE, LONGEVITY:DEFAULT_LONGEVITY,
         SKINCARE:DEFAULT_SKINCARE, DATA:DEFAULT_DATA} = KbData;
  const clone = Util.clone;
  const normalize = Schema.normalize;

let data = clone(DEFAULT_DATA);
  let lastError = null;      // 最近一次持久化失败信息（R7）
  let loadWarning = null;    // 加载期异常信息，供 UI 提示（R3/R7）

  /* ---- 滚动备份（R2/R7）：迁移或导入前留档，最多保留 BACKUP_KEEP 份 ---- */
  function snapshot(reason){
    try{
      const keys = Object.keys(localStorage).filter(k=>k.indexOf(BACKUP_PREFIX)===0).sort();
      while(keys.length >= BACKUP_KEEP){ localStorage.removeItem(keys.shift()); }
      const stamp = Util.localDate() + 'T' + new Date().toTimeString().slice(0,8);
      localStorage.setItem(BACKUP_PREFIX + stamp,
        JSON.stringify({reason:reason||'manual', at:stamp, data:data}));
      return true;
    }catch(e){ console.warn('备份失败', e); return false; }
  }
  function listBackups(){
    try{
      return Object.keys(localStorage).filter(k=>k.indexOf(BACKUP_PREFIX)===0).sort().reverse()
        .map(k=>{ let meta={}; try{ meta=JSON.parse(localStorage.getItem(k))||{}; }catch(e){}
          return {key:k, reason:meta.reason||'', at:meta.at||k.slice(BACKUP_PREFIX.length)}; });
    }catch(e){ return []; }
  }
  function restoreBackup(key){
    try{
      const raw = localStorage.getItem(key); if(!raw) return false;
      const env = JSON.parse(raw);
      data = normalize(clone(env && env.data ? env.data : env));
      save(); return true;
    }catch(e){ return false; }
  }

  function load(){
    let raw = null;
    try{
      raw = localStorage.getItem(KEY);
    }catch(e){
      loadWarning = '浏览器不允许读取本地存储（可能处于隐私模式），本次为临时会话，改动不会保存。';
    }
    if(raw){
      try{
        data = normalize(Object.assign(clone(DEFAULT_DATA), JSON.parse(raw)));
      }catch(e){
        // 结构损坏：另存原始串供抢救，绝不静默丢弃（R3）
        try{ localStorage.setItem(KEY + '.corrupt', raw); }catch(_){}
        data = normalize(clone(DEFAULT_DATA));
        loadWarning = '本地数据解析失败（已损坏），已回退到默认数据。原始内容已另存，可在「备份」页导出抢救。';
      }
    } else {
      data = normalize(clone(DEFAULT_DATA));
    }
    // ---- 迁移：逐条独立，任一步失败不影响其余 ----
    try{
      if(Array.isArray(data.library)){
        // 合并新增内置动作（尊重用户删除黑名单，R6）
        const known={}; data.library.forEach(a=>known[a.id]=1);
        const removed={}; (data.removedBuiltin||[]).forEach(id=>removed[id]=1);
        let added=0;
        DEFAULT_LIBRARY.forEach(a=>{
          if(!known[a.id] && !removed[a.id]){ data.library.push(clone(a)); known[a.id]=1; added++; }
        });
        // 同步 demo 链接（只动 demo，不触碰用户自改的名称/组数/次数）
        const demoMap={}; DEFAULT_LIBRARY.forEach(a=>{ demoMap[a.id]=a.demo; });
        let demoFixed=0;
        data.library.forEach(a=>{
          if(demoMap[a.id]!=null && a.demo!==demoMap[a.id]){ a.demo=demoMap[a.id]; demoFixed++; }
        });
        if(added>0 || demoFixed>0) save();
      }
      // v3.7 迁移（R2 修复）：只升级「周五」这一天，不再整周覆盖。
      // 旧实现命中历史签名后执行 data.plan = clone(DEFAULT_PLAN)，
      // 会把用户对其余各天的自定义排布一并抹除；改为按天替换后，未命中的天原样保留。
      (function migrateFriday(){
        const fri = data.plan && data.plan.week && data.plan.week['周五'];
        if(!fri || !Array.isArray(fri.actions)) return;
        const LEGACY = [
          ['a_leg_press','a_leg_ext','a_leg_curl','a_leg_bridge','a_leg_calf','a_core_plank'],
          ['a_leg_bulgarian','a_leg_curl','a_leg_rdl','a_leg_bridge','a_leg_calf','a_core_birddog'],
          ['a_leg_kbswing','a_leg_bulgarian','a_leg_curl','a_leg_rdl','a_leg_bridge','a_leg_calf']
        ];
        const cur = JSON.stringify(fri.actions);
        const latest = JSON.stringify(DEFAULT_PLAN.week['周五'].actions);
        if(cur !== latest && LEGACY.some(sig=>JSON.stringify(sig)===cur)){
          snapshot('pre-migrate-v3.7');   // 先留档，再改
          data.plan.week['周五'] = clone(DEFAULT_PLAN.week['周五']);
          save();
        }
      })();
      // v3.26 迁移：功能训练三天结构修正（周二去重补踝 / 周四换出训练动作补胸小肌+摩腹 / 周六改标签）
      // 与 v3.7 同一套做法：按动作序列精确签名匹配，命中才替换；未命中的天原样保留（尊重自定义）
      (function migrateFuncDays(){
        const wk = data.plan && data.plan.week;
        if(!wk) return;
        const SIGS = {
          '周二': [['a_cardio_walk','a_leg_monster','a_leg_clam','a_mob_sls','a_mob_hipflex'],
                   ['a_cardio_walk','a_leg_monster','a_mob_ankle','a_mob_sls','a_mob_hipflex']],
          '周四': [['a_cardio_baduan','a_mob_catcow','a_mob_tspine','a_mob_hipflex','a_core_plank']]
        };
        let changed = false;
        Object.keys(SIGS).forEach(day=>{
          const w = wk[day];
          if(!w || !Array.isArray(w.actions)) return;
          const cur = JSON.stringify(w.actions);
          const latest = JSON.stringify(DEFAULT_PLAN.week[day].actions);
          if(cur !== latest && SIGS[day].some(sig=>JSON.stringify(sig)===cur)){
            if(!changed){ snapshot('pre-migrate-v3.29'); changed = true; }
            wk[day] = clone(DEFAULT_PLAN.week[day]);
          }
        });
        // 周六：动作序列未改，只把旧标签 cardio 升级为 fcore
        const sat = wk['周六'];
        if(sat && sat.type==='cardio' && Array.isArray(sat.actions)
           && JSON.stringify(sat.actions)===JSON.stringify(DEFAULT_PLAN.week['周六'].actions)){
          if(!changed){ snapshot('pre-migrate-v3.29'); changed = true; }
          sat.type = DEFAULT_PLAN.week['周六'].type;
        }
        if(changed) save();
      })();
    }catch(e){ console.warn('迁移失败',e); }
    return data;
  }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(data));
      lastError = null;
      return true;
    }catch(e){
      // R7：写失败必须让用户知道，不能静默丢数据
      lastError = (e && e.name==='QuotaExceededError')
        ? '本地存储空间已满，本次改动未保存。请到「备份」页导出后清理旧备份。'
        : '保存失败：浏览器拒绝了写入（隐私模式或无痕窗口），本次改动不会保留。';
      console.warn(e);
      return false;
    }
  }
  function get(){ return data; }
  function set(mutator){
    mutator(data);
    const ok = save();
    if(!ok && typeof window!=='undefined' && window.__tm_onSaveError) window.__tm_onSaveError(lastError);
    return ok;
  }
  function reset(){ data = normalize(clone(DEFAULT_DATA)); save(); }
  function exportJSON(){ return JSON.stringify(data,null,2); }

  /* 导入（R5）：先验结构、后留档、再落地；结构非法一律拒绝，绝不静默重置 */
  function importJSON(str){
    const text = String(str==null?'':str).trim();
    if(!text) throw new Error('内容为空，请先粘贴导出的 JSON');
    let o;
    try{ o = JSON.parse(text); }
    catch(e){ throw new Error('JSON 语法错误：请检查是否为完整对象（以 { 开头、} 结尾）'); }
    if(o===null || typeof o!=='object' || Array.isArray(o)){
      throw new Error('这不是本系统的备份：顶层必须是对象，当前为 '
        + (o===null?'null':Array.isArray(o)?'数组':typeof o));
    }
    // 至少含一个已知业务键，避免 {} 或无关 JSON 被误判为合法备份
    const KNOWN = ['profile','library','plan','logs','metrics','diet','supps','herbs','releases','longevity','skincare'];
    if(!KNOWN.some(k=>Object.prototype.hasOwnProperty.call(o,k))){
      throw new Error('这不是本系统的备份：未找到任何已知字段（'+KNOWN.slice(0,4).join(' / ')+' …）');
    }
    snapshot('pre-import');           // 导入前留档，可回滚
    const before = clone(data);
    data = normalize(Object.assign(clone(DEFAULT_DATA), o));
    if(!save()){ data = before; throw new Error('写入失败，已回滚到导入前的数据'); }
    // 导入后跑一次迁移，补齐新增内置动作
    try{ load(); }catch(e){ console.warn('导入后迁移失败', e); }
    return true;
  }

  return {KEY,BACKUP_PREFIX,DEFAULT_DATA,DEFAULT_SUPPLEMENTS,DEFAULT_HERBS,DEFAULT_RELEASE,DEFAULT_LONGEVITY,DEFAULT_SKINCARE,
    load,save,get,set,reset,exportJSON,importJSON,normalize,snapshot,listBackups,restoreBackup,
    getLastError:()=>lastError, getLoadWarning:()=>loadWarning, clearLoadWarning:()=>{ loadWarning=null; },
    uid:()=> 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
})();

/* ----------------------- 模块: Library (动作库) ----------------------- */
const Library = (function(){
  const CATS = [
    {k:'push',label:'推'},{k:'pull',label:'拉'},{k:'legs',label:'腿'},
    {k:'core',label:'核心'},{k:'cardio',label:'有氧/功法'},{k:'mob',label:'功能/稳定'}
  ];
  const CAT_CLS = {push:'c1',pull:'c6',legs:'c4',core:'c7',cardio:'c2',mob:'c5'};
  function list(){ return Store.get().library; }
  function byId(id){ return list().find(a=>a.id===id); }
  function add(a){ Store.set(d=>{ d.library.push(Object.assign({id:Store.uid()},a)); }); }
  function update(id, patch){ Store.set(d=>{ const x=d.library.find(a=>a.id===id); if(x)Object.assign(x,patch); }); }
  function remove(id){
    Store.set(d=>{
      d.library = d.library.filter(a=>a.id!==id);
      // R6：内置动作无法物理删除（load 会补回），必须记入黑名单才算真正移除
      const isBuiltin = Store.DEFAULT_DATA.library.some(a=>a.id===id);
      if(isBuiltin){
        if(!Array.isArray(d.removedBuiltin)) d.removedBuiltin = [];
        if(d.removedBuiltin.indexOf(id)<0) d.removedBuiltin.push(id);
      }
      // 同步清理计划中的悬挂引用，避免界面残留"已删"占位
      Object.keys(d.plan.week).forEach(day=>{
        const w = d.plan.week[day];
        if(w && Array.isArray(w.actions)) w.actions = w.actions.filter(x=>x!==id);
      });
    });
  }
  function catLabel(k){ const c=CATS.find(c=>c.k===k); return c?c.label:k; }
  function catCls(k){ return CAT_CLS[k]||'c0'; }
  return {CATS,CAT_CLS,list,byId,add,update,remove,catLabel,catCls};
})();

/* ----------------------- 模块: Progress (进度反馈) ----------------------- */
const Progress = (function(){
  function list(){ return Store.get().metrics.slice().sort((a,b)=> a.date.localeCompare(b.date)); }
  function add(m){ Store.set(d=>{ d.metrics.push(m); }); }
  function remove(id){ Store.set(d=>{ d.metrics=d.metrics.filter(x=>x.id!==id); }); }
  // R4：取某字段的「首末有效点」，跳过 null。
  // 旧实现直接做 last.weight-first.weight，未测量（null）会被当成 0 参与算术，
  // 例如 [70, null] 会得出 dw=-70，凭空生成"体重下降 70kg"的减脂结论。
  function span(ms, key){
    const pts = ms.filter(m=> m[key]!=null && isFinite(m[key]));
    if(pts.length<2) return null;
    const from = pts[0][key], to = pts[pts.length-1][key];
    return {from, to, delta: +(to-from).toFixed(2), n: pts.length};
  }
  function fmtDelta(d, unit){
    if(d===0) return '持平';
    return (d>0?'+':'') + d + unit;
  }
  function feedback(){
    const ms = list();
    if(ms.length<2) return {trend:'数据不足',msg:'至少录入 2 次体测才能生成趋势反馈。建议每 2 周记录一次体重/体脂/腰围。',level:'mut',missing:[]};
    const last = ms[ms.length-1];
    const w = span(ms,'weight'), f = span(ms,'bodyfat'), k = span(ms,'waist');
    const missing = [];
    if(!w) missing.push('体重'); if(!f) missing.push('体脂'); if(!k) missing.push('腰围');
    const msg=[]; let level='ok';
    // 只有体重与体脂都各有 ≥2 个有效点时才做交叉判定，数据不足时明确拒答
    if(w && f){
      if(w.delta<0 && f.delta<0){ msg.push('体重与体脂同步下降，处于减脂正轨，且未出现明显反弹。'); }
      else if(w.delta<0 && f.delta>=0){ msg.push('体重下降但体脂未降，警惕肌肉流失——蛋白是否拉满(训练日 ≥'+Diet.TARGET.proTrain+'g)？力量训练有没落下？'); level='warn'; }
      else if(w.delta>=0 && f.delta<0){ msg.push('体重持平但体脂下降，说明在保肌/增肌同时刷脂，是理想的身体重组(recomp)信号。'); }
      else { msg.push('体重与体脂均上升，热量缺口可能没守住或水肿，检查近两周饮食与睡眠。'); level='bad'; }
      msg.push('体重 '+w.from+' → '+w.to+' kg（'+fmtDelta(w.delta,'kg')+'），体脂 '+f.from+' → '+f.to+'%（'+fmtDelta(f.delta,'%')+'）。');
    } else {
      level='warn';
      msg.push('有效数据点不足（缺 '+missing.join('、')+'，各项需至少 2 次有效记录），本次不生成减脂结论，以免误判。');
      if(w) msg.push('体重 '+w.from+' → '+w.to+' kg（'+fmtDelta(w.delta,'kg')+'）。');
      if(f) msg.push('体脂 '+f.from+' → '+f.to+'%（'+fmtDelta(f.delta,'%')+'）。');
    }
    if(k) msg.push('腰围 '+k.from+' → '+k.to+' cm（'+fmtDelta(k.delta,'cm')+'）。');
    const logs = Log.thisWeekCount();
    msg.push('本周已训练 '+logs+' 次（薄肌目标建议 3-4 次/周）。');
    if(logs<3) { msg.push('训练频率偏低，建议补足推/拉/腿至少各 1 次。'); if(level==='ok')level='warn'; }
    return {trend:'最近一次 '+last.date, msg:msg.join(' '), level, missing};
  }
  return {list,add,remove,feedback,span};
})();

/* ----------------------- 模块: Diet (饮食打卡) ----------------------- */
const Diet = (function(){
  // 目标锚点：温和缺口 -300~500kcal；训练日蛋白门槛更高。
  // 默认值为通用起点，可用 profile.local.js 的 window.__TM_TARGETS__ 覆盖为个人实测值。
  const TARGET = Object.assign({kcalMin:1900, kcalMax:2400, proTrain:120, proRest:100},
    (typeof window !== 'undefined' && window.__TM_TARGETS__) || {});
  const FLAGS = [
    {k:'oil',label:'油脂≥15% (5-10ml好油)'},
    {k:'nosugar',label:'无含糖饮料/甜点'},
    {k:'veg',label:'蔬菜≥500g'}
  ];
  function list(){ return Store.get().diet.slice().sort((a,b)=> b.date.localeCompare(a.date)); }
  function add(m){ Store.set(d=>{ const i=d.diet.findIndex(x=>x.date===m.date); if(i>=0)d.diet[i]=m; else d.diet.push(m); }); }
  function remove(id){ Store.set(d=>{ d.diet=d.diet.filter(x=>x.id!==id); }); }
  function byDate(date){ return list().find(x=>x.date===date); }
  function isTrainDate(date){ return Store.get().logs.some(l=>l.date===date); }
  function match(m){
    const isTrain=isTrainDate(m.date);
    const proTarget=isTrain?TARGET.proTrain:TARGET.proRest;
    // R10：热量未填必须显式暴露。旧实现下 kcal=0 既不触发"超标"也不触发"偏低"，
    // level 会停在 ok 且消息为空，渲染出一个绿色空提示块。
    const kcalMissing = !m.kcal || m.kcal<=0;
    const kcalOK = !kcalMissing && m.kcal>=TARGET.kcalMin && m.kcal<=TARGET.kcalMax;
    const proOK = m.protein>=proTarget;
    let level='ok'; const msgs=[];
    if(kcalMissing){ level='warn'; msgs.push('热量未填写，无法判定缺口'); }
    else if(m.kcal>TARGET.kcalMax){ level='bad'; msgs.push('热量超标 '+(m.kcal-TARGET.kcalMax)+' kcal，缺口没守住'); }
    else if(m.kcal<TARGET.kcalMin){ level=isTrain?'bad':'warn'; msgs.push('摄入偏低 '+(TARGET.kcalMin-m.kcal)+' kcal，缺口过大易掉肌'); }
    if(!proOK){ msgs.push('蛋白未达标 (今日目标 '+proTarget+'g'+(isTrain?'，训练日':'')+')'); if(level==='ok')level=isTrain?'bad':'warn'; }
    if(kcalOK&&proOK) msgs.push(isTrain?'训练日：热量+蛋白双达标，保肌窗口稳':'休息日：达标，缺口维持');
    if(!msgs.length) msgs.push('已记录，但数据不完整');   // 兜底：绝不产生空提示
    return {isTrain,kcalOK,proOK,proTarget,level,msg:msgs.join('；')};
  }
  function weekMatrix(){
    const days=[]; const now=new Date();
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(Util.localDate(d)); }
    return days.map(date=>{ const rec=byDate(date); return {date, rec, train:isTrainDate(date), m:rec?match(rec):null}; });
  }
  function feedback(){
    const wm=weekMatrix(); const logged=wm.filter(x=>x.rec);
    if(!logged.length) return {level:'muted',msg:'近 7 天还没有饮食打卡，从今天开始记录。'};
    const good=logged.filter(x=>x.m.level==='ok').length;
    const pct=Math.round(good/logged.length*100);
    let level = pct>=70?'ok':pct>=40?'warn':'bad';
    let msg='近 7 天打卡 '+logged.length+' 天，达标率 '+pct+'%。';
    const noOil=logged.filter(x=>!(x.rec.flags||[]).includes('oil')).length;
    if(noOil>2) msg+=noOil+' 天油脂未补，长期无油会掉代谢，晚餐补 5-10ml 好油。';
    const sug=logged.filter(x=>!(x.rec.flags||[]).includes('nosugar')).length;
    if(sug>0) msg+=sug+' 天有糖分破防，注意隐形糖（果汁/乳酸菌饮料）。';
    const trainMiss=wm.filter(x=>x.train&&x.rec&&!x.m.proOK).length;
    if(trainMiss>0){ msg+='有 '+trainMiss+' 个训练日蛋白没够，保肌窗口是最不能丢的。'; if(level==='ok')level='warn'; }
    if(level==='ok') msg+='吃练节奏咬合得不错，继续保持。';
    return {level,msg};
  }
  return {TARGET,FLAGS,list,add,remove,byDate,isTrainDate,match,weekMatrix,feedback};
})();

/* ----------------------- 模块: Adapt (自适应渐进 + 周容量) -----------------------
 * 规则透明写死（调参改这里）：
 *   上次 e1RM ≥ 前高×1.02 → 重量 +2.5%（四舍五入到 0.5kg）
 *   上次达前高但未上探   → 维持（可加 1 次或 1 组）
 *   上次未达前高         → 维持，动作质量优先
 *   距上次 ≥5 天         → 恢复性回归（组次减半热身）
 *   昨夜睡眠 <6h         → 目标重量再 -10%
 * e1RM 近似 = w × (1 + reps/30)（Epley），仅用于同动作组间/次间比较
 * ------------------------------------------------------------------------------ */
const Adapt = (function(){
  const PCT_UP = 0.025, SLEEP_PENALTY = 0.10, REST_GAP_DAYS = 5;
  function bestOf(entry){
    if(!entry || !Array.isArray(entry.sets)) return {v:0,w:0,reps:0};
    return entry.sets.reduce((m,s)=>{ const v=(s.weight||0)*(1+(s.reps||0)/30); return v>m.v ? {v:v,w:s.weight,reps:s.reps} : m; }, {v:0,w:0,reps:0});
  }
  function history(actionId){
    const logs=Store.get().logs
      .filter(l=>l.entries.some(e=>e.actionId===actionId))
      .sort((a,b)=> b.date.localeCompare(a.date));
    if(!logs.length) return null;
    const pick=l=>bestOf(l.entries.find(e=>e.actionId===actionId));
    const last={date:logs[0].date, best:pick(logs[0])};
    const prev=logs[1]?{date:logs[1].date, best:pick(logs[1])}:null;
    const gapDays=Math.round((new Date(Util.localDate())-new Date(last.date))/864e5);
    return {last,prev,gapDays};
  }
  function round05(x){ return Math.round(x*2)/2; }
  function suggestion(actionId){
    const a=Library.byId(actionId)||{sets:3,reps:'12-15'};
    const rec=history(actionId);
    if(!rec) return {kind:'first',actionId,target:null,msg:'首练：按动作库预设 '+a.sets+' 组 × '+a.reps+'，重量选「能标准完成全部组次」'};
    const w=rec.last.best.w;
    if(!w) return {kind:'first',actionId,target:null,msg:'上次未记录重量：今天用轻重量重建基线（12-15 次能标准完成）'};
    let target=w, why='';
    if(rec.prev && rec.last.best.v >= rec.prev.best.v*1.02){
      target=round05(w*(1+PCT_UP)); why='上次 '+w+'kg 优于前高 → +2.5% 上探';
    } else if(rec.prev && rec.last.best.v >= rec.prev.best.v){
      why='上次 '+w+'kg 稳定达标 → 维持，可加 1 次或 1 组';
    } else if(rec.prev){
      why='上次 '+w+'kg 未达前高 → 维持，把动作质量做满';
    } else {
      why='仅有一条记录 → 维持 '+w+'kg 建立基准';
    }
    if(rec.gapDays>=REST_GAP_DAYS){ why='这个动作 '+rec.gapDays+' 天没练 → 恢复性回归 '+target+'kg（组次减半热身）'; }
    const parts=[];
    const low=Body.sleepLow();
    if(low){ target=round05(target*(1-SLEEP_PENALTY)); parts.push('昨夜睡眠 '+low.hours+'h（<6h）→ 已下调 10%'); }
    parts.push(why);
    return {kind:'plan',actionId,target:target,msg:'今天 '+target+'kg（'+parts.join('；')+'）'};
  }
  /* 肌群归类：muscles+名称关键词 → 六大抗阻肌群（仪表只看抗阻，功法/有氧不计入） */
  function muscleOf(a){
    const str=((a&&a.muscles)||'')+' '+((a&&a.name)||'');
    if(/拉伸|柔韧|活动度|八段锦|太极|平衡|功法/.test(str)) return 'flex';
    if(/有氧|心率|快走|慢跑|台阶|跳绳|开合跳/.test(str)) return 'cardio';
    if(/胸|卧推|飞鸟|俯卧撑|夹胸|上斜/.test(str)) return 'chest';
    if(/背|划船|引体|下拉/.test(str)) return 'back';
    if(/肩|推举|侧平举|反向飞鸟/.test(str)) return 'shoulder';
    if(/弯举|臂|三头|二头/.test(str)) return 'arms';
    if(/蹲|腿|臀|箭步|提踵|硬拉|髋|蚌式|臀桥/.test(str)) return 'legs';
    if(/平板|支撑|卷腹|核心|腹/.test(str)) return 'core';
    return 'other';
  }
  /* 周容量：最近 7 天每抗阻肌群总组数（薄肌参考带 10-20 组/周/肌群） */
  function weekVolume(){
    const now=new Date(); const days=[];
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(Util.localDate(d)); }
    const map={};
    Store.get().logs.filter(l=>days.indexOf(l.date)>=0).forEach(l=>{
      l.entries.forEach(e=>{
        const a=Library.byId(e.actionId)||{name:e.actionName,muscles:''};
        const g=muscleOf(a);
        if(g==='flex'||g==='cardio'||g==='other') return;
        map[g]=map[g]||{};
        const key=a.id||a.name;
        map[g][key]=map[g][key]||{name:a.name,sets:0};
        map[g][key].sets+=(e.sets?e.sets.length:0);
      });
    });
    const ORDER=[['chest','胸'],['back','背'],['shoulder','肩'],['arms','臂'],['legs','腿'],['core','核心']];
    return ORDER.map(pair=>({group:pair[1],key:pair[0],sets:Object.values(map[pair[0]]||{}).reduce((acc,x)=>acc+x.sets,0)}));
  }
  return {suggestion,weekVolume,history,muscleOf};
})();

/* ------------------- 模块: KB 工厂 (知识库模块统一构造) -------------------
 * 补剂 / 中医 / 松解 / 抗衰 / 护肤 这 5 个知识库结构完全同构：
 *   静态条目常量（只读） + 用户清单（条目 id 数组，存在 Store 里）
 * 统一由 kbBase 产出，避免各模块各写一遍 mine/toggle——
 * 旧实现 5 份 toggle 里只有 4 份做了空数组防护，Supplements 那份会抛错（R9）。
 * -------------------------------------------------------------------- */
function kbBase(dataKey, source){
  function list(){ return source().slice().sort((a,b)=>a.priority-b.priority); }
  function mine(){
    const d = Store.get();
    return Array.isArray(d[dataKey]) ? d[dataKey] : [];
  }
  function inMine(id){ return mine().indexOf(id) >= 0; }
  function toggle(id){
    Store.set(d=>{
      if(!Array.isArray(d[dataKey])) d[dataKey] = [];   // 统一空数组防护
      const i = d[dataKey].indexOf(id);
      if(i>=0) d[dataKey].splice(i,1); else d[dataKey].push(id);
    });
  }
  function byId(id){ return list().find(x=>x.id===id); }
  function labelOf(axis, k){ const t = axis.find(x=>x.k===k); return t ? t.label : k; }
  return {list, mine, inMine, toggle, byId, labelOf};
}

/* ----------------------- 模块: Theme (明暗主题) -----------------------
 * 三态：auto(跟随系统) / light / dark。持久化到 localStorage。
 * 首次绘制前由 <head> 内联脚本兜底设定 data-theme，避免闪烁。
 * 默认 auto —— 系统为深色时行为与改动前完全一致。
 * -------------------------------------------------------------------- */
const Theme = (function(){
  const KEY = 'thinMuscle.theme.v1';
  const ORDER = ['auto','light','dark'];
  const LABEL = {auto:'跟随系统', light:'浅色', dark:'深色'};
  const MQ = '(prefers-color-scheme: dark)';

  function stored(){
    try{ const v = localStorage.getItem(KEY); return ORDER.indexOf(v) >= 0 ? v : 'auto'; }
    catch(e){ return 'auto'; }
  }
  function resolve(mode){
    if(mode !== 'auto') return mode;
    // 不支持 matchMedia 的环境（如 jsdom）沿用历史默认：深色
    if(!window.matchMedia) return 'dark';
    return matchMedia(MQ).matches ? 'dark' : 'light';
  }
  function apply(mode){
    document.documentElement.setAttribute('data-theme', resolve(mode));
  }
  function get(){ return stored(); }
  function set(mode){
    try{ localStorage.setItem(KEY, mode); }catch(e){}
    apply(mode);
  }
  function next(){ return ORDER[(ORDER.indexOf(get()) + 1) % ORDER.length]; }
  function label(){ return LABEL[get()]; }
  function init(){
    apply(stored());
    // 处于 auto 时，跟随系统主题实时切换
    try{
      if(window.matchMedia) matchMedia(MQ).addEventListener('change', function(){ if(get() === 'auto') apply('auto'); });
    }catch(e){}
  }
  return {get,set,next,label,init};
})();

/* ----------------------- 模块: UI (路由/渲染) ----------------------- */
/* ----------------------- 模块: SwipeTab (移动端手势切换) -----------------------
 * 仅小屏（≤767px）启用：手指左右滑动切换模块，左滑下一个 / 右滑上一个。桌面端不启用，
 * 保留原有点击切换。
 *
 * 三个阈值（防误触，REQ：合理的距离与速度阈值）：
 *   MIN_DIST      60 px  —— 慢速拖动至少滑这么远才触发
 *   MIN_DIST_FLICK 30 px —— 快速轻扫(flick)时，滑这么远即可
 *   MIN_VEL      0.3 px/ms（≈300 px/s）—— 轻扫的速度门槛
 *   DIR_RATIO    1.5     —— |dx| 必须 > |dy| * 1.5，否则判定为纵向滚动，完全不拦截（REQ：不影响上下滚动）
 *
 * 不拦截区域：.tabs（横向滚动的标签栏）/.chart-wrap / .table-wrap / [data-no-swipe]
 * 边界：首/尾只做轻微回弹提示，不越界
 * -------------------------------------------------------------------------------- */
const SwipeTab = (function(){
  const MQ = '(max-width: 767px)';
  const MIN_DIST = 60;
  const MIN_DIST_FLICK = 30;
  const MIN_VEL = 0.3;
  const DIR_RATIO = 1.5;
  const DAMP = 0.35;        // 跟手阻尼（位移打折，避免内容被拖太远）
  const EDGE_DAMP = 0.12;   // 边界处阻尼更大 → "拉不动"的手感
  let sx = 0, sy = 0, st = 0, dx = 0, dy = 0;
  let tracking = false, decided = false, horiz = false, enabled = false;

  const appEl = () => document.getElementById('app');
  const isMobile = () => !!(window.matchMedia && matchMedia(MQ).matches);
  // 这些容器内优先它自己的横向滚动，不抢手势
  const inNoSwipe = t => !!(t && t.closest && t.closest('.tabs, .chart-wrap, .table-wrap, [data-no-swipe]'));

  function onStart(e){
    if(!enabled || !e.touches || e.touches.length !== 1) return;
    if(inNoSwipe(e.target)) return;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now();
    dx = 0; dy = 0; tracking = true; decided = false; horiz = false;
    const el = appEl(); if(el) el.classList.add('is-swiping');
  }

  function onMove(e){
    if(!tracking || !e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    dx = t.clientX - sx; dy = t.clientY - sy;
    if(!decided && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      horiz = Math.abs(dx) > Math.abs(dy) * DIR_RATIO;   // 横向主导才接管
      decided = true;
    }
    if(!decided || !horiz) return;                        // 纵向 → 交给浏览器正常滚动
    const el = appEl();
    if(el){
      const idx = UI.currentIndex(), last = UI.tabKeys().length - 1;
      const atEdge = (idx <= 0 && dx > 0) || (idx >= last && dx < 0);
      el.style.transform = 'translateX(' + (dx * (atEdge ? EDGE_DAMP : DAMP)).toFixed(1) + 'px)';
    }
    if(e.cancelable) e.preventDefault();                  // 阻止页面横向滚动/橡皮筋
  }

  function onEnd(){
    if(!tracking) return;
    tracking = false;
    const el = appEl();
    if(el) el.classList.remove('is-swiping');
    if(!decided || !horiz){ release(el); return; }

    const dt = Math.max(1, Date.now() - st);
    const adx = Math.abs(dx);
    const vel = adx / dt;
    const passed = (adx > MIN_DIST) || (adx > MIN_DIST_FLICK && vel > MIN_VEL);
    if(!passed){ release(el); return; }

    const dir = dx < 0 ? 'next' : 'prev';
    const keys = UI.tabKeys();
    const idx = UI.currentIndex();
    const target = dir === 'next' ? idx + 1 : idx - 1;
    if(target < 0 || target >= keys.length){
      // 到边界：轻微回弹提示，不切换（REQ：不越界）
      if(el){
        // 先清掉上一次切换留下的滑动类，否则会与回弹动画叠加
        el.classList.remove('swipe-next','swipe-prev');
        el.classList.add(dir === 'next' ? 'swipe-edge-r' : 'swipe-edge-l');
        setTimeout(() => el.classList.remove('swipe-edge-r','swipe-edge-l'), 220);
      }
      release(el);
      return;
    }
    if(el){ el.style.transform = ''; el.classList.add('is-releasing'); }
    UI.goIndex(target, dir);      // 内部会 render 并播放方向性滑入动画
    if(el) setTimeout(() => el.classList.remove('is-releasing'), 60);
  }

      ['DOMS（延迟性肌肉酸痛）','练后 1-2 天才出现的酸痛，24-72 小时达峰后自行消退。它是正常适应反应，不是练坏了，也不等于「练到位了」。'],
      ['VO₂max（最大摄氧量）','身体每分钟每公斤体重能利用的最大氧气量，是心肺能力的金指标，也是最能预测长期健康的单一指标之一。'],
      ['hs-CRP（超敏C反应蛋白）','反映体内慢性炎症水平的血液指标，越低越好。与饮食结构、睡眠、训练量都有关系。'],
      ['ApoB（载脂蛋白B）','比「坏胆固醇（LDL-C）」更准的心血管风险指标，因为它数的是真正会堵血管的颗粒数量。年度体检值得加。'],
      ['HbA1c（糖化血红蛋白）','过去 2-3 个月的平均血糖水平，比单次空腹血糖更能反映长期控糖状况。'],
      ['ALT / AST','肝细胞里的两种酶，肝细胞受损时会漏进血里导致升高。补充剂相关的肝损伤警示常看这两项。'],
      ['eGFR（估算肾小球滤过率）','肾功能的核心指标。**看它比看血肌酐更靠**——肌酐会被肌肉量和肌酸补充干扰而假性升高，eGFR 是算出来的、相对稳。'],
      ['NEAT（非运动性活动消耗）','日常走动、站立、做家务、爬楼梯消耗的热量，不含正式训练。它在一天总消耗里占比不小，也是「久坐」这件事真正扣分的地方。']

      ['ISSN（国际运动营养学会）','运动营养与补剂领域最权威的立场声明发布机构。看到「ISSN 立场声明」＝该话题的行业最高共识文件。'],
      ['EFSA / TGA','欧洲食品安全局 / 澳洲药品管理局。常出现在安全性警示里（如姜黄素摄入上限、南非醉茄肝损伤通报）。'],
      ['CALERIE / COSMOS / TAME / Nambour','这些**全大写的英文不是缩写，而是研究项目的名称**。例：CALERIE 是那个把人分两组、一组吃七五折热量的人体长期试验；Nambour 是澳洲那个做了 4.5 年的防晒与皮肤老化试验。读来源栏时把它们当「某某研究」看即可。'],
      ['ROM（关节活动幅度）','一个动作能走完的完整行程。器械训练常只在中段受力，就是在这一点上不如自由重量——拉长位那一截被省掉了。'],
      ['MPS（肌肉蛋白合成）','身体把吃进去的氨基酸组装成肌肉蛋白的过程。抗阻训练后它会升高 24-48 小时，这也是「每餐 25-40 g 蛋白、分散到 3-5 餐」的依据。'],

      ['FMS（功能动作筛查）','一套用 7 个基本动作评估动作质量的测试，常用于发现左右不对称与代偿。'],

  function glossaryPanel(){
    const total = GLOSSARY.reduce((a,g)=>a+g.items.length, 0);

      GLOSSARY.map(g=>
        '<h3 class="mt-6">'+esc(g.g)+'</h3>'+
        '<div class="grid dense">'+
          g.items.map(it=>'<div class="card"><b>'+esc(it[0])+'</b><p class="small muted mt-2">'+rich(it[1])+'</p></div>').join('')+

      ).join('')+

  }

  /* ---- 概览：1 个 hero band + 双栏内容区 ---- */
  const DAY_LABELS=['周日','周一','周二','周三','周四','周五','周六'];
  /* 今日建议：今天计划里的每个动作，基于历史 + 昨夜睡眠给自适应目标 */
  function todaySuggestPanel(){
    const labels=['周日','周一','周二','周三','周四','周五','周六'];
    const day=(Plan.get().week||{})[labels[new Date().getDay()]]||{actions:[]};
    const acts=day.actions.map(id=>Adapt.suggestion(id));
    let body;
    if(!acts.length){
      body='<p class="small muted">今天是休息日——主动恢复（八段锦 / 散步），拉伸 10 分钟，不安排抗阻。</p>';
    } else {
      body=acts.map(s=>{
        const nm=(Library.byId(s.actionId)||{}).name||'';
        return '<div class="sug-row"><b>'+esc(nm)+'</b><span class="small muted">'+esc(s.msg)+'</span></div>';
      }).join('');
    }
    return '<div class="panel"><h2>今日建议</h2><p class="small muted">基于同动作历史 + 昨夜睡眠的自适应目标（规则透明，系数在 Adapt 模块）</p>'+body+'</div>';
  }
  /* 昨夜睡眠：快捷打卡（date=今天，语义「昨夜」），是今日建议 -10% 联动的数据源 */
  function sleepPanel(){
    const latest=Body.sleepLatest();
    const rows=Body.sleepList().slice(0,3).map(s=>'<div class="small muted">'+esc(s.date)+' · '+s.hours+'h · 质量 '+s.quality+'/5</div>').join('');
    return '<div class="panel"><h2>昨夜睡眠</h2>'+
      '<div class="field-row">'+
      '<div class="field"><label for="sl_hours">时长 h</label><input id="sl_hours" type="number" step="0.5" placeholder="7.5"></div>'+
      '<div class="field"><label for="sl_q">质量 1-5</label><input id="sl_q" type="number" min="1" max="5" value="3"></div>'+
      '</div><div class="btnrow"><button class="btn sm" id="sl_save">打卡</button></div>'+
      '<div class="mt-4">'+(latest?'<span class="small muted">最近：'+esc(latest.date)+' '+latest.hours+'h</span>':'<span class="small muted">还没记录——打卡后今日建议会自动联动</span>')+(rows?'<div class="mt-2">'+rows+'</div>':'')+'</div></div>';
  }
  /* 周容量仪表：每抗阻肌群最近 7 天总组数 vs 10-20 参考带 */
  function weekVolumePanel(){
    const rows=Adapt.weekVolume();
    const max=Math.max(20,1,...rows.map(r=>r.sets));
    const bars=rows.map(r=>{
      const pct=Math.min(100,Math.round(r.sets/max*100));
      const tag=r.sets===0?'（本周未练）':(r.sets<10?'（偏少，可加 1-2 个动作）':(r.sets>20?'（偏多，注意疲劳与关节）':'（最优区间内）'));
      return '<div class="ov-mod"><div class="ov-head"><span class="ov-name">'+r.group+'</span><span class="ov-count"><b>'+r.sets+'</b> 组</span></div>'+
        '<div class="ov-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="small muted">参考带 10-20 组/周'+tag+'</div></div>';
    }).join('');
    return '<div class="panel"><h2>周容量仪表</h2><p class="small muted">最近 7 天 · 每抗阻肌群总组数（不含功法/有氧）</p>'+bars+'</div>';
  }

  function weekTable(){
    const wk=Plan.get().week; const today=new Date().getDay();
    const labels=['周日','周一','周二','周三','周四','周五','周六'];
    return '<div class="table-wrap"><table class="data"><thead><tr><th scope="col">日</th><th scope="col">类型</th><th scope="col">动作</th></tr></thead><tbody>'+
      Object.keys(wk).map((day,i)=>{
        const d=wk[day]; const t=Plan.types()[d.type]||d.type;
        const names=d.actions.map(id=>{const a=Library.byId(id);
          // 空名/未找到一律显示占位，避免出现空白 pill 或多余分隔符
          const nm=a && String(a.name||'').trim();
          return nm?`<button type="button" class="tag act-link ${Library.catCls(a.cat)}" data-open-act="${esc(id)}">${esc(nm)}</button>`
                   :'<span class="tag c0">已删</span>';
        }).join('')||'<span class="muted">休息日</span>';
        const isToday = labels[today]===day;
        return `<tr class="${isToday?'is-today':''}"><td data-label="日">${day}${isToday?' •':''}</td><td data-label="类型">${esc(t)}</td><td data-label="动作"><div class="act-tags">${names}</div></td></tr>`;
      }).join('')+'</tbody></table></div>';
  }

  /* ---- 计划制定 ---- */
  function plan(){
    const wk=Plan.get().week;
    const focus=Plan.get().focus||'';
    const focusOpts=['','胸','背','肩','臂','腿','核心'].map(f=>'<option value="'+f+'"'+(f===focus?' selected':'')+'>'+(f||'不设置')+'</option>').join('');
    const KEY={胸:'chest',背:'back',肩:'shoulder',臂:'arms',腿:'legs',核心:'core'};
    let focusN=0;
    if(focus){ Object.values(wk).forEach(d=>d.actions.forEach(id=>{ const a=Library.byId(id); if(a && Adapt.muscleOf(a)===KEY[focus]) focusN++; })); }
    app().innerHTML = `<div class="panel"><h2>训练计划制定</h2>
      <p class="muted">模板：${esc(Plan.get().template)} ｜ 薄肌模式：力量 8-15RM + 中低强度有氧。点击下方任一天可编辑动作。</p>
      <div class="field-row">
        <div class="field"><label for="planFocus">本阶段重点部位（弱项倾斜，标记 ★）</label>
        <select id="planFocus">${focusOpts}</select></div>
        <div class="field"><label>&nbsp;</label><span class="small muted">${focus?('重点：'+focus+'——本周计划中 '+focusN+' 个动作已标 ★，容量可向其倾斜 10-20%'):'设置后本周计划中该肌群动作会标 ★'}</span></div>
      </div>
      <details class="fold mt-4"><summary>训练前热身 5 分钟（动态优先，不做静态拉伸）</summary>
        <div class="fold-body"><ul class="tip-list">
          <li>猫牛式 ×8（胸椎活动度）</li><li>肩绕环 前 10 + 后 10</li><li>髋绕环 ×8/侧</li>
          <li>弓步转体 ×6/侧（髋屈肌+胸椎）</li><li>臀桥 ×10（臀肌唤起）</li><li>靠墙踝背屈 ×10/侧（踝活动度）</li>
          <li>开合跳 ×20（心率提升）</li><li>徒手深蹲 ×8（模式激活）</li>
          <li class="muted">当天训练部位对应项加做一组；力量正式组前再用 50% 重量做 1 组热身组。</li>
        </ul></div>
      </details>
      <div class="grid">${Object.keys(wk).map(day=>dayCard(day)).join('')}</div>
    </div>`;
    $('#planFocus').onchange=e=>{
      const v=e.target.value;
      Store.set(d=>{ d.plan.focus=v; });
      toast(v?('本阶段重点已设：'+v):'已取消重点','ok'); render();
    };
  }
  function dayCard(day){
    const d=Plan.get().week[day]; const t=Plan.types()[d.type]||d.type;
    const focus=(Plan.get().focus||''); const KEY={胸:'chest',背:'back',肩:'shoulder',臂:'arms',腿:'legs',核心:'core'};
    const acts=d.actions.map(id=>{const a=Library.byId(id);
      if(!a) return '<span class="tag c0">已删</span>';
      const star=(focus && Adapt.muscleOf(a)===KEY[focus])?'★ ':'';
      return `<button type="button" class="tag act-link ${Library.catCls(a.cat)}" data-open-act="${esc(id)}">${star}${esc(a.name)}</button>`;
    }).join(' ');
    return `<div class="card">
      <div class="row between"><b>${esc(day)}</b><span class="pill">${esc(t)}</span></div>
      <div class="mt-4">${acts||'<span class="muted">休息日</span>'}</div>
      <button class="btn ghost sm mt-4" data-edit-day="${esc(day)}">编辑动作</button></div>`;
  }

  function dsBox(a){
    const d=DS[a.id], e=DS2[a.id];
    if(!d && !e) return '';
    const sec = d && d.s.length ? '<div class="fld"><span class="fld-k anat">协同肌群</span><div class="fld-v">'+d.s.map(esc).join(' · ')+'</div></div>' : '';
    // 中文分步：数据侧用 **…** 标出要领，rich() 转成 <b> 后统一升级为 .key（琥珀加粗高亮），便于一眼抓重点
    const stp = d && d.t.length ? '<div class="fld"><span class="fld-k step">中文分步</span><div class="fld-v"><ol class="flist">'
      + d.t.map(x=>'<li>'+rich(x).replace(/<b>/g,'<b class="key">')+'</li>').join('')+'</ol></div></div>' : '';
    const ERR = ' onerror="this.closest(\'.ds-wrap\').classList.add(\'ds-off\')"';
    let media = '';
    if(d){
      media = '<div class="fld ds-wrap"><span class="fld-k anim">动画演示</span><div class="fld-v">'
        + '<img class="ds-gif" src="'+DS_SRC+d.g+'" alt="'+esc(a.name)+' 动作演示动画"'
        + ' width="180" height="180" loading="lazy" decoding="async"'+ERR+'>'
        + '<p class="ds-attr">'+DS_ATTR+' · 180×180 · 需联网</p></div></div>';
    } else if(e){
      const mk = (f,t) => '<img class="ds2-img" src="'+DS2_SRC+e.d+'/'+f+'" alt="'+esc(a.name)+' '+t+'"'
        + ' loading="lazy" decoding="async"'+ERR+'>';
      media = '<div class="fld ds-wrap"><span class="fld-k anim">动作演示</span><div class="fld-v">'
        + '<div class="ds2-row">'+mk('0.jpg','起始位')+mk('1.jpg','终末位')+'</div>'
        + '<p class="ds2-note">'+ (e.note ? esc(e.note)+' · ' : '') +'free-exercise-db（公共领域）· 需联网</p>'
        + '</div></div>';
    }
    return sec + stp + media;
  }

  // 趋势图：按容器宽度重算坐标（375px 屏不再把 11px 文字压到 4.8px）
  // 三条量纲不同（kg / % / cm），统一按「各自区间内的相对位置 0-100%」绘制，
  // 并在末点标注真实数值 + 图例给出各自区间，避免被误读为同一量纲
  const CHART_SERIES=[
    {k:'weight', label:'体重', unit:'kg', cls:'s-weight'},
    {k:'bodyfat',label:'体脂', unit:'%',  cls:'s-bodyfat'},
    {k:'waist',  label:'腰围', unit:'cm', cls:'s-waist'}
  ];
  function renderChart(){
    const box=$('#chartBox'); if(!box) return;
    const ms=Progress.list();
    if(ms.length<2){ box.innerHTML=emptyState('至少录入 2 次体测，才会生成趋势图'); return; }
    const W=Math.max(300, Math.round(box.clientWidth||0)||680), H=260;
    const padL=40,padR=12,padT=12,padB=30;
    const iw=W-padL-padR, ih=H-padT-padB, n=ms.length;
    const X=i=> n>1 ? padL+iw*i/(n-1) : padL+iw/2;
    let grid='', ylab='';
    [0,0.25,0.5,0.75,1].forEach(t=>{
      const y=padT+ih*(1-t);
      grid+='<line class="gridline" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'"/>';
      ylab+='<text class="tick" x="'+(padL-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+Math.round(t*100)+'%</text>';
    });
    let paths='', legend='';
    CHART_SERIES.forEach(s=>{
      const vals=ms.map(m=>m[s.k]).filter(v=>v!=null);
      if(!vals.length) return;
      const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), span=(max-min)||1;
      const pts=[];
      ms.forEach((m,i)=>{ if(m[s.k]==null) return;
        pts.push({x:X(i), y:padT+ih*(1-(m[s.k]-min)/span), v:m[s.k]}); });
      if(!pts.length) return;
      paths+='<polyline class="'+s.cls+'" fill="none" stroke-width="2" stroke-linejoin="round" points="'+
        pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')+'"/>';
      pts.forEach(p=>{ paths+='<circle class="'+s.cls+'" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3"/>'; });
      const last=pts[pts.length-1];
      paths+='<text class="tick val" x="'+Math.min(last.x+6,W-padR).toFixed(1)+'" y="'+(last.y+4).toFixed(1)+'" text-anchor="end">'+last.v+s.unit+'</text>';
      legend+='<span><i class="'+s.cls+'"></i>'+s.label+' '+min+' - '+max+' '+s.unit+'</span>';
    });
    const xlab=ms.map((m,i)=>'<text class="tick" x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(m.date.slice(5))+'</text>').join('');
    box.innerHTML='<div class="chart-wrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" '+
      'role="img" aria-label="体测趋势：体重 / 体脂 / 腰围，纵轴为各序列在自身区间内的相对位置">'+
      grid+ylab+
      '<line class="axis" x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+ih)+'"/>'+
      '<line class="axis" x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'"/>'+
      paths+xlab+'</svg></div>'+
      '<div class="legend">'+legend+'<span class="mut">纵轴 = 各序列在自身区间内的相对位置（0-100%）</span></div>';
  }
  function renderMetricList(){
    const ms=Progress.list();
    if(!ms.length){ $('#metricList').innerHTML=emptyState('还没有体测记录，录入后自动生成历史与趋势图'); return; }
    $('#metricList').innerHTML='<div class="table-wrap"><table class="data"><thead><tr><th scope="col">日期</th><th scope="col">体重</th><th scope="col">体脂%</th><th scope="col">腰围</th><th scope="col"></th></tr></thead><tbody>'+
