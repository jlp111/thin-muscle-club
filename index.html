.stepper:focus-within{background:var(--input-fill);box-shadow:0 0 0 var(--ring-w) var(--ring)}
/* 步进按钮是全站最高频的控件（记录页一组一对，一天按几十次）。
   原先 26×34 / 手机 30×38，宽不到 32 的触摸下限；这里按「容器多高它就多高」吃满，
   并且按下去要有反馈：底色 + 轻微 scale，走 --dur-1。 */
.stepper .st{flex:0 0 auto;width:34px;height:var(--h-ctrl);border:0;background:transparent;
  color:var(--txt-3);font-size:16px;line-height:1;font-weight:var(--fw-m);
  -webkit-tap-highlight-color:transparent;cursor:pointer;
  transition:background-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std),transform var(--dur-1) var(--ease-out)}
.stepper .st:active{background:var(--surface-3);color:var(--txt-1);transform:scale(0.92)}
.stepper input{flex:1 1 0;min-width:0;width:100%;height:var(--h-ctrl);border:0;background:transparent;
  text-align:center;font-size:var(--fs-md);font-weight:var(--fw-sb);
  font-variant-numeric:tabular-nums;padding:0}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* 嵌套控件（.input-unit / .stepper）里的输入框只是"格"，不描边：外框由容器独家承担。
   组件规则 (0,1,1) 会让内层再长出 1px 边框 + 圆角 —— 视觉上就是"框里套框"。
   这里用 (0,2,1) 统一关掉，三套主题结构一致，只剩一层外框。 */
html[data-theme] .input-unit>input,
html[data-theme] .stepper>input{border:0;border-radius:0;background:transparent;box-shadow:none}
/* 单位紧跟数字：两列单位不同（kg / 次）时，只在卡头挂一个 pill 分不清哪列是哪列。
   9.5px 灰字、不抢点击（pointer-events:none），单位本身不加宽步进器。 */
.stepper .u{flex:0 0 auto;padding:0 5px 0 1px;font-size:9.5px;line-height:1;
  color:var(--txt-3);letter-spacing:.02em;pointer-events:none;user-select:none}
@media (max-width:374px){.stepper .u{font-size:9px}}
/* 320 宽下每列只有 ~93px，两只 32px 按钮已经吃掉 64px；单位再挤进去，
   数字区会塌到 21px（连 22.5 都放不下）。改成「数字在上、单位在下」的
   两行网格：按钮跨两行保持 ≥32px 触控，水平方向一点不让。 */
@media (max-width:374px){
  .stepper{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;
    grid-template-rows:auto auto;align-items:center}
  .stepper .st:first-child{grid-column:1;grid-row:1 / span 2;height:100%}
  .stepper .st:last-child {grid-column:3;grid-row:1 / span 2;height:100%}
  .stepper input{grid-column:2;grid-row:1;min-width:0;width:100%}
  .stepper .u{grid-column:2;grid-row:2;text-align:center;padding:0 0 3px}
}

/* 完成勾选：未完成是空心环，完成是实心绿环 —— 训练中一眼看到还剩几组 */
.chk{width:30px;height:30px;margin:0 auto;border-radius:50%;
  border:1.5px solid var(--line-3);background:transparent;color:transparent;
  font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.chk.on{background:transparent;border-color:var(--st-ok);color:var(--st-ok)}
/* ---------- 全站按压语法（触屏无 hover，"按到了"只能靠 :active 表达） ----------
   小控件 scale(.96)、整块 .food-opt scale(.995)，一律 --dur-1 + ease-out，只动 transform。
   与 .btn 的下沉(translateY 1px)同族：小控件用缩放，主按钮保留既有下沉。
   reduced-motion 下关掉位移，只留颜色反馈。 */
.pill:active,.chk:active,.wmore:active,.seg-btn:active,.ov-name-btn:active,.ov-add-btn:active,
.toc-item:active,.tag:active{transform:scale(.96)}
.food-opt:active{transform:scale(.995)}
@media (prefers-reduced-motion:reduce){
  .pill:active,.chk:active,.wmore:active,.seg-btn:active,.ov-name-btn:active,.ov-add-btn:active,
  .toc-item:active,.tag.act-link:active,.food-opt:active{transform:none}}

@media (max-width:767px){
  .act{padding:var(--sp-4) 0 2px}
  .act-top b{font-size:var(--fs-md)}
  /* 手机端步进器吃满 44px 触摸档（--h-ctrl 在 pointer:coarse 下就是 44）：
     原先 30×38 宽不过 32 下限，是全系统最该修的热区。勾选环同步放大，末列跟着让位。 */
  .stepper .st{width:44px;font-size:18px}
  .chk{width:40px;height:40px;font-size:15px}
  .sr-head,.sr{grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) 44px;justify-content:stretch}}

/* ---------- 记录页：周条 + 分段动作进度 ---------- */
/* 一周 7 天：圆形星期芯片 + 下方日期数字，今天显示「今」。
   左右滑动切周（±4 周）。手势必须用 data-no-swipe 从 SwipeTab 手里隔出来，
   否则横滑会被判成「切到别的页面」，而不是「切到上一周」。 */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
  margin:0 0 var(--sp-3);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:4px 0 2px;border:0;background:transparent;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform var(--dur-1) var(--ease-out)}
/* 圆随列宽自适应（列宽在 390 下约 51px、320 下约 40px）：
   写死 px 要么在窄屏溢出，要么在大屏显得空。上限 46px 保持和参考图一样的「几乎撑满列」，
   320 下自然收到 36px，仍大于 32 的触摸下限。 */
.wday .wc{display:flex;align-items:center;justify-content:center;
  width:calc(100% - 4px);max-width:46px;aspect-ratio:1;border-radius:50%;border:1px solid var(--line-2);
  background:var(--surface-1);color:var(--txt-2);font-size:var(--fs-sm);line-height:1;
  transition:background-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std),
             border-color var(--dur-1) var(--ease-std)}
.wday .dn{font-size:var(--fs-xs);color:var(--txt-3);line-height:1.2;
  font-variant-numeric:tabular-nums;transition:color var(--dur-1) var(--ease-std)}
.wday .dot{width:3px;height:3px;border-radius:50%;background:transparent}
.wday .dot.on{background:var(--st-ok)}
.wday.is-sel .wc{background:var(--accent);border-color:var(--accent);color:var(--txt-inv);font-weight:var(--fw-sb)}
.wday.is-sel .dn{color:var(--txt-1);font-weight:var(--fw-sb)}
.wday:active{transform:scale(.96)}
@media (hover:hover){ .wday:hover .wc{color:var(--txt-1);border-color:var(--line-3)} }
.wstrip.enter-l{animation:wsInL var(--dur-2) var(--ease-out) both}
.wstrip.enter-r{animation:wsInR var(--dur-2) var(--ease-out) both}
@keyframes wsInL{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes wsInR{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.wstrip.bump-l{animation:wsBumpL var(--dur-1) var(--ease-out)}
.wstrip.bump-r{animation:wsBumpR var(--dur-1) var(--ease-out)}
@keyframes wsBumpL{50%{transform:translateX(-6px)}}
@keyframes wsBumpR{50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){
  .wstrip.enter-l,.wstrip.enter-r,.wstrip.bump-l,.wstrip.bump-r{animation:none}
  .wday,.wday .wc,.wday .dn{transition:none}
}
.wmore{border:0;background:transparent;color:var(--txt-3);font-size:var(--fs-xs);
  padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
/* 保留原生控件给读屏与「其他日期」用，但视觉上不占位 */
.vhide{position:absolute;width:1px;height:1px;overflow:hidden;
  clip-path:inset(50%);opacity:0;pointer-events:none}

.aprog{display:flex;align-items:center;gap:var(--sp-3);margin:2px 0 var(--sp-3)}
.ap-t{font-size:var(--fs-xs);color:var(--txt-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.ap-t b{color:var(--txt-2);font-weight:var(--fw-sb)}
.ap-bars{flex:1 1 auto;display:flex;gap:3px;min-width:0}
.ap-bars i{flex:1 1 0;height:3px;border-radius:2px;background:var(--line-2);min-width:6px}
/* 默认全勾时不该有一排装饰线：点亮 = 「这个动作有组被取消了」，
   颜色用 warn 而不是 ok —— 它提示的是缺口，不是成就。 */
.ap-bars i.gap{background:var(--st-warn)}
/* 全勾时这条轨没有任何信息，但用 visibility 而不是 display 隐藏：
   保留高度，切换时不会让「已勾」那一行跳动（手指就在下面几行）。 */
.aprog.all-ok .ap-bars{visibility:hidden}

/* ---------- 进度页：坚持热力图 ---------- */
.cons-top{display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.cons-top b{font-size:var(--fs-lg);font-weight:var(--fw-b)}
.cons-top em{font-style:normal;color:var(--st-ok);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:12px;
  grid-template-rows:repeat(7,12px);gap:3px;justify-content:start}
.heat .hc{display:block;width:12px;height:12px;border-radius:2px;background:var(--line-2)}
.heat .hc.on{background:var(--st-ok)}
.heat .hc.fut{opacity:.35}
.heat-lg{display:flex;align-items:center;justify-content:flex-end;gap:4px;
  margin-top:var(--sp-2);font-size:12px;color:var(--txt-3)}
.heat-lg .hc{display:block;width:10px;height:10px;border-radius:2px;background:var(--line-2)}
.heat-lg .hc.on{background:var(--st-ok)}

/* ---------- 人体图（路径为 MIT 资产，见 BodyMap 模块注释） ---------- */
.bodymap{display:block;height:auto}
.bm-sm{height:72px;width:auto;flex:0 0 auto}
.bm-lg{height:230px;width:auto}
.bm-base path{fill:var(--surface-2);stroke:var(--line-3);stroke-width:2.5;
  vector-effect:non-scaling-stroke}
.bm-muscles path{fill:var(--accent);stroke:none}
/* 四级对比度要拉得开：未强调的肌群几乎融进底色，1..3 级逐级加深 */
.bm-muscles .l0{fill:var(--line-1);fill-opacity:1}
.bm-muscles .l1{fill-opacity:.45}
.bm-muscles .l2{fill-opacity:.75}
.bm-muscles .l3{fill-opacity:1}
.bmwrap{display:flex;justify-content:center;padding:var(--sp-3) 0 var(--sp-2)}
.bm-note{text-align:center;margin-top:0}
/* 分段控件 */
.seg{display:inline-flex;gap:2px;padding:2px;margin-bottom:var(--sp-4);
  border:1px solid var(--line-2);border-radius:var(--r-full);background:var(--surface-2)}
/* 三档切换原先实测 72×26px，低于触摸下限；吃满 44 档并给按压/选中过渡 */
@media (pointer:coarse){ .seg-btn{min-height:44px} }
.seg-btn{border:0;background:transparent;color:var(--txt-3);font-size:var(--fs-xs);
  padding:5px 12px;border-radius:var(--r-full);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
/* 选中态不用投影表达（投影会把它变成一枚「凸起的小按钮」）。
   底色 + 字重已足够区分，且各主题观感一致。 */
.seg-btn.on{background:var(--surface-1);color:var(--txt-1);font-weight:var(--fw-sb)}

/* ---------- 主题选择菜单（替代盲循环） ---------- */
/* ---------- 日期选择面板（自绘日历） --------------------------------------
   原生 <input type=date> 在 Chrome / iOS / Android 是三套完全不同的长相与
   交互，而本系统的五个日期字段只做一件事：选一个月内的某一天。原生控件一
   打开就占掉半屏，且无法与四套主题统一。
   面板只做两件事——读 el.value 当初值、选完写回 el.value 并派发 change。
   所以数据绑定（记录页的 applyDay、各表单保存时读值）与校验逻辑一行都不用改。 */
.dp{position:fixed;z-index:var(--z-modal);width:min(336px,calc(100vw - 24px));
  padding:var(--sp-3);background:var(--surface-1);border:1px solid var(--line-2);
  border-radius:var(--r-md);box-shadow:var(--shadow-3)}
.dp-hd{display:flex;align-items:center;gap:2px;margin:0 0 var(--sp-2)}
.dp-nav{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--txt-3);font:inherit;font-size:17px;line-height:1;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
.dp-t{flex:1 1 auto;min-width:0;height:34px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--txt-1);font:inherit;font-size:var(--fs-sm);
  font-weight:var(--fw-sb);cursor:pointer;font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-3{grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-top:var(--sp-2)}
.dp-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:0 0 2px}
.dp-wd span{text-align:center;font-size:var(--fs-xs);color:var(--txt-3);line-height:1.6}
.dp-d{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;
  border:0;border-radius:var(--r-sm);background:transparent;color:var(--txt-2);
  font:inherit;font-size:var(--fs-sm);cursor:pointer;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
  transition:background-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
.dp-d.is-out{color:var(--txt-3);opacity:.5}
.dp-d.is-today{color:var(--accent);font-weight:var(--fw-sb)}
.dp-d[aria-selected="true"]{background:var(--accent);color:var(--txt-inv);font-weight:var(--fw-sb)}
.dp-m{display:flex;align-items:center;justify-content:center;min-height:44px;
  border:1px solid transparent;border-radius:var(--r-sm);background:transparent;
  color:var(--txt-2);font:inherit;font-size:var(--fs-sm);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
.dp-m[aria-selected="true"]{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--accent)}
.dp-ft{display:flex;justify-content:flex-end;margin-top:var(--sp-2);padding-top:var(--sp-2);
  border-top:1px solid var(--line-2)}
.dp-today{height:32px;padding:0 var(--sp-5);border:1px solid var(--line-2);
  border-radius:var(--r-full);background:transparent;color:var(--txt-2);
  font:inherit;font-size:var(--fs-xs);cursor:pointer;-webkit-tap-highlight-color:transparent}
@media (hover:hover){
  .dp-nav:hover,.dp-t:hover,.dp-today:hover{background:var(--surface-2);color:var(--txt-1)}
  .dp-d:hover:not([aria-selected="true"]){background:var(--surface-2);color:var(--txt-1)}
  .dp-m:hover:not([aria-selected="true"]){background:var(--surface-2);color:var(--txt-1)}
}
@media (pointer:coarse){
  .dp-nav{width:44px;height:44px}
  .dp-t{height:44px}
  .dp-today{height:40px}
}
.dp-nav:focus-visible,.dp-t:focus-visible,.dp-d:focus-visible,.dp-m:focus-visible,.dp-today:focus-visible{
  outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}

.theme-menu{position:fixed;z-index:var(--z-toast);min-width:168px;padding:6px;
  background:var(--surface-1);border:1px solid var(--line-2);border-radius:var(--r-md);
  box-shadow:var(--shadow-3)}
.theme-menu button{display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;border:0;background:transparent;border-radius:var(--r-sm);
  color:var(--txt-2);font:inherit;font-size:var(--fs-sm);text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
@media (hover:hover){
.theme-menu button:hover{background:var(--surface-2);color:var(--txt-1)}}
.theme-menu button.on{color:var(--txt-1);font-weight:var(--fw-sb)}
.theme-menu .sw{flex:0 0 auto;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--accent);background:var(--surface-2)}

/* ---------- 主题切换：压制过渡 ----------
   全局把 box-shadow / border-color / background-color 放进了 transition。
   切主题时这些属性会从旧主题的值开始过渡，而 Chrome 在「过渡到 none / 换色」
   这一档会让它们停在**旧值**上不再更新（实测：切主题后卡片长期带着上一套的阴影
   与深边框；把该元素的 transition
   置空后才立刻落定）。
   所以切换的这两帧里彻底关掉过渡，让新主题的值一步落定。 */
html.theming, html.theming *,
html.theming *::before, html.theming *::after{transition:none !important}

/* ---------- 桌面端表单栅格 ----------
   一行摊到 1182px 会把 3 列拉成 388px，而控件又封顶 240px → 中间空 150px、右缘对不齐。
   这里把行宽收到 640px（与记录页 .act 的取值一致）并放开各类型上限，
   让每列等宽、左右边缘一致。移动端的 96px 栅格在下面这条 min-width 查询里不生效。 */
@media (min-width:768px){
  .field-row{max-width:640px}
  input[type=time],input[type=date],input[type=month],input[type=week],
  input[type=number]{max-width:none}
  /* 含日期的行按剩余项数选 3 列或 2 列，两种都能整除、不留半行 */
  .field-row.has-wide[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  .field-row.has-wide[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ===================== v3.37 · 五项底栏与二级页 =====================
 * 底栏从 13 项横滑收成 5 项：手机上 13 项同时只看得到 4-5 个，
 * 其余 8 个模块等于藏在横向盲区里。二级页顶部给一条返回，指回所属一级页。
 * ================================================================== */
/* 五项等分居中。
 * 必须用 body.is-mobile .mobile-nav .nav-scroll 这一串：上方 @media 里的
 * body.is-mobile .nav-scroll{display:flex} 权重 (0,2,1)，只用 (0,2,0) 压不过它，
 * 结果是 5 个按钮按 min-width:56px 定宽、从左边 8px 排到 296px，右侧空出 94px。
 * 同时撤掉横滑时代的两端渐隐遮罩：五项铺满整栏时，遮罩会把首尾两项的边缘吃掉。 */
body.is-mobile .mobile-nav .nav-scroll{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
  overflow:visible;-webkit-mask-image:none;mask-image:none;scroll-snap-type:none;
}
body.is-mobile .mobile-nav .nav-scroll button{
  flex:none;min-width:0;width:100%;padding:0 2px;scroll-snap-align:none;
}
.mnav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:46px;padding:5px 0 3px;border:0;border-radius:12px;background:transparent;
  color:var(--txt-3);font-family:var(--ff);font-size:11px;font-weight:600;line-height:1}
.mnav .nic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mnav.active{color:var(--accent);background:var(--accent-bg)}
.mnav.active .nic{stroke:var(--accent)}
#tabs .tab .nic{width:15px;height:15px;margin-right:6px;vertical-align:-2px;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs .tab{display:inline-flex;align-items:center}
#tabs .nav-glabel:empty{display:none}

.subbar{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.subback{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 10px 0 6px;border-radius:999px;
  border:1px solid var(--line-2);background:transparent;color:var(--txt-2);
  font-family:var(--ff);font-size:12px;font-weight:600}
.subback .backic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subback:active{background:var(--surface-2)}
.subbar .sub-t{font-size:12px;color:var(--txt-3)}

.rowlink{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;
  border-bottom:1px solid var(--line-1);background:none;text-align:left;color:var(--txt-1);font-family:inherit}
.rowlink:last-child{border-bottom:0}
.rowlink:active{background:var(--surface-2)}
.rowlink-ic{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--surface-2);
  display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--accent)}
.rowlink-tx{flex:1;min-width:0}
.rowlink-tx b{display:block;font-size:14px;font-weight:600}
.rowlink-tx span{display:block;margin-top:2px;font-size:11.5px;color:var(--txt-3)}
.rowlink-go{color:var(--txt-3);font-size:16px;line-height:1}

.me-hd{display:flex;align-items:center;gap:12px}
.me-av{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--txt-inv);
  display:grid;place-items:center;font-size:19px;font-weight:700}
.me-id b{display:block;font-size:17px;font-weight:600}
.me-id span{display:block;margin-top:2px;font-size:11.5px;color:var(--txt-3)}
.me-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.me-k>div{background:var(--surface-2);border-radius:12px;padding:9px 10px}
.me-k span{display:block;font-size:11px;color:var(--txt-3)}
.me-k b{display:block;margin-top:3px;font-size:16px;font-variant-numeric:tabular-nums}

/* ===================== v3.37 · 今日英雄卡 =====================
 * 深色渐变玻璃换成酸柠实底：一眼看到「今天练什么」与完成度。
 * 颜色全走 --accent / --txt-inv，三套主题自动跟着变。
 * ============================================================== */
.hv{background:var(--accent);color:var(--txt-inv);border-radius:24px;padding:15px 16px 13px}
.hv-top{display:flex;align-items:center;gap:12px}
.hv-ic{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.10);display:grid;place-items:center}
.hv-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hv-tx{flex:1;min-width:0}
.hv-greet{margin:0;font-size:11.5px;font-weight:600;opacity:.62}
.hv-day{margin:2px 0 0;font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.02em;color:inherit}
.hv-sub{margin:3px 0 0;font-size:11.5px;font-weight:600;opacity:.66}
/* v4.2：删除右上角「0/4」圆环。它没有标签、没有 aria-label，分母固定 4 又不说明
   是哪 4 项，而下方四枚胶囊已经是同一份数据（还能点、能看差哪项）——同一数据
   在一张卡里呈现两遍，且 a/b 这种形状在本 App 里正被记录页的「组」占用，
   极易被读成「4 组做了 0 组」。完成度交给胶囊自身的实底 + ✓。
   右上角改放连续训练天数：不重复任何现有信息，且是「今天要不要练」的动机锚点。 */
.hv-streak{flex:0 0 auto;text-align:center;padding:4px 8px 5px;border-radius:12px;
  background:rgba(0,0,0,.10);line-height:1.1}
.hv-streak b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.hv-streak span{display:block;margin-top:1px;font-size:9.5px;font-weight:600;opacity:.8}
.hv-cta{margin-top:12px;width:100%;height:44px;border:0;border-radius:999px;background:var(--txt-inv);color:var(--accent);
  font-family:var(--ff);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.hv-cta svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hv-cta:active{transform:scale(.99)}
.hv-chips{display:flex;gap:6px;margin-top:10px}
.hv-chips button,.hv-chips span{flex:1;text-align:center;font-size:11px;font-weight:600;padding:6px 0;border-radius:999px;
  border:0;font-family:var(--ff);background:rgba(0,0,0,.10);color:rgba(0,0,0,.74);
  min-height:34px;display:flex;align-items:center;justify-content:center;gap:3px;line-height:1}
.hv-chips i{font-style:normal;font-weight:800;font-size:10px;opacity:.9}
.hv-chips button:active{background:rgba(0,0,0,.18)}
.hv-chips .on{background:rgba(0,0,0,.9);color:var(--accent)}
.hv-stats{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}

/* ===================== v3.38 · 养护页内勾选 =====================
 * 五个模块共用一套结构：标题行（图标 / 名称 / 当日计数 / 进详情）+ 条目勾选行。
 * 勾选圆环用「描边环 → 实心酸柠」表达完成，与全站唯一的动作色保持一致。
 * ============================================================== */
.care-sum{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding:12px 14px 13px;
  border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line-1)}
.care-sum-hd{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;color:var(--txt-2)}
.care-sum-hd b{font-size:13px;color:var(--txt-1);font-variant-numeric:tabular-nums}
.care-sum-hd b i{font-style:normal}
.care-sum-hd b em{font-style:normal;margin-left:6px;font-size:11.5px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.care-bar{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.care-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width var(--dur-2) var(--ease-std)}

.care-sec{margin-top:10px}
.care-sec .care-hd{display:flex;align-items:center;gap:12px;padding:2px 0 10px;border-bottom:1px solid var(--line-1)}
.care-ic{flex:0 0 auto;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface-3);color:var(--txt-2);font-size:12px;font-weight:var(--fw-b);letter-spacing:0}
.care-tt{flex:1;min-width:0}
.care-tt b{display:block;font-size:14px;font-weight:var(--fw-b);color:var(--txt-1);line-height:1.25}
.care-tt span{display:block;margin-top:1px;font-size:11.5px;color:var(--txt-3);line-height:1.35}
.care-n{flex:0 0 auto;font-size:11.5px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.care-n b{font-size:13px;color:var(--txt-1)}
.care-more{position:relative;flex:0 0 auto;width:30px;height:30px;margin-left:-2px;border:0;border-radius:50%;
  background:transparent;color:var(--txt-3);font-size:17px;line-height:1;
  font-family:var(--ff);display:grid;place-items:center}
.care-more::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.care-more:active{background:var(--surface-3)}

.care-list{display:flex;flex-direction:column}
.care-row{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:9px 0;
  border:0;border-bottom:1px solid var(--line-1);background:none;text-align:left;
  color:var(--txt-2);font-family:inherit;font-size:13px;line-height:1.45}
.care-row:last-child{border-bottom:0}
.care-row:active{background:var(--surface-2)}
.care-tick{position:relative;flex:0 0 auto;width:21px;height:21px;border-radius:50%;
  box-shadow:inset 0 0 0 1.6px var(--line-3);transition:background-color var(--dur-1) var(--ease-std),box-shadow var(--dur-1) var(--ease-std)}
.care-tick::after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:solid var(--txt-inv);border-width:0 2px 2px 0;transform:rotate(43deg) scale(.7);
  opacity:0;transition:opacity var(--dur-1) var(--ease-std)}
.care-row.on{color:var(--txt-1)}
.care-row.on .care-tick{background:var(--accent);box-shadow:none}
.care-row.on .care-tick::after{opacity:1}
.care-row.on .care-lb{color:var(--txt-3)}
.care-lb{flex:1;min-width:0}
.care-empty{margin:0;padding:12px 0;font-size:12px;color:var(--txt-3)}
.care-note{margin:10px 0 0;line-height:1.6}
.care-allbtn{position:relative;margin-top:10px;height:36px;border-radius:999px;border:1px solid var(--line-2);
  background:transparent;color:var(--txt-2);font-family:var(--ff);font-size:12.5px;font-weight:600}
.care-allbtn::after{content:"";position:absolute;inset:-4px;border-radius:999px}
.care-allbtn:active{background:var(--surface-3)}

/* ---- v3.39 概览瘦身：英雄卡下方一行事实 + 今日安排清单 ---- */
.hv-meta{display:flex;gap:16px;margin-top:10px;padding:0 2px;font-size:11.5px;color:var(--txt-3)}

/* ===== v4.0 设计系统（注入块，勿手改：编辑 design-demos/v40/system.css）===== */
/* =====================================================================
 * v4.0 统一设计系统（覆盖层）
 *
 * 目的：不改业务逻辑，只统一外观。原则四条——
 *   1) 酸柠只给「当前」与「每屏一个主按钮」，重复列表里不再出现实心主按钮。
 *   2) 卡片一律扁平实底 + 发丝描边，去掉渐变与投影叠出来的灰雾。
 *   3) 字阶收敛：页标题 19 / 小节 15 / 正文 14 / 辅助 12.5 / 元信息 11.5。
 *   4) 间距只用 4 的倍数：4 / 8 / 12 / 16 / 20 / 24。
 * ===================================================================== */

/* ---------- 1. 令牌修正 ---------- */
:root{
  /* h3 原来 24px，比页标题 20 还大，小节标题反客为主 */
  --fs-h3:15px; --lh-h3:1.5;
  /* 焦点环原来停留在靛蓝（--ring:#9ba3f8），与酸柠主题不符 */
  --ring:var(--accent);
  /* 输入区从「近黑凹槽」改成「比所在面板浅半档的实底」，可输入区域一眼可辨，
     描边仍保持透明（门禁要求可见控件 0 条不透明描边）。 */
  --input-fill:var(--surface-2);
  --input-fill-hover:var(--surface-3);
}

/* ---------- 2. 面板与卡片：扁平、统一圆角与内距 ---------- */
.panel{
  background:var(--surface-1);
  border:1px solid var(--line-1);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:none;
}
.panel>h2{
  font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.3;
  margin:0 0 10px;color:var(--txt-1);
}
.panel>h2 + .small,
.panel>h2 + .muted{margin-top:-4px}
.panel h3{font-size:15px;font-weight:600;letter-spacing:0;line-height:1.5}

.card{
  background:var(--surface-2);
  border:1px solid var(--line-1);
  border-radius:14px;
  padding:14px;
  box-shadow:none;
}
/* 卡片之间的默认节奏：原来是各处手写 mt-4/5/6/7，统一成 12px */
.card + .card{margin-top:12px}

/* 次级说明文字：统一 12.5px、行高 1.65，避免同一页里 11/12/13 混用 */
.panel > p.small,
.card > p.small,
.small.muted{font-size:12.5px;line-height:1.65}

/* ---------- 3. 按钮：主按钮每屏一个，其余一律次级 ---------- */
.btn{border-radius:12px;font-weight:600}
.btn.ghost{
  background:transparent;color:var(--txt-2);
  border:1px solid var(--line-2);box-shadow:none;
}
.btn.ghost:hover{color:var(--txt-1);border-color:var(--line-3)}
.btn.danger{box-shadow:none}
/* 列表里的重复动作（加入清单 / 展开 / 编辑）一律小一号、弱一档 */
.btn.sm{height:34px;padding:0 12px;font-size:12.5px}

/* ---------- 4. 表单 ---------- */
input,select,textarea{
  height:44px;border-radius:12px;
  border:1px solid transparent;           /* 保持透明：改的是填充，不是描边 */
  background:var(--input-fill);
}
textarea{height:auto;min-height:96px;line-height:1.7;padding-top:10px}
.field > label,
.field-label,
label.meal-num-k{font-size:12px;color:var(--txt-3);font-weight:400}
.field-row{gap:12px}
.field-row + .field-row{margin-top:12px}
.input-unit{border-radius:12px}
/* 实测：输入框填充与面板只有 1.06–1.11:1，几乎看不出「这里能输入」。
   补一圈 --line-2 的 inset 发丝线，几何不变（仍是 1px 透明 border），
   只在视觉上把可编辑区从面板里「拎出来」。 */
input:not([type=checkbox]):not([type=radio]),
select,textarea,.stepper,.input-unit{box-shadow:inset 0 0 0 1px var(--line-2)}
input:not([type=checkbox]):not([type=radio]):focus,
select:focus,textarea:focus,
.stepper:focus-within,.input-unit:focus-within{
  box-shadow:inset 0 0 0 1px var(--line-2),0 0 0 var(--ring-w) var(--ring);
}
input[type=checkbox],input[type=radio]{box-shadow:none}

/* ---------- 5. 标签 / 胶囊 ---------- */
.tag{border-radius:999px;font-size:11px;line-height:1.4;padding:3px 8px;font-weight:400}
.pill{border-radius:999px}
.chip{border-radius:999px}

/* ---------- 6. 表格 ---------- */
table.data{font-size:12.5px}
table.data th{
  font-size:11.5px;font-weight:400;color:var(--txt-3);
  border-bottom:1px solid var(--line-2);
}
table.data td{border-bottom:1px solid var(--line-1);padding:10px 8px}
table.data tr:last-child td{border-bottom:0}

/* ---------- 7. 知识库卡片（补剂/中医/松解/抗衰/护肤）----------
   原来每张开到底都是一整条实心主按钮，一屏出现 6 次酸柠，主按钮失去意义。 */
.kb-card-btn,
.card .kb-toggle{
  display:inline-flex;height:32px;padding:0 12px;font-size:12px;
  border-radius:999px;border:1px solid var(--line-2);
  background:transparent;color:var(--txt-2);box-shadow:none;
}
.card .kb-toggle:hover{border-color:var(--accent-bd);color:var(--txt-1)}
.card .kb-toggle.is-in{border-color:var(--accent-bd);color:var(--accent)}
.card .lead{font-size:13px;line-height:1.7;color:var(--txt-2)}
.kb-group > summary{font-size:13px}

/* ---------- 8. 行内列表（我的 / 养护 等）---------- */
.rowlink{min-height:52px;padding:12px 0;gap:12px}
.rowlink:last-child{border-bottom:0}
.rowlink-tx b{font-size:14px;font-weight:600}
.rowlink-tx span{font-size:12px;color:var(--txt-3);line-height:1.5}
.rowlink-ic{border-radius:11px}

/* 二级页返回是每页第一个动作，30px 低于 32px 的触控下限，抬到 34。 */
.subback{height:34px}

/* 「我的」头像区：编辑入口靠右，名字过长时先压缩名字，不挤按钮。 */
.me-id{flex:1;min-width:0}
.me-id b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-edit{margin-left:auto;flex:0 0 auto}
.me-meta{margin:10px 0 0;font-size:12px;line-height:1.6;text-wrap:pretty}
.me-derive{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.me-derive>div{background:var(--surface-2);border-radius:12px;padding:9px 10px;min-width:0}
.me-derive span{display:block;font-size:10.5px;color:var(--txt-3)}
.me-derive b{display:block;margin-top:2px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.me-derive b small{font-size:9.5px;font-weight:500;color:var(--txt-3);margin-left:2px}

/* 个人资料抽屉：表单一屏放不下时只滚表单，标题与关闭键固定。 */
.sheet-form{max-height:86dvh}
.profile-form{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 2px 2px 0}
.profile-form>.field:first-child{margin-top:12px}
.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.profile-note{margin:10px 0 4px;line-height:1.6}
/* 自定义目标的输入框平时不占位；用 [hidden] 显式兜底，免得被 .field input 的 display 规则顶掉 */
#pf_goal_custom{margin-top:8px}
#pf_goal_custom[hidden]{display:none}
.profile-actions{margin-top:4px}
/* 动作区固定在抽屉底部，不跟表单一起滚：
   短屏（或地址栏占位）时「保存资料」曾落在可视区最下沿——手指点在那儿等于点在浏览器
   工具栏/手势区上，表现为「点了没反应」。固定之后，无论字段多少它都在同一位置。 */
.sheet-foot{flex:0 0 auto;margin-top:8px;padding-top:10px;border-top:1px solid var(--line-1);
  background:var(--surface-1)}
.sheet-foot .field-err{margin:0 0 6px}
.sheet-foot .btnrow{margin-top:0}

/* ---------- 9. 空状态 / 异常状态 ---------- */
.empty-state,
.es{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:28px 16px;text-align:center;color:var(--txt-3);font-size:12.5px;line-height:1.7;
  border:1px dashed var(--line-2);border-radius:14px;background:transparent;
}
.empty-state .btn,
.es .btn{margin-top:2px}

/* ---------- 10. 弹窗 ---------- */
.modal{border-radius:16px;box-shadow:none;background:var(--surface-1);border:1px solid var(--line-2)}
.modal-msg{font-size:14px;line-height:1.75}

/* 抽屉：用 dvh 跟随地址栏收放；键盘弹起时不会把「填入这一餐」顶出屏幕。
   背景滚动由 html.sheet-open 锁住，抽屉内部单独滚动并阻止滚动链。 */
html.sheet-open,html.sheet-open body,html.tp-open,html.tp-open body{overflow:hidden}
.sheet{max-height:84dvh;overscroll-behavior:contain}
/* 时间面板（showPicker 不可用时的兜底）：两个原生 select + 常用时间快选 */
.tp-grid{display:flex;align-items:end;gap:10px;margin:14px 0 12px}
.tp-grid label{flex:1;min-width:0;font-size:11px;color:var(--txt-3);font-weight:600}
.tp-grid select{display:block;width:100%;margin-top:4px}
.tp-colon{padding-bottom:8px;font-size:18px;font-weight:700;color:var(--txt-3)}
.tp-quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tp-quick .tag{min-height:34px;display:inline-flex;align-items:center;padding:0 10px}
.tp-quick .tag:active{transform:scale(.96)}
.sheet-list{overscroll-behavior:contain}
.sheet-x{width:40px;height:40px}
.sheet-add{height:44px}

/* ---------- 11. 顶部说明条：各页开头的长段说明统一收紧 ---------- */
.panel > p.muted:first-of-type{font-size:12.5px;line-height:1.7;color:var(--txt-3)}
.note-fold > summary{font-size:12px}
.note-fold .small{font-size:12.5px;line-height:1.75}
.tip-list{font-size:12.5px;line-height:1.8}
.tip-list li + li{margin-top:6px}

/* ---------- 12. 底部导航（保持 v3.38 的等分，不再改结构）---------- */
.mnav{font-size:11px;font-weight:600}
.mnav .nic{width:20px;height:20px}

/* ---------- 13. 图表 ---------- */
.chart .tick{font-size:10.5px;fill:var(--txt-3)}
.legend{font-size:11.5px;color:var(--txt-3)}

/* ---------- 13b. 数字高亮去盒 ----------
   .hl 原来给每个数字套一层酸柠底 + 一圈描边，知识库页一屏能出现 20 次。
   数字的可扫读性靠「比正文亮一档 + 等宽数字」就够了，不需要底色。 */
.hl{background:transparent;color:var(--txt-1);border-radius:0;padding:0;box-shadow:none;font-weight:600}
/* 线性图标统一规格（与底栏一致） */
.ui-ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.care-ic .ui-ic,.rowlink-ic .ui-ic{width:18px;height:18px}

/* ---------- 13c. 芯片：标签灰、值亮；只有「判断」才带色 ----------
   剂量/时机是事实不是判断，原来整条芯片染成 info 色，一屏下来全是彩字。
   现在：标签 txt-3、值 txt-1；只有证据/安全性这类判断保留状态色。 */
.chip{color:var(--txt-3)}
.chip b{color:var(--txt-1)}
.chip.info,.chip.info b{color:var(--txt-2)}
.chip.ok b{color:var(--st-ok)}
.chip.warn b{color:var(--st-warn)}
.chip.bad b{color:var(--st-bad)}
.chip.mut b{color:var(--st-mut)}

/* ---------- 13d. 记录页：动作块成组 ----------
   原来 6 个动作只靠一条细线分隔，一长溜下来分不出边界。
   改成浅一档的子卡片：卡片(surface-2) > 动作块(surface-3)，层级靠底色而非描边。 */
.act{background:var(--surface-3);border:0;border-top:1px solid var(--line-1);
  /* 通栏色带而不是圆角子卡：子卡的 padding+border 会吃掉 26px，
     组次步进器（− 数字 +）被挤到只剩一位数，实测「30」被裁成「3」。
     负 margin 抵消卡片内距，动作块仍占满原有宽度，控件尺寸不变。 */
  border-radius:0;padding:12px 14px;margin:12px -14px 0}
.act-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act-top b{font-size:14px;font-weight:600}
.act-ctx{font-size:12px;line-height:1.6;color:var(--txt-3);margin-top:4px}
.act-ctx b{color:var(--txt-2);font-weight:600;letter-spacing:.04em;font-size:11px}
.act-ctx .why{color:var(--txt-3)}
.act-foot{margin-top:8px}
.sr-head{font-size:11px;color:var(--txt-3)}

/* ---------- 13e. 英雄卡小字：低透明度在暖炭桃色上不达标 ----------
   .hv-greet/.hv-sub 原来 0.62/0.66，暖炭主题实测 3.83:1 / 4.23:1；
   抬到 0.72/0.74 后为 4.88:1 / 5.12:1，墨色与石灰主题仍远高于 4.5。 */
.hv-greet{opacity:.72}
.hv-sub{opacity:.74}

/* ---------- 13f. 进度 / 周报同级切换 ----------
   周报在底栏收成五项后失去了页内入口，只能靠 hash 进入。
   这里给它一个与进度平级的胶囊切换，同时保留返回条。 */
.pagetabs{display:flex;gap:4px;margin:0 0 12px;padding:4px;
  background:var(--surface-2);border:1px solid var(--line-1);border-radius:999px}
.pagetabs button{flex:1;height:32px;border:0;border-radius:999px;background:transparent;
  color:var(--txt-3);font-family:var(--ff);font-size:12.5px;font-weight:600}
.pagetabs button[aria-current="page"]{background:var(--accent);color:var(--txt-inv)}
.pagetabs button:active{transform:scale(.99)}

/* 「＋ 加一组」和养护「›」是重复出现的小动作，不能只靠 pointer:coarse 兜底：
   桌面鼠标也受 WCAG 2.5.8 的 24px 约束，这里统一抬到 32px。 */
.wmore{min-height:32px;display:inline-flex;align-items:center}
.care-more{width:32px;height:32px}

/* 周报是 4 张同比指标卡：3 列会剩下一张孤零零挂在第二行，改 2×2。
   桌面宽于 720 时再回到 4 列。 */
.grid.stat.stat-4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){.grid.stat.stat-4{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ---------- 13g. 组次步进器：给数字留出三位数宽度 ----------
   390px 下数字区实测只有 21px，输入 100 会贴边；按钮 34→32，
   仍高于 32px 触控下限，数字区多出 4px。 */
.stepper .st{width:32px}
.stepper input{min-width:2.2em;font-size:13px}

/* ---------- 14. 小屏：减留白，不缩字号 ----------
   320px 下组次步进器的数字曾被挤成 0 宽（实测 clientWidth=0，「30」完全看不见）。
   原因是三层容器内距 + 两只 44px 步进按钮把中间数字挤没了。
   小屏的解法是把留白让给控件，而不是把字缩到看不清。 */
@media (max-width:374px){
  main{padding-left:8px;padding-right:8px}
  .panel{padding:12px}
  .card{padding:10px}
  .act{padding:10px;margin-left:-10px;margin-right:-10px}
  .sr-head,.sr{grid-template-columns:14px minmax(0,1fr) minmax(0,1fr) 28px;gap:4px}
  .stepper .st{width:32px}          /* 仍 ≥ 32px 触控下限；数字让出 8px 给每一位 */
  .stepper input{min-width:1.6em}   /* 至少保住一位数，不再塌成 0 */
}

/* ---------- 15. 记录页：参考 Flex / openGym compact 的安静列表 ----------
   旧结构在每个动作里重复一次表头、LAST、NEXT 和长说明，像一张张表单。
   现在：session 头 + 全页一次列名 + 动作卡（只看动作与组） + 保存卡。
   组行左到右仍是「组号 / 数值 / 次数 / 完成」，但不再有箱中箱和重复说明。 */
.log-session{background:var(--surface-2);border:1px solid var(--line-1);border-radius:16px;
  padding:13px 14px 11px;margin-top:2px}
.log-session-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.log-session-hd h3{margin:0;font-size:17px;line-height:1.35;font-weight:650;letter-spacing:-.01em}
.log-kicker{margin:0 0 2px;font-size:10.5px;letter-spacing:.12em;color:var(--txt-3);font-weight:600}
.log-session .aprog{margin:9px 0 0}
.log-legend{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) 32px;
  gap:6px;align-items:center;padding:9px 13px 3px;font-size:10.5px;color:var(--txt-3);
  text-align:center;letter-spacing:.02em}
.log-legend span:first-child{text-align:left}
.log-acts{display:flex;flex-direction:column;gap:10px;margin-top:3px}
.act{background:var(--surface-2);border:1px solid var(--line-1);border-radius:16px;
  padding:12px 13px 9px;margin:0;max-width:none}
.act-top{gap:6px}
.act-top b{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.35}
.act-ctx{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:4px;font-size:11.5px;line-height:1.55;color:var(--txt-3)}
.act-ctx span+span::before{content:"·";margin-right:8px;color:var(--line-3)}
.act-ctx b{font-size:10.5px;letter-spacing:.04em;color:var(--txt-2);font-weight:600}
.act .sr{grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) 32px;gap:6px;
  padding:5px 0;border-top:1px solid var(--line-1)}
/* 单数值动作（骑车 30min、农夫行走 40m…）：去掉空占位列，唯一一列铺满整行，
   勾仍贴右边，与全页列名首列的起点对齐。 */
.act .sr.one{grid-template-columns:18px minmax(0,1fr) 32px}
.act-ctx + .sr{border-top:0;padding-top:6px}
.act .sr .no{width:18px;height:18px;border-radius:50%;background:var(--surface-3);
  display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--txt-3)}
.act .sr .chk{width:32px;height:32px}
.act-foot{display:flex;align-items:center;gap:12px;margin-top:7px;padding-top:7px;
  border-top:1px solid var(--line-1)}
.act-count{margin-right:auto;font-size:11px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.act-foot .wmore{min-height:32px;padding:4px 0;text-decoration:none;font-size:12px;font-weight:600}
.act-foot .addset{color:var(--accent)}
.act-foot .delset{color:var(--txt-3)}
.act-foot .wmore:disabled{opacity:.35;cursor:not-allowed}
.log-save{padding:14px;margin-top:12px;background:var(--surface-2)}
.log-save .btnrow{margin-top:10px}
.log-save .btn{width:100%;height:46px;border-radius:12px}
@media (max-width:374px){
  .act .sr.one{grid-template-columns:14px minmax(0,1fr) 32px}
  .log-session{padding:12px 12px 10px}
  .log-session-hd h3{font-size:16px}
  .log-legend{padding:8px 11px 3px}
  .act{padding:10px 11px 8px}
  .act-top b{font-size:15.5px}
  .log-save{padding:12px}
}

/* ---------- v4.2 · 记录页节拍器：下一组提示 + 组间休息 ----------
   同类 App（Strong / Hevy 一致）里，勾完一组后用户只需要再看两样东西：
   下一组的预填数字、还有多久该开始。所以勾选后把「下一个未勾的组」滚进视口、
   给组号染成动作色，底部浮出一条倒计时。 */
.act .sr.is-next .no{background:var(--accent);color:var(--txt-inv);font-weight:700}
.act .sr.is-next{box-shadow:inset 2px 0 0 var(--accent)}
/* 跟练开关：坐在「已勾 x/y 组」这条线上。关 = 默认全勾的补记通道，
   开 = 逐组点。不用 checkbox 的观感，因为它改变的是整页的默认行为。 */

<script data-page-node-id="Q0LWp7LHDEvQjBtR4n6VVp" data-pnid-children="QUlVeyQG9sIMPmUkfGJJT8">
"use strict";
/* =====================================================================
 * 薄肌俱乐部 (Thin Muscle Club)
 * 模块化功能系统 —— 可独立运行，也可作为子模块挂载到更大系统。
 *
 * 模块边界（统一通过 Store 数据层通信，便于将来拆分/集成）：
 *   Store    : 数据层 (localStorage 持久化 + 导入/导出)
 *   Library  : 动作库管理 (CRUD / 分类 / 搜索)
 *   Plan     : 训练计划制定 (推拉腿薄肌模板 + 自定义)
 *   Log      : 训练记录追踪 (逐组重量次数 + 恢复评分)
 *   Diet     : 饮食打卡 (热量/蛋白目标 + 训练日自动识别 + 吃练匹配度)
 *   Supps    : 补剂循证库 (分级/剂量/禁忌/相互作用/证据评级 + 我的清单)
 *   Progress : 进度反馈 (体测趋势 + 周完成度反馈)
 *   UI       : 路由与渲染 (tab 切换 / 事件委托)
 * ===================================================================== */

/* ----------------------- 模块: Util (通用工具) -----------------------
 * 日期一律走 localDate()。禁止使用 toISOString().slice(0,10)：
 * 它返回 UTC 日期，在 UTC+8 下本地 00:00-08:00 会得到"昨天"，
 * 导致录入日期错位、周窗口整体偏移、训练日识别失效（R1）。
 * -------------------------------------------------------------------- */
const Util = (function(){
  function pad(n){ return String(n).padStart(2,'0'); }
  // 本地日期 YYYY-MM-DD
  function localDate(d){
    const t = d ? new Date(d) : new Date();
    return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
  }
  // 本地本周一（00:00）
  function mondayOf(d){
    const t = d ? new Date(d) : new Date();
    t.setHours(0,0,0,0);
    t.setDate(t.getDate() - ((t.getDay()+6)%7));
    return t;
  }
  // 是否为合法 YYYY-MM-DD
  function isDateStr(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  // 深拷贝（本系统数据无函数与 Date 对象，JSON 往返安全）
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  return {localDate, mondayOf, isDateStr, pad, clone};
})();

/* ----------------------- 日期选择面板（自绘日历） -----------------------
 * 为什么自绘：原生 <input type=date> 在 Chrome / iOS / Android 上是三套不同
 * 的交互与长相，而这个系统的日期字段只做一件事——选一个月内的某一天。
 *
 * 边界（重要）：不接管数据。面板只读 el.value 当初值、选完写回 el.value 并派发
 * input/change，所以「记录页 change → applyDay → 重渲染」这条链、以及各表单
 * 保存时直接读 el.value 的写法，全都保持原样，没有任何校验逻辑需要迁移。
 *
 * 键盘：输入框上 Enter / Space / ↓ 打开；面板内 ←→↑↓ 移一天（月视图移一月、
 * 年视图移一年），Home/End 跳到本周首尾，PageUp/PageDown 翻月，Shift 同键翻年，
 * Enter 选中，Esc 逐级返回（年 → 月 → 日 → 关闭）。
 * 触屏：格子按 --h-ctrl 档取尺寸（coarse 下 44px 起），点外部或滚动即关。
 * ---------------------------------------------------------------------- */
const DatePick = (function(){
  const WD = ['一','二','三','四','五','六','日'];   /* 周一起，与热力图同序 */
  let panel = null, cur = null;                      /* cur:{el,view,y,m,sel,focus} */
  const pad = Util.pad;

  function isoOf(y, m, d){ return y + '-' + pad(m) + '-' + pad(d); }
  function parse(v){
    if(!Util.isDateStr(v)) return null;
    const p = v.split('-').map(Number);
    const t = new Date(p[0], p[1] - 1, p[2]);
    /* 2026-02-31 在 Date 里会滚成 3 月 3 日，必须回读校验，否则面板会显示错月份 */
    if(t.getFullYear() !== p[0] || t.getMonth() !== p[1] - 1 || t.getDate() !== p[2]) return null;
    return {y:p[0], m:p[1], d:p[2]};
  }
  function dim(y, m){ return new Date(y, m, 0).getDate(); }        /* m 从 1 起 */
  function addM(y, m, n){ const t = new Date(y, m - 1 + n, 1); return {y:t.getFullYear(), m:t.getMonth()+1}; }
  function addD(y, m, d, n){ const t = new Date(y, m - 1, d + n); return {y:t.getFullYear(), m:t.getMonth()+1, d:t.getDate()}; }
  function dowMon(y, m, d){ return (new Date(y, m - 1, d).getDay() + 6) % 7; }   /* 周一=0 */

  function titleText(){
    if(cur.view === 'd') return cur.y + '年' + cur.m + '月';
    if(cur.view === 'm') return cur.y + '年';
    const b = Math.floor(cur.y / 12) * 12;
    return b + '–' + (b + 11);
  }
  function navLabels(){
    if(cur.view === 'd') return ['上个月', '下个月'];
    if(cur.view === 'm') return ['上一年', '下一年'];
    return ['前 12 年', '后 12 年'];
  }

  function bodyDays(){
    const days = dim(cur.y, cur.m);
    const lead = dowMon(cur.y, cur.m, 1);
    const pv = addM(cur.y, cur.m, -1), nx = addM(cur.y, cur.m, 1);
    const today = Util.localDate();
    let h = '<div class="dp-wd">' + WD.map(function(w){ return '<span>' + w + '</span>'; }).join('') + '</div>';
    h += '<div class="dp-grid">';
    for(let i = 0; i < 42; i++){
      let y = cur.y, m = cur.m, d = i - lead + 1, out = false;
      if(d < 1){ y = pv.y; m = pv.m; d = dim(y, m) + d; out = true; }
      else if(d > days){ d -= days; y = nx.y; m = nx.m; out = true; }
      const iso = isoOf(y, m, d);
      h += '<button type="button" class="dp-d' + (out ? ' is-out' : '') + (iso === today ? ' is-today' : '') + '"'
         + ' data-k="' + iso + '" data-d="' + iso + '"'
         + ' aria-selected="' + (cur.sel === iso ? 'true' : 'false') + '"'
         + (iso === today ? ' aria-current="date"' : '')
         + ' aria-label="' + y + '年' + m + '月' + d + '日' + (out ? '（' + (i < lead ? '上' : '下') + '月）' : '')
         + (iso === today ? '，今天' : '') + '"'
         + ' tabindex="-1">' + d + '</button>';
    }
    return h + '</div>';
  }
  function bodyMonths(){
    let h = '<div class="dp-grid dp-3">';
    for(let m = 1; m <= 12; m++){
      h += '<button type="button" class="dp-m" data-k="' + m + '" data-m="' + m + '"'
         + ' aria-selected="' + (cur.m === m ? 'true' : 'false') + '"'
         + ' aria-label="' + cur.y + '年' + m + '月" tabindex="-1">' + m + ' 月</button>';
    }
    return h + '</div>';
  }
  function bodyYears(){
    const b = Math.floor(cur.y / 12) * 12;
    let h = '<div class="dp-grid dp-3">';
    for(let i = 0; i < 12; i++){
      const y = b + i;
      h += '<button type="button" class="dp-m" data-k="' + y + '" data-y="' + y + '"'
         + ' aria-selected="' + (cur.y === y ? 'true' : 'false') + '"'
         + ' aria-label="' + y + '年" tabindex="-1">' + y + '</button>';
    }
    return h + '</div>';
  }

  function place(){
    if(!panel || !cur || !cur.el.isConnected) return;
    const r = cur.el.getBoundingClientRect();
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const left = Math.min(Math.max(8, r.left), Math.max(8, vw - pw - 8));
    /* 底部固定导航会盖住 y>vh-pad-nav 的区域：饮食/舌象这些日期字段位于长表单深处，
       面板若按 vh 计算就会有一截藏在导航后面，所以把可用底边抬到导航上沿。 */
    const navH = document.body.classList.contains('is-mobile')
      ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--pad-nav'), 10) || 0) : 0;
    const vbottom = vh - navH - 8;
    let top = r.bottom + 6;
    if(top + ph > vbottom) top = r.top - ph - 6;           /* 下面放不下就翻到输入框上方 */
    top = Math.max(8, Math.min(top, Math.max(8, vbottom - ph)));
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  }

  function paint(){
    const body = panel.querySelector('[data-body]');
    panel.querySelector('[data-title]').textContent = titleText();
    const navs = panel.querySelectorAll('[data-nav]');
    const lb = navLabels();
    navs[0].setAttribute('aria-label', lb[0]);
    navs[1].setAttribute('aria-label', lb[1]);
    body.innerHTML = cur.view === 'd' ? bodyDays() : (cur.view === 'm' ? bodyMonths() : bodyYears());
    /* roving tabindex：只有当前格 tabindex=0，Tab 才能整体离开面板 */
    const items = body.querySelectorAll('button');
    let target = null;
    items.forEach(function(b){
      const on = b.getAttribute('data-k') === String(cur.focus);
      b.tabIndex = on ? 0 : -1;
      if(on) target = b;
    });
    if(!target && items.length){ target = items[0]; target.tabIndex = 0; }
    /* 先定位再聚焦：面板初始在 left:-9999px，若先聚焦、浏览器又忽略
       preventScroll，页面会横向滚一下，而滚动监听会立刻把面板关掉。 */
    place();
    if(target){ try{ target.focus({preventScroll:true}); }catch(e){ target.focus(); } }
  }

  function step(n){
    if(cur.view === 'd'){
      const p = parse(cur.focus) || parse(cur.sel) || parse(Util.localDate());
      const t = addM(cur.y, cur.m, n);
      cur.y = t.y; cur.m = t.m;
      cur.focus = isoOf(t.y, t.m, Math.min(p.d, dim(t.y, t.m)));
    } else if(cur.view === 'm'){
      cur.y += n; cur.focus = String(cur.m);
    } else {
      cur.y += n * 12; cur.focus = String(cur.y);
    }
    paint();
  }

  function up(){
    if(cur.view === 'y'){ cur.view = 'm'; cur.focus = String(cur.m); paint(); return; }
    if(cur.view === 'm'){ cur.view = 'd'; cur.focus = cur.sel || Util.localDate(); paint(); return; }
    close(true);
  }

  function commit(iso){
    const el = cur.el;
    close(false);                       /* 先关：change 里可能重建整张表单 */
    cur = null;
    el.value = iso;
    try{ el.dispatchEvent(new Event('input', {bubbles:true})); }catch(e){}
    try{ el.dispatchEvent(new Event('change', {bubbles:true})); }catch(e){}
    /* 记录页在 change 里重建表单，旧节点已 detach：按 id 找回新节点再还给焦点，
       否则焦点会掉到 body，键盘用户得从头 Tab 一遍。 */
    const again = el.id ? document.getElementById(el.id) : null;
    const t = (again && again.matches && again.matches('input[type="date"]')) ? again : (el.isConnected ? el : null);
    if(t){ try{ t.focus({preventScroll:true}); }catch(e){} }
  }

  function onClick(e){
    const b = e.target.closest && e.target.closest('button');
    if(!b || !panel.contains(b)) return;
    if(b.hasAttribute('data-nav')){ step(+b.getAttribute('data-nav')); return; }
    if(b.hasAttribute('data-today')){ commit(Util.localDate()); return; }
    if(b.hasAttribute('data-title')){
      if(cur.view === 'd'){ cur.view = 'm'; cur.focus = String(cur.m); }
      else if(cur.view === 'm'){ cur.view = 'y'; cur.focus = String(cur.y); }
      else { cur.view = 'd'; cur.focus = cur.sel || Util.localDate(); }
      paint(); return;
    }
    if(b.hasAttribute('data-d')){ commit(b.getAttribute('data-d')); return; }
    if(b.hasAttribute('data-m')){
      cur.m = +b.getAttribute('data-m');
      const pd = (parse(cur.sel) || {}).d || 1;
      cur.focus = isoOf(cur.y, cur.m, Math.min(pd, dim(cur.y, cur.m)));
      cur.view = 'd'; paint(); return;
    }
    if(b.hasAttribute('data-y')){
      cur.y = +b.getAttribute('data-y');
      cur.view = 'm'; cur.focus = String(cur.m); paint(); return;
    }
  }

  function onKey(e){
    const k = e.key;
    if(k === 'Escape'){ e.preventDefault(); up(); return; }
    if(k === 'Tab') return;                       /* 不拦：让 Tab 按 roving 顺序离开 */
    if(k === 'Enter' || k === ' '){
      const b = e.target.closest && e.target.closest('button');
      if(b){ e.preventDefault(); b.click(); }
      return;
    }
    if(cur.view === 'd'){
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].indexOf(k) < 0) return;
      e.preventDefault();
      const p = parse(cur.focus) || parse(cur.sel) || parse(Util.localDate());
      let t;
      if(k === 'ArrowLeft') t = addD(p.y, p.m, p.d, -1);
      else if(k === 'ArrowRight') t = addD(p.y, p.m, p.d, 1);
      else if(k === 'ArrowUp') t = addD(p.y, p.m, p.d, -7);
      else if(k === 'ArrowDown') t = addD(p.y, p.m, p.d, 7);
      else if(k === 'Home') t = addD(p.y, p.m, p.d, -dowMon(p.y, p.m, p.d));
      else if(k === 'End') t = addD(p.y, p.m, p.d, 6 - dowMon(p.y, p.m, p.d));
      else if(k === 'PageUp'){
        const q = e.shiftKey ? {y:p.y - 1, m:p.m} : addM(p.y, p.m, -1);
        t = {y:q.y, m:q.m, d:Math.min(p.d, dim(q.y, q.m))};
      } else {
        const q = e.shiftKey ? {y:p.y + 1, m:p.m} : addM(p.y, p.m, 1);
        t = {y:q.y, m:q.m, d:Math.min(p.d, dim(q.y, q.m))};
      }
      cur.y = t.y; cur.m = t.m; cur.focus = isoOf(t.y, t.m, t.d);
      paint(); return;
    }
    /* 月 / 年视图：3 列网格，←→ 移一格，↑↓ 移一行 */
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','PageUp','PageDown'].indexOf(k) < 0) return;
    e.preventDefault();
    const isM = cur.view === 'm';
    let v = parseInt(cur.focus, 10);
    if(isNaN(v)) v = isM ? cur.m : cur.y;
    if(k === 'ArrowLeft') v -= 1;
    else if(k === 'ArrowRight') v += 1;
    else if(k === 'ArrowUp') v -= 3;
    else if(k === 'ArrowDown') v += 3;
    else if(k === 'PageUp') v += isM ? -1 : -12;
    else v += isM ? 1 : 12;
    cur.focus = String(isM ? Math.min(12, Math.max(1, v)) : Math.min(2200, Math.max(1900, v)));
    paint();
  }

  function onDoc(e){
    if(!panel) return;
    if(panel.contains(e.target)) return;
    if(cur && e.target === cur.el) return;        /* 点同一个框 = 收起，交给下面的 trigger */
    close(false);
  }
  function onScroll(){ close(false); }

  function build(){
    const el = document.createElement('div');
    el.className = 'dp';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'false');
    el.setAttribute('aria-label', '选择日期');
    el.setAttribute('aria-describedby', 'dpHint');
    el.style.left = '-9999px';
    el.style.top = '0px';
    el.innerHTML = '<div class="dp-hd">'
      + '<button type="button" class="dp-nav" data-nav="-1">‹</button>'
      + '<button type="button" class="dp-t" data-title aria-live="polite"></button>'
      + '<button type="button" class="dp-nav" data-nav="1">›</button>'
      + '</div>'
      + '<div data-body></div>'
      + '<div class="dp-ft"><button type="button" class="dp-today" data-today>今天</button></div>'
      + '<p class="vhide" id="dpHint">方向键选择日期，回车确认，Esc 返回</p>';
    document.body.appendChild(el);
    el.addEventListener('click', onClick);
    el.addEventListener('keydown', onKey);
    return el;
  }

  function open(el){
    if(cur && cur.el === el){ close(true); return; }     /* 再点一次 = 收起 */
    close(false);
    const v = parse(el.value) || parse(Util.localDate());
    cur = {el:el, view:'d', y:v.y, m:v.m,
           sel: parse(el.value) ? el.value : '',
           focus: parse(el.value) ? el.value : Util.localDate()};
    panel = build();
    paint();
    el.setAttribute('aria-expanded', 'true');
    /* capture：抢在输入框自身的 click 之前；外层 doc 监听在 open 之后才加，
       所以「点自己」时先走 trigger（toggle），再走 onDoc 时 panel 已为 null。 */
    document.addEventListener('pointerdown', onDoc, true);
    window.addEventListener('scroll', onScroll, {passive:true, capture:true});
    window.addEventListener('resize', place);
  }

  function close(refocus){
    const el = cur && cur.el;
    if(panel){
      panel.removeEventListener('click', onClick);
      panel.removeEventListener('keydown', onKey);
      panel.remove();
    }
    panel = null;
    document.removeEventListener('pointerdown', onDoc, true);
    window.removeEventListener('scroll', onScroll, true);
    window.removeEventListener('resize', place);
    if(el) el.setAttribute('aria-expanded', 'false');
    cur = null;
    if(refocus && el && el.isConnected){ try{ el.focus({preventScroll:true}); }catch(e){} }
  }

  /* —— 全局触发（委托，表单重建后无需重新绑定） —— */
  document.addEventListener('pointerdown', function(e){
    const el = e.target && e.target.closest && e.target.closest('input[type="date"]');
    if(!el || el.disabled) return;
    /* 拦掉原生选择器。readonly 是第二道保险（见 markWideFields），
       因为部分 Android WebView 上 preventDefault 拦不住日期选择器。 */
    e.preventDefault();
    open(el);
  }, true);
  document.addEventListener('keydown', function(e){
    const el = e.target;
    if(!el || !el.matches || !el.matches('input[type="date"]')) return;
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown'){
      e.preventDefault();
      open(el);
    }
  });

  return {open:open, close:close};
})();

/* ----------------------- 时间字段：点整块都要能选时间 -----------------------
 * input[type=time] 在桌面 Chromium 上只有点右侧那个 18px 小钟才弹组件，
 * 点字段本体只是选中「小时」段；某些 WebView 则完全不弹。用户看到的就是
 * 「点了没反应」。这里和日期一样一律走自绘面板：pointerdown 拦掉原生，
 * 面板只读写 el.value 并派发 input/change，不改任何表单逻辑。 */
const TimePick = (function(){
  let el=null, panel=null;
  function close(){
    if(panel){ panel.remove(); panel=null; }
    document.documentElement.classList.remove('tp-open');
    el=null;
  }
  function sheet(){
    if(!el || !el.isConnected){ close(); return; }
    const target=el;               // close() 会清空 el，先抓住要写回的那个输入框
    const cur=/^(\d{1,2}):(\d{2})$/.exec(target.value||'')||[,22,30];
    const hh=+cur[1], mm=+cur[2];
    const opts=function(n,step,sel){
      let s='';
      for(let i=0;i<n;i+=step) s+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+Util.pad(i)+'</option>';
      return s;
    };
    close();
    panel=document.createElement('div');
    panel.className='sheet-backdrop'; panel.id='timeSheet';
    panel.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tp_title">'+
      '<div class="sheet-hd"><b id="tp_title">选择时间</b>'+
        '<button type="button" class="sheet-x" data-tp-close aria-label="关闭">✕</button></div>'+
      '<div class="tp-grid">'+
        '<label>时<select id="tp_h" aria-label="小时">'+opts(24,1,hh)+'</select></label>'+
        '<span class="tp-colon">:</span>'+
        '<label>分<select id="tp_m" aria-label="分钟">'+opts(60,5,Math.min(55,Math.round(mm/5)*5))+'</select></label>'+
      '</div>'+
      '<div class="tp-quick">'+['22:30','23:00','07:00','08:00','12:00','20:00'].map(function(t){
        return '<button type="button" class="tag" data-tp-set="'+t+'">'+t+'</button>';
      }).join('')+'</div>'+
      '<div class="btnrow"><button type="button" class="btn" data-tp-ok>确定</button></div>'+
    '</div>';
    document.body.appendChild(panel);
    document.documentElement.classList.add('tp-open');
    const sh=panel.querySelector('#tp_h'), sm=panel.querySelector('#tp_m');
    const commit=function(){
      const v=Util.pad(+sh.value)+':'+Util.pad(+sm.value);
      close();
      target.value=v;
      target.dispatchEvent(new Event('input',{bubbles:true}));
      target.dispatchEvent(new Event('change',{bubbles:true}));
      try{ target.focus(); }catch(e){}
    };
    panel.addEventListener('click', function(e){
      const t=e.target;
      if(!t || !t.closest) return;
      if(t===panel || t.closest('[data-tp-close]')){ close(); return; }
      const quick=t.closest('[data-tp-set]');
      if(quick){ const p=quick.getAttribute('data-tp-set').split(':'); sh.value=+p[0]; sm.value=+p[1]; return; }
      if(t.closest('[data-tp-ok]')) commit();
    });
    panel.querySelector('[data-tp-ok]').focus();
  }
  function open(target){
    el=target;
    sheet();
  }
  document.addEventListener('pointerdown', function(e){
    const t=e.target && e.target.closest ? e.target.closest('input[type="time"]') : null;
    if(!t || t.disabled) return;
    e.preventDefault();            // 拦掉原生滚轮；键盘仍可由 Enter/Space 打开
    open(t);
  }, true);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && panel){ e.preventDefault(); close(); return; }
    const t=e.target;
    if(!t || !t.matches || !t.matches('input[type="time"]')) return;
    if(e.key==='Enter' || e.key===' ' || e.key==='ArrowDown'){ e.preventDefault(); open(t); }
  });
  return {open:open, close:close};
})();

 * **中性示例值**，不含任何真实个人信息。
 *

 *      主脚本之前加一个 src="profile.local.js" 的 script 标签（结束标签别写进注释，
 *      HTML 解析器会把它当成整段脚本的终点）。该文件被 .gitignore 排除，不会进仓库。
 *      字段见示例文件：

 *                            bodyfat:20, muscleRate:null, city:''};
 *   window.__TM_TARGETS__ = {kcalMin:1900, kcalMax:2400, proTrain:120, proRest:100};

/* 目标预设 = 全站唯一来源。

 * 「固定选项 + 自定义」，而不是让用户每次手打一句容易写歪的话。
 * 顺序即「目标空间」的顺序：先体成分（薄肌/减脂/增肌/重组），再能力（力量/体态/康复）。
 * GOAL_ALIAS 用来把旧版本存下的自由文本归一到最近的预设，避免历史数据落到「自定义」。 */
const GOAL_PRESETS = [
  '薄肌（降体脂保肌）',   // 默认：体重基本不动，体脂降、肌肉保住——本系统的主线
  '减脂（体重下降）',     // 以体重刻度为主，允许一定肌肉流失，缺口更大
  '增肌（体重上升）',     // 以围度/力量上升为主，接受体脂小幅上升
  '重组（体重不变）',     // 体重锁死，只看体脂/腰围/力量三条线

  '体态（圆肩/骨盆）',   // 目标是把姿势拉回中立位，训练量让位于活动度
  '康复（疼痛/活动度）'   // 有疼痛或术后，强度让位于不加重症状
];

function goalCanon(v){
  const s = String(v==null?'':v).trim();

  return GOAL_ALIAS[s] || s;
}
const PERSONAL = Object.assign({
  age: 30, sex: '男', height: 175, weight: 67, bodyfat: 20,
  muscleRate: null,   // 可选：体成分秤上的肌肉率 %

  kcalRest:1780, kcalTrain:1950,    // 分档目标值

/* 由画像推导的区间——改画像即自动跟随，不写死在文案里 */
function computeDerived(p){
  const pos = v => typeof v === 'number' && isFinite(v) && v > 0;
  const r = (x, n) => Math.round(x * Math.pow(10, n)) / Math.pow(10, n);
  const lean = (pos(p.weight) && pos(p.bodyfat)) ? r(p.weight * (1 - p.bodyfat / 100), 1) : null;
  const hrLo = pos(p.age) ? Math.floor((220 - p.age) * 0.6) : null;
  const hrHi = pos(p.age) ? Math.floor((220 - p.age) * 0.8) : null;
  const proLo = pos(p.weight) ? Math.round(p.weight * 1.6) : null;
  const proHi = pos(p.weight) ? Math.round(p.weight * 2.2) : null;
  // Mifflin-St Jeor × 活动系数 1.5（每周 3-5 次训练）；显式给了 tdee 则以显式值为准
  const bmr = (pos(p.weight) && pos(p.height) && pos(p.age))
    ? Math.round(10 * p.weight + 6.25 * p.height - 5 * p.age + (p.sex === '女' ? -161 : 5)) : null;
  const tdee = pos(p.tdee) ? Math.round(p.tdee) : (bmr ? Math.round(bmr * 1.5 / 50) * 50 : null);
  // 文案用：画像缺失时回落到中性表述，绝不渲染 null
  const hrText = (hrLo && hrHi) ? hrLo + '-' + hrHi : null;
  const proText = (proLo && proHi) ? proLo + '-' + proHi + 'g' : null;
  const leanText = lean ? lean + ' kg' : null;
  const tdeeText = tdee ? tdee + ' kcal' : null;
  return {lean, hrLo, hrHi, proLo, proHi, bmr, tdee, hrText, proText, leanText, tdeeText};
}

const DERIVED = computeDerived(PERSONAL);
function recalcDerived(){ Object.assign(DERIVED, computeDerived(PERSONAL)); }

/* ----------------------- 模块: Schema (结构定义与版本迁移) -----------------------
 * 数据长什么样、跨版本如何演进，全部收敛在这一处。
 * 这是本系统风险最高、也最需要单测的一块，因此与持久化（Store）彻底分开：
 *   normalize() 保证渲染层永不因缺字段抛错（R3）
 *   normalize() 幂等，可安全重复调用
 * ------------------------------------------------------------------------------ */
const Schema = (function(){
  const clone = Util.clone;
  /* ---- 数据规范化（R3）：保证渲染层永不因缺字段抛错 ----
     所有外部进入的数据（本地存储 / 导入 JSON）必须先过这里 */
  const ARR_KEYS = ['supps','herbs','releases','longevity','skincare'];
  function normalize(d){
    if(!d || typeof d !== 'object' || Array.isArray(d)) d = {};
    if(!d.profile || typeof d.profile!=='object' || Array.isArray(d.profile)) d.profile = clone(KbData.DATA.profile);
    /* 画像可编辑：只做范围与类型校验，不再把值钉死。
       约束：数值必须有限且落在生理范围内；缺失则回落到该字段的默认值。
       体重/体脂的「最新值」由 Profile.current() 从 metrics 里取，这里只存用户显式保存的画像。 */
    (function normalizeProfile(){
      const raw = d.profile || {};
      const num = (v, def, min, max) => {
        const n = Number(v);
        return (isFinite(n) && n >= min && n <= max) ? n : def;
      };
      d.profile = {
        age: num(raw.age, PROFILE_DEFAULT.age, 12, 100),
        sex: raw.sex === '女' ? '女' : '男',
        height: num(raw.height, PROFILE_DEFAULT.height, 120, 230),
        weight: num(raw.weight, PROFILE_DEFAULT.weight, 30, 250),
        bodyfat: num(raw.bodyfat, PROFILE_DEFAULT.bodyfat, 3, 60),
        goal: (typeof raw.goal === 'string' && raw.goal.trim()) ? raw.goal.trim().slice(0, 40) : PROFILE_DEFAULT.goal,
        goalWeight: num(raw.goalWeight, PROFILE_DEFAULT.goalWeight, 30, 250),
        name: typeof raw.name === 'string' ? raw.name.trim().slice(0, 20) : '',
        city: typeof raw.city === 'string' ? raw.city.trim().slice(0, 20) : '',
        tdee: (raw.tdee == null || raw.tdee === '' || !isFinite(Number(raw.tdee)) || Number(raw.tdee) <= 0) ? null : Math.round(Number(raw.tdee))
      };
    })();
    if(!Array.isArray(d.library)) d.library = clone(KbData.LIBRARY);
    // 动作条目：补齐渲染用到的全部字段
    // P0-1：cat/demo 白名单收敛——导入的恶意备份无法借未知分类或 javascript: 协议穿透渲染层
    const CAT_KEYS = ['push','pull','legs','core','cardio','mob'];   // 与 Library.CATS 保持同步
    d.library = d.library.filter(a=>a && typeof a==='object' && typeof a.id==='string').map(a=>({
      id: a.id,
      name: typeof a.name==='string' ? a.name : '(未命名动作)',
      cat: (typeof a.cat==='string' && CAT_KEYS.indexOf(a.cat)>=0) ? a.cat : 'core',
      muscles: typeof a.muscles==='string' ? a.muscles : '',
      sets: (typeof a.sets==='number' && a.sets>0) ? a.sets : 3,
      reps: typeof a.reps==='string' ? a.reps : '12-15',
      equip: typeof a.equip==='string' ? a.equip : '',
      level: typeof a.level==='string' ? a.level : '',
      points: Array.isArray(a.points) ? a.points.map(String) : [],
      errors: Array.isArray(a.errors) ? a.errors.map(String) : [],
      fail: typeof a.fail==='string' ? a.fail : '',
      demo: (typeof a.demo==='string' && /^https?:\/\//i.test(a.demo)) ? a.demo : ''
    }));
    // 计划：模板 + 七天结构 + 动作引用合法性
    if(!d.plan || typeof d.plan!=='object' || !d.plan.week || typeof d.plan.week!=='object') d.plan = clone(KbData.PLAN);
    if(typeof d.plan.template !== 'string') d.plan.template = KbData.PLAN.template;
    if(typeof d.plan.focus !== 'string') d.plan.focus = '';
    const liveIds = {}; d.library.forEach(a=>{ liveIds[a.id]=1; });
    Object.keys(KbData.PLAN.week).forEach(day=>{
      const w = d.plan.week[day];
      if(!w || typeof w!=='object'){ d.plan.week[day] = clone(KbData.PLAN.week[day]); return; }
      if(typeof w.type !== 'string') w.type = 'rest';
      // 剔除指向已删除动作的引用，避免界面残留"已删"占位
      w.actions = Array.isArray(w.actions) ? w.actions.filter(id=>liveIds[id]) : [];
    });
    // 训练记录
    if(!Array.isArray(d.logs)) d.logs = [];
    d.logs = d.logs.filter(l=> l && typeof l==='object').map(l=>({
      id: l.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(l.date) ? l.date : Util.localDate(),
      dayType: typeof l.dayType==='string' ? l.dayType : '',
      rating: (typeof l.rating==='number') ? l.rating : 8,
      recovery: typeof l.recovery==='string' ? l.recovery : '',
      entries: (Array.isArray(l.entries)?l.entries:[]).filter(e=>e && typeof e==='object').map(e=>({
        actionId: typeof e.actionId==='string' ? e.actionId : '',
        actionName: typeof e.actionName==='string' ? e.actionName : '(未知动作)',
        sets: (Array.isArray(e.sets)?e.sets:[]).filter(s=>s && typeof s==='object')
          .map(s=>({ weight: Number(s.weight)||0, reps: Number(s.reps)||0 })),
        rpe: (e.rpe==null || e.rpe==='') ? null : (Number(e.rpe)||null)
      }))
    }));
    // 体测
    if(!Array.isArray(d.metrics)) d.metrics = [];
    d.metrics = d.metrics.filter(m=> m && typeof m==='object').map(m=>({
      id: m.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(m.date) ? m.date : Util.localDate(),
      weight:  (m.weight==null  || m.weight==='') ? null : (Number(m.weight)  || null),
      bodyfat: (m.bodyfat==null || m.bodyfat==='') ? null : (Number(m.bodyfat) || null),
      waist:   (m.waist==null   || m.waist==='') ? null : (Number(m.waist)   || null),
      restinghr: (m.restinghr==null || m.restinghr==='') ? null : (Number(m.restinghr)|| null)
    }));
    // 睡眠打卡（date=记录日，语义为「昨夜」；同日 upsert）
    if(!Array.isArray(d.sleep)) d.sleep = [];
    d.sleep = d.sleep.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      hours: Number(x.hours)||0,
      quality: Number(x.quality)||3,
      bedtime: typeof x.bedtime==='string' ? x.bedtime : ''
    }));
    // 日步数打卡（NEAT）：date=当天；同日 upsert。v3.38-cut 新增，
    // 缺字段的老备份会被 normalize 补成空数组，渲染层不会拿到 undefined。
    if(!Array.isArray(d.steps)) d.steps = [];
    d.steps = d.steps.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      steps: Math.max(0, Math.round(Number(x.steps)||0)),
      note: typeof x.note==='string' ? x.note : ''
    }));
    // 柔韧自测（坐位体前屈 cm，越大越好；深蹲最低点髋高 cm，越小越好）
    if(!Array.isArray(d.flex)) d.flex = [];
    d.flex = d.flex.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      sitreach: (x.sitreach==null || x.sitreach==='') ? null : (Number(x.sitreach)||null),
      squat:    (x.squat==null    || x.squat==='')    ? null : (Number(x.squat)   ||null)
    }));
    // 舌象周记
    if(!Array.isArray(d.tongue)) d.tongue = [];
    d.tongue = d.tongue.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      coat: typeof x.coat==='string' ? x.coat : '',
      thick: typeof x.thick==='string' ? x.thick : '',
      note: typeof x.note==='string' ? x.note : ''
    }));
    // 食物库（内置 + 用户自定义；normalize 补齐默认）
    if(!Array.isArray(d.foods)) d.foods = [];
    const builtinIds = {}; (KbData.FOODS||[]).forEach(f=>builtinIds[f.id]=1);
    if(KbData.FOODS && KbData.FOODS.length){
      const known2={}; d.foods.forEach(f=>{ if(f&&f.id) known2[f.id]=1; });
      KbData.FOODS.forEach(f=>{ if(!known2[f.id]) d.foods.push(Object.assign({},f)); });
    }
    // 养护每日勾选：{ 'YYYY-MM-DD': { supps:[id…], herbs:[…], … } }
    // 只记「哪天勾了哪条」，不改各模块的「我的清单」（那是长期清单，两者语义不同）。
    if(!d.careTick || typeof d.careTick!=='object' || Array.isArray(d.careTick)) d.careTick = {};
    Object.keys(d.careTick).forEach(function(day){
      const v = d.careTick[day];
      if(!v || typeof v!=='object' || Array.isArray(v)){ delete d.careTick[day]; return; }
      Object.keys(v).forEach(function(k){
        if(!Array.isArray(v[k])) delete v[k];
        else v[k] = v[k].filter(function(x){ return typeof x==='string'; });
      });
    });
    const builtinCat = {}; (KbData.FOODS||[]).forEach(f=>{ if(f&&f.id) builtinCat[f.id]=f.cat||''; });
    d.foods = d.foods.filter(x=> x && typeof x==='object' && x.name).map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      name: String(x.name), kcal: Number(x.kcal)||0, protein: Number(x.protein)||0, per: x.per||'100g', serv: Number(x.serv)||0,
      cat: (typeof x.cat==='string' && x.cat) ? x.cat : (builtinCat[x.id]||'other')
    }));
    // 文字周记
    if(!Array.isArray(d.journal)) d.journal = [];
    d.journal = d.journal.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      content: typeof x.content==='string' ? x.content : ''
    }));
    // 饮食
    if(!Array.isArray(d.diet)) d.diet = [];
    d.diet = d.diet.filter(x=> x && typeof x==='object').map(x=>({
      id: x.id || ('id_'+Math.random().toString(36).slice(2,8)),
      date: Util.isDateStr(x.date) ? x.date : Util.localDate(),
      kcal: Number(x.kcal)||0,
      protein: Number(x.protein)||0,
      flags: Array.isArray(x.flags) ? x.flags.filter(f=>typeof f==='string') : [],
      firstmeal: typeof x.firstmeal==='string' ? x.firstmeal : '',
      lastmeal: typeof x.lastmeal==='string' ? x.lastmeal : '',
      meals: Array.isArray(x.meals) ? x.meals.filter(m=>m&&typeof m==='object').map(m=>({
        name:String(m.name||''), food:String(m.food||''), kcal:Number(m.kcal)||0, pro:Number(m.pro)||0, wt:Number(m.wt)||0
      })) : []
    }));
    // 各知识库"我的清单"：只保留字符串 id
    ARR_KEYS.forEach(k=>{
      if(!Array.isArray(d[k])) d[k] = [];
      d[k] = d[k].filter(x=>typeof x==='string');
    });
    // 内置动作删除黑名单（R6）
    if(!Array.isArray(d.removedBuiltin)) d.removedBuiltin = [];
    d.removedBuiltin = d.removedBuiltin.filter(x=>typeof x==='string');
    // 备份时间戳（R7）
    if(!Util.isDateStr(d.lastBackupAt)) d.lastBackupAt = null;
    return d;
  }

  return {normalize};
})();

const Store = (function(){
  const KEY = 'thinMuscle.trainSys.v1';
  const BACKUP_PREFIX = 'thinMuscle.backup.v1.';
  const BACKUP_KEEP = 3;

  // 从 KbData 取常量（保持 Store.DEFAULT_* 对外接口不变，内部调用点无需改动）
  const {LIBRARY:DEFAULT_LIBRARY, PLAN:DEFAULT_PLAN, SUPPLEMENTS:DEFAULT_SUPPLEMENTS,
         HERBS:DEFAULT_HERBS, RELEASE:DEFAULT_RELEASE, LONGEVITY:DEFAULT_LONGEVITY,
         SKINCARE:DEFAULT_SKINCARE, FOODS:DEFAULT_FOODS, DATA:DEFAULT_DATA} = KbData;
  const clone = Util.clone;
  const normalize = Schema.normalize;

let data = clone(DEFAULT_DATA);
  let lastError = null;      // 最近一次持久化失败信息（R7）
  let loadWarning = null;    // 加载期异常信息，供 UI 提示（R3/R7）

  /* ---- 滚动备份（R2/R7）：迁移或导入前留档，最多保留 BACKUP_KEEP 份 ---- */
  function snapshot(reason){
    try{
      const keys = Object.keys(localStorage).filter(k=>k.indexOf(BACKUP_PREFIX)===0).sort();
      while(keys.length >= BACKUP_KEEP){ localStorage.removeItem(keys.shift()); }
      const stamp = Util.localDate() + 'T' + new Date().toTimeString().slice(0,8);
      localStorage.setItem(BACKUP_PREFIX + stamp,
        JSON.stringify({reason:reason||'manual', at:stamp, data:data}));
      return true;
    }catch(e){ console.warn('备份失败', e); return false; }
  }
  function listBackups(){
    try{
      return Object.keys(localStorage).filter(k=>k.indexOf(BACKUP_PREFIX)===0).sort().reverse()
        .map(k=>{ let meta={}; try{ meta=JSON.parse(localStorage.getItem(k))||{}; }catch(e){}
          return {key:k, reason:meta.reason||'', at:meta.at||k.slice(BACKUP_PREFIX.length)}; });
    }catch(e){ return []; }
  }
  function restoreBackup(key){
    try{
      const raw = localStorage.getItem(key); if(!raw) return false;
      const env = JSON.parse(raw);
      data = normalize(clone(env && env.data ? env.data : env));
      save(); return true;
    }catch(e){ return false; }
  }

  function load(){
    let raw = null;
    try{
      raw = localStorage.getItem(KEY);
    }catch(e){
      loadWarning = '浏览器不允许读取本地存储（可能处于隐私模式），本次为临时会话，改动不会保存。';
    }
    if(raw){
      try{
        data = normalize(Object.assign(clone(DEFAULT_DATA), JSON.parse(raw)));
      }catch(e){
        // 结构损坏：另存原始串供抢救，绝不静默丢弃（R3）
        try{ localStorage.setItem(KEY + '.corrupt', raw); }catch(_){}
        data = normalize(clone(DEFAULT_DATA));
        loadWarning = '本地数据解析失败（已损坏），已回退到默认数据。原始内容已另存，可在「备份」页导出抢救。';
      }
    } else {
      data = normalize(clone(DEFAULT_DATA));
    }
    // ---- 迁移：逐条独立，任一步失败不影响其余 ----
    try{
      if(Array.isArray(data.library)){
        // 合并新增内置动作（尊重用户删除黑名单，R6）
        const known={}; data.library.forEach(a=>known[a.id]=1);
        const removed={}; (data.removedBuiltin||[]).forEach(id=>removed[id]=1);
        let added=0;
        DEFAULT_LIBRARY.forEach(a=>{
          if(!known[a.id] && !removed[a.id]){ data.library.push(clone(a)); known[a.id]=1; added++; }
        });
        // demo 同步：一次性迁移（P1-6）——首次加载对齐历史脏数据后打标记，
        // 此后用户在动作表单编辑的 demo 链接不再被每次开页强制重置（旧行为：静默回滚用户编辑）
        if(!data.demoSynced){
          const demoMap={}; DEFAULT_LIBRARY.forEach(a=>{ demoMap[a.id]=a.demo; });
          let demoFixed=0;
          data.library.forEach(a=>{
            if(demoMap[a.id]!=null && a.demo!==demoMap[a.id]){ a.demo=demoMap[a.id]; demoFixed++; }
          });
          data.demoSynced = true;
          if(added>0 || demoFixed>0 || !raw) save();   // !raw：首次访问也要把标记落盘
        }
      }
      /* 食物库下架清理（一次性迁移）：内置已移除的条目从存量数据清除并落盘
         （normalize 里的同名清理管内存态；此处管落盘——两者双保险） */
      if(Array.isArray(data.foods)){
        const REMOVED_FOOD_IDS=['f_tofu','f_sweetpotato','f_spinach','f_almond','f_milk'];
        const beforeN=data.foods.length;
        data.foods=data.foods.filter(f=>f && REMOVED_FOOD_IDS.indexOf(f.id)<0);
        if(data.foods.length!==beforeN) save();
      }
      // v3.7 迁移（R2 修复）：只升级「周五」这一天，不再整周覆盖。
      // 旧实现命中历史签名后执行 data.plan = clone(DEFAULT_PLAN)，
      // 会把用户对其余各天的自定义排布一并抹除；改为按天替换后，未命中的天原样保留。
      (function migrateFriday(){
        const fri = data.plan && data.plan.week && data.plan.week['周五'];
        if(!fri || !Array.isArray(fri.actions)) return;
        const LEGACY = [
          ['a_leg_press','a_leg_ext','a_leg_curl','a_leg_bridge','a_leg_calf','a_core_plank'],
          ['a_leg_bulgarian','a_leg_curl','a_leg_rdl','a_leg_bridge','a_leg_calf','a_core_birddog'],
          ['a_leg_kbswing','a_leg_bulgarian','a_leg_curl','a_leg_rdl','a_leg_bridge','a_leg_calf']
        ];
        const cur = JSON.stringify(fri.actions);
        const latest = JSON.stringify(DEFAULT_PLAN.week['周五'].actions);
        if(cur !== latest && LEGACY.some(sig=>JSON.stringify(sig)===cur)){
          snapshot('pre-migrate-v3.7');   // 先留档，再改
          data.plan.week['周五'] = clone(DEFAULT_PLAN.week['周五']);
          save();
        }
      })();
      // v3.26 迁移：功能训练三天结构修正（周二去重补踝 / 周四换出训练动作补胸小肌+摩腹 / 周六改标签）
      // 与 v3.7 同一套做法：按动作序列精确签名匹配，命中才替换；未命中的天原样保留（尊重自定义）
      (function migrateFuncDays(){
        const wk = data.plan && data.plan.week;
        if(!wk) return;
        const SIGS = {
          '周二': [['a_cardio_walk','a_leg_monster','a_leg_clam','a_mob_sls','a_mob_hipflex'],
                   ['a_cardio_walk','a_leg_monster','a_mob_ankle','a_mob_sls','a_mob_hipflex'],  // 旧『快走』版：已等同新版，无需迁移
                   ['a_cardio_stair','a_leg_monster','a_mob_ankle','a_mob_sls','a_mob_hipflex']],  // v3.38：楼梯机版 → 改为 Zone2 快走/慢跑 30-40min @114-133 bpm
          '周四': [['a_cardio_baduan','a_mob_catcow','a_mob_tspine','a_mob_hipflex','a_core_plank']]
        };
        let changed = false;
        Object.keys(SIGS).forEach(day=>{
          const w = wk[day];
          if(!w || !Array.isArray(w.actions)) return;
          const cur = JSON.stringify(w.actions);
          const latest = JSON.stringify(DEFAULT_PLAN.week[day].actions);
          if(cur !== latest && SIGS[day].some(sig=>JSON.stringify(sig)===cur)){
            if(!changed){ snapshot('pre-migrate-v3.29'); changed = true; }
            wk[day] = clone(DEFAULT_PLAN.week[day]);
          }
        });
        // 周六：动作序列未改，只把旧标签 cardio 升级为 fcore
        const sat = wk['周六'];
        if(sat && sat.type==='cardio' && Array.isArray(sat.actions)
           && JSON.stringify(sat.actions)===JSON.stringify(DEFAULT_PLAN.week['周六'].actions)){
          if(!changed){ snapshot('pre-migrate-v3.29'); changed = true; }
          sat.type = DEFAULT_PLAN.week['周六'].type;
        }
        if(changed) save();
      })();
      /* 本部署版迁移（v3.36-pro）：周计划按 67kg / 体脂 20% 画像重排。
         浏览器里若已有旧计划，上面的「合并新增动作」只补动作库，不会改周计划，
         用户打开看到的仍是旧排布（胸背容量偏低）。这里做一次性替换：
         仅在计划仍是「旧内置模板」时整周替换，用户自己改过的天不动（尊重自定义）。 */
      (function migrateDeployPlan(){
        const wk = data.plan && data.plan.week;
        if(!wk || data.planDeployMigrated) return;
        const LEGACY_FULL = {
          '周一':['a_push_dbpress','a_push_incline','a_push_1armsh','a_push_tricep','a_push_lat'],
          '周三':['a_pull_machine','a_pull_pulldown','a_pull_1armrow','a_pull_curl','a_pull_reverse'],
          '周五':['a_leg_stepup','a_leg_bulgarian','a_leg_curl','a_leg_slrdl','a_leg_slbridge','a_leg_calf']
        };
        let hit = false;
        Object.keys(LEGACY_FULL).forEach(day=>{
          const w = wk[day];
          if(w && Array.isArray(w.actions)
             && JSON.stringify(w.actions) === JSON.stringify(LEGACY_FULL[day])) hit = true;
        });
        if(hit){
          snapshot('pre-migrate-deploy-plan');   // 先留档，再改
          Object.keys(DEFAULT_PLAN.week).forEach(day=>{
            wk[day] = clone(DEFAULT_PLAN.week[day]);
          });
          data.plan.template = DEFAULT_PLAN.template;
          data.planDeployMigrated = true;
          save();
        } else {
          // 已是新计划或用户自定义：只打标记，不动内容
          data.planDeployMigrated = true;
          save();
        }
      })();
    }catch(e){ console.warn('迁移失败',e); }
    return data;
  }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(data));
      lastError = null;
      return true;
    }catch(e){
      // R7：写失败必须让用户知道，不能静默丢数据
      lastError = (e && e.name==='QuotaExceededError')
        ? '本地存储空间已满，本次改动未保存。请到「备份」页导出后清理旧备份。'
        : '保存失败：浏览器拒绝了写入（隐私模式或无痕窗口），本次改动不会保留。';
      console.warn(e);
      return false;
    }
  }
  function get(){ return data; }
  function set(mutator){
    mutator(data);
    const ok = save();
    if(!ok && typeof window!=='undefined' && window.__tm_onSaveError) window.__tm_onSaveError(lastError);
    return ok;
  }
  function reset(){ data = normalize(clone(DEFAULT_DATA)); save(); }
  function exportJSON(){ return JSON.stringify(data,null,2); }

  /* 导入（R5）：先验结构、后留档、再落地；结构非法一律拒绝，绝不静默重置 */
  function importJSON(str){
    const text = String(str==null?'':str).trim();
    if(!text) throw new Error('内容为空，请先粘贴导出的 JSON');
    let o;
    try{ o = JSON.parse(text); }
    catch(e){ throw new Error('JSON 语法错误：请检查是否为完整对象（以 { 开头、} 结尾）'); }
    if(o===null || typeof o!=='object' || Array.isArray(o)){
      throw new Error('这不是本系统的备份：顶层必须是对象，当前为 '
        + (o===null?'null':Array.isArray(o)?'数组':typeof o));
    }
    // 至少含一个已知业务键，避免 {} 或无关 JSON 被误判为合法备份
    const KNOWN = ['profile','library','plan','logs','metrics','diet','supps','herbs','releases','longevity','skincare'];
    if(!KNOWN.some(k=>Object.prototype.hasOwnProperty.call(o,k))){
      throw new Error('这不是本系统的备份：未找到任何已知字段（'+KNOWN.slice(0,4).join(' / ')+' …）');
    }
    snapshot('pre-import');           // 导入前留档，可回滚
    const before = clone(data);
    data = normalize(Object.assign(clone(DEFAULT_DATA), o));
    if(!save()){ data = before; throw new Error('写入失败，已回滚到导入前的数据'); }
    // 导入后跑一次迁移，补齐新增内置动作
    try{ load(); }catch(e){ console.warn('导入后迁移失败', e); }
    return true;
  }

  return {KEY,BACKUP_PREFIX,DEFAULT_DATA,DEFAULT_SUPPLEMENTS,DEFAULT_HERBS,DEFAULT_RELEASE,DEFAULT_LONGEVITY,DEFAULT_SKINCARE,
    load,save,get,set,reset,exportJSON,importJSON,normalize,snapshot,listBackups,restoreBackup,
    getLastError:()=>lastError, getLoadWarning:()=>loadWarning, clearLoadWarning:()=>{ loadWarning=null; },
    uid:()=> 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
})();
