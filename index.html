  /* ---- 数据/备份 ---- */
  const BACKUP_REASON = {'pre-import':'导入前自动留档','pre-migrate-v3.7':'版本迁移前自动留档','pre-migrate-v3.26':'版本迁移前自动留档','pre-migrate-v3.29':'版本迁移前自动留档','manual':'手动留档'};
  function dataView(){
    const backups = Store.listBackups();
    const lastBackup = Store.get().lastBackupAt;
    const stale = !lastBackup;
    appInner().innerHTML = `<div class="panel"><h2>数据 / 备份</h2>
      <p class="muted">所有数据保存在本机浏览器（localStorage），不上传。导入或版本迁移前系统会自动留档，最多保留最近 3 份。</p>
      <div class="card ${stale?'note-warn':'note-ok'}">
        <b>上次导出备份：${lastBackup? esc(lastBackup) : '从未导出'}</b>
        <p class="small mt-2">${stale
          ? '还没有导出过备份。本地存储一旦被浏览器清理（Safari 会清理 7 天未访问站点的数据）就无法恢复，建议立即导出一份并存到网盘。'
          : '浏览器清理本地存储后无法恢复，建议每月导出一次。'}</p>
      </div>
      <div class="btnrow">
        <button class="btn sm" id="exp">导出 JSON</button>
        <button class="btn ghost sm" id="imp">导入 JSON</button>
        <button class="btn ghost sm" id="snap">立即留档</button>
        <button class="btn danger sm" id="reset">恢复默认数据</button>
      </div>
      <textarea id="io" rows="8" class="mt-5" placeholder="导出内容将显示在此；导入时粘贴 JSON 后点导入"></textarea>
      <div class="field-err" id="io_err"></div>
      <h3 class="mt-7">本地自动留档（${backups.length}）</h3>
      <div id="backupList"></div>
    </div>`;
    renderBackupList();
    // pending 态：按钮 disabled + 文案变化（导出大 JSON / 导入解析时给出反馈）
    function busy(el,on,text){
      if(!el) return;
      if(on){ if(el.dataset.label==null) el.dataset.label=el.textContent; el.disabled=true; el.textContent=text; }
      else { el.disabled=false; if(el.dataset.label!=null) el.textContent=el.dataset.label; }
    }
    function nextFrame(fn){ requestAnimationFrame(()=>requestAnimationFrame(fn)); }
    function showIoErr(msg){ const box=$('#io_err'); if(box){ box.textContent=msg; box.classList.add('show'); } }
    function clearIoErr(){ const box=$('#io_err'); if(box){ box.textContent=''; box.classList.remove('show'); } }

    $('#exp').onclick=()=>{ const b=$('#exp'); busy(b,true,'导出中…');
      nextFrame(()=>{
        $('#io').value=Store.exportJSON();
        Store.set(d=>{ d.lastBackupAt = Util.localDate(); });   // R7：记录导出时间，供时效提醒
        busy(b,false); toast('已导出到文本框，请复制保存到文件或网盘','ok');
      }); };
    $('#imp').onclick=()=>{ const b=$('#imp'); clearIoErr(); busy(b,true,'导入中…');
      nextFrame(()=>{
        try{
          Store.importJSON($('#io').value);
          busy(b,false); toast('导入成功，已自动留档','ok'); cur='home'; render();
        }catch(e){
          busy(b,false);
          showIoErr(e && e.message ? e.message : String(e));   // R5：明确告知被拒原因
          toast('导入失败：数据未被修改','bad');
        }
      }); };
    $('#snap').onclick=()=>{ Store.snapshot('manual'); toast('已留档','ok'); cur='data'; render(); };
    $('#reset').onclick=()=>{
      confirmDel('确认恢复默认数据？当前记录将清空，且不可撤销。系统会先自动留一份档。', ()=>{
        const b=$('#reset'); busy(b,true,'重置中…');
        nextFrame(()=>{ Store.snapshot('manual'); Store.reset(); draftClearAll(); busy(b,false); toast('已重置','ok'); cur='home'; render(); });
      });
    };
  }
  function renderBackupList(){
    const box = $('#backupList'); if(!box) return;
    const list = Store.listBackups();
    if(!list.length){
      box.innerHTML = emptyState('还没有留档记录。导入数据或版本迁移时系统会自动先留一份', '<button class="btn ghost sm" data-scroll="snap">立即留档</button>');
      return;
    }
    box.innerHTML = '<div class="table-wrap"><table class="data"><thead><tr><th scope="col">留档时间</th><th scope="col">时机</th><th scope="col"></th></tr></thead><tbody>'+
      list.map(b=>'<tr><td data-label="时间">'+esc(b.at)+'</td>'+
        '<td data-label="时机">'+esc(BACKUP_REASON[b.reason]||b.reason||'—')+'</td>'+
        '<td data-label="操作"><button class="btn ghost sm" data-restore="'+esc(b.key)+'">恢复此份</button></td></tr>').join('')+
      '</tbody></table></div>';
  }

  /* ---- 事件委托 ---- */
  function bind(){
    window.addEventListener('scroll', ()=>{ scrollPos[cur]=window.scrollY; }, {passive:true});
    window.addEventListener('hashchange', ()=>{
      const h=(location.hash||'').replace(/^#\/?/,'');
      const btn=document.querySelector('#tabs .tab[data-tab="'+h+'"]');
      if(btn && h!==cur){ cur=h; render(); }
    });
    const tabsEl=$('#tabs');
    tabsEl.addEventListener('keydown',e=>{
      if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'&&e.key!=='Home'&&e.key!=='End')return;
      const btns=[].slice.call(tabsEl.querySelectorAll('.tab'));
      let i=btns.findIndex(b=>b.classList.contains('active'));
      if(e.key==='ArrowLeft') i=(i-1+btns.length)%btns.length;
      else if(e.key==='ArrowRight') i=(i+1)%btns.length;
      else if(e.key==='Home') i=0;
      else if(e.key==='End') i=btns.length-1;
      e.preventDefault();
      cur=btns[i].getAttribute('data-tab'); render();
      const nb=$('#tabs .tab.active'); if(nb&&nb.focus) nb.focus();
    });
    document.body.addEventListener('click',e=>{
      const dw=e.target.closest('[data-dismiss-warn]');
      if(dw){ Store.clearLoadWarning(); render(); return; }
      const rs=e.target.closest('[data-restore]');
      if(rs){
        const key=rs.getAttribute('data-restore');
        confirmDel('用这份留档覆盖当前全部数据？当前数据会先自动留档一份。', ()=>{
          Store.snapshot('manual');
          if(Store.restoreBackup(key)){ toast('已恢复该留档','ok'); cur='home'; render(); }
          else toast('恢复失败：留档内容不可读','bad');
        });
        return;
      }
      const bk=e.target.closest('[data-back]'); if(bk){ cur=bk.getAttribute('data-back'); render(); return; }
      /* 跳页 + 定位：data-goto-any="progress|sleepPanel" —— 先切页，再滚到该区块。
         进度页的睡眠/体测面板是这次从概览挪过去的，入口在首页四枚胶囊里。 */
      const ga=e.target.closest('[data-goto-any]');
      if(ga){
        const q=ga.getAttribute('data-goto-any').split('|');
        cur=q[0]; render();
        if(q[1]){ const el=document.getElementById(q[1]); if(el) el.scrollIntoView({block:'start'}); }
        return;
      }
      const t=e.target.closest('[data-tab]'); if(t){ cur=t.getAttribute('data-tab'); render(); return; }
      const cf=e.target.closest('[data-clear-filter]');
      if(cf){ const which=cf.getAttribute('data-clear-filter');
        if(which==='lib'){ const s=$('#libSearch'),c=$('#libCat'); if(s)s.value=''; if(c)c.value=''; renderLibList('',''); }
        else if(which==='supp'){ const f=$('#suppFilter'); if(f)f.value=''; renderSuppList(''); }
        else if(which==='herb'){ const f=$('#herbFilter'); if(f)f.value=''; renderHerbList(''); }
        else if(which==='rel'){ const f=$('#relFilter'); if(f)f.value=''; renderRelList(''); }
        else if(which==='long'){ const f=$('#longFilter'); if(f)f.value=''; renderLongList(''); }
        else if(which==='skin'){ const f=$('#skinFilter'); if(f)f.value=''; renderSkinList(''); }
        return;
      }
      const go=e.target.closest('[data-goto]'); if(go){ cur=go.getAttribute('data-goto'); render(); return; }
      const oa=e.target.closest('[data-open-act]');
      if(oa){ focusAct=oa.getAttribute('data-open-act'); cur='library'; render(); return; }
      const okb=e.target.closest('[data-open-kb]');
      if(okb){
        const p=okb.getAttribute('data-open-kb').split('|');
        focusKb={tab:p[0], id:p[1]}; cur=p[0]; render(); return;
      }
      /* 「我的事项」一键加入：todo 条目整条可点 → 入清单 + 局部刷新该模块
         （不整页 render，保护禁忌/术语表/查看全部的展开态） */
      const qa=e.target.closest('[data-quick-add]');
      if(qa){
        const p=qa.getAttribute('data-quick-add').split('|');
        const cfg=OV_MODS.filter(function(m){return m.tab===p[0];})[0];
        if(cfg && !cfg.mod.inMine(p[1])){
          cfg.mod.toggle(p[1]);
          toast('已加入「'+cfg.name+'」清单','ok');
          const box=qa.closest('.ov-mod');
          if(box) box.outerHTML=renderOvMod(cfg);
        }
        return;
      }
      const lm=e.target.closest('[data-lib-more]');
      if(lm){ libShowAll[lm.getAttribute('data-lib-more')]=true;
        renderLibList($('#libSearch').value,$('#libCat').value); return; }
      const sc=e.target.closest('[data-scroll]'); if(sc){ const el=document.getElementById(sc.getAttribute('data-scroll'));
        if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); return; }
      const ed=e.target.closest('[data-edit-day]'); if(ed){ editDay(ed.getAttribute('data-edit-day')); return; }
      const ea=e.target.closest('[data-edit-act]'); if(ea){ openActionForm(ea.getAttribute('data-edit-act')); return; }
      const da=e.target.closest('[data-del-act]');
      if(da){ const id=da.getAttribute('data-del-act');
        confirmDel('删除该动作？该操作不可撤销。', ()=>{ Library.remove(id); render(); }); return; }
      const dl=e.target.closest('[data-del-log]');
      if(dl){ const id=dl.getAttribute('data-del-log');
        confirmDel('删除这条训练记录？该操作不可撤销。', ()=>{ Log.remove(id); renderHistory(); }); return; }
      const dm=e.target.closest('[data-del-m]');
      if(dm){ const id=dm.getAttribute('data-del-m');
        confirmDel('删除这条体测记录？该操作不可撤销。', ()=>{ Progress.remove(id); renderFeedback(); renderChart(); renderMetricList(); }); return; }
      const dd=e.target.closest('[data-del-diet]');
      if(dd){ const id=dd.getAttribute('data-del-diet');
        confirmDel('删除这条饮食打卡？该操作不可撤销。', ()=>{ Diet.remove(id); renderDietFb(); renderDietMatrix(); renderDietList(); }); return; }
      if(handleMineToggle(e,{sel:'[data-toggle-supp]',attr:'data-toggle-supp',mod:Supplements,filterSel:'#suppFilter',render:renderSuppList,countSel:'#suppCount'})) return;
      if(handleMineToggle(e,{sel:'[data-toggle-herb]',attr:'data-toggle-herb',mod:Herbs,filterSel:'#herbFilter',render:renderHerbList,countSel:'#herbCount'})) return;
      if(handleMineToggle(e,{sel:'[data-toggle-release]',attr:'data-toggle-release',mod:Release,filterSel:'#relFilter',render:renderRelList,countSel:'#relCount'})) return;
      if(handleMineToggle(e,{sel:'[data-toggle-long]',attr:'data-toggle-long',mod:Longevity,filterSel:'#longFilter',render:renderLongList,countSel:'#longCount'})) return;
      if(handleMineToggle(e,{sel:'[data-toggle-skin]',attr:'data-toggle-skin',mod:Skin,filterSel:'#skinFilter',render:renderSkinList,countSel:'#skinCount'})) return;
    });
    const mn=document.getElementById('mobileNav');
    if(mn) mn.addEventListener('click',e=>{
      const b=e.target.closest('[data-tab]');
      if(!b) return;
      mn.querySelectorAll('button').forEach(x=>{const on=(x===b); x.classList.toggle('active',on);
        if(on) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current');});
      const sheet=document.getElementById('moreSheet'); if(sheet) sheet.hidden=true;
    });
    const moreBtn=document.getElementById('moreBtn');
    if(moreBtn) moreBtn.onclick=()=>{ const s=document.getElementById('moreSheet'); if(s) s.hidden=!s.hidden; };
    const moreClose=document.getElementById('moreClose');
    if(moreClose) moreClose.onclick=()=>{ const s=document.getElementById('moreSheet'); if(s) s.hidden=true; };
    const ms2=document.getElementById('moreSheet'); if(ms2) ms2.addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b){ ms2.hidden=true; const mn=document.getElementById('mobileNav'); if(mn) mn.querySelectorAll('button[data-tab]').forEach(x=>x.classList.toggle('active',x.getAttribute('data-tab')===b.getAttribute('data-tab'))); } if(e.target===ms2 || e.target.closest('.more-close')) ms2.hidden=true; });
    document.addEventListener('focusin',e=>{
      if(e.target && e.target.matches && e.target.matches('input,select,textarea')){
        const n=document.getElementById('mobileNav'); if(n) n.classList.add('kb-hidden');
      }
    });
    document.addEventListener('focusout',e=>{
      if(e.target && e.target.matches && e.target.matches('input,select,textarea')){
        setTimeout(()=>{ const a=document.activeElement; const n=document.getElementById('mobileNav');
          if(n && !(a && a.matches && a.matches('input,select,textarea'))) n.classList.remove('kb-hidden'); },120);
      }
    });
  }
  function editDay(day){
    const wk=Plan.get().week; const d=wk[day];
    const opts=Object.keys(Plan.types()).map(k=>'<option value="'+k+'"'+(k===d.type?' selected':'')+'>'+Plan.types()[k]+'</option>').join('');
    const picks=Library.list().map(a=>{
      const on=d.actions.indexOf(a.id)>=0;
      return '<label class="pick'+(on?' on':'')+'">'+
        '<input type="checkbox" value="'+esc(a.id)+'"'+(on?' checked':'')+'>'+
        '<span>'+esc(a.name)+'</span>'+
        '<span class="pick-cat">'+tag(a.cat)+'</span></label>';
    }).join('');
    appInner().innerHTML=`<div class="panel"><h2>编辑 ${esc(day)}</h2>
      <div class="field"><label for="ed_type">类型</label><select id="ed_type">${opts}</select></div>
      <p class="field-label" id="ed_actions_lb">选择动作（点卡片切换，可多选）</p>
      <div class="pick-list" id="ed_actions" role="group" aria-labelledby="ed_actions_lb">${picks}</div>
      <div class="btnrow"><button class="btn" id="ed_save">保存</button><button class="btn ghost" id="ed_back">返回</button></div>
    </div>`;
    // 整卡可点：同步 label 高亮态
    $('#ed_actions').addEventListener('change',e=>{
      const lb=e.target.closest('.pick'); if(lb) lb.classList.toggle('on',!!e.target.checked);
    });
    $('#ed_save').onclick=()=>{
      const actions=[].slice.call($('#ed_actions').querySelectorAll('input[type=checkbox]'))
        .filter(x=>x.checked).map(x=>x.value);
      Plan.setDay(day,{type:$('#ed_type').value,actions}); toast('已保存','ok'); cur='plan'; render();
    };
    $('#ed_back').onclick=()=>{ cur='plan'; render(); };
  }

  function init(){
    // R7：持久化失败时由 Store 回调到这里，让用户立刻知道改动没落盘
    // 主题：先按存储值应用，再初始化切换按钮（三态循环）
    Theme.init();
      (function bindThemeBtn(){
      const tb = $('#themeBtn');
      if(!tb) return;
      const paint = function(){
        tb.textContent = '主题：' + Theme.label();
        tb.setAttribute('aria-label', '切换主题，当前：' + Theme.label());
        tb.setAttribute('aria-haspopup', 'menu');
        if(!menu) tb.setAttribute('aria-expanded', 'false');
      };
      let menu = null;
      const close = function(){
        if(!menu) return;
        menu.remove(); menu = null;
        tb.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', onDoc, true);
        window.removeEventListener('scroll', onScroll, true);
      };
      const onDoc = function(ev){
        if(menu && !menu.contains(ev.target) && ev.target !== tb) close();
      };
      /* 菜单是 fixed 定位、只在打开时量一次坐标：页面一滚，它的视觉位置与
         可点区域就脱钩了（用户会点到下面的卡片）。滚动即关，比重新定位便宜。 */
      const onScroll = function(){ close(); };
      const open = function(){
        close();
        menu = document.createElement('div');
        menu.className = 'theme-menu';
        menu.setAttribute('role', 'menu');
        menu.innerHTML = Theme.list().map(function(o){
          return '<button type="button" role="menuitemradio" aria-checked="'+(Theme.get()===o.k)+'"'
            + ' data-thm="'+o.k+'" class="'+(Theme.get()===o.k?'on':'')+'">'
            + '<i class="sw" style="background:'+o.bg+';border-color:'+o.fg+'"></i>'+o.label+'</button>';
        }).join('');
        document.body.appendChild(menu);
        const r = tb.getBoundingClientRect();
        menu.style.top = (r.bottom + 6) + 'px';
        menu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
        menu.querySelectorAll('[data-thm]').forEach(function(b){
          b.onclick = function(){ Theme.set(b.getAttribute('data-thm')); paint(); close(); };
        });
        tb.setAttribute('aria-expanded', 'true');
        window.addEventListener('scroll', onScroll, {passive:true, capture:true});
        /* 焦点进入菜单（preventScroll：否则聚焦本身会触发一次 scroll 又把它关掉）。 */
        const cur = menu.querySelector('[data-thm].on') || menu.querySelector('[data-thm]');
        if(cur) try{ cur.focus({preventScroll:true}); }catch(e){ cur.focus(); }
        setTimeout(function(){ document.addEventListener('click', onDoc, true); }, 0);
      };
      paint();
      tb.onclick = function(){ menu ? close() : open(); };
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
    })();
    window.__tm_onSaveError = msg => toast(msg, 'bad');
    const verEl = $('#ver'); if(verEl) verEl.textContent = APP_VERSION;
    (function mobileGuard(){
      const apply=()=>{
        const narrow=(window.innerWidth||0)<=768;
        const touch=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
        document.body.classList.toggle('is-mobile', !!(narrow&&touch));
      };
      apply();
      window.addEventListener('resize',apply);
    })();
    Store.load(); Profile.applyRuntime(); bind(); SwipeTab.init();
    /* 启动定位：hash 优先；hash 缺失或非法时退回上次浏览的模块，最后才回落首页。
       这样「编辑按钮重新打开文件」不会把用户甩回概览。 */
    const k=String(location.hash||'').replace(/^#\/?/,'');
    const okk = kk => !!kk && !!Pages[kk];
    if(okk(k)) cur=k;
    else { const memo=TabMemo.read(); if(okk(memo)) cur=memo; }
    render();
    window.addEventListener('hashchange',onHashChange);
    let raf=null;
    window.addEventListener('resize',()=>{
      if(cur!=='progress'||raf) return;
      raf=requestAnimationFrame(()=>{ raf=null; if(cur==='progress'&&$('#chartBox')) renderChart(); });
    });
  }
  return {init,render,tabKeys,currentIndex,goIndex};
})();

/* ----------------------- 启动 ----------------------- */
UI.init();
</script>
