const BM_GROUP={chest:'push',deltoids:'push',triceps:'push',
  'upper-back':'pull','lower-back':'pull','trapezius':'pull','biceps':'pull','forearm':'pull',
  quadriceps:'legs',hamstring:'legs',gluteal:'legs',calves:'legs',adductors:'legs',
  abs:'core',obliques:'core'};
function bodyMap(level, opts){
  const o=opts||{};
  const lv=(typeof level==='function')?level:(g)=>level[g]||0;
  const d=BODY_PATHS;
  let out='';
  d.outline.forEach(o2=>{ out+=o2.d.map(x=>'<path d="'+x+'"/>').join(''); });
  let mus='';
  ['front','back'].forEach(side=>{
    d[side].forEach(it=>{
      const cls='l'+Math.max(0,Math.min(3, lv(BM_GROUP[it.s]||'')|0));
      (it.l||[]).concat(it.r||[]).concat(it.p||[]).forEach(x=>{ mus+='<path class="'+cls+'" d="'+x+'"/>'; });
    });
  });
  return '<svg class="bodymap '+(o.cls||'')+'" viewBox="'+d.vb+'" role="img" aria-label="'+(o.label||'肌群示意图')+'">'
    +'<g class="bm-base">'+out+'</g><g class="bm-muscles">'+mus+'</g></svg>';
}
function bmLevelsByDay(day){
  const d=Plan.get().week[day]; if(!d||!Array.isArray(d.actions)) return {};
  const lv={push:0,pull:0,legs:0,core:0}; let any=false;
  d.actions.forEach(id=>{ const a=Library.byId(id); if(!a) return;
    if(lv[a.cat]!=null){ lv[a.cat]=2; any=true; } });
  if(!any && d.actions.length){ lv.push=1; lv.pull=1; lv.legs=1; lv.core=1; }
  return lv;
}
function bmWeekVolume(){
  const since=new Date(); since.setDate(since.getDate()-6);
  const from=Util.localDate(since), by={push:0,pull:0,legs:0,core:0};
  (Store.get().logs||[]).forEach(l=>{
    if(!l.date||l.date<from) return;
    (l.entries||[]).forEach(e=>{
      const a=Library.byId(e.actionId); if(!a) return;
      if(by[a.cat]!=null) by[a.cat]+=(e.sets||[]).length||0;
    });
  });
  return by;
}
function bmRecoveryDays(){
  const by={push:null,pull:null,legs:null,core:null};
  const today=Util.localDate();
  (Store.get().logs||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(l=>{
    (l.entries||[]).forEach(e=>{
      const a=Library.byId(e.actionId); if(!a) return;
      /* 只在这个肌群还没记到过时写入（by 初值为 null，不是 undefined） */
      if(by[a.cat]===undefined || by[a.cat]!==null) return;
      by[a.cat]=Math.round((new Date(today)-new Date(l.date))/864e5);
    });
  });
  return by;
}
function bmLevelsOf(mode){
  const lvl=n=> n>=9?3:(n>=4?2:(n>=1?1:0));
  if(mode==='recovery'){
    const d=bmRecoveryDays(), one=x=> x===null?0:(x<=0?3:(x<=1?2:(x<=2?1:0)));
    return {push:one(d.push),pull:one(d.pull),legs:one(d.legs),core:one(d.core)};
  }
  const v=bmWeekVolume();
  if(mode==='untrained'){ const z=n=> n?0:3;
    return {push:z(v.push),pull:z(v.pull),legs:z(v.legs),core:z(v.core)}; }
  return {push:lvl(v.push),pull:lvl(v.pull),legs:lvl(v.legs),core:lvl(v.core)};
}

/* ----------------------- 模块: Library (动作库) ----------------------- */
const Library = (function(){
  const CATS = [
    {k:'push',label:'推'},{k:'pull',label:'拉'},{k:'legs',label:'腿'},
    {k:'core',label:'核心'},{k:'cardio',label:'有氧/功法'},{k:'mob',label:'功能/稳定'}
  ];
  const CAT_CLS = {push:'c1',pull:'c6',legs:'c4',core:'c7',cardio:'c2',mob:'c5'};
  function list(){ return Store.get().library; }
  function byId(id){ return list().find(a=>a.id===id); }
  function add(a){ Store.set(d=>{ d.library.push(Object.assign({id:Store.uid()},a)); }); }
  function update(id, patch){ Store.set(d=>{ const x=d.library.find(a=>a.id===id); if(x)Object.assign(x,patch); }); }
  function remove(id){
    Store.set(d=>{
      d.library = d.library.filter(a=>a.id!==id);
      // R6：内置动作无法物理删除（load 会补回），必须记入黑名单才算真正移除
      const isBuiltin = Store.DEFAULT_DATA.library.some(a=>a.id===id);
      if(isBuiltin){
        if(!Array.isArray(d.removedBuiltin)) d.removedBuiltin = [];
        if(d.removedBuiltin.indexOf(id)<0) d.removedBuiltin.push(id);
      }
      // 同步清理计划中的悬挂引用，避免界面残留"已删"占位
      Object.keys(d.plan.week).forEach(day=>{
        const w = d.plan.week[day];
        if(w && Array.isArray(w.actions)) w.actions = w.actions.filter(x=>x!==id);
      });
    });
  }
  function catLabel(k){ const c=CATS.find(c=>c.k===k); return c?c.label:'其他'; }
  function catCls(k){ return CAT_CLS[k]||'c0'; }
  return {CATS,CAT_CLS,list,byId,add,update,remove,catLabel,catCls};
})();

/* ----------------------- 模块: Plan (计划制定) ----------------------- */
const Plan = (function(){
  function get(){ return Store.get().plan; }
  function setDay(dayKey, dayObj){ Store.set(d=>{ d.plan.week[dayKey]=dayObj; }); }
  /* 训练日类型字典 —— 显示层唯一术语源。
     任何 UI 文案一律引用本表，不得另写同义文案（历史上「主动恢复/活动度/柔韧/松解」四词混用）。
     注：active 原为「主动恢复 + 活动度」，去掉「+ 活动度」——活动度是动作属性（关节可活动幅度），
     不是日类型；且真实衡量活动度的数据（坐位体前屈 / 深蹲髋高）由 Body.flexList() 承载。 */
  function types(){ return {push:'推 (胸肩三头)',pull:'拉 (背二头)',legs:'腿 (股四腘绳臀)',core:'核心',cardio:'有氧/功法',func:'功能稳定 + 有氧',active:'主动恢复',fcore:'功能核心 + 有氧',rest:'休息'}; }
  /* 类型性质：resistance=抗阻日 / mixed=抗阻+有氧混合日 / active=主动恢复日 / cardio=有氧日 / rest=休息日
     用途：替代散落在渲染层的硬编码类型正则（如判断某日是否适用 8-15 RM），新增类型时不会漏判 */
  const TYPE_KIND={push:'resistance',pull:'resistance',legs:'resistance',core:'resistance',
                   func:'mixed',fcore:'mixed',cardio:'cardio',active:'active',rest:'rest'};
  function typeKind(k){ return TYPE_KIND[k]||'rest'; }
  return {get,setDay,types,typeKind};
})();

/* ----------------------- 模块: Log (记录追踪) ----------------------- */
const Log = (function(){
  function list(){ return Store.get().logs.slice().sort((a,b)=> b.date.localeCompare(a.date)); }
  function add(log){ Store.set(d=>{ d.logs.push(log); }); }
  function remove(id){ Store.set(d=>{ d.logs=d.logs.filter(l=>l.id!==id); }); }
  function thisWeekCount(){
    const mondayStr = Util.localDate(Util.mondayOf());
    return list().filter(l=> typeof l.date==='string' && l.date >= mondayStr).length;
  }
  /* 本周抗阻训练次数：只数「抗阻日」的记录（push/pull/legs/core），
     function 日与主动恢复日不计入。
     原实现只有一个 thisWeekCount（任意记录都算一次），而本部署版周计划是
     3 抗阻日 + 2 混合日 + 1 主动恢复日 = 6 个非休息日，
     练满 6 天会显示「6 次（目标 3-4）」永远超标，稳定度评分也失真。
     现按 Plan.typeKind 分开统计，抗阻次数与活动次数各自有对应目标。 */
  /* 这一场「是什么类型」应当由实际练了什么决定，而不是记录上那个 dayType：
     dayType 取自「打开表单时选中的周几」，历史数据里存在错值（周计划按周几存，
     而旧版记录页初始把 #logDay 留在第一个选项上），动作 id 却是用户真练出来的东西。
     一条动作都解析不出来时（旧导入数据 / 动作库改过 id）才回落到标签。 */
  function sessionType(l){
    const cnt = {}, order = [];
    ((l && l.entries) || []).forEach(e => {
      const a = Library.byId(e && (e.actionId || e.id));
      if (!a || !a.cat) return;
      if (!(a.cat in cnt)) { cnt[a.cat] = 0; order.push(a.cat); }
      cnt[a.cat]++;
    });
    if (order.length) { order.sort((x, y) => cnt[y] - cnt[x]); return order[0]; }
    return (l && l.dayType) || '';
  }
  function isResist(l){ return Plan.typeKind(sessionType(l)) === 'resistance'; }
  function thisWeekResistCount(){
    const mondayStr = Util.localDate(Util.mondayOf());
    return list().filter(l=> typeof l.date==='string' && l.date >= mondayStr && isResist(l)).length;
  }
  return {list, add, remove, thisWeekCount, thisWeekResistCount, sessionType, isResist};
})();

/* ----------------------- 模块: Progress (进度反馈) ----------------------- */
const Progress = (function(){
  function list(){ return Store.get().metrics.slice().sort((a,b)=> a.date.localeCompare(b.date)); }
  function add(m){ Store.set(d=>{
    /* 同一天重复录入应覆盖，而不是追加：否则「最近一次体测」会取到同日的旧值，
       趋势图也会出现同一天两个点。 */
    const i=d.metrics.findIndex(x=>x && x.date===m.date);
    if(i>=0) d.metrics[i]=m; else d.metrics.push(m);
    /* profile 里的体重/体脂保持与最新体测一致，导出备份时不会出现两套数字。 */
    if(!d.profile) d.profile = {};
    if(m.weight != null) d.profile.weight = m.weight;
    if(m.bodyfat != null) d.profile.bodyfat = m.bodyfat;
  }); }
  function remove(id){ Store.set(d=>{ d.metrics=d.metrics.filter(x=>x.id!==id); }); }
  // R4：取某字段的「首末有效点」，跳过 null。
  // 旧实现直接做 last.weight-first.weight，未测量（null）会被当成 0 参与算术，
  // 例如 [70, null] 会得出 dw=-70，凭空生成"体重下降 70kg"的减脂结论。
  function span(ms, key){
    const pts = ms.filter(m=> m[key]!=null && isFinite(m[key]));
    if(pts.length<2) return null;
    const from = pts[0][key], to = pts[pts.length-1][key];
    return {from, to, delta: +(to-from).toFixed(2), n: pts.length};
  }
  function fmtDelta(d, unit){
    if(d===0) return '持平';
    return (d>0?'+':'') + d + unit;
  }
  function feedback(){
    const ms = list();
    if(ms.length<2) return {trend:'数据不足',msg:'至少录入 2 次体测才能生成趋势反馈。建议每 2 周记录一次体重/体脂/腰围。',level:'mut',missing:[]};
    const last = ms[ms.length-1];
    const w = span(ms,'weight'), f = span(ms,'bodyfat'), k = span(ms,'waist');
    const missing = [];
    if(!w) missing.push('体重'); if(!f) missing.push('体脂'); if(!k) missing.push('腰围');
    const msg=[]; let level='ok';
    // 只有体重与体脂都各有 ≥2 个有效点时才做交叉判定，数据不足时明确拒答
    if(w && f){
      if(w.delta<0 && f.delta<0){ msg.push('体重与体脂同步下降，处于减脂正轨，且未出现明显反弹。'); }
      else if(w.delta<0 && f.delta>=0){ msg.push('体重下降但体脂未降，警惕肌肉流失——蛋白是否拉满(训练日 ≥'+Diet.TARGET.proTrain+'g)？力量训练有没落下？'); level='warn'; }
      else if(w.delta>=0 && f.delta<0){ msg.push('体重持平但体脂下降，说明在保肌/增肌同时刷脂，是理想的身体重组(recomp)信号。'); }
      else { msg.push('体重与体脂均上升，热量缺口可能没守住或水肿，检查近两周饮食与睡眠。'); level='bad'; }
      msg.push('体重 '+w.from+' → '+w.to+' kg（'+fmtDelta(w.delta,'kg')+'），体脂 '+f.from+' → '+f.to+'%（'+fmtDelta(f.delta,'%')+'）。');
    } else {
      level='warn';
      msg.push('有效数据点不足（缺 '+missing.join('、')+'，各项需至少 2 次有效记录），本次不生成减脂结论，以免误判。');
      if(w) msg.push('体重 '+w.from+' → '+w.to+' kg（'+fmtDelta(w.delta,'kg')+'）。');
      if(f) msg.push('体脂 '+f.from+' → '+f.to+'%（'+fmtDelta(f.delta,'%')+'）。');
    }
    if(k) msg.push('腰围 '+k.from+' → '+k.to+' cm（'+fmtDelta(k.delta,'cm')+'）。');
    const logs = Log.thisWeekResistCount();
    msg.push('本周抗阻已训练 '+logs+' 次（薄肌目标建议 3 次/周，功能日另计）。');
    if(logs<3) { msg.push('抗阻频率偏低，建议补足推/拉/腿至少各 1 次。'); if(level==='ok')level='warn'; }
    return {trend:'最近一次 '+last.date, msg:msg.join(' '), level, missing};
  }
  return {list,add,remove,feedback,span};
})();

/* ----------------------- 模块: Diet (饮食打卡) ----------------------- */
const Diet = (function(){
  // 目标锚点：减脂保肌处方 v3.38-cut —— 尽快降体脂、尽量不掉肌肉。
  // 本部署版按画像 30 岁 / 175cm / 67kg / 体脂 20% 实算：
  //   BMR(Mifflin) = 10×67 + 6.25×175 − 5×30 + 5 ≈ 1619 kcal
  //   TDEE = BMR × 1.5 ≈ 2450 kcal（每周 3-4 次抗阻）
  //   缺口 -500~-670 → 训练日 1950 / 休息日 1780 kcal（对应每周 0.45-0.6 kg 纯脂肪，再快就吃到瘦体重）
  //   蛋白 2.3 g/kg 体重、2.9 g/kg 瘦体重（减脂期保肌上沿）→ 训练日与休息日同为 155g
  //   脂肪下限 50g，碳水承担热量差额（训练日 200g / 休息日 150g）
  // 仍可用 profile.local.js 的 window.__TM_TARGETS__ 覆盖为实测值。
  const TARGET = Object.assign({}, TARGET_LOCK,
    (typeof window !== 'undefined' && window.__TM_TARGETS__) || {});
  const FLAGS = [
    {k:'oil',label:'油脂≥15% (5-10ml好油)'},
    {k:'nosugar',label:'无含糖饮料/甜点'},
    {k:'veg',label:'蔬菜≥500g'}
  ];
  function list(){ return Store.get().diet.slice().sort((a,b)=> b.date.localeCompare(a.date)); }
  function add(m){ Store.set(d=>{ const i=d.diet.findIndex(x=>x.date===m.date); if(i>=0)d.diet[i]=m; else d.diet.push(m); }); }
  function remove(id){ Store.set(d=>{ d.diet=d.diet.filter(x=>x.id!==id); }); }
  function byDate(date){ return list().find(x=>x.date===date); }
  /* 训练日判定：当天有训练记录，或计划里当天排了抗阻日，都算训练日。
     原实现只看 logs，导致「计划今天是拉日但还没去练」时蛋白门槛被按休息日算（120g），
     低于该用的训练日门槛（145g）——新用户第一个训练日必然踩这个坑。 */
  const PLAN_TRAIN_TYPES = ['push','pull','legs','func','fcore'];
  function plannedTrain(date){
    try{
      const wk = Store.get().plan && Store.get().plan.week;
      if(!wk) return false;
      const labels=['周日','周一','周二','周三','周四','周五','周六'];
      const day = labels[new Date(date+'T00:00:00').getDay()];
      const w = wk[day];
      return !!(w && PLAN_TRAIN_TYPES.indexOf(w.type)>=0 && Array.isArray(w.actions) && w.actions.length>0);
    }catch(e){ return false; }
  }
  function isTrainDate(date){ return Store.get().logs.some(l=>l.date===date) || plannedTrain(date); }
  function match(m){
    const isTrain=isTrainDate(m.date);
    const proTarget=isTrain?TARGET.proTrain:TARGET.proRest;
    // R10：热量未填必须显式暴露。旧实现下 kcal=0 既不触发"超标"也不触发"偏低"，
    // level 会停在 ok 且消息为空，渲染出一个绿色空提示块。
    const kcalMissing = !m.kcal || m.kcal<=0;
    const kcalOK = !kcalMissing && m.kcal>=TARGET.kcalMin && m.kcal<=TARGET.kcalMax;
    const proOK = m.protein>=proTarget;
    let level='ok'; const msgs=[];
    if(kcalMissing){ level='warn'; msgs.push('热量未填写，无法判定缺口'); }
    else if(m.kcal>TARGET.kcalMax){ level='bad'; msgs.push('热量超标 '+(m.kcal-TARGET.kcalMax)+' kcal，缺口没守住'); }
    else if(m.kcal<TARGET.kcalMin){ level=isTrain?'bad':'warn'; msgs.push('摄入偏低 '+(TARGET.kcalMin-m.kcal)+' kcal，缺口过大易掉肌'); }
    if(!proOK){ msgs.push('蛋白未达标 (今日目标 '+proTarget+'g'+(isTrain?'，训练日':'')+')'); if(level==='ok')level=isTrain?'bad':'warn'; }
    if(kcalOK&&proOK) msgs.push(isTrain?'训练日：热量+蛋白双达标，保肌窗口稳':'休息日：达标，缺口维持');
    if(!msgs.length) msgs.push('已记录，但数据不完整');   // 兜底：绝不产生空提示
    return {isTrain,kcalOK,proOK,proTarget,level,msg:msgs.join('；')};
  }
  function weekMatrix(){
    const days=[]; const now=new Date();
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(Util.localDate(d)); }
    return days.map(date=>{ const rec=byDate(date); return {date, rec, train:isTrainDate(date), m:rec?match(rec):null}; });
  }
  function feedback(){
    const wm=weekMatrix(); const logged=wm.filter(x=>x.rec);
    if(!logged.length) return {level:'muted',msg:'近 7 天还没有饮食打卡，从今天开始记录。'};
    const good=logged.filter(x=>x.m.level==='ok').length;
    const pct=Math.round(good/logged.length*100);
    let level = pct>=70?'ok':pct>=40?'warn':'bad';
    let msg='近 7 天打卡 '+logged.length+' 天，达标率 '+pct+'%。';
    const noOil=logged.filter(x=>!(x.rec.flags||[]).includes('oil')).length;
    if(noOil>2) msg+=noOil+' 天油脂未补，长期无油会掉代谢，晚餐补 5-10ml 好油。';
    const sug=logged.filter(x=>!(x.rec.flags||[]).includes('nosugar')).length;
    if(sug>0) msg+=sug+' 天有糖分破防，注意隐形糖（果汁/乳酸菌饮料）。';
    const trainMiss=wm.filter(x=>x.train&&x.rec&&!x.m.proOK).length;
    if(trainMiss>0){ msg+='有 '+trainMiss+' 个训练日蛋白没够，保肌窗口是最不能丢的。'; if(level==='ok')level='warn'; }
    if(level==='ok') msg+='吃练节奏咬合得不错，继续保持。';
    const win=wm.filter(x=>x.rec&&x.rec.firstmeal&&x.rec.lastmeal);
    if(win.length){
      const toMin=t=>{const p=String(t).split(':');return (+p[0])*60+(+p[1]);};
      const hs=win.map(x=>{let s=toMin(x.rec.lastmeal)-toMin(x.rec.firstmeal); if(s<=0)s+=1440; return s/60;});
      const avg=Math.round(hs.reduce((a,b)=>a+b,0)/hs.length*10)/10;
      msg+=' 近 '+win.length+' 天平均进食窗 '+avg+'h（目标 ≤12h，末餐建议 20:00 前）。';
    }
    return {level,msg};
  }
  return {TARGET,FLAGS,list,add,remove,byDate,isTrainDate,match,weekMatrix,feedback};
})();

/* ----------------------- 模块: Profile (可编辑画像) -----------------------
 * 画像的单一真相：
 *   Store.profile   —— 年龄/性别/身高/目标等用户显式保存的值
 *   metrics[]       —— 身体数据页的体测历史；体重/体脂取「最近一次有效值」
 * 两者合并后才写回 PERSONAL，并重算 DERIVED 与 Diet.TARGET。
 * 这样「我的」可编辑、体测页录入能回显，首页/饮食/周报也不用改读取口径。
 * -------------------------------------------------------------------------- */
const Profile = (function(){
  const KEYS = ['age','sex','height','weight','bodyfat','goal','goalWeight','name','city','tdee'];
  const RANGES = {age:[12,100], height:[120,230], weight:[30,250], bodyfat:[3,60], goalWeight:[30,250]};

  function cleanNumber(v, key, fallback){
    const n = Number(v);
    return (isFinite(n) && n >= RANGES[key][0] && n <= RANGES[key][1]) ? n : fallback;
  }
  function latestMetric(key){
    const rows = (Store.get().metrics || [])
      .filter(function(m){ return m && m[key] != null && isFinite(Number(m[key])); })
      .slice()
      .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    return rows.length ? Number(rows[rows.length-1][key]) : null;
  }
  function latestMetricDate(){
    const rows = (Store.get().metrics || []).slice()
      .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    return rows.length ? rows[rows.length-1].date : null;
  }
  function current(){
    const raw = Store.get().profile || {};
    const w = latestMetric('weight');
    const f = latestMetric('bodyfat');
    return {
      age: cleanNumber(raw.age, 'age', PROFILE_DEFAULT.age),
      sex: raw.sex === '女' ? '女' : '男',
      height: cleanNumber(raw.height, 'height', PROFILE_DEFAULT.height),
      weight: w != null ? w : cleanNumber(raw.weight, 'weight', PROFILE_DEFAULT.weight),
      bodyfat: f != null ? f : cleanNumber(raw.bodyfat, 'bodyfat', PROFILE_DEFAULT.bodyfat),
      goal: goalCanon(raw.goal) || PROFILE_DEFAULT.goal,
      goalWeight: cleanNumber(raw.goalWeight, 'goalWeight', PROFILE_DEFAULT.goalWeight),
      name: typeof raw.name === 'string' ? raw.name : '',
      city: typeof raw.city === 'string' ? raw.city : '',
      tdee: (raw.tdee != null && isFinite(Number(raw.tdee)) && Number(raw.tdee) > 0) ? Math.round(Number(raw.tdee)) : null
    };
  }

  /* 饮食目标跟随画像：沿用原来的缺口（休息 -670 / 训练 -500）与蛋白 2.3 g/kg，
     只把基数换成当前 TDEE/体重，避免「画像改了但饮食页还写 1780–1950」的假联动。 */
  function syncDietTarget(){
    if(typeof Diet === 'undefined' || !Diet.TARGET) return;
    /* profile.local.js 明确给了实测目标时以它为准，不被画像重算覆盖。 */
    if(typeof window !== 'undefined' && window.__TM_TARGETS__) return;
    const t = Number(DERIVED.tdee) || TARGET_LOCK.tdee || 2450;
    const rest = Math.max(1200, Math.round((t - 670) / 10) * 10);
    const train = Math.max(1400, Math.round((t - 500) / 10) * 10);
    const pro = Math.max(60, Math.round((Number(PERSONAL.weight) || 0) * 2.3 / 5) * 5);
    Object.assign(Diet.TARGET, {
      kcalMin: rest, kcalMax: train, kcalRest: rest, kcalTrain: train,
      proTrain: pro, proRest: pro, tdee: t
    });
  }
  function applyRuntime(){
    const p = current();
    KEYS.forEach(function(k){ PERSONAL[k] = p[k]; });
    recalcDerived();
    syncDietTarget();
  }

  function validate(p){
    const errs = {};
    Object.keys(RANGES).forEach(function(k){
      const v = Number(p[k]);
      if(!isFinite(v) || v < RANGES[k][0] || v > RANGES[k][1]) errs[k] = '超出范围（' + RANGES[k][0] + '–' + RANGES[k][1] + '）';
    });
    if(!p.goal) errs.goal = '请选择一个目标，或自己写一句';
    if(p.goal && String(p.goal).length > 40) errs.goal = '目标最多 40 字';
    return Object.keys(errs).length ? errs : null;
  }

  /* 保存：年龄/身高/目标写 profile；体重/体脂变化同时写今天的体测，
     这样「我的」与「身体数据」是同一份数字，而不是两套各说各话。 */
  function save(patch){
    const before = current();
    const next = Object.assign({}, before, patch || {});
    next.age = Number(next.age); next.height = Number(next.height);
    next.weight = Number(next.weight); next.bodyfat = Number(next.bodyfat);
    next.goalWeight = Number(next.goalWeight);
    const errs = validate(next);
    if(errs) return {ok:false, errors:errs};

    const weightChanged = next.weight !== before.weight;
    const bfChanged = next.bodyfat !== before.bodyfat;
    const ok = Store.set(function(d){
      d.profile = Object.assign({}, d.profile || {}, {
        age: next.age, sex: next.sex === '女' ? '女' : '男', height: next.height,
        weight: next.weight, bodyfat: next.bodyfat, goal: next.goal,
        goalWeight: next.goalWeight, name: next.name || '', city: next.city || '',
        tdee: next.tdee == null ? null : next.tdee
      });
      if(weightChanged || bfChanged){
        if(!Array.isArray(d.metrics)) d.metrics = [];
        const date = Util.localDate();
        const i = d.metrics.findIndex(function(m){ return m && m.date === date; });
        if(i >= 0){
          d.metrics[i].weight = next.weight;
          d.metrics[i].bodyfat = next.bodyfat;
        }else{
          d.metrics.push({id:Store.uid(), date:date, weight:next.weight, bodyfat:next.bodyfat, waist:null, restinghr:null});
        }
      }
    });
    if(!ok) return {ok:false, errors:{_:'保存失败：浏览器存储不可写'}};
    applyRuntime();
    return {ok:true};
  }

  return {current, save, applyRuntime, latestMetric, latestMetricDate, validate};
})();

/* ----------------------- 模块: Body (睡眠 / 柔韧 / 舌象) ----------------------- */
const Body = (function(){
  function sleepList(){ return Store.get().sleep.slice().sort((a,b)=> b.date.localeCompare(a.date)); }
  function sleepAdd(m){ Store.set(d=>{ const i=d.sleep.findIndex(x=>x.date===m.date); if(i>=0)d.sleep[i]=m; else d.sleep.push(m); }); }
  function sleepLatest(){ const l=sleepList(); return l[0]||null; }
  /* 昨夜睡眠是否不足（<6h）：记录超过 1.5 天视为过期，不参与联动 */
  function sleepLow(){
    const s=sleepLatest(); if(!s) return null;
    const gap=(new Date(Util.localDate())-new Date(s.date))/864e5;
    if(gap>1.5) return null;
    return (s.hours>0 && s.hours<6) ? {hours:s.hours,quality:s.quality} : null;
  }
  function flexList(){ return Store.get().flex.slice().sort((a,b)=> b.date.localeCompare(a.date)); }
  function flexAdd(m){ Store.set(d=>{ const i=d.flex.findIndex(x=>x.date===m.date); if(i>=0)d.flex[i]=m; else d.flex.push(m); }); }
  function tongueList(){ return Store.get().tongue.slice().sort((a,b)=> b.date.localeCompare(a.date)); }
  function tongueAdd(m){ Store.set(d=>{ const i=d.tongue.findIndex(x=>x.date===m.date); if(i>=0)d.tongue[i]=m; else d.tongue.push(m); }); }
  function tongueRemove(id){ Store.set(d=>{ d.tongue=d.tongue.filter(x=>x.id!==id); }); }
  /* ---- 日步数（NEAT）：减脂期最容易被忽略、也最容易补的缺口来源 ---- */
  function stepsList(){ return (Store.get().steps||[]).slice().sort((a,b)=> b.date.localeCompare(a.date)); }
  function stepsAdd(m){ Store.set(d=>{ if(!Array.isArray(d.steps)) d.steps=[]; const i=d.steps.findIndex(x=>x.date===m.date); if(i>=0)d.steps[i]=m; else d.steps.push(m); }); }
  function stepsToday(){ const k=Util.localDate(); return stepsList().find(x=>x.date===k)||null; }
  function stepsWeekAvg(){
    const now=new Date(); const days=[], vals=[];
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(Util.localDate(d)); }
    days.forEach(dt=>{ const r=stepsList().find(x=>x.date===dt); if(r && r.steps) vals.push(r.steps); });
    if(!vals.length) return null;
    return Math.round(vals.reduce((a,b)=>(a)+(b),0)/vals.length);
  }
  return {sleepList,sleepAdd,sleepLatest,sleepLow,flexList,flexAdd,tongueList,tongueAdd,tongueRemove,
          stepsList,stepsAdd,stepsToday,stepsWeekAvg};
})();

/* ----------------------- 模块: Foods (食物库) ----------------------- */
const Foods = (function(){
  function list(q){
    const all=Store.get().foods.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh'));
    if(!q) return all;
    return all.filter(f=>f.name.indexOf(q)>=0);
  }
  function add(f){ Store.set(d=>{ if(d.foods.some(x=>x.id===f.id)) return; d.foods.push(f); }); }
  function byId(id){ return Store.get().foods.find(f=>f.id===id); }
  return {list,add,byId};

/* ----------------------- 模块: Adapt (自适应渐进 + 周容量) -----------------------
 * 规则透明写死（调参改这里）：
 *   上次 e1RM ≥ 前高×1.02 → 重量 +2.5%（四舍五入到 0.5kg）
 *   上次达前高但未上探   → 维持（可加 1 次或 1 组）
 *   上次未达前高         → 维持，动作质量优先
 *   距上次 ≥5 天         → 恢复性回归（组次减半热身）
 *   昨夜睡眠 <6h         → 目标重量再 -10%
 * e1RM 近似 = w × (1 + reps/30)（Epley），仅用于同动作组间/次间比较
 * ------------------------------------------------------------------------------ */
const Adapt = (function(){
  const PCT_UP = 0.025, SLEEP_PENALTY = 0.10, REST_GAP_DAYS = 5;
  function bestOf(entry){
    if(!entry || !Array.isArray(entry.sets)) return {v:0,w:0,reps:0};
    return entry.sets.reduce((m,s)=>{ const v=(s.weight||0)*(1+(s.reps||0)/30); return v>m.v ? {v:v,w:s.weight,reps:s.reps} : m; }, {v:0,w:0,reps:0});
  }
  function history(actionId){
    const logs=Store.get().logs
      .filter(l=>l.entries.some(e=>e.actionId===actionId))
      .sort((a,b)=> b.date.localeCompare(a.date));
    if(!logs.length) return null;
    const pick=l=>bestOf(l.entries.find(e=>e.actionId===actionId));
    const last={date:logs[0].date, best:pick(logs[0])};
    const prev=logs[1]?{date:logs[1].date, best:pick(logs[1])}:null;
    const gapDays=Math.round((new Date(Util.localDate())-new Date(last.date))/864e5);
    return {last,prev,gapDays};
  }
  function round05(x){ return Math.round(x*2)/2; }
  function suggestion(actionId){
    const a=Library.byId(actionId)||{sets:3,reps:'12-15'};
    const rec=history(actionId);
    if(!rec) return {kind:'first',actionId,target:null,msg:'首练：按动作库预设 '+a.sets+' 组 × '+a.reps+'，重量选「能标准完成全部组次」'};
    const w=rec.last.best.w;
    if(!w) return {kind:'first',actionId,target:null,msg:'上次未记录重量：今天用轻重量重建基线（12-15 次能标准完成）'};
    let target=w, why='';
    if(rec.prev && rec.last.best.v >= rec.prev.best.v*1.02){
      target=round05(w*(1+PCT_UP)); why='上次 '+w+'kg 优于前高 → +2.5% 上探';
    } else if(rec.prev && rec.last.best.v >= rec.prev.best.v){
      why='上次 '+w+'kg 稳定达标 → 维持，可加 1 次或 1 组';
    } else if(rec.prev){
      why='上次 '+w+'kg 未达前高 → 维持，把动作质量做满';
    } else {
      why='仅有一条记录 → 维持 '+w+'kg 建立基准';
    }
    if(rec.gapDays>=REST_GAP_DAYS){ why='这个动作 '+rec.gapDays+' 天没练 → 恢复性回归 '+target+'kg（组次减半热身）'; }
    const parts=[];
    const low=Body.sleepLow();
    if(low){ target=round05(target*(1-SLEEP_PENALTY)); parts.push('昨夜睡眠 '+low.hours+'h（<6h）→ 已下调 10%'); }
    parts.push(why);
    return {kind:'plan',actionId,target:target,msg:'今天 '+target+'kg（'+parts.join('；')+'）'};
  }
  /* 肌群归类：muscles+名称关键词 → 六大抗阻肌群（仪表只看抗阻，功法/有氧不计入）
     P1-归类修正（三处顺序错误，会让周容量仪表统计失真）：
       1. 「反向飞鸟」练三角肌后束，原规则先命中 /飞鸟/ 判成胸 → 改为肩优先。
       2. 「俯卧腿弯举」练腘绳肌，原规则先命中 /弯举/ 判成臂 → 改为腿优先于臂。
       3. 「单腿罗马尼亚硬拉」肌肉名含「平衡/本体感觉」，原规则先命中 /平衡/ 判成柔韧
          → 把「平衡」从柔韧关键词移除，仅保留真正的拉伸/活动度类词。 */
  function muscleOf(a){
    if(a && a.cat==='mob') return 'flex';
    if(a && a.cat==='cardio') return 'cardio';
    const str=((a&&a.muscles)||'')+' '+((a&&a.name)||'');
    if(/拉伸|柔韧|活动度|八段锦|太极|功法|松解/.test(str)) return 'flex';
    if(/有氧|心率|快走|慢跑|跳绳|开合跳|楼梯机|骑车/.test(str)) return 'cardio';
    if(/后束|反向飞鸟|侧平举|肩|推举|面拉|耸肩/.test(str)) return 'shoulder';
    if(/胸|卧推|飞鸟|俯卧撑|夹胸|上斜|臂屈伸/.test(str)) return 'chest';
    if(/背|划船|引体|下拉/.test(str)) return 'back';
    if(/蹲|腿|臀|箭步|提踵|硬拉|髋|蚌式|臀桥|小腿|腘绳|股四/.test(str)) return 'legs';
    if(/弯举|臂|三头|二头/.test(str)) return 'arms';
    if(/平板|支撑|卷腹|核心|腹/.test(str)) return 'core';
    return 'other';
  }
  /* 周容量：最近 7 天每抗阻肌群总组数（薄肌参考带 10-20 组/周/肌群） */
  function weekVolume(){
    const now=new Date(); const days=[];
    for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(Util.localDate(d)); }
    const map={};
    Store.get().logs.filter(l=>days.indexOf(l.date)>=0).forEach(l=>{
      l.entries.forEach(e=>{
        const a=Library.byId(e.actionId)||{name:e.actionName,muscles:''};
        const g=muscleOf(a);
        if(g==='flex'||g==='cardio'||g==='other') return;
        map[g]=map[g]||{};
        const key=a.id||a.name;
        map[g][key]=map[g][key]||{name:a.name,sets:0};
        map[g][key].sets+=(e.sets?e.sets.length:0);
      });
    });
    const ORDER=[['chest','胸'],['back','背'],['shoulder','肩'],['arms','臂'],['legs','腿'],['core','核心']];
    return ORDER.map(pair=>({group:pair[1],key:pair[0],sets:Object.values(map[pair[0]]||{}).reduce((acc,x)=>acc+x.sets,0)}));
  }
  return {suggestion,weekVolume,history,muscleOf};
})();

/* ------------------- 模块: Supplements (补剂循证库) ------------------- */
/* ------------------- 模块: KB 工厂 (知识库模块统一构造) -------------------
 * 补剂 / 中医 / 松解 / 抗衰 / 护肤 这 5 个知识库结构完全同构：
 *   静态条目常量（只读） + 用户清单（条目 id 数组，存在 Store 里）
 * 统一由 kbBase 产出，避免各模块各写一遍 mine/toggle——
 * 旧实现 5 份 toggle 里只有 4 份做了空数组防护，Supplements 那份会抛错（R9）。
 * -------------------------------------------------------------------- */
function kbBase(dataKey, source){
  function list(){ return source().slice().sort((a,b)=>a.priority-b.priority); }
  function mine(){
    const d = Store.get();
    return Array.isArray(d[dataKey]) ? d[dataKey] : [];
  }
  function inMine(id){ return mine().indexOf(id) >= 0; }
  function toggle(id){
    Store.set(d=>{
      if(!Array.isArray(d[dataKey])) d[dataKey] = [];   // 统一空数组防护
      const i = d[dataKey].indexOf(id);
      if(i>=0) d[dataKey].splice(i,1); else d[dataKey].push(id);
    });
  }
  function byId(id){ return list().find(x=>x.id===id); }
  function labelOf(axis, k){ const t = axis.find(x=>x.k===k); return t ? t.label : k; }
  return {list, mine, inMine, toggle, byId, labelOf};
}

/* ------------------- 模块: Care (养护每日勾选) -------------------
 * 补剂/中医/松解/抗衰/护肤 五件事，每天各勾一遍。
 * 与各模块的「我的清单」分开：mine() 是长期清单（我吃哪些补剂），
 * careTick 是当天做没做（今天吃没吃），两件事不能混成一个数组——
 * 否则「移出清单」会把历史打卡一起抹掉。
 * 条目来源：优先用「我的清单」；清单空时退到该类目的基础项，并在页面上写明。
 * ---------------------------------------------------------------- */
const Care = (function(){
  const MODS = [
    {k:'supps',    n:'补剂', d:'维D · 镁 · Omega-3',   ic:'pill', mod:Supplements, axis:'tier', daily:['core']},
    {k:'herbs',    n:'中医', d:'健脾祛湿 · 舌象',       ic:'leaf', mod:Herbs,       axis:'type', daily:['food','lifestyle']},
    {k:'release',  n:'松解', d:'泡沫轴 · 筋膜球 · 拉伸', ic:'wave', mod:Release,     axis:'type', daily:['tool'],
     fallbackIds:['r_stretch','r_foam','r_ball','r_area_sed']},
    {k:'longevity',n:'抗衰', d:'防晒 · 睡眠 · 力量',    ic:'spark', mod:Longevity,   axis:'type', daily:['habit']},
    {k:'skin',     n:'护肤', d:'早间 3 步 · 夜间 3 步', ic:'drop', mod:Skin,        axis:'tier', daily:['core']}
  ];
  const KEEP_DAYS = 90;      // 只留最近 90 天，避免打卡记录无限膨胀

  function dayKey(){ return Util.localDate(); }
  function map(){
    const d = Store.get();
    return (d && d.careTick && typeof d.careTick==='object') ? d.careTick : {};
  }
  function ticks(k){
    const day = map()[dayKey()];
    return (day && Array.isArray(day[k])) ? day[k] : [];
  }
  function has(k, id){ return ticks(k).indexOf(id) >= 0; }

  /* 一键全选/全清：只作用于「今天页面上看得见的那些条目」。
     不碰各模块的 mine()，也不删历史日期。 */
  function setAll(on){
    const secs = sections();
    Store.set(function(d){
      if(!d.careTick || typeof d.careTick!=='object' || Array.isArray(d.careTick)) d.careTick = {};
      const key = dayKey();
      if(!d.careTick[key] || typeof d.careTick[key]!=='object') d.careTick[key] = {};
      const day = d.careTick[key];
      secs.forEach(function(sec){
        day[sec.k] = on ? sec.items.map(function(x){ return x.id; }) : [];
      });
      const keys = Object.keys(d.careTick).sort();
      while(keys.length > KEEP_DAYS) delete d.careTick[keys.shift()];
    });
  }
  function toggle(k, id){
    Store.set(function(d){
      if(!d.careTick || typeof d.careTick!=='object' || Array.isArray(d.careTick)) d.careTick = {};
      const key = dayKey();
      if(!d.careTick[key] || typeof d.careTick[key]!=='object') d.careTick[key] = {};
      const day = d.careTick[key];
      if(!Array.isArray(day[k])) day[k] = [];
      const i = day[k].indexOf(id);
      if(i >= 0) day[k].splice(i,1); else day[k].push(id);
      // 按日期键裁剪：键是 YYYY-MM-DD，字典序即时间序
      const keys = Object.keys(d.careTick).sort();
      while(keys.length > KEEP_DAYS) delete d.careTick[keys.shift()];
    });
  }

  /* 某模块今天要勾的条目：我的清单 → 否则该类目的基础项（最多 4 条） */
  function itemsOf(m){
    const all = m.mod.list();
    const mine = all.filter(function(x){ return m.mod.inMine(x.id); });
    if(mine.length) return {list:mine, from:'mine'};
    /* 类目筛选不够用的模块（如松解）直接指定条目 id：按类目只能拿到「恢复基石」，
       而那几条讲的是睡眠与营养，不是松解动作。 */
    if(m.fallbackIds){
      const byId = {};
      all.forEach(function(x){ byId[x.id] = x; });
      const picked = m.fallbackIds.map(function(id){ return byId[id]; }).filter(Boolean);
      if(picked.length) return {list:picked, from:'default'};
    }
    const fallback = all.filter(function(x){
      const v = m.axis === 'tier' ? x.tier : x.type;
      return m.daily.indexOf(v) >= 0;
    }).slice(0, 4);
    return {list:fallback, from:'default'};
  }

  function sections(){
    return MODS.map(function(m){
      const it = itemsOf(m);
      const list = it.list.map(function(x){ return {id:x.id, name:x.name}; });
      const done = list.filter(function(x){ return has(m.k, x.id); }).length;
      return {k:m.k, n:m.n, d:m.d, ic:m.ic, items:list, done:done, from:it.from};
    });
  }
  function total(){
    const secs = sections();
    return {
      items: secs.reduce(function(a,s){ return a + s.items.length; }, 0),
      done:  secs.reduce(function(a,s){ return a + s.done; }, 0)
    };
  }
  return {MODS, sections, total, ticks, has, toggle, setAll, dayKey};
})();

/* ----------------------- 模块: Theme (主题) -----------------------
 * 三套：墨色 / 石灰 / 暖炭，全部深色底。纸面主题已整块移除（v3.36）。
 * 持久化到 localStorage；旧版本存下的 light / auto 读取时迁移为 dark。
 * 首次绘制前由 <head> 内联脚本兜底设定 data-theme，避免闪烁。
 * -------------------------------------------------------------------- */
const Theme = (function(){
  const KEY = 'thinMuscle.theme.v1';
  const ORDER = ['dark','lime','ember'];
  const LABEL = {dark:'墨色', lime:'石灰', ember:'暖炭'};
  /* 菜单里的双色示意：底＝该主题页面底色，描边＝强调色 */
  const SWATCH = {
    dark:{bg:'#0a0a0a', fg:'#dcee5d'},
    lime:{bg:'#0a0c10', fg:'#a3e635'},
    ember:{bg:'#100d0b', fg:'#d9a184'}
  };

  function stored(){
    try{
      const v = localStorage.getItem(KEY);
      /* 迁移：light 与 auto 已无对应主题，落回墨色 */
      return ORDER.indexOf(v) >= 0 ? v : 'dark';
    }catch(e){ return 'dark'; }
  }
  function apply(mode){
    const html = document.documentElement;
    /* 先关过渡再换主题：否则阴影/描边会过渡到旧值并卡住（见 CSS 里的说明）。
       强制一次重排确保新值在无过渡状态下落定，随后两帧后恢复过渡。 */
    html.classList.add('theming');
    html.setAttribute('data-theme', mode);
    void html.offsetWidth;
    const done = function(){ html.classList.remove('theming'); };
    if(window.requestAnimationFrame) requestAnimationFrame(function(){ requestAnimationFrame(done); });
    else setTimeout(done, 32);
  }
  function get(){ return stored(); }
  function set(mode){
    if(ORDER.indexOf(mode) < 0) mode = 'dark';
    try{ localStorage.setItem(KEY, mode); }catch(e){}
    apply(mode);
  }
  function next(){ return ORDER[(ORDER.indexOf(get()) + 1) % ORDER.length]; }
  function label(){ return LABEL[get()]; }
  function init(){ apply(stored()); }
  function list(){
    return ORDER.map(function(k){ return {k:k, label:LABEL[k], bg:SWATCH[k].bg, fg:SWATCH[k].fg}; });
  }
  return {get,set,next,label,init,list};
})();

/* ----------------------- 模块: UI (路由/渲染) ----------------------- */
/* ----------------------- 模块: SwipeTab (移动端手势切换) -----------------------
 * 仅小屏（≤767px）启用：手指左右滑动切换模块，左滑下一个 / 右滑上一个。桌面端不启用，
 * 保留原有点击切换。
 *
 * 三个阈值（防误触，REQ：合理的距离与速度阈值）：
 *   MIN_DIST      60 px  —— 慢速拖动至少滑这么远才触发
 *   MIN_DIST_FLICK 30 px —— 快速轻扫(flick)时，滑这么远即可
 *   MIN_VEL      0.3 px/ms（≈300 px/s）—— 轻扫的速度门槛
 *   DIR_RATIO    1.5     —— |dx| 必须 > |dy| * 1.5，否则判定为纵向滚动，完全不拦截（REQ：不影响上下滚动）
 *
 * 不拦截区域：.tabs（横向滚动的标签栏）/.chart-wrap / .table-wrap / [data-no-swipe]
 * 边界：首/尾只做轻微回弹提示，不越界
 * -------------------------------------------------------------------------------- */
const SwipeTab = (function(){
  const MQ = '(max-width: 767px)';
  /* 这组数是「防错优先」而不是「效率优先」的取值：
     本页纵向滚动是主路径，切页另有底栏与顶部 tab 两条冗余入口，
     所以横滑必须更明确才接管。误判的代价是「整页滑走 + 未保存表单丢失」，
     而漏判的代价只是「这次没滑动」，两者不对等。 */
  const SLOP = 12;            // 判轴死区（原来 8：8px 抖动在 0.35 阻尼下仍会露出 2.8px 位移）
  const MIN_DIST = 60;
  const MIN_DIST_FLICK = 36;  // 轻扫距离（原 30 偏松）
  const MIN_VEL = 0.45;       // 轻扫速度 px/ms（原 0.3≈300px/s，几乎任何带速度的横移都算）
  const DIR_RATIO = 2.0;      // |dx| 要超过 |dy| 的 2 倍（原 1.5）
  const DAMP = 0.35;        // 跟手阻尼（位移打折，避免内容被拖太远）
  const EDGE_DAMP = 0.12;   // 边界处阻尼更大 → "拉不动"的手感
  /* 屏幕两缘留给系统手势：左缘是 iOS Safari 的返回、右缘是部分安卓的手势导航。
     不设保留区的后果不是「切错页」，而是「直接离开页面，未保存的表单没了」。
     左侧取 28 是因为记录页第一列序号紧贴边缘，手指更容易擦到。 */
  const EDGE_L = 28;
  const EDGE_R = 24;
  /* 滑动结束后浏览器仍可能补发一次 click，落到手指下方的 ± 或勾选上。
     600ms 覆盖 iOS(≤350ms) 与安卓(≤300ms) 的合成 click 延迟。 */
  const SWALLOW_MS = 600;
  let sx = 0, sy = 0, st = 0, dx = 0, dy = 0;
  let swallowUntil = 0;     // 横轴锁定过 → 到这个时刻为止，补发的 click 一律吞掉
  let cooling = false;      // 切页动画进行中：忽略新手势，避免两条动画叠加闪动
  let tracking = false, decided = false, horiz = false, enabled = false;

  const appEl = () => document.getElementById('app');
  const isMobile = () => !!(window.matchMedia && matchMedia(MQ).matches);
  // 这些容器内优先它自己的横向滚动，不抢手势
  /* 自带手势或自带选区行为的容器优先：.stepper / input 在按下的瞬间就可能被手指
     带偏，若同时又被判成横滑，会出现「改了一档数值 + 整页切走」两个动作同时发生。 */
  const inNoSwipe = t => !!(t && t.closest && t.closest('.tabs, .chart-wrap, .table-wrap, .mobile-nav, .stepper, input, select, textarea, [data-no-swipe]'));

  function onStart(e){
    if(!enabled || !e.touches || e.touches.length !== 1) return;
    if(cooling) return;                       // 动画没播完就起手会让同一动画中途重启
    if(inNoSwipe(e.target)) return;
    const t = e.touches[0];
    if(t.clientX < EDGE_L || t.clientX > (window.innerWidth - EDGE_R)) return;  // 系统手势保留区
    sx = t.clientX; sy = t.clientY; st = Date.now();
    dx = 0; dy = 0; tracking = true; decided = false; horiz = false;
    const el = appEl(); if(el) el.classList.add('is-swiping');
  }

  function onMove(e){
    if(!tracking || !e.touches || e.touches.length !== 1) return;
    const t = e.touches[0];
    dx = t.clientX - sx; dy = t.clientY - sy;
    if(!decided && (Math.abs(dx) > SLOP || Math.abs(dy) > SLOP)){
      horiz = Math.abs(dx) > Math.abs(dy) * DIR_RATIO;   // 横向主导才接管
      decided = true;
      /* 一旦确认是横滑，就把焦点从输入框上摘掉：手机上键盘会盖住半屏，
         而横滑过程中用户已经不在编辑了，留着键盘只会挡住目标页。 */
      if(horiz){
        const a=document.activeElement;
        if(a && a!==document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) a.blur();
      }
    }
    if(!decided || !horiz) return;                        // 纵向 → 交给浏览器正常滚动
    const el = appEl();
    if(el){
      const idx = UI.currentIndex(), last = UI.tabKeys().length - 1;
      const atEdge = (idx <= 0 && dx > 0) || (idx >= last && dx < 0);
      el.style.transform = 'translateX(' + (dx * (atEdge ? EDGE_DAMP : DAMP)).toFixed(1) + 'px)';
    }
    if(e.cancelable) e.preventDefault();                  // 阻止页面横向滚动/橡皮筋
  }

  function onEnd(){
    if(!tracking) return;
    tracking = false;
    const el = appEl();
    if(el) el.classList.remove('is-swiping');
    if(!decided || !horiz){ release(el); return; }
    /* 确认是横滑：接下来浏览器补发的 click 不是用户意图。
       不吞的话，手指从「+」滑出去会先改一档数值、再切页，回来时值已被改动。 */
    swallowUntil = Date.now() + SWALLOW_MS;

    const dt = Math.max(1, Date.now() - st);
    const adx = Math.abs(dx);
    const vel = adx / dt;
    const passed = (adx > MIN_DIST) || (adx > MIN_DIST_FLICK && vel > MIN_VEL);
    if(!passed){ release(el); return; }

    const dir = dx < 0 ? 'next' : 'prev';
    const keys = UI.tabKeys();
    const idx = UI.currentIndex();
    const target = dir === 'next' ? idx + 1 : idx - 1;
    if(target < 0 || target >= keys.length){
      // 到边界：轻微回弹提示，不切换（REQ：不越界）
      if(el){
        // 先清掉上一次切换留下的滑动类，否则会与回弹动画叠加
        el.classList.remove('swipe-next','swipe-prev');
        el.classList.add(dir === 'next' ? 'swipe-edge-r' : 'swipe-edge-l');
        setTimeout(() => el.classList.remove('swipe-edge-r','swipe-edge-l'), 220);
      }
      release(el);
      return;
    }
    if(el){ el.style.transform = ''; }
    UI.goIndex(target, dir);
    startCooling(el);      // 内部会 render 并播放方向性滑入动画（切换路径不加 is-releasing，避免与 swipe 动画的 transform 叠加冲突导致闪动）
  }

  /* 冷却的解除以 swipe 动画的 animationend 为唯一信号：
     reduce-motion 下动画约 0ms 结束，若用固定 260ms 计时会把用户白锁 260ms

       否则「全选 → 取消一项」后按钮仍写着「取消全选」，再点一次会把剩下的 19 项全清掉。 */
    function syncCareAll(){
      const b=appInner().querySelector('[data-care-all]');
      if(!b) return;
      const t=Care.total();
      const all=t.items>0 && t.done===t.items;
      b.setAttribute('data-care-all', all?'off':'on');
      b.textContent = all ? '取消全选' : '全选今日';
    }
    /* 勾选只改这一行的样式与两处计数，不重绘整页 —— 重绘会把滚动位置弹回顶部 */
    appInner().querySelectorAll('[data-care-tick]').forEach(function(btn){
      btn.onclick = function(){
        const p = btn.getAttribute('data-care-tick').split('|');
        Care.toggle(p[0], p[1]);
        const on = Care.has(p[0], p[1]);
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        const sec = btn.closest('.care-sec');
        const cnt = sec ? sec.querySelector('.care-n b') : null;
        if(cnt) cnt.textContent = sec.querySelectorAll('.care-row.on').length;
        const t = Care.total();
        const dEl = $('#careDone'), tEl = $('#careTot'), bEl = $('#careBar');
        if(dEl) dEl.textContent = t.done;
        if(tEl) tEl.textContent = t.items;
        const pc = t.items ? Math.round(t.done / t.items * 100) : 0;
        if(bEl) bEl.style.width = pc + '%';
        const pEl = $('#carePct');
        if(pEl) pEl.textContent = '· ' + pc + '%';
        syncCareAll();
      };
    });
  }

  function onProfileKey(e){
    if(e.key==='Escape'){ e.preventDefault(); closeProfileSheet(); return; }
    if(e.key!=='Tab') return;
    const wrap=document.getElementById('profileSheet');
    if(!wrap) return;
    const sheet=wrap.querySelector('.sheet');
    const list=[].slice.call(sheet.querySelectorAll(
      'button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]'
    )).filter(function(el){ return el.offsetParent !== null; });
    if(!list.length){ e.preventDefault(); return; }
    const first=list[0], last=list[list.length-1];
    if(e.shiftKey && (document.activeElement===first || !sheet.contains(document.activeElement))){
      e.preventDefault(); last.focus();
    }else if(!e.shiftKey && document.activeElement===last){
      e.preventDefault(); first.focus();
    }
  }

       没有 toast、没有红字、抽屉也不关，用户只会以为按钮坏了。 */
    function profileSave(){
      const msg=back.querySelector('#pf_err');
      const say=function(txt){
        if(!msg) return;
        msg.textContent=txt||''; msg.classList.toggle('show', !!txt);
      };
      say('');
      clearFieldErrs();
      let res;
      try{
        res=Profile.save({
          name:back.querySelector('#pf_name').value.trim(),
          age:back.querySelector('#pf_age').value,
          sex:back.querySelector('#pf_sex').value,
          height:back.querySelector('#pf_height').value,

              ? back.querySelector('#pf_goal_custom').value.trim()

          tdee:p.tdee

        toast('保存失败，请重试','bad');
        return;

      if(!res || !res.ok){
        const map={age:'#pf_age',height:'#pf_height',weight:'#pf_weight',bodyfat:'#pf_bf',goalWeight:'#pf_gw',goal:'#pf_goal'};
        /* 自定义模式下「目标」错的是输入框而不是下拉：红字要标在实际该改的那个控件上 */
        if(back.querySelector('#pf_goal').value==='__custom') map.goal='#pf_goal_custom';
        const errs=(res&&res.errors)||{};
        let first=null;
        Object.keys(map).forEach(function(k){
          if(errs[k]){
            /* 目标有两个控件（下拉 / 自定义输入），但红字只有一处 #pf_goal_err */
            setFieldErr(map[k], errs[k], k==='goal' ? '#pf_goal_err' : (map[k]+'_err'));
            if(!first) first=map[k];
          }
        });
        if(errs._){ say(errs._); toast(errs._, 'bad'); return; }
        const n=Object.keys(errs).length;
        /* 不写「下方」：错字在滚动区里、汇总在底栏，谁是「下方」取决于已经滚到哪 */
        say(n ? ('有 '+n+' 项需要修正，已在表单中标出') : '保存未完成，请检查填写');
        /* setFieldErr 已经把第一个错的字段滚进视口并聚焦；这里只兜一层，
           避免「字段在滚动区顶部、用户还停在底部」时看不到红字。 */
        if(first){ const el=back.querySelector(first); if(el) try{ el.scrollIntoView({block:'center'}); }catch(e){} }
        return;
      }
      closeProfileSheet(false);
      render();
      toast('资料已保存','ok');
      setTimeout(function(){ const b=document.querySelector('[data-edit-profile]'); if(b) b.focus(); }, 0);
    }
    /* 选「自定义…」才露出输入框：预设能覆盖九成场景，但别把想写细的人堵死 */
    const goalSel=back.querySelector('#pf_goal'), goalCustom=back.querySelector('#pf_goal_custom');
    goalSel.addEventListener('change', function(){

    /* 委托而不是 onclick：按钮节点若被任何重建流程替换，onclick 会静默丢失 */
    back.addEventListener('click', function(e){

      if(t.closest('[data-profile-save]')) profileSave();
    });
    const first=back.querySelector('#pf_name'); if(first) first.focus();
  }

  function goIndex(i, dir){

  /* 含原生日期控件的字段标成整行宽：96px 栅格下限放不下 162px 的日期段，
     不标就会出现 "2026/10□" 这种裁切。 */
  function markWideFields(){
    const box = appInner();
    if(!box) return;
    /* 时间字段也交给自绘面板：readOnly 挡住 Android WebView 的原生滚轮，
       让「点一下会发生什么」在三套主题、各平台一致。value/change 链不变。 */
    box.querySelectorAll('input[type="time"]').forEach(function(el){
      el.readOnly = true;
      el.setAttribute('aria-haspopup','dialog');
      el.setAttribute('aria-expanded','false');
    });
    box.querySelectorAll('input[type="date"],input[type="datetime-local"]').forEach(function(el){
      /* 日期一律走自绘面板（DatePick）：readOnly 才挡得住 Android 的原生选择器，
         也让「点一下会发生什么」在各平台一致。value / change 的绑定完全不变。 */
      if(el.type === 'date'){
        el.readOnly = true;
        el.setAttribute('aria-haspopup', 'dialog');
        if(!el.hasAttribute('aria-expanded')) el.setAttribute('aria-expanded', 'false');
      }
      const f = el.closest('.field');
      if(!f) return;
      f.classList.add('f-wide');
      const row = f.parentElement;
      if(row && row.classList.contains('field-row')){
        row.classList.add('has-wide');
        /* 日期占满一行，剩下的项要能被列数整除才不会吊在半行：
           剩 3 项（日期+2+2 那种）用 3 列，剩 4 项用 2 列（2×2）。 */
        const rest = row.children.length - 1;
        row.setAttribute('data-cols', (rest % 3 === 0) ? '3' : '2');
      }
    });
  }
  function render(){
    syncHash();
    /* 每次渲染前把 Store.profile + 最新体测写回运行画像：
       体测页刚录入的体重/体脂，切到「我的」、首页、饮食都要立刻回显。 */
    try{ Profile.applyRuntime(); }catch(e){ console.warn('画像同步失败', e); }
    /* 路由切换时兜底清掉抽屉：若用户按浏览器后退而不是关闭，
       否则遮罩会留在新页面上，且 html 的滚动锁不会解除。 */
    const staleSheet=document.getElementById('foodSheet');
    if(staleSheet) staleSheet.remove();
    const staleProfile=document.getElementById('profileSheet');
    if(staleProfile) staleProfile.remove();
    /* 时间面板也要一起收：否则切页后遮罩会留在新页面上，滚动锁解不开 */
    const staleTime=document.getElementById('timeSheet');
    if(staleTime) staleTime.remove();
    document.documentElement.classList.remove('tp-open');
    document.documentElement.classList.remove('sheet-open');
    /* 离开记录页：休息倒计时不留到别的页面上（它是这一组的节拍，不是全局状态） */
    if(cur!=='log') restStop();
    TabMemo.write(cur);
    renderTabs();
    const ap=document.getElementById('app');
    const tabEl=document.getElementById('tab-'+cur);
    /* 一级页：tabpanel + 指向自己的 tab。
       二级页（progress/report/supps/…）没有自己的 tab，若继续用 tabOf 的父级，
       会出现「周报面板被命名为今日」这种错标；改用 region + 自己的文本名。 */
    if(!SUB_OF[cur] && tabEl){
      ap.setAttribute('role','tabpanel');
      ap.setAttribute('aria-labelledby',tabEl.id);
      ap.removeAttribute('aria-label');
    }else{
      ap.setAttribute('role','region');
      ap.removeAttribute('aria-labelledby');
      ap.setAttribute('aria-label', SUB_LABEL[cur] || cur);
    }
    // 从概览/计划跳转进来时正在做 scrollIntoView，此时若再恢复旧滚动位置会把它覆盖掉
    const pendingJump = !!focusAct || !!focusKb;
    // R3：单页渲染异常不得让整站失效——先兜住，再把残留数据导出的通道留给用户
    try{
      Pages[cur]();
      if(SUB_OF[cur]) injectSubbar();
    }catch(err){
      console.warn('渲染失败', err);
      renderCrash(err);
    }
    markWideFields();   // 每个页面渲染后都要标一次（DOM 是重建的）
    // R7：加载期异常（存储损坏 / 隐私模式）常驻提示，直至用户确认。
    // 幂等渲染：先移除旧条再插入——render 多次触发（hash 切换/验证操作）不叠加（预览环境禁 storage 时曾叠 4 条）。
    const warn = Store.getLoadWarning();
    const oldWarn = ap.querySelector('[data-load-warn]');
    if(oldWarn) oldWarn.remove();
    if(warn) ap.insertAdjacentHTML('afterbegin', warningBar(warn));
    if(!pendingJump) window.scrollTo(0, scrollPos[cur]||0);
    /* 手势切换：内容渲染完成后播放方向性滑入动画。
       void ap.offsetWidth 强制重排，确保同名动画能重新触发。
       点击切换时 pendingDir 为 null → 不加 class → 沿用 .panel 的淡入上移。 */
    if(pendingDir){
      ap.classList.remove('swipe-next','swipe-prev');
      void ap.offsetWidth;
      ap.classList.add(pendingDir === 'next' ? 'swipe-next' : 'swipe-prev');
      pendingDir = null;
    }
  }
  /* v3.37：二级页顶部一条返回，指向它在树上的父级（report 的父级是 progress，再往上是今日） */
  function injectSubbar(){

    if(!parent) return;
    const box = appInner();
    const label = (TABS.find(function(t){ return t.k === tabOf(cur); }) || {}).label || '返回';
    box.insertAdjacentHTML('afterbegin',
      '<div class="subbar"><button type="button" class="subback" data-back="'+parent+'">'+
      '<svg class="backic" aria-hidden="true" focusable="false"><use href="#ni-back"/></svg>'+label+
      '</button><span class="sub-t">'+esc(SUB_LABEL[cur]||'')+'</span></div>');
  }

  /* ===== 身体成分（报告体，对应方向一） =====

  function reportBlocks(){
    const W=+PERSONAL.weight||0, BF=+PERSONAL.bodyfat||0, GW=+PERSONAL.goalWeight||W;
    const lean=+(W*(1-BF/100)).toFixed(1);
    const fat=+(W-lean).toFixed(1);
    const goalFat=+(GW-lean).toFixed(1);
    const goalPct=GW?+(goalFat/GW*100).toFixed(1):0;
    const SCALE=Math.max(70, Math.ceil(Math.max(W,GW)/10)*10);   // 两条共用的量程（kg）
    const leanPct=+(lean/SCALE*100).toFixed(2);
    const fatPct=+(fat/SCALE*100).toFixed(2);
    const goalFatPct=+(goalFat/SCALE*100).toFixed(2);
    return '<div class="rep-grid">'+
      '<section><div class="rep-hd"><h2>身体成分</h2>'+
        '<em>当前 → 目标</em></div>'+
        '<div class="rep-rows">'+

          '<span class="now">'+W.toFixed(1)+'</span><span class="ar">→</span>'+
          '<span class="to">'+GW.toFixed(1)+' kg</span>'+
          '<span class="d">−'+(W-GW).toFixed(1)+' kg</span></span></div>'+
        '<div class="rep-crow"><span class="k">体脂率</span><span class="v">'+
          '<span class="now">'+BF.toFixed(1)+'</span><span class="ar">→</span>'+
          '<span class="to">'+goalPct.toFixed(1)+' %</span>'+

          '<span class="to">'+goalFat.toFixed(1)+' kg</span>'+

  /* 「我的事项」模块配置与渲染（模块级：概览页渲染 + 全局 quick-add 局部刷新共用）
     todo 条目 = 名称按钮（点击跳详情）+ 独立「+」按钮（点击入清单）——热区分离防误触 */
  const OV_MODS=[
    {name:'补剂',tab:'supps',mod:Supplements,core:function(x){return x.tier==='core';}},
    {name:'中医',tab:'herbs',mod:Herbs,core:function(x){return x.type==='food';}},
    {name:'松解',tab:'release',mod:Release,core:function(x){return x.type==='basis';}},
    {name:'抗衰',tab:'longevity',mod:Longevity,core:function(x){return x.type==='habit';}},
    {name:'护肤',tab:'skin',mod:Skin,core:function(x){return x.tier==='core';}}
  ];
  function renderOvMod(m){
    var all=m.mod.list(), mine=m.mod.mine();
    var core=all.filter(m.core);
    var done=core.filter(function(x){return mine.indexOf(x.id)>=0;});
    var todo=core.filter(function(x){return mine.indexOf(x.id)<0;});
    var pct=core.length?Math.round(done.length/core.length*100):0;
    /* 条目全部直接展示（.ov-items 自带 flex-wrap 换行，放不下自动折行）——不再截断为「还有 N 项」 */
    var items='';
    done.forEach(function(x){items+='<button type="button" class="ov-item ov-done" data-open-kb="'+m.tab+'|'+esc(x.id)+'">'+esc(x.name)+'</button>';});
    todo.forEach(function(x){
      items+='<span class="ov-item ov-todo">'+
        '<button type="button" class="ov-name-btn" data-open-kb="'+m.tab+'|'+esc(x.id)+'">'+esc(x.name)+'</button>'+
        '<button type="button" class="ov-add-btn" data-quick-add="'+m.tab+'|'+esc(x.id)+'" aria-label="将'+esc(x.name)+'加入我的清单" title="加入我的清单">+</button>'+
      '</span>';
    });
    if(!core.length) items='<span>暂无核心条目</span>';
    return '<div class="ov-mod">'+
      '<div class="ov-head"><span class="ov-name">'+m.name+'</span>'+
      '<span class="ov-count"><b>'+done.length+'</b>/'+core.length+'</span></div>'+
      (pct>0?'<div class="ov-bar"><i style="width:'+pct+'%"></i></div>':'')+
      '<div class="ov-items">'+items+'</div></div>';
  }
  /* 连续训练天数：从今天往回数「有训练记录」的日历天；今天还没练就从昨天起算，
     免得一进首页就显示 0 天。用中午 12 点做基准，绕开夏令时与跨日边界。
     只数记录日，休息日既不奖励也不惩罚——它回答的是「我连着几天没断了」。 */
  function trainStreak(){
    const has={};
    Log.list().forEach(function(x){ if(x && x.date) has[x.date]=1; });
    const d=new Date(); d.setHours(12,0,0,0);
    if(!has[Util.localDate(d)]) d.setDate(d.getDate()-1);
    let n=0;
    while(has[Util.localDate(d)] && n<999){ n++; d.setDate(d.getDate()-1); }
    return n;
  }
  function home(){
    const todayLabel=DAY_LABELS[new Date().getDay()];
    const today=Plan.get().week[todayLabel];
    const todayType=today?(Plan.types()[today.type]||today.type):'-';
    const todayN=today?today.actions.length:0;
    const todayStr=Util.localDate();
    const dietRec=Diet.list().find(x=>x.date===todayStr);
    const dietLogged=!!dietRec;
    const sl=Body.sleepLatest();
    const sleepHours=sl?(sl.hours||null):null;
    const ms=Progress.list();
    const lastMetric=ms.length?ms[ms.length-1]:null;
    const weekResist=Log.thisWeekResistCount();
    const gH=new Date().getHours();
    const greetWord=gH<11?'早上好':gH<18?'下午好':'晚上好';
    const greetName=PERSONAL.name?('，'+PERSONAL.name):'';
    const dNow=new Date();
    const greetDate=(dNow.getMonth()+1)+'月'+dNow.getDate()+'日 '+DAY_LABELS[dNow.getDay()];
    const trainDone=!!Log.list().find(x=>x.date===todayStr);
    /* 四枚入口的落点：训练→记录、饮食→饮食、睡眠与体测→进度页对应区块。
       原来这里是 <span>，只显示状态、点了没反应——看起来像按钮却是死的。 */
    const todayDone=[
      {k:'训练', ok:trainDone, to:'log'},
      {k:'饮食', ok:dietLogged, to:'diet'},
      {k:'睡眠', ok:sleepHours!=null, to:'progress|sleepPanel'},
      {k:'体测', ok:!!(lastMetric&&lastMetric.date===todayStr), to:'progress|metricPanel'}
    ];
    const streak=trainStreak();
    /* 判断依据是「这一天到底练不练抗阻」，不是 type 是否叫 rest：
       原来的 type==='rest' 只覆盖休息日，把「主动恢复」这类非抗阻日也判成了抗阻日。 */
    const rmKind = Plan.typeKind(today&&today.type);
    const isLiftDay = (rmKind==='resistance' || rmKind==='mixed') && todayN>0;
    const rmText = isLiftDay ? ' · 8-15 RM' : '';
    /* 今日安排 = 动作清单 + 自适应目标（原独立「今日建议」面板与它内容重复，合并为一张卡） */

            '<span class="td-msg">'+esc(msg)+'</span>'+
            '<span class="td-set">'+esc((a.sets||'')+'×'+(a.reps||''))+'</span>'+
            '<span class="td-go" aria-hidden="true">›</span></button>';
        }).join('')
      : '<p class="small muted">今天是休息日——主动恢复（八段锦 / 散步），拉伸 10 分钟，不安排抗阻。</p>';
    const db=Diet.feedback(), fb=Progress.feedback();
    appInner().innerHTML = `
      <section class="hv">
        <div class="hv-top">
          <div class="hv-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 12h19"/><rect x="6.2" y="6.6" width="3.4" height="10.8" rx="1.6"/><rect x="14.4" y="6.6" width="3.4" height="10.8" rx="1.6"/></svg></div>
          <div class="hv-tx">
            <p class="hv-greet">${esc(greetWord+(greetName||''))} · ${esc(greetDate)}</p>
            <h2 class="hv-day">${esc(todayType)}</h2>
            <p class="hv-sub">${todayN} 个动作 · ${isLiftDay? '抗阻日'+rmText : '恢复日'}</p>
          </div>
          ${streak>=2?'<div class="hv-streak" aria-label="连续训练 '+streak+' 天"><b>'+streak+'</b><span>天连练</span></div>':''}
        </div>
        <button class="hv-cta" type="button" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5l10 6.5-10 6.5Z"/></svg>开始今日训练</button>
        <div class="hv-chips">${todayDone.map(x=>'<button type="button" class="hv-chip'+(x.ok?' on':'')+'" data-goto-any="'+x.to+'" aria-pressed="'+(x.ok?'true':'false')+'" aria-label="'+x.k+'，今日'+(x.ok?'已完成':'未完成')+'">'+(x.ok?'<i aria-hidden="true">✓</i>':'')+x.k+'</button>').join('')}</div>
      </section>

        <span>本周抗阻 <b>${weekResist}</b>/3 次</span>
        <span>有氧心率 <b>${esc(DERIVED.hrText||'低-中')}</b> bpm</span>
      </div>

      <div class="panel"><h2>今日安排</h2>
        <p class="small muted">重量以能标准完成全部组次为准；有历史后按表现与睡眠自动调整。</p>
        <div class="td-list">${planBody}</div>
      </div>

      <div class="panel"><h2>今日状态</h2>
        <div class="fld"><span class="fld-k info">吃练</span><div class="fld-v"><p class="${stCls(db.level)}">${esc(db.msg)}</p></div></div>

  }

        const names=d.actions.map(id=>{const a=Library.byId(id);
          // 空名/未找到一律显示占位，避免出现空白 pill 或多余分隔符
          const nm=a && String(a.name||'').trim();
          return nm?`<button type="button" class="tag act-link ${Library.catCls(a.cat)}" data-open-act="${esc(id)}">${esc(nm)}</button>`
                   :'<span class="tag c0">已删</span>';

      }).join('')+'</tbody></table></div>';
  }

  /* ---- 计划制定 ---- */

    appInner().innerHTML = `<div class="panel"><h2>训练计划制定</h2>
      <p class="muted">模板：${esc(Plan.get().template)} ｜ 薄肌模式：力量 8-15RM + 中低强度有氧。点击下方任一天可编辑动作。</p>

      '<p class="small muted">上面编辑、这里核对：七天类型与动作的对照表，今天那一行会标 •。</p>'+
      weekTable()+'</div>';
    $('#planFocus').onchange=e=>{
      const v=e.target.value;
      Store.set(d=>{ d.plan.focus=v; });

  function dayCard(day){
    const d=Plan.get().week[day]; const t=Plan.types()[d.type]||d.type;
    const focus=(Plan.get().focus||''); const KEY={胸:'chest',背:'back',肩:'shoulder',臂:'arms',腿:'legs',核心:'core'};
    const acts=d.actions.map(id=>{const a=Library.byId(id);
      if(!a) return '<span class="tag c0">已删</span>';
      const star=(focus && Adapt.muscleOf(a)===KEY[focus])?'★ ':'';
      return `<button type="button" class="tag act-link ${Library.catCls(a.cat)}" data-open-act="${esc(id)}">${star}${esc(a.name)}</button>`;
    }).join(' ');
    return `<div class="card">
      <div class="row between">
        <div><b>${esc(day)}</b> <span class="pill">${esc(t)}</span></div>
        ${bodyMap(bmLevelsByDay(day), {cls:'bm-sm', label:day+' 涉及肌群'})}

      <button class="btn ghost sm mt-4" data-edit-day="${esc(day)}">编辑动作</button></div>`;

  /* 动作库的浏览态：58 个动作平铺是 15.2 屏，但「浏览全部」其实很少发生——
     真正常用的是「找某个动作」。所以默认按肌群分组、每组先给 6 个，
     想看全的按按钮展开；一旦输入搜索词或选了分类，说明已经在检索，就直接平铺结果。 */
  let libShowAll = {};
  const LIB_PREVIEW = 6;
  function renderLibList(q,cat){
    q=(q||'').toLowerCase(); cat=cat||'';
    const all=Library.list();
    const items=all.filter(a=>(!cat||a.cat===cat)&&(!q||(a.name+a.muscles+a.cat).toLowerCase().includes(q)));
    const cnt=$('#libCount');
    if(cnt) cnt.textContent = (q||cat) ? ('筛出 '+items.length+' / '+all.length+' 个') : ('共 '+all.length+' 个动作');
    let body;
    if(!items.length){
      body = emptyState('无匹配动作', '<button class="btn ghost sm" data-clear-filter="lib">清除筛选</button>');
    } else if(q || cat){
      body = '<div class="grid dense">'+items.map(libCard).join('')+'</div>';
    } else {
      body = Library.CATS.map(function(c){
        const g=items.filter(a=>a.cat===c.k);
        if(!g.length) return '';
        const shown=!!libShowAll[c.k];
        const list=shown? g : g.slice(0,LIB_PREVIEW);
        return '<details class="kb-group"'+(c.k===Library.CATS[0].k?' open':'')+'>'+
          '<summary><span class="kbg-k">'+esc(c.label)+'</span><span class="kbg-n">'+g.length+' 个</span></summary>'+
          '<div class="grid dense">'+list.map(libCard).join('')+'</div>'+
          (!shown&&g.length>LIB_PREVIEW
            ? '<button class="btn ghost sm mt-4" data-lib-more="'+c.k+'">显示全部 '+g.length+' 个</button>'
            : '')+
          '</details>';
      }).join('');
    }
    $('#libList').innerHTML = body;
    // 从概览/计划跳转而来：定位到目标动作 → 高亮 + 自动展开 + 滚入视野
    if(focusAct){
      const card = $('#libList').querySelector('[data-act="'+focusAct+'"]');
      if(card){
        const grp = card.closest('details.kb-group');
        if(grp) grp.open = true;      // 目标若在收起的组里，先把组打开
        card.classList.add('is-focus');
        const det = card.querySelector('details');
        if(det) det.open = true;
        if(card.scrollIntoView) card.scrollIntoView({block:'center', behavior:'smooth'});
      }
      focusAct = null;
    }
  }

  function dsBox(a){
    const d=DS[a.id], e=DS2[a.id];
    if(!d && !e) return '';
    const sec = d && d.s.length ? '<div class="fld"><span class="fld-k anat">协同肌群</span><div class="fld-v">'+d.s.map(esc).join(' · ')+'</div></div>' : '';
    // 中文分步：数据侧用 **…** 标出要领，rich() 转成 <b> 后统一升级为 .key（琥珀加粗高亮），便于一眼抓重点
    const stp = d && d.t.length ? '<div class="fld"><span class="fld-k step">中文分步</span><div class="fld-v"><ol class="flist">'
      + d.t.map(x=>'<li>'+rich(x).replace(/<b>/g,'<b class="key">')+'</li>').join('')+'</ol></div></div>' : '';
    const ERR = ' onerror="this.closest(\'.ds-wrap\').classList.add(\'ds-off\')"';
    let media = '';
    if(d){
      media = '<div class="fld ds-wrap"><span class="fld-k anim">动画演示</span><div class="fld-v">'
        + '<img class="ds-gif" src="'+DS_SRC+d.g+'" alt="'+esc(a.name)+' 动作演示动画"'
        + ' width="180" height="180" loading="lazy" decoding="async"'+ERR+'>'
        + '<p class="ds-attr">'+DS_ATTR+' · 180×180 · 需联网</p></div></div>';
    } else if(e){
      const mk = (f,t) => '<img class="ds2-img" src="'+DS2_SRC+e.d+'/'+f+'" alt="'+esc(a.name)+' '+t+'"'
        + ' loading="lazy" decoding="async"'+ERR+'>';
      media = '<div class="fld ds-wrap"><span class="fld-k anim">动作演示</span><div class="fld-v">'
        + '<div class="ds2-row">'+mk('0.jpg','起始位')+mk('1.jpg','终末位')+'</div>'
        + '<p class="ds2-note">'+ (e.note ? esc(e.note)+' · ' : '') +'free-exercise-db（公共领域）· 需联网</p>'
        + '</div></div>';
    }
    return sec + stp + media;
  }
  function libCard(a){
    return `<div class="card" data-act="${esc(a.id)}">
      <div class="row between"><b>${esc(a.name)}</b>${tag(a.cat)}</div>
      <div class="lead">${esc(a.muscles)}${a.points && a.points[0] ? '：' + rich(a.points[0]) : ''}</div>
      ${chips([['组次',(a.sets||'')+' 组 × '+esc(a.reps||''),'info'],
               a.equip?['器械',a.equip,'plain']:null,
               a.level?['难度',a.level,'plain']:null])}
      <details><summary>展开：要点 · 常见错误 · 中文分步 · 动画演示</summary>
        <div class="fld"><span class="fld-k ok">要点</span><div class="fld-v"><ul class="flist">${a.points.map(p=>'<li>'+rich(p)+'</li>').join('')}</ul></div></div>
        <div class="fld"><span class="fld-k bad">常见错误</span><div class="fld-v"><ul class="flist">${a.errors.map(p=>'<li>'+rich(p)+'</li>').join('')}</ul></div></div>
        ${failBox(a.fail)}
        ${a.demo?`<div class="fld src"><span class="fld-k ref">演示</span><div class="fld-v"><a href="${esc(a.demo)}" target="_blank" rel="noopener">权威演示源 ↗</a></div></div>`:''}
        ${dsBox(a)}
      </details>
      <div class="row mt-4">
        <button class="btn ghost sm" data-edit-act="${esc(a.id)}" aria-label="编辑 ${esc(a.name)}">编辑</button>
        <button class="btn danger sm quiet" data-del-act="${esc(a.id)}" aria-label="删除 ${esc(a.name)}">删除</button>
      </div>
    </div>`;
  }
  function openActionForm(id){

        <div class="field"><label for="f_mus">目标肌肉</label><input id="f_mus" value="${esc(a.muscles)}"></div>

        <div class="field"><label for="f_level">难度等级</label><select id="f_level">${['初级','中级','进阶'].map(l=>'<option value="'+l+'"'+(l===(a.level||'初级')?' selected':'')+'>'+l+'</option>').join('')}</select></div>
      </div>
      <label for="f_points">要点 (每行一条)</label><textarea id="f_points" rows="3">${esc(pts)}</textarea>
      <label for="f_errors">常见错误 (每行一条)</label><textarea id="f_errors" rows="2">${esc(errs)}</textarea>
      <label for="f_fail">失败模式（常见失败 → 一线修复 → 兜底）</label><textarea id="f_fail" rows="2" placeholder="如：膝前不适 → 降重10-15%+膝对第二趾 → 换箱式蹲，停单腿蹲1-2周">${esc(fails)}</textarea>
      <label for="f_demo">权威演示链接 (可选)</label><input id="f_demo" value="${esc(a.demo)}" placeholder="https://exrx.net/...">
      <span class="field-err" id="f_demo_err"></span>
      <div class="btnrow">
        <button class="btn" id="f_save">保存</button>
        <button class="btn ghost" id="f_back">返回</button>

    </div>`;
    $('#f_save').onclick=()=>{
      clearFieldErrs();
      const obj={name:$('#f_name').value.trim(),cat:$('#f_cat').value,muscles:$('#f_mus').value.trim(),
        sets:+$('#f_sets').value||3,reps:$('#f_reps').value.trim(),
        equip:$('#f_equip').value.trim(),level:$('#f_level').value,
        points:$('#f_points').value.split('\n').map(s=>s.trim()).filter(Boolean),
        errors:$('#f_errors').value.split('\n').map(s=>s.trim()).filter(Boolean),
        fail:$('#f_fail').value.trim(),
        demo:$('#f_demo').value.trim()};
      if(!obj.name){ setFieldErr('#f_name','请填写动作名称','#f_name_err'); return; }
      // P0-1：演示链接协议白名单——javascript:/data: 等协议可构造点击型 XSS
      if(obj.demo && !/^https?:\/\//i.test(obj.demo)){ setFieldErr('#f_demo','演示链接必须以 http(s):// 开头','#f_demo_err'); return; }

      toast('已保存','ok'); cur='library'; render();
