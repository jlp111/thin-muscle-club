/* 思源宋体（Noto Serif SC）可变字重 200–900，按本页用字切 4 块内嵌
   每块带自己的 unicode-range；缺字回退到系统宋体。来源：Google Fonts。 */





/* =====================================================================
 * 薄肌俱乐部 · 展示层样式表 v5
 * 设计系统：Ink Surface + 三轴色彩 (status / cat / tier)
 *
 * 契约（改动前务必先读）：
 *   status 轴 --st-*   仅表达「判定」——ok / info / warn / bad / mut，是全站唯一允许填充的轴。
 *   cat    轴 --cat-*  无序分类——仅「文字 + 描边」，禁填充，避免与状态色混淆。
 *   tier   轴 --tier-* 有序分级——同 cat，仅「文字 + 描边」。
 *   --accent 仅用于「可交互」，禁止用它表达判定。
 *   别名：--cat-0 = --st-mut = --tier-3（同为「中性/其他」）；--st-info = --accent（信息色即品牌色）。
 *
 * v5 相对 v4 的变更（纯展示层，DOM 与类名契约不变）：
 *   1. 品牌色由通用蓝 #4f9dff 收敛为「鸢尾紫」，与 status 轴（绿 / 琥珀 / 红）色相隔离，
 *      既避开品类默认蓝，也让「可交互」在深色底上更容易被一眼识别。
 *   2. 新增材质层令牌 --grad-* / --amb-* / --glow：面板与卡片由「平涂」升级为极轻的
 *      竖向渐变 + 顶缘高光，用材质而非阴影来表达层级，深色下不再糊成一片。
 *   3. 圆角、阴影、字阶、进度条厚度整体收紧，标题加负字距，提升「精密仪器」般的秩序感。
 *   4. 新增自定义滚动条、选区配色、prefers-contrast 增强，无障碍能力只增不减。
 *   所有 颜色 / 字号 / 间距 / 圆角 / 阴影 / 渐变 一律走 CSS 变量，禁止硬编码。
 * ===================================================================== */

/* ---------- 1. 设计令牌 ---------- */
:root{
  /* 声明原生控件配色：select 下拉 / date 日历 / 滚动条 会跟随该值渲染 */
  color-scheme: dark;
  /* 分区锚点偏移 = header 高 + 余量（87+12 / 移动 53+12） */
  --h-header:99px;

  /* 1. 表面层级 4 阶：0=页面凹槽 → 1=面板 → 2=卡片 → 3=悬停/浮起 */
  --surface-0:#0a0a0a;  --surface-1:#111111;  --surface-2:#181817;  --surface-3:#222220;
  --line-1:#1e1e1c;     --line-2:#2c2c29;     --line-3:#3d3d39;     --line-ctl:#4d4d48;

  /* 2. 文本 */
  /* 三级文字刻意拉开：txt-1 主 / txt-2 次 / txt-3 辅助。
     txt-3 取值受「卡片悬停态」反推——悬停底色 --surface-3 比常态亮，三级文字须在其上仍 ≥4.5:1；
     因此把 txt-2 一并上提，避免两级被压成同一档。 */
  --txt-1:#f7f7f4;  --txt-2:#a8a8a0;  --txt-3:#8f8f87;  --txt-inv:#0a0a0a;

  /* 3. 动作色（唯一用于「可交互」与「当前」，禁止表达判定）——酸柠
     取值来自 B 方向实测：15.5:1 压在近黑底上，是全页唯一允许发光的颜色。 */
  --accent:#dcee5d;  --accent-bg:rgba(220,238,93,.13); --accent-bd:rgba(220,238,93,.36); --accent-hi:#e9f78c;

  /* 4. status 轴（唯一允许填充的轴） */
  --st-ok:#4ad6a0;  --st-ok-bg:rgba(74,214,160,.13);  --st-ok-bd:rgba(74,214,160,.34);
  --st-info:#dcee5d;--st-info-bg:rgba(220,238,93,.13);--st-info-bd:rgba(220,238,93,.34);
  --st-warn:#f2b45c;--st-warn-bg:rgba(242,180,92,.13);--st-warn-bd:rgba(242,180,92,.34);
  --st-bad:#f97070; --st-bad-bg:rgba(249,112,112,.13);--st-bad-bd:rgba(249,112,112,.34);
  --st-mut:#a3acba; --st-mut-bg:rgba(163,172,186,.10);--st-mut-bd:rgba(163,172,186,.26);

  /* 5. cat 池（无序分类，文字+描边，禁填充） */
  --cat-1:#f0947a; --cat-1-bd:rgba(240,148,122,.32);
  --cat-2:#e8bb63; --hl-money:#e8bb63; --hl-money-bg:rgba(232,187,99,.13); --hl-money-bd:rgba(232,187,99,.32);
   --cat-2-bd:rgba(232,187,99,.32);
  --cat-3:#a8cd6e; --cat-3-bd:rgba(168,205,110,.32);
  --cat-4:#57c98d; --cat-4-bd:rgba(87,201,141,.32);
  --cat-5:#5ccfd8; --cat-5-bd:rgba(92,207,216,.32);
  --cat-6:#6fa8f5; --cat-6-bd:rgba(111,168,245,.32);
  --cat-7:#b58cf0; --cat-7-bd:rgba(181,140,240,.32);
  --cat-8:#e88fc2; --cat-8-bd:rgba(232,143,194,.32);
  --cat-0:#98a1b0; --cat-0-bd:rgba(152,161,176,.26);

  /* 6. tier 轴（有序分级，文字+描边，禁填充） */
  --tier-1:#6fe0b4;  --tier-2:#8cc0ff;  --tier-3:#98a1b0;  --tier-4:#f89a9a;

  /* 7. 字体 */
  --ff: -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  /* 数字不再走等宽家族：Menlo/Consolas 的字面只有正文的 0.86 倍、重心偏高，
     25-40g 这类混排数字会显得比汉字小一号。改用系统无衬线（SF / Segoe UI），
     字面与汉字同高；列对齐由 font-variant-numeric:tabular-nums 保证，不靠等宽字体。 */
  --ff-num: -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* 字阶说明：13px 原为正文主体，但实测有 116 处内容文字（今日建议的具体目标、表格单元格、
     容量注释）落在这一档，低于网页正文 14px 的可读性底线。现把 --fs-sm 提到 14px，
     使「正文及其辅助文字」统一在 14px 一档；与正文的区分改由颜色（txt-2/txt-3）与字重承担，
     这比 1px 的字号差更稳健。12px 专留给标签/元信息。 */
  --fs-xs:12px; --lh-xs:1.6;   --fs-sm:14px; --lh-sm:1.68;   --fs-md:14px; --lh-md:1.78;
  /* 字阶收敛到六档：12 / 14 / 15 / 20 / 24 / 26。
     原先 --fs-lg 16 与正文 15 只差 1px、--fs-xl 21 与 --fs-h2 20 只差 1px，
     两对「差 1px 的层级」各占一个层级名，等于凭空多两档、把层级稀释掉；
     现已分别并入 15 与 20。另：正文实际渲染由第 1397 行媒体查询统一为 15px，
     令牌与浏览器取值必须一致，否则按令牌调层级会失灵。 */
  --fs-lg:15px; --lh-lg:1.45;  --fs-xl:20px; --lh-xl:1.3;  --fs-display:26px; --lh-display:1.15;
  --fs-h2:20px; --lh-h2:1.35;  --fs-h3:24px; --lh-h3:1.25;
  /* 字重只有两档：400 常规 / 600 强调。
     原来的 500（fw-m）在中文系统字体上根本落不到——苹方/雅黑的中间档不稳定，
     Windows 直接退到 Regular，于是「500」和「400」看起来一样，「600」又和「700」糊在一起，
     三档被压成一档半，层级只能靠字号硬撑。这里合成两档，强调回归稀缺。 */
  --fw-m:400; --fw-sb:600; --fw-b:600;
  /* 标题负字距：字号越大越收紧，避免中英混排显得松散 */
  --ls-tight:-.01em; --ls-display:-.02em;

  /* 8. 间距 10 档（原缺 sp-8，20 直接跳到 32，24px 这个最常用段距无处落） */
  --sp-1:2px; --sp-2:4px; --sp-3:6px; --sp-4:8px; --sp-5:12px;
  --sp-6:16px; --sp-7:20px; --sp-8:24px; --sp-9:32px;

  /* 9. 圆角 3 档 + full */
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;

  /* 10. 材质与高程
     层级靠「渐变 + 顶缘高光」表达，阴影只做轻量兜底，避免深色下叠加成灰雾 */
  --hi-1:inset 0 1px 0 rgba(255,255,255,.045);  --hi-2:inset 0 1px 0 rgba(255,255,255,.075);
  --shadow-1:0 1px 2px rgba(0,0,0,.34), var(--hi-1);
  --shadow-2:0 2px 6px rgba(0,0,0,.34), 0 10px 28px rgba(0,0,0,.42), var(--hi-2);
  --shadow-3:0 4px 12px rgba(0,0,0,.42), 0 20px 48px rgba(0,0,0,.58), var(--hi-2);
  --glow:rgba(124,134,242,.26);
  /* 控件材质：主按钮的内高光 / 投影 / 按压阴影、输入框的内凹阴影。
     本质是「白上黑下」的光影常量，但仍收进令牌 —— 三套深色主题各自调强弱，
     同一强度放到石灰绿与暖炭上观感不同，不能写死。 */
  --btn-hi:inset 0 1px 0 rgba(255,255,255,.22);
  --btn-hi-hover:inset 0 1px 0 rgba(255,255,255,.28);
  --btn-drop:0 1px 2px rgba(0,0,0,.28);
  --btn-press:inset 0 2px 4px rgba(0,0,0,.24);
  --input-inset:inset 0 1px 2px rgba(0,0,0,.16);
  /* 面板 / 卡片 / 页头 的竖向渐变：顶部略亮，模拟自上而下的环境光 */
  --grad-panel:linear-gradient(180deg,#13161b 0%,#0f1115 100%);
  --grad-card:linear-gradient(180deg,#1a1d23 0%,#161920 100%);
  --grad-header:linear-gradient(180deg,#13161b 0%,#0f1115 100%);
  --grad-btn:linear-gradient(180deg,#8b93f5 0%,#6d78ea 100%);
  --grad-btn-hi:linear-gradient(180deg,#9aa1f8 0%,#7b85ee 100%);
  --grad-bar:linear-gradient(90deg,#37c78f,#5ee0aa);
  /* 页面顶部环境光 + 表头右缘渐隐色（移动端 tabs 溢出遮罩） */
  --amb-1:rgba(124,134,242,.055);
  --header-fade:#0f1115;
  --input-bg:#0b0d11;
  /* 输入区填充色：输入框不再画描边，只靠「比所在容器更深一档」的填充界定可输入区域。
     hover 提亮一档给出「可点」的预反馈，focus 由 2px ring 接管（不再改背景，
     否则聚焦时整块会「亮一下」，比描边更吵）。disabled 用不透明度压制。 */
  --input-fill:#06070d;
  --input-fill-hover:#0d1017;

  /* 11. 焦点环 */
  --ring:#9ba3f8; --ring-w:2px; --ring-offset:2px;

  /* 12. 控件尺寸 */
  --h-ctrl:40px; --h-row:40px; --h-tag:20px; --h-chip:24px; --h-bar:6px;
  /* 12b. 控件内边距 / 尺寸（消除硬编码，间距一律走令牌） */
  --pad-tab:14px; --pad-btn:16px; --h-btn-sm:36px; --pad-ctl:10px; --sz-icon:32px; --max-pick:340px;
  /* 12c. 移动导航体系（P1-7 收编：底栏 / 更多面板 / 食物卡 / 身份行的专用尺寸档） */
  --h-nav:48px; --pad-nav:64px; --r-nav:10px; --z-nav:60;
  --h-touch-min:44px;  /* 内部触达标准(≈WCAG 2.5.5 AAA)；AA 2.5.8 硬底线为 24×24 */
  --fs-xxs:11px;       /* 二级小字（食物卡数值行），随全局字阶 +1 */

  /* 13. 动效 */
  --dur-1:120ms; --dur-2:180ms; --dur-3:260ms;
  --ease-std:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);

  /* 14. 栅格与容器 */
  --container:1240px;
  --grid-dense:repeat(auto-fill,minmax(min(100%,240px),1fr));
  --gap-grid:var(--sp-5);

  /* 15. 层级 */
  --z-header:10; --z-modal:40; --z-toast:50;
  --scrim:rgba(0,0,0,.62);
}

/* ---------- 1c. 主题：石灰（参考 openGym 的近黑 + 荧光青柠） ----------
   只换颜色与材质令牌，字号/间距/圆角/组件规则与深色完全一致。
   灰阶刻意压成「冷中性 + 微绿」，正文用偏绿的近白，让青柠强调色显得是唯一亮源。 */
html[data-theme="lime"]{
  color-scheme:dark;
  --surface-0:#0a0c10;  --surface-1:#111418;  --surface-2:#181c21;  --surface-3:#22272e;
  --line-1:#1e2329;     --line-2:#2b3138;     --line-3:#3c434c;     --line-ctl:#4c545e;
  --txt-1:#e9eee0;  --txt-2:#a7b0a0;  --txt-3:#8a947f;  --txt-inv:#0a0c10;

  --accent:#a3e635;  --accent-bg:rgba(163,230,53,.12); --accent-bd:rgba(163,230,53,.34); --accent-hi:#b9f25c;

  --st-ok:#35d6a4;  --st-ok-bg:rgba(53,214,164,.13);  --st-ok-bd:rgba(53,214,164,.34);
  --st-info:#a3e635;--st-info-bg:rgba(163,230,53,.12);--st-info-bd:rgba(163,230,53,.32);
  --st-warn:#f2b45c;--st-warn-bg:rgba(242,180,92,.13);--st-warn-bd:rgba(242,180,92,.34);
  --st-bad:#f97070; --st-bad-bg:rgba(249,112,112,.13);--st-bad-bd:rgba(249,112,112,.34);
  --st-mut:#a7b0a0; --st-mut-bg:rgba(167,176,160,.10);--st-mut-bd:rgba(167,176,160,.26);

  /* 分类色：沿用旧色相会与青柠打架，改为低饱和一族，按「暖→冷」排开 */
  --cat-1:#d9c9a3; --cat-1-bd:rgba(217,201,163,.30);
  --cat-2:#cfd39a; --hl-money:#cfd39a; --hl-money-bg:rgba(207,211,154,.12); --hl-money-bd:rgba(207,211,154,.30);
   --cat-2-bd:rgba(207,211,154,.30);
  --cat-3:#a9d98c; --cat-3-bd:rgba(169,217,140,.30);
  --cat-4:#8fd4b4; --cat-4-bd:rgba(143,212,180,.30);
  --cat-5:#93c9d6; --cat-5-bd:rgba(147,201,214,.30);
  --cat-6:#a3b6e6; --cat-6-bd:rgba(163,182,230,.30);
  --cat-7:#c3a9e0; --cat-7-bd:rgba(195,169,224,.30);
  --cat-8:#dda3c4; --cat-8-bd:rgba(221,163,196,.30);
  --cat-0:#a7b0a0; --cat-0-bd:rgba(167,176,160,.26);
  --tier-1:#35d6a4; --tier-2:#a3e635; --tier-3:#a7b0a0; --tier-4:#f97070;

  --hi-1:inset 0 1px 0 rgba(255,255,255,.04);
  --hi-2:inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-1:0 1px 2px rgba(0,0,0,.36), var(--hi-1);
  --shadow-2:0 2px 6px rgba(0,0,0,.36), 0 10px 28px rgba(0,0,0,.44), var(--hi-2);
  --shadow-3:0 4px 12px rgba(0,0,0,.44), 0 20px 48px rgba(0,0,0,.60), var(--hi-2);
  --glow:rgba(163,230,53,.22);

  --grad-panel:linear-gradient(180deg,#111418 0%,#0c0f13 100%);
  --grad-card:linear-gradient(180deg,#181c21 0%,#14181d 100%);
  --grad-header:linear-gradient(180deg,#111418 0%,#0c0f13 100%);
  --grad-bar:linear-gradient(90deg,#7bc313,#b9f25c);
  --amb-1:rgba(163,230,53,.05);
  --header-fade:#0c0f13;
  --input-bg:#070a0d;
  --input-fill:#06070f;
  --input-fill-hover:#10141c;
  --ring:#a3e635;
  --scrim:rgba(0,0,0,.68);

  --btn-fill:#a3e635; --btn-fill-hi:#b9f25c; --btn-fill-press:#8fcc24;
  --btn-fill-bd:#7cb31c; --btn-bd-hi:#93d120;
  --btn-edge:inset 0 0 0 1px rgba(8,12,6,.24);
  --grad-btn:var(--btn-fill); --grad-btn-hi:var(--btn-fill-hi);
}

/* ---------- 1d. 主题：暖炭（参考 GymMane 的暖黑 + 沙色强调） ----------
   与石灰的区别不只是色相：暖炭的灰阶整体偏棕、文字偏米白，
   强调色用低饱和沙色，强调"安静"而不是"发亮"。 */
html[data-theme="ember"]{
  color-scheme:dark;
  --surface-0:#100d0b;  --surface-1:#171311;  --surface-2:#1f1916;  --surface-3:#29221d;
  --line-1:#241d19;     --line-2:#332a24;     --line-3:#463a31;     --line-ctl:#57493e;
  --txt-1:#f2e9df;  --txt-2:#c0ae9d;  --txt-3:#9c8b7a;  --txt-inv:#14100d;

  --accent:#d9a184;  --accent-bg:rgba(217,161,132,.14); --accent-bd:rgba(217,161,132,.36); --accent-hi:#eab89d;

  --st-ok:#9dbe6b;  --st-ok-bg:rgba(157,190,107,.13);  --st-ok-bd:rgba(157,190,107,.34);
  --st-info:#d9a184;--st-info-bg:rgba(217,161,132,.14);--st-info-bd:rgba(217,161,132,.34);
  --st-warn:#e0a760;--st-warn-bg:rgba(224,167,96,.13); --st-warn-bd:rgba(224,167,96,.34);
  --st-bad:#e8796b; --st-bad-bg:rgba(232,121,107,.13); --st-bad-bd:rgba(232,121,107,.34);
  --st-mut:#c0ae9d; --st-mut-bg:rgba(192,174,157,.10); --st-mut-bd:rgba(192,174,157,.26);

  /* 分类色：整体压进暖调，最暖一档直接取沙色强调 */
  --cat-1:#d9a184; --cat-1-bd:rgba(217,161,132,.32);
  --cat-2:#d9c08a; --hl-money:#d9c08a; --hl-money-bg:rgba(217,192,138,.12); --hl-money-bd:rgba(217,192,138,.32);
   --cat-2-bd:rgba(217,192,138,.32);
  --cat-3:#bcc48a; --cat-3-bd:rgba(188,196,138,.32);
  --cat-4:#9dbe6b; --cat-4-bd:rgba(157,190,107,.32);
  --cat-5:#96b3a8; --cat-5-bd:rgba(150,179,168,.30);
  --cat-6:#a3a9c4; --cat-6-bd:rgba(163,169,196,.30);
  --cat-7:#c3a3b8; --cat-7-bd:rgba(195,163,184,.30);
  --cat-8:#d3a0a0; --cat-8-bd:rgba(211,160,160,.30);
  --cat-0:#c0ae9d; --cat-0-bd:rgba(192,174,157,.26);
  --tier-1:#9dbe6b; --tier-2:#d9a184; --tier-3:#c0ae9d; --tier-4:#e8796b;

  --hi-1:inset 0 1px 0 rgba(255,240,225,.045);
  --hi-2:inset 0 1px 0 rgba(255,240,225,.07);
  --shadow-1:0 1px 2px rgba(0,0,0,.36), var(--hi-1);
  --shadow-2:0 2px 6px rgba(0,0,0,.36), 0 10px 28px rgba(0,0,0,.44), var(--hi-2);
  --shadow-3:0 4px 12px rgba(0,0,0,.44), 0 20px 48px rgba(0,0,0,.60), var(--hi-2);
  --glow:rgba(217,161,132,.22);

  --grad-panel:linear-gradient(180deg,#171311 0%,#12100e 100%);
  --grad-card:linear-gradient(180deg,#1f1916 0%,#191412 100%);
  --grad-header:linear-gradient(180deg,#171311 0%,#12100e 100%);
  --grad-bar:linear-gradient(90deg,#c98d6c,#eab89d);
  --amb-1:rgba(217,161,132,.05);
  --header-fade:#12100e;
  --input-bg:#0b0908;
  --input-fill:#0b0806;
  --input-fill-hover:#16110e;
  --ring:#d9a184;
  --scrim:rgba(0,0,0,.68);

  --btn-fill:#d9a184; --btn-fill-hi:#eab89d; --btn-fill-press:#c88f70;
  --btn-fill-bd:#b57d5f; --btn-bd-hi:#c98a68;
  --btn-edge:inset 0 0 0 1px rgba(20,12,8,.22);
  --grad-btn:var(--btn-fill); --grad-btn-hi:var(--btn-fill-hi);
}
@media (pointer:coarse){ :root{ --h-ctrl:44px; --h-row:44px; }}

/* ---------- 2. 基础重置 ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--surface-0)}
body{margin:0;color:var(--txt-1);
  /* 顶部环境光：整站只有这一处页面级渐变，锚在文档顶端，滚动时自然淡出 */
  background:radial-gradient(58% 300px at 50% 0, var(--amb-1), transparent 100%) no-repeat, var(--surface-0);
  font-family:var(--ff);font-size:var(--fs-md);line-height:var(--lh-md);
  font-optical-sizing:auto;
  /* 禁止浏览器合成字重/斜体：系统字体缺 500/600 档时，合成加粗会把笔画糊成墨团，
     这不是「更醒目」而是「变脏」。宁可不强调，也不接受变形字。中文没有斜体传统，
     faux italic 一出现就是事故。 */
  font-synthesis:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
h1{font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:var(--fw-b);letter-spacing:var(--ls-tight);text-wrap:balance}
h2{font-size:var(--fs-h2);line-height:var(--lh-h2);font-weight:var(--fw-sb);letter-spacing:var(--ls-tight);text-wrap:balance}
h3{font-size:var(--fs-md);line-height:var(--lh-md);font-weight:var(--fw-sb);color:var(--txt-1);letter-spacing:var(--ls-tight);text-wrap:balance}
p{font-size:var(--fs-md);line-height:var(--lh-md);text-wrap:pretty}
a{color:var(--accent);text-decoration:none;transition:color var(--dur-1) var(--ease-std)}
@media (hover:hover){
a:hover{color:var(--accent-hi);text-decoration:underline;text-underline-offset:2px}}
b,strong{font-weight:var(--fw-sb)}
ul,ol{padding-left:1.25em}
svg{display:block;max-width:100%}
button{font-family:inherit}
::selection{background:var(--accent-bd);color:var(--txt-1)}

/* 自定义滚动条：默认细窄、低对比，悬停时才浮现——避免抢走内容注意力 */
*{scrollbar-width:thin;scrollbar-color:var(--line-3) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid transparent;
  background-clip:content-box;border-radius:var(--r-full)}
@media (hover:hover){
::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:content-box}}
::-webkit-scrollbar-corner{background:transparent}

/* ---------- 3. 工具类 ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--txt-2)}
.small{font-size:var(--fs-sm);line-height:var(--lh-sm)}
.num{font-family:var(--ff-num);font-variant-numeric:tabular-nums}
.mt-0{margin-top:0} .mt-2{margin-top:var(--sp-2)} .mt-3{margin-top:var(--sp-3)}
.mt-4{margin-top:var(--sp-4)} .mt-5{margin-top:var(--sp-5)}
.mt-6{margin-top:var(--sp-6)} .mt-7{margin-top:var(--sp-7)}
/* status 文字色（全局统一：ok / info / warn / bad / mut） */
.ok{color:var(--st-ok)} .info{color:var(--st-info)} .warn{color:var(--st-warn)}
.bad{color:var(--st-bad)} .mut{color:var(--st-mut)}

/* ---------- 4. 布局：页头 / 主区 ---------- */
header{position:sticky;top:0;z-index:var(--z-header);
  background:var(--grad-header);
  border-bottom:1px solid var(--line-2)}
/* 页头底缘一道虹彩发丝线：把品牌色以极低的强度带到全局最显眼的位置 */
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-bd) 22%,var(--accent-bd) 78%,transparent);
  opacity:.5;pointer-events:none}
.nav-inner{position:relative;max-width:var(--container);margin:0 auto;padding:0 var(--sp-5)}
.nav-brand{display:flex;align-items:baseline;gap:var(--sp-3);padding:var(--sp-4) 0 var(--sp-2)}
.brand{font-size:var(--fs-md);line-height:var(--lh-md);font-weight:var(--fw-sb);
  letter-spacing:.02em;color:var(--txt-1);display:inline-flex;align-items:center;gap:var(--sp-3)}
/* 品牌标记：纯 CSS 绘制的双环符号，替代字符图标（P0-1 零命中） */
.brand::before{content:'';flex:0 0 auto;width:12px;height:12px;border-radius:var(--r-full);
  background:var(--grad-btn);box-shadow:0 0 0 1px var(--accent-bd), 0 0 10px var(--glow)}
.ver{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--txt-3);
  font-family:var(--ff-num)}
main{max-width:var(--container);margin:0 auto;padding:var(--sp-6) var(--sp-5) var(--sp-9)}
@media (max-width:767px){
  .nav-brand{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  :root{--pad-tab:var(--sp-4);--h-header:65px}
  /* 右缘渐隐：遮住横向滚动的 tabs，暗示「还有更多」，颜色须与页头实底一致 */
  .nav-inner::after{content:'';position:absolute;top:0;right:0;bottom:0;width:var(--sp-9);
    background:linear-gradient(90deg,transparent,var(--header-fade) 65%);
    pointer-events:none}}

/* ---------- 4b. 主题切换按钮 ----------
   绝对定位于页头右侧。注意不能放进 .nav-brand —— 该容器在 ≤767px 被设成 sr-only，
   按钮会跟着消失。 */
.theme-btn{position:absolute;top:10px;right:var(--sp-5);z-index:1;
  display:inline-flex;align-items:center;height:var(--h-chip);padding:0 var(--sp-4);
  border:1px solid var(--line-2);border-radius:var(--r-full);background:var(--surface-1);
  color:var(--txt-2);font-family:inherit;font-size:var(--fs-xs);line-height:1;
  font-weight:var(--fw-m);white-space:nowrap;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  box-shadow:var(--hi-1);
  transition:background-color var(--dur-1) var(--ease-std),
             border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
@media (hover:hover){
.theme-btn:hover{background:var(--surface-2);border-color:var(--accent-bd);color:var(--txt-1)}}
.theme-btn:focus-visible{outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}
@media (max-width:767px){
  /* ≤767px 时 .nav-brand 被 sr-only、body.is-mobile 下 #tabs 被 display:none，
     .nav-inner 既无内容又无高度 → header 只剩 2px，而 .theme-btn 仍是 absolute，
     会全程浮在 y=6..26 盖住正文。解法是给抬头区补结构、按钮归位到文档流，
     而不是给 header 硬撑一个 min-height。
     不用 --h-header(65px)：那是锚点偏移用的，48px 已够且省首屏。 */
  .nav-inner{min-height:48px;display:flex;align-items:center}
  .theme-btn{position:static;margin-left:auto;height:var(--h-chip);padding:0 var(--sp-4)}}

/* ---------- 5. Tab 导航 ---------- */
.tabs{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) 0;
  overflow-x:auto;overscroll-behavior-x:contain;scroll-behavior:smooth;
  scroll-padding-inline:var(--sp-4);
  scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.nav-group{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto}
.nav-sep{flex:0 0 auto;width:1px;height:20px;background:var(--line-2);margin:0 var(--sp-2)}
.nav-glabel{flex:0 0 auto;font-size:var(--fs-xs);line-height:var(--lh-xs);
  font-weight:var(--fw-m);color:var(--txt-3);padding:0 var(--sp-1);white-space:nowrap;
  letter-spacing:.06em}
.tab{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;
  height:var(--h-ctrl);padding:0 var(--pad-tab);border:1px solid transparent;
  border-radius:var(--r-md);background:transparent;color:var(--txt-2);
  font-size:var(--fs-md);font-weight:var(--fw-sb);line-height:1;white-space:nowrap;
  cursor:pointer;-webkit-appearance:none;appearance:none}
@media (hover:hover){
.tab:hover{background:var(--surface-2);color:var(--txt-1)}}
/* 激活态：品牌色淡底胶囊 + 底部短发光条。两者都走 --accent，与 status 轴不冲突 */
.tab.active{background:var(--accent-bg);border-color:var(--accent-bd);color:var(--txt-1);
  box-shadow:var(--hi-1)}
.tab.active::after{content:'';position:absolute;left:50%;bottom:3px;width:16px;height:2px;
  transform:translateX(-50%);border-radius:var(--r-full);
  background:var(--accent);box-shadow:0 0 8px var(--glow)}
@media (max-width:1023px){
  .nav-glabel{display:none}
  .nav-sep{margin:0 var(--sp-1)}}
@media (max-width:479px){
  :root{--pad-tab:var(--sp-3)}
  .tab{font-size:var(--fs-sm)}}

/* ---------- 6. 面板 / 卡片 / 栅格 ---------- */
.panel{background:var(--grad-panel);border:1px solid var(--line-1);border-radius:var(--r-lg);
  padding:var(--sp-6);margin-bottom:var(--sp-6);box-shadow:var(--shadow-1)}
.card{background:var(--grad-card);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:var(--sp-5);box-shadow:var(--shadow-1)}
@media (hover:hover){
@media (hover:hover){
.card:hover{background:var(--surface-3);border-color:var(--line-3);
  box-shadow:var(--shadow-2);transform:translateY(-1px)}}}
.card.note-warn{border-color:var(--st-warn-bd)}
.card.note-ok{border-color:var(--st-ok-bd)}
.card.note-alt{border-color:var(--cat-7-bd)}
.card.note-pink{border-color:var(--cat-8-bd)}
/* 说明 / 免责：默认收起的折叠条。
   内容一字不删，只改默认展开状态——五页首屏原本被 150-270 字的「使用说明 + 免责」占满，
   真正的卡片被推到第二屏。改用中性色而非状态色：免责条款是固定文案，不是「状态」，
   它占了首屏最亮的位置，就是颜色轴误用（status 轴只该表达判定）。 */
.card.note-fold{margin:var(--sp-3) 0 0;padding:0 var(--sp-5);
  background:var(--surface-2);border-color:var(--line-1);box-shadow:none}
@media (hover:hover){
.card.note-fold:hover{background:var(--surface-2);border-color:var(--line-2);
  box-shadow:none;transform:none}}
.card.note-fold>summary{min-height:40px;border:0;padding:0;
  font-size:var(--fs-xs);color:var(--txt-3)}
.card.note-fold>summary .nf-k{color:var(--txt-2);font-weight:var(--fw-sb)}
.card.note-fold>summary .nf-hint{margin-left:auto;color:var(--txt-3)}
.card.note-fold[open]>summary{border-bottom:1px solid var(--line-1);margin-bottom:var(--sp-4)}
.card.note-fold>p{margin-bottom:var(--sp-3)}
.card.note-fold>p:last-child{margin-bottom:var(--sp-4)}
/* 卡片内段落节奏（替代逐条 inline margin） */
:where(.card)>p{margin-top:var(--sp-4)}
.card>*:first-child{margin-top:0}
.act-block{margin:var(--sp-5) 0;border-top:1px solid var(--line-1);padding-top:var(--sp-4)}
.card.is-excluded{opacity:.72}
.card.is-excluded .lead{text-decoration:line-through;text-decoration-color:var(--line-3)}

.grid{display:grid;grid-template-columns:1fr;gap:var(--gap-grid);margin-top:var(--sp-5)}
/* 动作库 58 张卡 / 3,016 节点，是全站最重的一页（切页布局 34.6ms，掉两帧）。
   用 content-visibility:auto 让视口外的卡片跳过布局与绘制——节点数不变、结构不变，
   但首帧只算看得见的 3-4 张。contain-intrinsic-size 用 auto，浏览器会记住真实高度，
   滚动时不会来回跳。只限定在动作库，避免影响其他页的卡片。 */
/* 只给动作库用（58 张卡 / 3,016 节点 / 15.2 屏，切页布局 34.6ms → 6.7ms）。
   知识库那五页故意不启用：content-visibility 会让「未滚动过的高度」按估算值算，
   实测偏差约 9%（补剂 4370 估 vs 3998 实际），滚到底才自我修正——对「要读到页底」的
   内容页来说，滚动条忽长忽短比省 12ms 更烦；而动作库是检索型页面，快速滚动更常见。
   intrinsic-size 取实测中位数 185px（区间 141–233）。 */
#libList .grid>.card{content-visibility:auto;contain-intrinsic-size:auto 185px}
.grid.stat{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.stat>*:first-child{grid-column:span 2}
/* 移动端：首枚 stat 独占整行时会因留白过大而比 .hero-day-v 更抢眼（首屏最大元素）。
   改为 3 枚并列，配合 .stat .v 降至 --fs-xl 后宽度足够 */
@media (max-width:767px){
  .grid.stat{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.stat>*:first-child{grid-column:auto}
}
.grid.dense{grid-template-columns:var(--grid-dense)}
.grid.mt-0{margin-top:0}
@media (min-width:768px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1024px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- 7. 行 / 工具条 / 字段 ---------- */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3)}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3);
  margin:var(--sp-5) 0}
/* 长页分区：跳转目录 + 锚点偏移（避免 sticky header 盖住标题） */
.toc{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-3)}
.toc-item{display:inline-flex;align-items:center;height:var(--h-chip);padding:0 var(--sp-4);
  border-radius:var(--r-full);border:1px solid var(--line-2);background:transparent;
  color:var(--txt-2);font-size:var(--fs-xs);line-height:1;white-space:nowrap;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  transition:background-color var(--dur-1) var(--ease-std),
             border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
@media (hover:hover){
.toc-item:hover{background:var(--surface-2);border-color:var(--accent-bd);color:var(--txt-1)}}
.toc-item:focus-visible{border-color:var(--accent-bd)}
.panel[id]{scroll-margin-top:var(--h-header)}
.toolbar:first-child{margin-top:0}
/* 筛选下拉的内容宽度是固定的（"全部分类"约 74px），给死 200px 会留一大段空白；
   让它按内容自适应、只设上限。搜索框才是需要伸展的那一个。 */
.toolbar>select{width:auto;flex:0 1 auto;max-width:min(200px,50vw)}
.toolbar>input{flex:1 1 150px;max-width:240px}
.btnrow{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-5)}
.field{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.field-row{display:grid;gap:var(--sp-4);
  grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
/* 含原生日期的字段一律独占整行：日期内容固有 162px，与两列的 100 余 px 挤不下。
   这条必须放在全局（桌面也要用），否则桌面上日期会和时间并排、两个时间被挤成斜对角。 */
.field-row>.field.f-wide{grid-column:1/-1}
/* 手机上 200px 下限算不出第二列（2×200+8=408 > 336），于是所有字段各自占满一整行，
   而时间框实际只需要 59px。96px 的下限让 390px 能排到 3 列（3×96+2×8=304 ≤ 336），
   两项的行仍由 auto-fit 合并成各半宽。 */
@media (max-width:767px){
  .field-row{grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));gap:var(--sp-3)}
  /* 原生 time 控件的固有宽度 103px（含时钟图标与 20px 内边距），三列轨道只有 97px，
     会被削掉 6px。这里只收紧它自己的左右内边距与间距腾位置，不改字号（改了会和
     相邻的数字/文本框视觉不齐）。 */
  input[type=time]{padding-left:5px;padding-right:5px}
  /* 原生日期控件的固有宽度约 162px（要显示 2026/10/29 三段），压到 107px 会被裁成
     "2026/10□"。所以含日期的字段在手机上独占一行，时间/数字继续并排。
     用 JS 打 f-wide / has-wide 而不是 :has()——微信安卓端的内核不支持 :has()。
     列数取 2 而不是 3：实测四个页面都是「日期 + 2 项」或「日期 + 4 项」，
     偶数个剩余项两两铺满，左右边界与日期严格齐平，不会在右侧留下一条空轨道。 */
  .field-row.has-wide{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* 日期必须与整行同宽，否则右缘比下面两列的时间组短一截。
     这里必须用 .f-wide 提高特异性：全局 `input[type=date]{max-width:15rem}` 在样式表里
     位置更靠后，同特异性下会反过来压住这条（第一版就是这么失效的）。 */
  .field-row>.field.f-wide>input[type=date],
  .field-row>.field.f-wide>input[type=datetime-local]{max-width:none}
}
.field-err{display:none;margin-top:var(--sp-1);font-size:var(--fs-sm);
  line-height:var(--lh-sm);color:var(--st-bad)}
.field-err.show{display:block}
/* 无效态：恢复边框色（边框一直在，只是常态透明），零布局影响、不与焦点环打架 */
input.invalid,select.invalid,textarea.invalid{border-color:var(--st-bad)}
input.invalid:focus,select.invalid:focus,textarea.invalid:focus{border-color:var(--st-bad)}

/* ---------- 8. 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  height:var(--h-ctrl);padding:0 var(--pad-btn);border:1px solid var(--accent-bd);
  border-radius:var(--r-md);
  background:var(--grad-btn);color:var(--txt-inv);
  font-size:var(--fs-md);font-weight:var(--fw-b);line-height:1;white-space:nowrap;
  cursor:pointer;-webkit-appearance:none;appearance:none;
  box-shadow:var(--btn-hi), var(--btn-drop)}
@media (hover:hover){
.btn:hover{background:var(--grad-btn-hi);
  box-shadow:var(--btn-hi-hover), 0 2px 12px var(--glow)}}
.btn:active{transform:translateY(1px);
  box-shadow:var(--btn-press)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
/* ghost / danger 走「安静」路线：去掉主按钮的渐变与内高光，只留描边 */
.btn.ghost{background:transparent;color:var(--txt-1);border-color:var(--line-2);box-shadow:none}
@media (hover:hover){
.btn.ghost:hover{background:var(--surface-2);border-color:var(--accent-bd);color:var(--txt-1)}}
.btn.danger{background:transparent;color:var(--st-bad);border-color:var(--st-bad-bd);box-shadow:none}
@media (hover:hover){
.btn.danger:hover{background:var(--st-bad-bg);border-color:var(--st-bad);color:var(--st-bad)}}
.btn.sm{height:var(--h-btn-sm);padding:0 var(--sp-4);font-size:var(--fs-sm);font-weight:var(--fw-sb)}
@media (pointer:coarse){ .btn.sm{height:44px;min-height:44px}}
@media (pointer:coarse){ .wmore{min-height:34px}}
/* P1-8：触达目标补齐（WCAG 2.2 AA 2.5.8 ≥24px）——只放大触达区，不改视觉密度 */
@media (pointer:coarse){
  .tag.act-link{min-height:34px;padding:0 var(--sp-5)}
  .ov-item{padding:var(--sp-2) var(--sp-4)}
  .toc-item{min-height:32px}
  /* 概览「我的事项」：名称按钮是文字链接语义（透明底、hover 只变色），
     32px 已在 AA 2.5.8(24px) 之上且保住扫读密度；加号是隐形热区，看到的仍只是 '+'。
     误触根因是 .ov-todo 的水平 gap（4px），靠加高度治不了 —— 必须同时改 gap。 */
  .ov-name-btn{min-height:34px;min-width:34px;padding:0 var(--sp-2);display:inline-flex;align-items:center;justify-content:center}
  .ov-add-btn{width:32px;height:32px}
  .ov-todo{gap:var(--sp-4)}
  .ov-items{gap:var(--sp-3) var(--sp-4)}
  /* 饮食页勾选项：整行可点，checkbox 本体放大到 20px */
  label.small.inline{min-height:var(--h-touch-min);display:inline-flex;align-items:center}
  input[type=checkbox]{width:20px;height:20px}
}
.btn.quiet{background:transparent;border-color:transparent;color:var(--txt-3);box-shadow:none}
/* 拆开写：hover 与 focus-visible 要分开门控 —— 混在一条里就没法只把 hover 包进
   @media (hover:hover)（那会顺手杀掉键盘焦点环）。 */
.btn.quiet:focus-visible{background:var(--surface-2);
  border-color:var(--line-2);color:var(--txt-1)}
@media (hover:hover){
.btn.quiet:hover{background:var(--surface-2);
  border-color:var(--line-2);color:var(--txt-1)}}
.btn.danger.quiet{background:transparent;border-color:transparent;color:var(--txt-3);box-shadow:none}
.btn.danger.quiet:focus-visible{background:var(--st-bad-bg);
  border-color:var(--st-bad-bd);color:var(--st-bad)}
@media (hover:hover){
.btn.danger.quiet:hover{background:var(--st-bad-bg);
  border-color:var(--st-bad-bd);color:var(--st-bad)}}

/* ---------- 9. 表单控件 ---------- */
/* 时间/日期/月份这类内容宽度是固定的，拉满只会留一大段空白（单独成行时） */
input[type=time],input[type=date],input[type=month],input[type=week]{max-width:15rem}
/* 原生日历/时钟按钮默认带一层 UA 底色，在深色主题上会露出一块白方块；
   统一成透明底 + 继承前景色，并给固定尺寸，避免它自己撑出一段额外宽度。 */
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator,
input[type=datetime-local]::-webkit-calendar-picker-indicator{
  background:transparent; color:inherit; opacity:.65;
  width:18px; height:18px; padding:0; margin:0 2px 0 0; cursor:pointer}
input[type=date]::-webkit-datetime-edit,
input[type=time]::-webkit-datetime-edit,
input[type=datetime-local]::-webkit-datetime-edit{padding:0}
input[type=number]{max-width:22rem}
/* 输入控件统一「无描边」：用填充色与容器分层，不靠 1px 线。
   注意这里必须写 `1px solid transparent` 而不是 `border:0` ——
   虽然视觉上看不见，但 1px 的盒子仍占位，高度 / 宽度 / 基线 / 相邻间距与改前逐像素一致；
   写 0 会让 box-sizing:border-box 的控件内容区变大、auto 高度的控件矮 2px，
   整页会累积出 5-6px 的位移（实测 97 处）。透明边框同时把 invalid 态留给 border-color 表达。 */
input,select,textarea{width:100%;height:var(--h-ctrl);background:var(--input-fill);
  border:1px solid transparent;border-radius:var(--r-sm);color:var(--txt-1);
  font-family:inherit;font-size:var(--fs-md);line-height:var(--lh-md);padding:0 var(--pad-ctl);
  box-shadow:none}
input,textarea{-webkit-appearance:none;appearance:none}
textarea{height:auto;min-height:calc(var(--h-ctrl) * 1.75);padding:var(--sp-4) var(--pad-ctl);resize:vertical}
input::placeholder,textarea::placeholder{color:var(--txt-3)}
@media (hover:hover){
/* 悬停：填充提亮一档。描边消失后必须补这层预反馈，否则控件看起来是「死」的。
   已聚焦的不再变色，避免鼠标划过时焦点态闪烁。 */
input:hover:not(:disabled):not(:focus),
select:hover:not(:disabled):not(:focus),
textarea:hover:not(:disabled):not(:focus){background:var(--input-fill-hover)}}
/* 聚焦：填充回到底色，改由 2px ring 接管。四态里这是唯一「强化」的一档。 */
input:focus,select:focus,textarea:focus{outline:none;background:var(--input-fill);
  box-shadow:0 0 0 var(--ring-w) var(--ring)}
/* 禁用：整块降不透明 + 指针禁止，视觉上「退到纸背」，与可编辑态彻底分开 */
input:disabled,select:disabled,textarea:disabled{
  opacity:.55;cursor:not-allowed;background:var(--input-fill)}
input[type=checkbox],input[type=radio]{width:1em;height:1em;min-width:1em;padding:0;margin:0;
  font-size:var(--fs-lg);accent-color:var(--accent);flex:0 0 auto;box-shadow:none;
  -webkit-appearance:auto;appearance:auto}
label{display:block;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-2);
  font-weight:var(--fw-m);margin:var(--sp-4) 0 var(--sp-2)}
label.inline{display:inline-flex;align-items:center;gap:var(--sp-2);margin:0;
  min-width:0;font-size:var(--fs-md)}
/* 非表单控件的区块标题：与 label 同视觉，但不承担表单关联语义 */
.field-label{display:block;font-size:var(--fs-sm);line-height:var(--lh-sm);
  color:var(--txt-2);font-weight:var(--fw-m);margin:var(--sp-4) 0 var(--sp-2)}

/* ---------- 10. 表格 ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:var(--sp-4) 0}
table.data{width:100%;border-collapse:collapse;font-size:var(--fs-sm);line-height:var(--lh-sm)}
table.data th,table.data td{text-align:left;padding:var(--sp-4) var(--pad-ctl);
  border-bottom:1px solid var(--line-1);vertical-align:top}
table.data th{color:var(--txt-2);font-weight:var(--fw-sb);font-size:var(--fs-xs);
  line-height:var(--lh-xs);white-space:nowrap;border-bottom-color:var(--line-2);
  letter-spacing:.04em}
table.data tbody tr{min-height:var(--h-row)}
@media (hover:hover){
@media (hover:hover){
table.data tbody tr:hover{background:var(--surface-2)}}}
table.data td.num,table.data th.num{text-align:right;
  font-family:var(--ff-num);font-variant-numeric:tabular-nums}
table.data tbody tr.is-today{background:var(--accent-bg)}
/* 移动端：表格转字段行卡片 */
@media (max-width:767px){
  .table-wrap{overflow:visible}
  table.data thead{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap}
  table.data,table.data tbody,table.data tr,table.data td{display:block;width:100%}
  table.data tr{border:1px solid var(--line-1);border-radius:var(--r-md);
    padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-3);background:var(--grad-card)}
  table.data td{border:none;padding:var(--sp-1) 0;display:flex;gap:var(--sp-4);
    align-items:baseline;justify-content:space-between}
  table.data td::before{content:attr(data-label);flex:0 0 auto;color:var(--txt-3);
    font-size:var(--fs-xs);line-height:var(--lh-xs)}
  table.data td:empty{display:none}
  table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
}
@media (min-width:480px) and (max-width:767px){
  table.data td{padding:var(--sp-2) 0}}

/* ---------- 10b. 吃练矩阵卡片网格 ---------- */
.dm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-3)}
.dm-card{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:var(--sp-3)}
.dm-total{border-color:var(--accent-bd);background:var(--accent-bg)}
.dm-head{display:flex;align-items:center;gap:var(--sp-2)}
.dm-date{font-size:var(--fs-sm);font-weight:var(--fw-sb);color:var(--txt-1);font-variant-numeric:tabular-nums}
.dm-head .badge{margin-left:auto}
.dm-train{margin-top:var(--sp-2)}
.dm-num{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-sm);line-height:var(--lh-sm);margin-top:var(--sp-2)}
.dm-num .lbl{color:var(--txt-3)}
.dm-num .val{color:var(--txt-1);font-weight:var(--fw-sb);font-variant-numeric:tabular-nums}
@media (min-width:1100px){.dm-grid{grid-template-columns:repeat(5,1fr)}}

/* ---------- 11. 标签 / 徽标 / 芯片 ---------- */
.tag{display:inline-flex;align-items:center;height:var(--h-tag);padding:0 var(--sp-4);
  border-radius:var(--r-full);border:1px solid var(--cat-0-bd);background:transparent;
  color:var(--cat-0);font-size:var(--fs-xs);line-height:1;font-weight:var(--fw-m);
  white-space:nowrap}
/* cat：无序分类——文字 + 描边，禁填充（与 tier 轴同规） */
.c0{color:var(--cat-0);background:transparent;border-color:var(--cat-0-bd)}
.c1{color:var(--cat-1);background:transparent;border-color:var(--cat-1-bd)}
.c2{color:var(--cat-2);background:transparent;border-color:var(--cat-2-bd)}
.c3{color:var(--cat-3);background:transparent;border-color:var(--cat-3-bd)}
.c4{color:var(--cat-4);background:transparent;border-color:var(--cat-4-bd)}
.c5{color:var(--cat-5);background:transparent;border-color:var(--cat-5-bd)}
.c6{color:var(--cat-6);background:transparent;border-color:var(--cat-6-bd)}
.c7{color:var(--cat-7);background:transparent;border-color:var(--cat-7-bd)}
.c8{color:var(--cat-8);background:transparent;border-color:var(--cat-8-bd)}
/* tier：有序分级——文字 + 描边，不填充 */
.tag.t1,.tag.t2,.tag.t3,.tag.t4{background:transparent}
.tag.t1{color:var(--tier-1);border-color:currentColor}
.tag.t2{color:var(--tier-2);border-color:currentColor}
.tag.t3{color:var(--tier-3);border-color:currentColor}
.tag.t4{color:var(--tier-4);border-color:currentColor}
.tag.t4 .tier-ord,.fld-k.t4{color:var(--tier-4)}

.chiprow{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--sp-1) var(--sp-5);margin:var(--sp-3) 0 0}
/* 芯片从「带框小盒子」降为「一行 meta」：标签本身已经写明是什么（剂量/时机/证据），
   再叠一层边框 + 一层底色 + 一层字重就是三重装饰。一张卡 4-5 个盒子叠起来，
   是这几页最主要的视觉噪音来源。现在只靠间距分隔，判断类（证据/安全性）保留文字色。 */
.chip{display:inline-flex;align-items:center;gap:var(--sp-2);
  padding:0;border:0;background:transparent;border-radius:0;
  /* 剂量 / 时机 / 证据 / 安全性是「要不要用」的判据，原先 12px + txt-3 是全卡最弱的一行，
     比下面的科普长文还小 —— 层级倒置。抬到 13px 并把对比从 txt-3 提到 txt-2：
     主次靠对比度拉开，不靠字号（字号已经收在 6 档里）。 */
  color:var(--txt-2);font-size:13px;line-height:1.5;white-space:nowrap}
/* 芯片里的值不再加粗：靠颜色（txt-1 对 txt-3）拉开，宽度靠 tabular-nums 对齐。 */
.chip b{color:var(--txt-1);font-weight:var(--fw-m);font-variant-numeric:tabular-nums}
.chip.ok{color:var(--st-ok);background:transparent;border:0}
.chip.info{color:var(--st-info);background:transparent;border:0}
.chip.warn{color:var(--st-warn);background:transparent;border:0}
.chip.bad{color:var(--st-bad);background:transparent;border:0}
.chip.mut{color:var(--st-mut);background:transparent;border:0}
.chip.ok b,.chip.info b,.chip.warn b,.chip.bad b,.chip.mut b{color:inherit}

.badge{display:inline-flex;align-items:center;height:var(--h-tag);padding:0 var(--sp-2);
  border-radius:var(--r-sm);border:1px solid transparent;font-size:var(--fs-xs);
  font-weight:var(--fw-m);line-height:1;white-space:nowrap}
.badge.ok{color:var(--st-ok);background:var(--st-ok-bg);border-color:var(--st-ok-bd)}
.badge.info{color:var(--st-info);background:var(--st-info-bg);border-color:var(--st-info-bd)}
.badge.warn{color:var(--st-warn);background:var(--st-warn-bg);border-color:var(--st-warn-bd)}
.badge.bad{color:var(--st-bad);background:var(--st-bad-bg);border-color:var(--st-bad-bd)}
.badge.mut{color:var(--st-mut);background:var(--st-mut-bg);border-color:var(--st-mut-bd)}

/* 只读计数胶囊：全站唯一「既有底色又有描边」的小件，和输入区的填充撞了语义。
   按新规则归位到「标签」档：透明底 + 描边，一眼看出「不能点、不能写」。 */
.pill{display:inline-flex;align-items:center;height:var(--h-chip);padding:0 var(--sp-4);
  border-radius:var(--r-full);background:transparent;border:1px solid var(--line-2);
  color:var(--txt-2);font-size:var(--fs-xs);line-height:1;white-space:nowrap}

/* ---------- 12. 内容片段：字段行 / 高亮 / 列表 / 失败模式 ---------- */
.fld{display:flex;gap:var(--sp-2);margin:var(--sp-2) 0;
  font-size:var(--fs-sm);line-height:var(--lh-sm)}
/* 内容整体作为一个 flex item —— flex 恒为「标签 + 内容」两项。
   若省掉这层，文本与被 rich()/markNum() 标记过的行内元素会各自成为匿名 flex item，
   在 nowrap 下并排挤压并独立折行，出现「金标准」被拆成两列这类错位（务必保留此层） */
.fld-v{flex:1 1 auto;min-width:0}
/* 动作名可点击：概览与计划统一使用 .tag.act-link（分类色描边 pill），与动作库同款 */
.act-tags{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.tag.act-link{cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;
  transition:border-color var(--dur-1) var(--ease-std),color var(--dur-1) var(--ease-std)}
@media (hover:hover){
.tag.act-link:hover{border-color:var(--accent-bd);color:var(--txt-1)}}
.tag.act-link:focus-visible{outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}
.card.is-focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg),var(--shadow-2)}
/* 补充演示图（free-exercise-db · Unlicense 公共领域 · 每动作 2 张：起始位 / 终末位） */
.ds2-row{display:flex;flex-wrap:wrap;gap:var(--sp-3)}
.ds2-img{display:block;width:150px;height:auto;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface-2)}
.ds2-note{font-size:var(--fs-xs);color:var(--txt-3);margin:var(--sp-2) 0 0;line-height:var(--lh-xs)}
.ds-off .ds2-img{display:none}
/* 数据集演示动画（GIF 由 CDN 按需加载，离线自动降级） */
.ds-gif{display:block;width:180px;height:180px;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface-2)}
.ds-attr{font-size:var(--fs-xs);color:var(--txt-3);margin:var(--sp-2) 0 0;line-height:var(--lh-xs)}
.ds-off .ds-gif{display:none}
.ds-off .ds-attr::before{content:'动画未加载 · ';color:var(--txt-3)}
.flist li{margin-bottom:var(--sp-1)}
/* 字段名只是「格子名」，不当强调：改用颜色（ok/info/warn/bad 各自着色）区分，
   字重归常规。原先 12px + 600 的字段名在每张卡里重复 4-5 次，是加粗通胀的主要来源之一。 */
.fld-k{flex:0 0 auto;min-width:3.4em;font-weight:var(--fw-m);white-space:nowrap}
.fld-k::before{content:'';display:inline-block;width:4px;height:4px;
  border-radius:var(--r-full);background:currentColor;margin-right:var(--sp-3);
  vertical-align:2px;opacity:.85}
.fld-k.ok{color:var(--st-ok)}   .fld-k.info{color:var(--st-info)}
.fld-k.warn{color:var(--st-warn)} .fld-k.bad{color:var(--st-bad)}
.fld-k.mut{color:var(--st-mut)}
/* 动作库扩展字段标题：复用 cat 轴（无序分类）——与 status 轴分工不冲突
   （要点=ok 绿 / 常见错误=bad 红 属 status；协同肌群·中文分步·动画演示·演示 属分类） */
.fld-k.anat{color:var(--cat-5)}   /* 协同肌群 —— 解剖参考 */
.fld-k.step{color:var(--cat-2)}   /* 中文分步 —— 核心操作步骤 */
.fld-k.anim{color:var(--cat-7)}   /* 动画演示 —— 视觉资源 */
.fld-k.ref{color:var(--cat-6)}    /* 演示 —— 外部参考源 */
.hl{background:var(--accent-bg);color:var(--accent-hi);border-radius:var(--r-sm);
  padding:0 var(--sp-2);font-weight:var(--fw-sb);font-variant-numeric:tabular-nums;
  box-shadow:inset 0 0 0 1px var(--accent-bd)}
.hl.money{background:var(--hl-money-bg);color:var(--hl-money);
  box-shadow:inset 0 0 0 1px var(--hl-money-bd)}
/* 中文分步的要领标注：与「中文分步」标题同色系（cat-2 琥珀），加粗 + 淡琥珀底。
   数据侧用 **…** 标记，渲染时由 rich() 转 <b> 后升级为本类 */
.key{color:var(--cat-2);font-weight:var(--fw-sb);
  background:var(--hl-money-bg);border-radius:var(--r-sm);padding:0 var(--sp-2)}
.flist{margin:var(--sp-1) 0 0;padding-left:1.25em}
.flist li{margin:var(--sp-1) 0}
.lead{font-size:var(--fs-md);line-height:var(--lh-md);color:var(--txt-1);
  font-weight:var(--fw-m);margin:var(--sp-3) 0 var(--sp-2)}
.fail{background:var(--st-warn-bg);border:1px solid var(--st-warn-bd);
  border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);
  margin:var(--sp-3) 0 var(--sp-2);font-size:var(--fs-sm);line-height:var(--lh-sm)}
.fail-k{display:block;color:var(--st-warn);font-weight:var(--fw-sb);
  font-size:var(--fs-xs);line-height:var(--lh-xs);margin-bottom:var(--sp-1)}
.fail-step{padding:var(--sp-1) 0}
.fail-step b{color:var(--st-warn);font-weight:var(--fw-sb);margin-right:var(--sp-2)}
.src{color:var(--txt-3);font-size:var(--fs-xs);line-height:var(--lh-xs)}
/* 去掉列表项外框后，项间呼吸必须由间距承担（原 4px 是配合框用的，纯文本会糊成一段） */
.tip-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:var(--sp-4);
  margin-bottom:0;margin-left:0;margin-right:0}
.tip-list:not([class*="mt-"]){margin-top:var(--sp-2)}
.tip-list li{position:relative;padding-left:var(--sp-5);
  font-size:var(--fs-sm);line-height:var(--lh-sm)}
.tip-list li::before{content:'·';position:absolute;left:var(--sp-3);top:0;color:var(--txt-3)}
/* 步骤序列（护肤早晚流程）：序号圆 + 单行动作，替代长段落便于扫读 */
.steps{list-style:none;padding:0;margin:var(--sp-2) 0 0;counter-reset:step}
.steps li{position:relative;padding-left:var(--sp-7);margin:var(--sp-2) 0;
  font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-1)}
.steps li:first-child{margin-top:0}
.steps li::before{counter-increment:step;content:counter(step);
  position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:var(--r-full);
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-0);border:1px solid var(--line-2);color:var(--txt-3);
  font-family:var(--ff-num);font-size:var(--fs-xs);font-weight:var(--fw-sb)}

/* ---------- 13. 折叠 ---------- */
details{margin:var(--sp-3) 0 0;border-top:1px solid var(--line-1);padding-top:var(--sp-3)}
summary{cursor:pointer;display:flex;align-items:center;gap:var(--sp-3);
  color:var(--txt-2);font-size:var(--fs-sm);line-height:var(--lh-sm);
  font-weight:var(--fw-m);list-style:none}
summary::-webkit-details-marker{display:none}
/* 展开箭头用 CSS 绘制的雪佛龙，替代字符图标，避免字体差异导致的基线偏移 */
summary::before{content:'';flex:0 0 auto;width:6px;height:6px;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(-45deg);transition:transform var(--dur-1) var(--ease-std)}
details[open] summary::before{transform:rotate(45deg)}
/* 展开内容淡入 + 轻微上移：18-23 个折叠块每页，原生瞬跳太生硬，但节气门式的整段高度动画
   会触发重排。只动 opacity/transform，不参与布局，所以不花性能。 */
/* 展开内容淡入 + 轻微上移。用 transition + @starting-style 而不是 keyframes：
   keyframes 不可中断，快速开合会从 0 重播；transition 会从当前值续接。
   @starting-style 只描述"首次显示时从哪来"，旧内核忽略它即退化为无动画，可接受。
   时长走 --dur-2（180ms），不再硬编码 .16s。 */
details[open]>*:not(summary){
  transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out);
  @starting-style{opacity:0;transform:translateY(-3px)}
}
@media (prefers-reduced-motion:reduce){details[open]>*:not(summary){transition:none}}
/* 知识库分组（护肤成分库）：组标题一行 + 组内卡片网格。
   组本身是可折叠的 <details>，但要盖掉 details 的通用上边框——
   否则每组顶部都会多一道线，和「分节靠留白、不靠装饰线」的规则打架。 */
/* 知识库首屏入场：5 项以内、每项差 25ms、总量 <300ms。
   .stagger 由 JS 只在「第一次进入这一页」时加；筛选/搜索引起的重渲染不加，
   否则每敲一个字都闪一次，变成噪声。表单页与记录页明确不动（每天几十次的界面不该动画）。 */
@keyframes kbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid.stagger>.card{animation:kbIn var(--dur-3) var(--ease-out) both}
.grid.stagger>.card:nth-child(2){animation-delay:25ms}
.grid.stagger>.card:nth-child(3){animation-delay:50ms}
.grid.stagger>.card:nth-child(4){animation-delay:75ms}
.grid.stagger>.card:nth-child(5){animation-delay:100ms}
@media (prefers-reduced-motion:reduce){.grid.stagger>.card{animation:none;animation-delay:0ms}}
.kb-group{border-top:0;padding-top:0;margin-top:var(--sp-6)}
.kb-group>summary{display:flex;align-items:baseline;gap:var(--sp-3);min-height:36px;
  color:var(--txt-1);font-size:var(--fs-md);font-weight:var(--fw-sb)}
.kb-group>summary .kbg-n{margin-left:auto;font-size:var(--fs-xs);color:var(--txt-3);font-weight:var(--fw-m)}
.kb-group>.grid{margin-top:var(--sp-3)}
/* 许可说明：读一次就够的元信息，收进折叠——它曾占掉动作库首屏 14 行 */
.lib-src{margin:var(--sp-3) 0 0;border-top:0;padding-top:0}
.lib-src>summary{font-size:var(--fs-xs);color:var(--txt-3)}
.lib-src .small{margin-top:var(--sp-3)}
@media (hover:hover){
summary:hover{color:var(--txt-1)}}

/* ---------- 14. Hero / 指标卡 / 进度条 ---------- */
/* Hero 是首页唯一「有表情」的区块：品牌色环境光自右上角渗入，其余面板一律克制 */
.hero-band{background:radial-gradient(120% 150% at 100% 0, var(--accent-bg), transparent 58%), var(--grad-panel);
  border:1px solid var(--line-1);
  border-radius:var(--r-lg);padding:var(--sp-6);margin-bottom:var(--sp-6);
  display:grid;grid-template-columns:1fr;gap:var(--sp-6);box-shadow:var(--shadow-1)}
.hero-day-k{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--txt-3);
  font-weight:var(--fw-m);letter-spacing:.08em;display:flex;align-items:center;gap:var(--sp-3)}
.hero-day-k::before{content:'';width:5px;height:5px;border-radius:var(--r-full);
  background:var(--accent);box-shadow:0 0 8px var(--glow)}
.hero-day-v{font-size:var(--fs-display);line-height:var(--lh-display);font-weight:var(--fw-b);
  letter-spacing:var(--ls-display);margin-top:var(--sp-3)}
.hero-day-sub{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-2);
  margin-top:var(--sp-3)}
@media (min-width:768px){
  .hero-band{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:start}}
.stat{background:var(--grad-card);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:var(--sp-5);box-shadow:var(--hi-1)}
/* 首屏主锚点只能是 .hero-day-v 一个。stat 数字降为 --fs-xl，
   避免两处 26px 互相抢注意力（原实现 .stat .v 与 .hero-day-v 同为 --fs-display） */
.stat .v{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:var(--fw-b);
  font-family:var(--ff-num);font-variant-numeric:tabular-nums;letter-spacing:var(--ls-display)}
.stat .k{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-2);
  margin-top:var(--sp-2)}
.stat.is-static{background:transparent;border-style:dashed}
.stat.is-static .v{color:var(--txt-2);font-size:var(--fs-lg)}
.stat .fix{display:block;font-size:var(--fs-xs);line-height:var(--lh-xs);
  color:var(--txt-3);margin-top:var(--sp-1)}
.home-cols{display:grid;grid-template-columns:1fr;gap:var(--sp-6)}
@media (min-width:1024px){ .home-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{height:var(--h-bar);background:var(--surface-0);border-radius:var(--r-full);
  overflow:hidden;border:1px solid var(--line-1);flex:1;max-width:140px}
.bar>i{display:block;height:100%;background:var(--grad-bar);border-radius:var(--r-full)}
.ov2-title{margin:var(--sp-8) 0 var(--sp-2);font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:var(--fw-sb);letter-spacing:var(--ls-tight)}
.ov2-sub{margin:0 0 var(--sp-4)}
/* 列数显式钉死：auto-fill 会让 6 卡在 1024px 变 5+1 孤儿换行、在 390px 塌成 1 列
   （390→内容 366px，2 列需 368px，差 2px 就翻车）。改为按断点定列，布局稳定。 */
.ov2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
/* 首屏卡片由 6 张并为 4 张（原「今日动作」与今日建议面板重复、「本周打卡」与 hero 周次数重复），
   列数随之收敛为 2/2/4，避免 6 列时后两张空位。 */
@media (min-width:768px){ .ov2-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1024px){ .ov2-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ov2-card{background:var(--grad-card);border:1px solid var(--line-2);border-radius:var(--r-md);padding:var(--sp-5)}
.ov2-k{font-size:var(--fs-xs);color:var(--txt-3);margin-bottom:var(--sp-2)}
.ov2-v{font-size:var(--fs-xl);font-weight:var(--fw-sb);color:var(--txt-1);line-height:1.2}
.ov2-v--sm{font-size:var(--fs-md)}
.ov2-note{font-size:var(--fs-xs);color:var(--txt-2);margin-top:var(--sp-2)}
.ov2-bar{height:var(--h-bar);background:var(--surface-3);border-radius:var(--r-full);overflow:hidden;margin-top:var(--sp-3)}
.ov2-bar>i{display:block;height:100%;background:var(--accent);border-radius:var(--r-full)}
/* 问候语降级为从属信息：主锚点让位给 .hero-day-v */
.hero-greet{margin:var(--sp-2) 0 0;font-size:var(--fs-lg);font-weight:var(--fw-sb);color:var(--txt-2)}
/* 今日完成度：首页第一屏的核心信息。四项各一个小圆点，做过的亮起、没做的暗着，
   下面一条 4px 的进度条给总量。不用卡片、不用圆环——它只是「今天还差什么」的一句话。 */
.hero-done{margin:var(--sp-4) 0 0;max-width:240px}
.hero-done-head{display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-3);
  font-size:var(--fs-xs);color:var(--txt-3);letter-spacing:.02em}
.hero-done-head b{margin-left:auto;color:var(--txt-1);font-size:var(--fs-md);
  font-weight:var(--fw-sb);font-variant-numeric:tabular-nums}
.hero-done-track{height:4px;border-radius:var(--r-full);background:var(--surface-3);
  margin:var(--sp-2) 0 var(--sp-3);overflow:hidden}
.hero-done-track>i{display:block;height:100%;background:var(--accent);border-radius:var(--r-full);
  transition:width var(--dur-1) var(--ease-std)}
.hero-done-items{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-5);
  font-size:var(--fs-xs);color:var(--txt-3)}
.hero-done-items span{display:inline-flex;align-items:center;gap:var(--sp-2)}
.hero-done-items span::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--line-2)}
.hero-done-items span.on{color:var(--txt-1)}
.hero-done-items span.on::before{background:var(--st-ok)}
/* 两句身份宣言收进折叠：它们是「读一次就够」的内容，不该占首屏三分之一 */
.hero-note{margin:var(--sp-4) 0 0;border-top:0;padding-top:0;max-width:560px}
.hero-note>summary{font-size:var(--fs-xs);color:var(--txt-3)}
.hero-note .identity-line{margin-top:var(--sp-3)}

/* ---------- 15. 概览：禁忌 / 事项 ---------- */
.warn-box{background:var(--st-bad-bg);border:1px solid var(--st-bad-bd);
  border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-3)}
.warn-box h3{color:var(--st-bad);margin:0 0 var(--sp-2);font-size:var(--fs-md)}
.warn-row{padding:var(--sp-1) 0;font-size:var(--fs-sm);line-height:var(--lh-sm);
  color:var(--txt-1);display:flex;align-items:baseline;gap:var(--sp-3)}
.warn-row::before{content:'';display:inline-block;width:4px;height:4px;
  border-radius:var(--r-full);background:var(--st-bad);flex-shrink:0;margin-top:.55em}
.warn-row b{color:var(--st-bad);font-weight:var(--fw-sb)}
.ov-mod{margin:var(--sp-5) 0 0;padding-top:var(--sp-5);border-top:1px solid var(--line-1)}
.ov-mod:first-child{margin-top:0;padding-top:0;border-top:none}
.ov-head{display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.ov-name{font-weight:var(--fw-sb);font-size:var(--fs-md)}
.ov-count{margin-left:auto;color:var(--txt-3);font-size:var(--fs-sm);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ov-count b{color:var(--txt-1);font-size:var(--fs-lg);font-weight:var(--fw-sb)}
.ov-bar{height:var(--h-bar);background:var(--surface-0);border-radius:var(--r-full);
  overflow:hidden;margin-bottom:var(--sp-3)}
.ov-bar>i{display:block;height:100%;background:var(--grad-bar);border-radius:var(--r-full);
  transition:width var(--dur-2) var(--ease-std)}
.ov-items{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);
  font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-3)}
/* 「我的事项」条目可点击：按钮重置。注意须置于 .ov-done 之前 ——
   两者同为单类选择器，靠源序决定；若放在后面，color:inherit 会盖掉勾选态的绿色 */
.ov-item{background:transparent;border:0;margin:0;padding:0;font:inherit;color:inherit;
  cursor:pointer;text-align:left;border-bottom:1px dashed transparent;
  transition:color var(--dur-1) var(--ease-std)}
@media (hover:hover){
.ov-item:hover{color:var(--txt-1);border-bottom-color:var(--line-3)}}
.ov-item:focus-visible{outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}
.ov-done{color:var(--st-ok);font-weight:var(--fw-sb)}
/* todo 条目 = span 容器（名称按钮 + 加号按钮，热区分离防误触） */
.ov-todo{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);color:var(--txt-2)}
.ov-name-btn{background:transparent;border:0;margin:0;padding:0;font:inherit;color:var(--txt-2);
  cursor:pointer;text-align:left;flex:1 1 auto;min-width:0;
  transition:color var(--dur-1) var(--ease-std)}
/* 触摸档热区补宽：名称按钮实测只有 28px 宽（min-width:0 + padding:0 是本行上方刻意设置的，
   用来防长词撑破整行）。这里不改那两个值，只在**位置更靠后**的 coarse 规则里补 min-width 与
   左右 padding —— 同权重下靠后胜出，写在上方那个 coarse 块里会被当死代码。 */
@media (pointer:coarse){ .ov-name-btn{min-width:34px;padding:var(--sp-1) var(--sp-2)} }
@media (hover:hover){
.ov-name-btn:hover{color:var(--accent-hi)}}
.ov-name-btn:focus-visible{outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}
/* 加号：裸字符呈现（无边框无底色），24px 隐形热区保触达（WCAG 2.5.8） */
.ov-add-btn{flex:0 0 auto;width:24px;height:24px;padding:0;border:0;background:transparent;
  color:var(--accent);font-weight:var(--fw-b);line-height:1;font-size:var(--fs-lg);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:color var(--dur-1) var(--ease-std)}
@media (hover:hover){
.ov-add-btn:hover{color:var(--accent-hi)}}
.ov-add-btn:focus-visible{outline:var(--ring-w) solid var(--ring);outline-offset:var(--ring-offset)}
/* 勾选标记用纯 CSS 绘制（border 旋转），不使用字符图标，P0-1 零命中 */
.ov-done::before{content:'';display:inline-block;width:5px;height:9px;
  border:solid currentColor;border-width:0 1.5px 1.5px 0;
  transform:rotate(45deg);margin-right:var(--sp-3);vertical-align:middle}
.ov-more{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* ---------- 16. 训练记录组行 ---------- */
.setrow{display:flex;gap:var(--sp-2);align-items:center;margin:var(--sp-2) 0}
.setrow input{flex:1 1 80px;min-width:0}

/* ---------- 17. Toast ---------- */
.toast{position:fixed;bottom:var(--sp-7);left:50%;transform:translateX(-50%);
  background:var(--surface-3);border:1px solid var(--line-3);border-left:3px solid var(--st-mut);
  border-radius:var(--r-md);box-shadow:var(--shadow-3);color:var(--txt-1);
  padding:var(--sp-5) var(--sp-6);font-size:var(--fs-md);font-weight:var(--fw-sb);
  line-height:var(--lh-md);max-width:min(92vw,420px);opacity:0;pointer-events:none;
  /* 必须高于抽屉遮罩（--z-nav + 5）：原先用 --z-toast(50)，抽屉开着时任何 toast
     都被压在遮罩下——「保存失败」这类提示等于没提示，用户看到的就是「点了没反应」。 */
  z-index:calc(var(--z-nav) + 10);
  transition:opacity var(--dur-2) var(--ease-std),transform var(--dur-2) var(--ease-out)}
.toast.show{opacity:1;animation:tm-toast var(--dur-2) var(--ease-out)}
.toast.ok{border-left-color:var(--st-ok)}
.toast.warn{border-left-color:var(--st-warn)}
.toast.bad{border-left-color:var(--st-bad)}

/* ---------- 17b. 确认弹窗（替代原生 confirm，见 R11） ---------- */
.modal-backdrop{position:fixed;inset:0;background:var(--scrim);display:flex;
  align-items:center;justify-content:center;padding:var(--sp-6);z-index:var(--z-modal)}
.modal{background:var(--grad-card);border:1px solid var(--line-3);border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);padding:var(--sp-6);width:100%;max-width:min(92vw,420px)}
.modal-msg{font-size:var(--fs-md);line-height:var(--lh-md);color:var(--txt-1)}
.modal-act{display:flex;flex-wrap:wrap;gap:var(--sp-3);justify-content:flex-end;
  margin-top:var(--sp-6)}
.modal-act .btn{min-width:88px}

/* ---------- 18. 空态 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--sp-3);padding:var(--sp-9) var(--sp-6);color:var(--txt-2);
  font-size:var(--fs-md);line-height:var(--lh-md);text-align:center}
.empty svg{width:var(--sz-icon);height:var(--sz-icon);color:var(--txt-2);opacity:.55}
.empty .empty-act{margin-top:var(--sp-2)}

/* ---------- 19. 图表 ---------- */
.chart-wrap{margin:var(--sp-4) 0;overflow-x:auto}
svg.chart{display:block;max-width:100%;height:auto}
svg.chart .gridline{stroke:var(--line-1)}
svg.chart .axis{stroke:var(--line-2)}
svg.chart .tick{font-size:var(--fs-sm);fill:var(--txt-3)}
svg.chart .tick.val{fill:var(--txt-2)}
svg.chart .s-weight{stroke:var(--cat-6);fill:var(--cat-6)}
svg.chart .s-bodyfat{stroke:var(--cat-4);fill:var(--cat-4)}
svg.chart .s-waist{stroke:var(--cat-2);fill:var(--cat-2)}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-4);margin-top:var(--sp-3);
  font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--txt-2)}
.legend span{display:inline-flex;align-items:center;gap:var(--sp-2)}
.legend i{display:inline-block;width:12px;height:2px;border-radius:var(--r-full)}
.legend i.s-weight{background:var(--cat-6)}
.legend i.s-bodyfat{background:var(--cat-4)}
.legend i.s-waist{background:var(--cat-2)}

/* ---------- 20. 编辑日：动作复选卡片 ---------- */
.pick-list{display:grid;grid-template-columns:1fr;gap:var(--sp-2);
  margin:var(--sp-2) 0;max-height:var(--max-pick);overflow:auto;padding-right:var(--sp-2)}
@media (min-width:480px){
  .pick-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}}
.pick{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface-2);
  cursor:pointer;font-size:var(--fs-md);line-height:var(--lh-md)}
@media (hover:hover){
@media (hover:hover){
.pick:hover{border-color:var(--accent-bd);background:var(--surface-3)}}}
.pick input{flex:0 0 auto}
.pick.on{border-color:var(--accent-bd);background:var(--accent-bg)}
.pick .pick-cat{margin-left:auto;flex:0 0 auto}

/* ---------- 21. 焦点 / 过渡 / 动效 ---------- */
:focus-visible{ outline:var(--ring-w) solid var(--ring); outline-offset:var(--ring-offset); }
/* border-color / box-shadow 的值来自主题令牌。让它们参与过渡时，切换主题会出现
   「慢一拍」：Chrome 会把这几个属性的过渡终点取成**旧主题**的解析值，切完之后
   元素仍带着上一套主题的描边与阴影（实测三套主题逐一切换，边框每次都落后一步）。
   这两项本来也没有"动起来"的必要（悬停变边框是瞬时更利落），直接从过渡列表移除；
   只保留 transform（按压/回弹）与 background-color（悬停底色）。 */
/* 次级可点控件（步进/勾选/胶囊/标签…）并入同一条过渡规则。
   刻意只列 background-color + transform：border-color / box-shadow 取自主题令牌，
   参与过渡时 Chrome 会把终点取成旧主题的解析值，切主题"慢一拍"（见上方实测记录）。
   按压只需要 transform，悬停只需要底色，这两个够了。 */
.btn,.tab,.card,input,select,textarea,summary,
.pill,.food-opt,.chk,.wmore,.seg-btn,.ov-name-btn,.ov-add-btn,.toc-item,.tag,.stepper .st{
  transition:background-color var(--dur-1) var(--ease-std),
  transform var(--dur-2) var(--ease-out); }
@keyframes tm-in   { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@keyframes tm-toast{ from{opacity:0;transform:translate(-50%,12px)} to{opacity:1;transform:translate(-50%,0)} }
.panel{animation:tm-in var(--dur-3) var(--ease-out)}

/* ---------- 22. 移动端手势切换模块 ----------
   仅小屏（≤767px，由 SwipeTab 模块判断）生效：左滑下一个 / 右滑上一个模块。
   动效：沿用 --dur-3(260ms) 与 --ease-out，与 .panel 入场动画同频；
        只动 transform / opacity，不触发重排。
   方向性：swipe-next 从右侧滑入，swipe-prev 从左侧滑入。
   边界：swipe-edge-l / -r 为到达首尾时的轻微回弹提示（不越界）。 */
#app.swipe-next{animation:tm-swipe-next var(--dur-3) var(--ease-out)}
#app.swipe-prev{animation:tm-swipe-prev var(--dur-3) var(--ease-out)}
#app.swipe-edge-l{animation:tm-swipe-edge-l var(--dur-2) var(--ease-out)}
#app.swipe-edge-r{animation:tm-swipe-edge-r var(--dur-2) var(--ease-out)}
/* 手势切换时抑制面板自身入场动画，避免与容器滑动叠加导致视觉抖动 */
#app.swipe-next .panel,#app.swipe-prev .panel{animation:none}
/* 跟手拖动 / 松手回弹：拖动中禁用过渡（跟手），松手后启用过渡（回弹） */
#app.is-swiping{transition:none}
#app.is-releasing{transition:transform var(--dur-2) var(--ease-out)}
@keyframes tm-swipe-next{from{transform:translateX(16px)}to{transform:none}}
@keyframes tm-swipe-prev{from{transform:translateX(-16px)}to{transform:none}}
@keyframes tm-swipe-edge-l{0%,100%{transform:none}40%{transform:translateX(-10px)}}
@keyframes tm-swipe-edge-r{0%,100%{transform:none}40%{transform:translateX(10px)}}

/* 非法输入抖动（横向 3px 两次，180ms 内收） */
.shake{animation:tm-shake var(--dur-2) var(--ease-std)}
@keyframes tm-shake{0%,100%{transform:none}20%{transform:translateX(-3px)}45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}
@media (prefers-reduced-motion:reduce){
  .shake{animation:none}
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}}
/* 高对比偏好：加深描边与次要文字，保证在强光 / 低质量屏幕下依然可读 */
@media (prefers-contrast:more){
  :root{ --line-1:#3a4150; --line-2:#4a5262; --line-3:#5f6879; --line-ctl:#6b7484;
         --txt-2:#c3cad6; --txt-3:#a9b2c0; }
}
.sug-row{padding:var(--sp-3) 0;border-bottom:1px dashed var(--line-1);display:flex;flex-direction:column;gap:var(--sp-1)}
.sug-row:last-child{border-bottom:0}
.ma7{stroke:var(--st-warn);fill:none;stroke-dasharray:6 4}
.goalline{stroke:var(--accent);stroke-dasharray:2 4}
.mobile-nav{display:none}
.mobile-nav button{font-size:var(--fs-xs);padding:0 var(--sp-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media(max-width:768px) and (pointer:coarse){
  .mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:var(--z-nav);
    padding:var(--sp-4) var(--sp-4) env(safe-area-inset-bottom);background:var(--surface-1);border-top:1px solid var(--line-2)}
  .mobile-nav button{position:relative;border:0;background:transparent;color:var(--txt-3);font-weight:var(--fw-b);min-height:var(--h-nav);border-radius:var(--r-nav);
    transition:color var(--dur-1) var(--ease-std),background-color var(--dur-1) var(--ease-std)}
  /* 选中态不只靠颜色：加一条 2px 形态指示，读屏与色觉障碍用户也能确认当前页 */
  .mobile-nav button.active{color:var(--st-info);background:var(--accent-bg)}
  .mobile-nav button.active::after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
    width:16px;height:2px;border-radius:var(--r-full);background:var(--st-info)}
  #tabs{display:none!important}   /* 移动端导航合并：顶栏 13-tab 与底栏功能重复，底栏为唯一导航（周报等经「更多」可达） */
  #app{padding-bottom:var(--pad-nav)}}
@media print{
  #tabs,.mobile-nav,.btnrow,#jr_text,#jr_save,#jr_print{display:none!important}
  #app .panel{box-shadow:none}
  body{background:#fff;color:#111}}
.mobile-nav.kb-hidden{display:none!important}
body.is-mobile .mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:var(--z-nav);padding:var(--sp-4) var(--sp-4) env(safe-area-inset-bottom);background:var(--surface-1);border-top:1px solid var(--line-2)}
body.is-mobile .mobile-nav button{position:relative;border:0;background:transparent;color:var(--txt-3);font-weight:var(--fw-b);min-height:var(--h-nav);border-radius:var(--r-nav);transition:color var(--dur-1) var(--ease-std),background-color var(--dur-1) var(--ease-std)}
body.is-mobile .mobile-nav button.active{color:var(--st-info);background:var(--accent-bg)}
body.is-mobile .mobile-nav button.active::after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:16px;height:2px;border-radius:var(--r-full);background:var(--st-info)}
body.is-mobile #tabs{display:none!important}
body.is-mobile #app{padding-bottom:var(--pad-nav)}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4)}
.food-cat-title{margin:var(--sp-5) 0 var(--sp-3);font-size:var(--fs-sm);font-weight:var(--fw-sb);color:var(--txt-2)}
#foodLib>summary{font-size:var(--fs-lg);font-weight:var(--fw-sb);color:var(--txt-1)}
#mealRows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-4)}
.meal-card{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-md);padding:var(--sp-4);transition:border-color var(--dur-1) var(--ease-std)}
@media (hover:hover){
.meal-card:hover{border-color:var(--line-3)}}
.meal-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.meal-tag{font-size:var(--fs-sm);font-weight:var(--fw-sb);color:var(--txt-2);white-space:nowrap}
.meal-slot{font-size:var(--fs-xs);color:var(--txt-3);white-space:nowrap}
.meal-card .m_food{width:100%;margin-bottom:var(--sp-3)}
.food-sug{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-2) 0}
.sug-chip{font-size:var(--fs-xs);padding:2px var(--sp-3);border:1px solid var(--accent-bd);border-radius:var(--r-full);background:var(--accent-bg);color:var(--txt-1);cursor:pointer}
@media (hover:hover){
.sug-chip:hover{background:var(--accent);color:var(--txt-inv)}}
.meal-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3);min-width:0}
.meal-nums>div{min-width:0}
.meal-num-k{font-size:var(--fs-xs);color:var(--txt-3);display:block;margin-bottom:var(--sp-1)}
.meal-nums .input-unit{min-width:0}
/* 数值输入组：输入框 + 框外静态单位后缀（单位不进输入框、不参与解析、聚焦不消失）
   多框对齐靠统一 grid 列宽 + 后缀固定 flex:0 0 auto，桌面/移动一致 */
.input-unit{display:flex;align-items:center;background:var(--input-fill);
  border:1px solid transparent;border-radius:var(--r-sm);padding:0 var(--sp-3);
  height:var(--h-ctrl);box-shadow:none}
.input-unit input{flex:1 1 auto;min-width:0;width:100%;border:0;background:transparent;padding:0;
  height:100%;color:var(--txt-1);font:inherit;font-weight:var(--fw-sb);text-align:right;box-shadow:none;
  margin-right:var(--sp-3)}
.input-unit input:focus{outline:none;box-shadow:none}
@media (hover:hover){
/* 外壳与全局输入框同一套四态：悬停提亮 → 聚焦由 ring 接管（顺序不能反，同特异性下后者生效） */
.input-unit:hover:not(:focus-within){background:var(--input-fill-hover)}}
.input-unit:focus-within{background:var(--input-fill);box-shadow:0 0 0 var(--ring-w) var(--ring)}
.input-unit .unit{flex:0 0 auto;font-size:var(--fs-xs);color:var(--txt-3);white-space:nowrap}
/* 隐藏 number 原生步进箭头：避免与右侧单位后缀挤在一起 */
.input-unit input::-webkit-outer-spin-button,.input-unit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.input-unit input[type=number]{-moz-appearance:textfield;-webkit-appearance:none;appearance:none}
@media(max-width:600px){ .food-grid{grid-template-columns:1fr 1fr}}
.food-opt{min-height:var(--h-ctrl);padding:var(--sp-3) var(--sp-5);font-size:var(--fs-sm);line-height:1.3;text-align:left;border:1px solid var(--line-2);border-radius:var(--r-nav);background:var(--surface-2);color:var(--txt-1);display:flex;flex-direction:column;justify-content:center;gap:var(--sp-1)}
.food-opt small{font-size:var(--fs-xxs);color:var(--txt-3);font-weight:var(--fw-m)}
@media (hover:hover){
.food-opt:hover{border-color:var(--accent-bd)}}
body.is-mobile .food-opt{font-size:var(--fs-xs);padding:var(--sp-2) var(--sp-4);min-height:var(--h-touch-min)}
/* 身份语/宣言：降为 eyebrow 与脚注层级（内容一句不删，只降视觉噪音）。
   原 .identity-line 用了 status 轴的 --st-info，属颜色轴误用：status 轴应只表达状态语义 */
.identity-line{font-size:var(--fs-xs);font-weight:var(--fw-m);letter-spacing:.06em;color:var(--txt-3);margin:0 0 var(--sp-3)}
.identity-sub{font-size:var(--fs-xs);line-height:var(--lh-xs);color:var(--txt-3);margin:var(--sp-3) 0 0;font-style:normal}
#hungryHint .ok{color:var(--st-ok)}#hungryHint .warn{color:var(--st-warn)}

/* =====================================================================
 * v9.1 · 单一体系：三套深色主题共用同一副骨架
 *
 *   墨色 / 石灰 / 暖炭 只换令牌，不覆盖组件规则；报告体（周容量 / 体成分）
 *   的配色全部走令牌，换主题即换色，结构不动。
 *   v3.36 起删除纸面主题与其整套覆盖层（历史背景见 git）。
 * ===================================================================== */

/* ---------- 共用：等宽数字 + 报告体语义色 ---------- */
:root{
  --ff-num:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* 暗色（默认）下的参考带与脂肪纹理 */
  --rep-band:rgba(124,134,242,.16);
  --rep-band-bd:rgba(124,134,242,.48);
  --rep-fat:rgba(228,124,124,.85);
  --rep-fat-bd:rgba(228,124,124,.52);
}

/* ============ 报告体：周容量 + 体成分 ============ */
/* rep-grid 与 panel 同一套规则：节间不靠线，靠留白与编号 */
.rep-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border-top:0}
.rep-grid>section{padding:20px 0 24px;min-width:0}
/* 同上：分节头不压线，靠上边距与编号分节（周报页每节都有一道横线，页尾连成排，太吵） */
.rep-hd{display:flex;align-items:baseline;gap:10px;border-bottom:0;
  padding-bottom:0;margin-bottom:10px}
.rep-no{display:none}
.rep-hd h2{margin:0;font-size:17px;font-weight:600;letter-spacing:.04em;display:flex;align-items:baseline;gap:9px}
.rep-hd h2::before{content:counter(sec,decimal-leading-zero);font-family:var(--ff-num);font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:400}
.rep-hd em{margin-left:auto;font-style:normal;font-size:12px;color:var(--txt-3);letter-spacing:.06em}

.rep-note{font-size:12.5px;line-height:1.85;color:var(--txt-2);margin:14px 0 0}
.rep-note b{color:var(--txt-1);font-weight:600}
/* 身体成分四行：标签 | 当前 → 目标 | 差值
   旧版 .v 用 justify-self:end 把整串数值顶到行尾，面板一宽，标签与数值之间就空出一大块。
   改为「数值紧贴标签 + 定宽列」，四行的数值列因此天然对齐（tabular-nums 已开），
   差值用 minmax 吸住右端，与上下的发丝线形成一条稳定的右侧读数栏。 */
.rep-rows{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:26px}
/* ≥1280 四列时，给每一格一道左侧发丝线：四组读数（体重/体脂率/脂肪量/瘦体重）
   在宽屏下容易连成一串，竖线把它们切成四栏，扫描时不必数位置。 */
@media (min-width:1280px){
  .rep-rows{column-gap:34px}
  .rep-rows>.rep-crow{padding-left:14px;border-left:1px solid var(--line-2)}
  .rep-rows>.rep-crow:nth-child(4n+1){padding-left:0;border-left:0}
}
@media (max-width:1280px){ .rep-rows{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:0}}
@media (max-width:720px){ .rep-rows{grid-template-columns:minmax(0,1fr)}}
.rep-crow{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line-2)}
.rep-crow .k{font-size:13px;color:var(--txt-2);letter-spacing:.02em}
.rep-crow .v{display:grid;grid-template-columns:50px 10px 56px 52px;gap:8px;justify-content:start;
  align-items:baseline;font-family:var(--ff-num);font-variant-numeric:tabular-nums}
.rep-crow .now{font-size:23px;letter-spacing:-.02em}
.rep-crow .ar{font-size:12px;color:var(--txt-3);text-align:center}
.rep-crow .to{font-size:14px;color:var(--txt-2)}
.rep-crow .d{font-size:12px;color:var(--st-bad);margin-left:6px;white-space:nowrap}
.rep-crow .d.keep{color:var(--st-ok)}
/* 体量图：两根同尺度堆叠条（当前 / 目标）
   瘦体重段用墨色、脂肪段用砖红，两段长度在同一把尺上可直接比较；
   段内数字用 --surface-0 —— 它恒等于页面底色，压在色段上也读得清。 */
/* 体量图：两根同尺度条（当前 / 目标）
   只画形状，不塞数字——数值在上方四格里已有；条下压一把 0–70kg 的量程轴，
   两条长度因此可比：瘦体重段等长，脂肪段变短，就是「体重在掉、肌肉没动」。 */
.rep-mass2{margin:16px 0 0}
.rep-mass2 .mrow{display:grid;grid-template-columns:30px minmax(0,1fr) 46px;gap:10px;align-items:center;padding:3px 0}
.rep-mass2 .mk{font-size:12px;letter-spacing:.14em;color:var(--txt-3)}
.rep-mass2 .mbar{display:flex;height:10px;background:var(--line-1)}
.rep-mass2 .seg{display:block;height:100%}
.rep-mass2 .seg.lean{background:var(--txt-1)}
.rep-mass2 .seg.fat{background:var(--rep-fat)}
.rep-mass2 .mv{font-family:var(--ff-num);font-variant-numeric:tabular-nums;font-size:14px;
  text-align:right;color:var(--txt-1)}
.rep-mass2 .maxis{display:grid;grid-template-columns:30px minmax(0,1fr) 46px;gap:10px;margin-top:7px}
.rep-mass2 .maxis .tick{display:flex;justify-content:space-between;border-top:1px solid var(--line-2);
  padding-top:5px;font-family:var(--ff-num);font-size:12px;color:var(--txt-3);letter-spacing:.04em}
.rep-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--txt-2)}
.rep-legend i{display:inline-block;width:12px;height:9px;margin-right:6px;vertical-align:0}
@media (max-width:900px){
  .rep-grid{grid-template-columns:minmax(0,1fr)}
  .rep-grid>section{padding:18px 0 20px}
  .rep-grid>section:first-child{border-right:0;border-bottom:0}}

/* ===================== Phase 3 补丁（注入于样式表末尾） =====================
 * 纯 CSS 覆盖：不改 DOM、不改业务逻辑。纸面分支已随主题删除，
 * 这里只剩与主题无关的两条：数值等宽、数据条尺寸。
 * ============================================================================ */

/* ③ 数值等宽：--ff-num 此前只命中 0.6%，数值节点统一 tabular-nums，
   列内纵向对齐不再随字符宽度漂移（三套主题都加） */
.ov2-v,.stat .v,.hero-day-v,td.num,
.rep-crow .now,.rep-crow .to,.rep-crow .d,.rep-mass2 .mv{
  font-family:var(--ff-num);font-variant-numeric:tabular-nums}

/* ④ 数据条语言统一：8px 方角轨道（--r-full 为 999px 胶囊） */
.ov-bar,.ov2-bar,.rep-mass2 .mbar{height:8px;border-radius:var(--r-full);background:var(--surface-3)}
.rep-legend i.lg-lean{background:var(--txt-1)}
.rep-legend i.lg-fat{background:var(--rep-fat)}

 
.input-unit:focus-within{background:var(--input-fill);box-shadow:0 0 0 var(--ring-w) var(--ring)}

/* ⑬ 手机端 hero 瘦身：三枚 stat 不再纵向堆叠（≤900px 曾塌成 1 列 342px） */
@media (max-width:767px){
  .hero-band{padding:16px 0 12px}
  .hero-band .grid.stat{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ===================== Phase 3b · A 暗色主按钮：去渐变 + 去光晕 =====================
 * 只用令牌改写，不新增选择器权重：--grad-btn / --grad-btn-hi 由渐变改为实色变量，
 * 于是 .btn、.brand::before 自动跟随，不产生回流（同尺寸同位置，仅重绘）。
 * 三套深色主题共用这一组按钮令牌：换主题只换色值，不动结构。 */
:root{
  --btn-fill:#dcee5d; --btn-fill-hi:#e9f78c; --btn-fill-press:#cfe24a;
  --btn-fill-bd:#c4d64e; --btn-bd-hi:#d8ea6a;
  --btn-edge:inset 0 0 0 1px rgba(8,9,12,.22);
  --grad-btn:var(--btn-fill); --grad-btn-hi:var(--btn-fill-hi);
}
.btn{background:var(--btn-fill);border-color:var(--btn-fill-bd);
  box-shadow:var(--btn-hi),var(--btn-edge),var(--btn-drop)}
@media (hover:hover){
.btn:hover{background:var(--btn-fill-hi);border-color:var(--btn-bd-hi);
  box-shadow:var(--btn-hi-hover),var(--btn-edge),0 2px 6px rgba(0,0,0,.40)}}
.btn:active{background:var(--btn-fill-press);border-color:var(--btn-fill-bd);box-shadow:var(--btn-press)}
.btn.ghost{border-color:var(--line-3)}
.brand::before{box-shadow:0 0 0 1px var(--accent-bd)}

/* ===================== Phase 3b · B 移动端正文：14 → 15px =====================
 * iOS 聚焦缩放的真正触发条件是输入框 < 16px，所以控件单独提到 16px；
 * 正文用 15px 而不是 16px：行长 390-32=358px 下 16px 中文一行约 22 字，偏挤。
 * 数值统一 tabular-nums，避免滚动时列宽抖动。 */
@media (max-width:767px){
  p,.small,.lead,.warn-row,.tip-list>li,.sug-row .small,.fld-v p{font-size:15px;line-height:1.7}
  input,select,textarea{font-size:16px}
  body{font-variant-numeric:tabular-nums}
  .ov2-v,.hero-day-v,.rep-crow .d,.rep-mass2 .mv{white-space:nowrap}
}

/* ===================== Phase 3b · C 概览密度：≤767px 收紧 =====================
 * 上移 15px 正文带来的增量，主要从 hero/统计卡/面板内边距里省。
 * hero / panel 各自另有内边距覆盖，所以这一档单独写。 */
@media (max-width:767px){
  .hero-band{padding:16px 14px 12px;gap:12px}
  .hero-band .grid.stat{gap:8px}
  .stat{padding:10px}
  .stat .k{font-size:12px;line-height:1.5;margin-top:2px}
  .stat .fix{margin-top:0}
  .ov2-title{margin:18px 0 2px}
  .ov2-sub{margin:0 0 6px}
  .ov2-grid{gap:8px}
  .ov2-card{padding:10px 12px}
  .ov2-bar{margin-top:6px}
  .rep-grid>section{padding:14px 0}
  .rep-crow{padding-top:4px;padding-bottom:4px}
  .panel{padding:14px;margin-bottom:12px}
  .panel>h2{margin-bottom:8px}
  .field{gap:4px}
  .btnrow{margin-top:10px}
  .ov-mod{margin-top:12px;padding-top:12px}
  .ov-head{margin-bottom:4px}
  .ov-items{gap:4px 8px}
  .sug-row{padding:4px 0}
  table.data tr{padding:5px 8px;margin-bottom:4px}
  table.data td{padding:1px 0}
  .table-wrap{margin:6px 0}
  /* 本周训练日：日 / 类型 并排一行，动作独占一行（原先三行各占一行，7 行白吃 ~90px） */
  table.data:has(td[data-label="日"]) tbody tr{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:baseline}
  table.data:has(td[data-label="日"]) tbody td{display:flex;justify-content:flex-start;gap:6px}
  table.data:has(td[data-label="日"]) tbody td[data-label="动作"]{grid-column:1/-1;margin-top:2px}
}

/* ===================== Phase 3b · D 体验校验抓出的 5 处必须补 =====================
 * 放在最后，确保它们覆盖前面所有同权重规则（其中 D3、D5 修正的是上轮的死代码）。 */

/* D1 必须：B 把 .small 提到 15px 时误伤了表格单元格 —— table.data td.small 是
   日志「动作/组次」列，放大后 390 出边 9px、320 页面级横滚 43px。收回 14px。
   --fs-sm:14px / --lh-sm:1.6 为既有令牌。 */
@media (max-width:767px){
  table.data td.small,table.data th.small{font-size:var(--fs-sm);line-height:var(--lh-sm)}
}
/* D2 必须：.input-unit input{font:inherit} 权重(0,2,1) > input{font-size:16px}(0,0,1)，
   否则饮食页 12 个数字框仍是 14px，iOS 聚焦会整页缩放。 */
@media (max-width:767px){ .input-unit input{font-size:16px} }
/* D3 必须：上轮 @media(pointer:coarse){.ov-add-btn{width:32px;height:32px}} 被后位
   同权重的 .ov-add-btn{width:24px} 覆盖，是死代码。此处后位置复写并补 min-height。 */
@media (pointer:coarse){ .ov-add-btn{width:32px;height:32px;min-height:32px} }
/* D4 必须：details>summary 实测 22.4px(14×1.6)，低于 AA 2.5.8 的 24px，全局生效
   （鼠标同样是 2.5.8 的约束对象）。不用 display:flex —— summary 上的 flex 会影响
   ::marker 与展开指示的排布，改用 min-height 打底 + padding-block 补足。
   代价已知：桌面首页每个 summary +2px（1280×900 由 3225 → 3229）。 */
details>summary{min-height:24px;padding-block:1px}
/* 触摸档把折叠标题抬到 40px：24px 是桌面 AA 底线，但手机上「点一行字展开」需要瞄。
   必须写在这里而不是上方的 coarse 块 —— 与上一行同权重 (0,0,2)，靠源序取胜。 */
@media (pointer:coarse){ details>summary{min-height:40px} }
/* D5 必须：上轮删掉旧 coarse 规则后 #themeBtn 掉回 24px。 */
@media (max-width:767px) and (pointer:coarse){ .theme-btn{min-height:44px} }


/* ===================== 底部导航：13 项横向可滑动 =====================
 * 结构：nav（不是滚动容器，负责固定定位与底色）> .nav-scroll（真正的滚动条）> 13 个 button。
 * 为什么要多这一层：渐隐遮罩（mask）会把它作用到的元素连背景一起吃掉，
 * 若直接挂在 nav 上，导航两端会透出后面的正文。放在 .nav-scroll 上则只淡化按钮。 */
@media (max-width:767px){
  /* nav 只负责固定定位与底色，排布交给 .nav-scroll 的栅格（见 v3.38 段）。
     这里必须显式写 display:block：上面把 nav 设成了 repeat(5,1fr) 的栅格，
     而 nav 只有一个子元素（.nav-scroll），照那样排会把它塞进第 1 列。
     v3.37 收成 5 项后横滑已无意义，原先的 overflow-x/scroll-snap/两端渐隐
     与按钮定宽一并删掉——那套规则会让 5 个按钮按 min-width:56px 左对齐。 */
  body.is-mobile .mobile-nav{display:block;overflow:hidden}
}

/* ---------- 训练记录：按类型计量 + 多列组次网格 ----------
 * 旧版每组一行、单列排布，在宽屏上左右都是空白；改为 auto-fill 网格，
 * 一个动作的所有组并排，行数随组数自然增加（多行多列）。 */
/* ---------- 训练记录：动作区块 + 组次行（结构对齐 GymMane） ----------
 * 组次按「行」排而不是按「列」：步进器要横向空间，7 列并排必然挤压。
 * 每行 = 序号 | 重量 | 次数 | 完成，列宽固定 → 多组之间天然对齐、可逐行扫。
 * 勾选表示「这组做了」，未勾的保存时不计入；默认全勾（数值已按计划预填）。 */
/* 桌面上把整块限制在 640px：分隔线只跟内容同宽，右侧不留一条空线 */
@media (min-width:768px){ .act{max-width:640px} }
.act{border-top:1px solid var(--line-1);padding:var(--sp-5) 0 2px}
.act:first-of-type{border-top:0;padding-top:0}
.act-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.act-top b{font-size:var(--fs-lg);font-weight:var(--fw-b);line-height:1.3}
.act-cat{font-size:12px;color:var(--txt-3);border:1px solid var(--line-2);
  border-radius:var(--r-full);padding:1px 7px;line-height:1.5}
.act-seed{font-size:12px;color:var(--accent);background:var(--accent-bg);
  border-radius:var(--r-full);padding:1px 7px;line-height:1.5}
.act-ctx{margin-top:2px;font-size:12px;line-height:1.5;color:var(--txt-3)}
/* 「＋ 加一组 / － 删掉加的那组」用现成的 .wmore 文字按钮（12px、下划线、触摸档 34px 高），
   不新建控件形态；这里只排行。 */
.act-foot{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5);margin-top:var(--sp-2)}
.draft-note{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--sp-2) var(--sp-4)}
.act-ctx b{font-weight:var(--fw-sb);color:var(--txt-2);letter-spacing:.02em}
.act-ctx .why{color:var(--txt-3)}

/* 所有动作统一四列：序号 | 主数值 | 次数值 | 完成。
   非抗阻只有一列数值，第三列留空 —— 否则步进器会被拉到整行宽，看起来像坏了。 */
/* 桌面端用定宽列 + 左对齐：步进器是控件不是数据，拉满整行会变成两个空盒子。
   手机上（见 767 媒体查询）才让列吃满可用宽度。 */
.sr-head,.sr{display:grid;align-items:center;gap:6px;
  grid-template-columns:20px minmax(0,190px) minmax(0,190px) 34px;
  justify-content:start}
.sr-empty{display:block}
.sr-head{margin-top:8px;padding-bottom:2px;font-size:12px;color:var(--txt-3);
  text-align:center;letter-spacing:.02em}
.sr-head span:first-child{text-align:left}
.sr{padding:3px 0;border-top:1px solid var(--line-1)}
.sr .no{font-size:var(--fs-xs);color:var(--txt-3);text-align:left;
  font-variant-numeric:tabular-nums}

/* 步进器：两侧 26px 触控区 + 中间可直接点的数字 */
.stepper{display:flex;align-items:center;min-width:0;
  border:1px solid transparent;border-radius:var(--r-sm);background:var(--input-fill)}
@media (hover:hover){
.stepper:hover:not(:focus-within){background:var(--input-fill-hover)}}
